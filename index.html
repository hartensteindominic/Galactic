<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>HyperStream XD • Bubble 4D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070817;color:white;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}#viewer{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#343477,#121632 38%,#070817 80%)}canvas{width:100%;height:100%;display:block}.pill{background:#171932cc;border:1px solid #ffffff20;border-radius:999px;padding:8px 12px;backdrop-filter:blur(18px);font-size:10px;box-shadow:0 7px 22px #0005}.top{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.pink{color:#ff9bd2}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fb7185;margin-right:5px;box-shadow:0 0 10px #fb7185}.live .dot{background:#34d399;box-shadow:0 0 10px #34d399}#preview{position:absolute;z-index:6;right:10px;bottom:10px;width:86px;height:112px;border-radius:20px;object-fit:cover;transform:scaleX(-1);border:2px solid #ffffff35;box-shadow:0 8px 25px #0008;background:#111}#message{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);padding:13px 17px;border-radius:22px;background:#11132acc;border:1px solid #ffffff18;backdrop-filter:blur(18px);font-size:12px;text-align:center;white-space:nowrap}#message.hide{display:none}#controls{z-index:20;padding:10px 11px calc(11px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:#0d0e20f5;border-top:1px solid #ffffff15;box-shadow:0 -15px 40px #0008}.row{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:18px;padding:12px 8px;color:white;font-weight:800;font-size:12px;background:linear-gradient(180deg,#292b50,#191b37);box-shadow:inset 0 1px #ffffff20,0 6px 16px #0004}.btn:active{transform:scale(.96)}.hero{padding:15px;border-radius:22px;font-size:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#fb7185)}.on{background:linear-gradient(135deg,#ff7a9d,#ff4d6d)}.blue{background:linear-gradient(135deg,#38bdf8,#6366f1)}.green{background:linear-gradient(135deg,#34d399,#059669)}.slider{display:flex;align-items:center;gap:8px;font-size:11px;color:#b8bbd0}.slider label{width:54px}.slider input{flex:1;accent-color:#f472b6}.slider output{width:30px;text-align:right;color:#ff9bd2}.tiny{text-align:center;color:#8589a8;font-size:10px}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script></head><body><div id="viewer"><div class="top"><div id="status" class="pill"><span class="dot"></span>Starting camera…</div><div class="pill">🫧 <span id="fps">—</span> FPS · <span id="pts" class="pink">0</span></div></div><video id="preview" autoplay playsinline muted></video><div id="message">🫧 Starting live 3D camera…</div><canvas id="c"></canvas></div><div id="controls"><button id="scan" class="btn hero" onclick="toggleScan()">✨ Start 4D Scan</button><div class="row"><button class="btn" onclick="flipCamera()">📷 Flip</button><button id="play" class="btn" onclick="togglePlay()">▶️ Play</button><button class="btn" onclick="center()">🎯 Center</button></div><div class="slider"><label>Depth</label><input id="depth" type="range" min="30" max="160" value="105"><output id="dv">105</output></div><div class="slider"><label>Bubbles</label><input id="levels" type="range" min="7" max="26" value="17"><output id="lv">17</output></div><div class="slider"><label>Glow</label><input id="glow" type="range" min="6" max="25" value="13"><output id="gv">13</output></div><div class="row"><button class="btn green" onclick="photo()">📸 Photo</button><button class="btn blue" onclick="share()">💌 Share</button></div><div class="tiny">☝️ drag to turn · 🤏 pinch to zoom · 🫧 live camera becomes a 3D bubble contour</div></div><script>const $=id=>document.getElementById(id);let scene,camera,renderer,composer,orbit,video,stream,work,ctx,ready=false,facing='user',lastSample=0,lastPlay=0,frames=[],recording=[],playing=false,scanning=false,pi=0,depth=105,levels=17,glow=.013,points=null,contours=[],ribs=[];function init(){let b=$('viewer');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(38,b.clientWidth/b.clientHeight,.05,900);camera.position.set(0,1,6);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setSize(b.clientWidth,b.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setClearColor(0x070817);composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(b.clientWidth,b.clientHeight),.8,.55,.68));orbit=new THREE.OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.dampingFactor=.09;orbit.rotateSpeed=.6;orbit.zoomSpeed=.8;orbit.enablePan=false;orbit.minDistance=2;orbit.maxDistance=18;orbit.autoRotate=true;orbit.autoRotateSpeed=.14;orbit.target.set(0,.1,0);let light=new THREE.PointLight(0xff7ac8,2,30);light.position.set(-4,3,5);scene.add(light);light=new THREE.PointLight(0x61d9ff,2,30);light.position.set(4,-2,5);scene.add(light);addEventListener('resize',resize);startCamera();loop()}function resize(){let b=$('viewer');camera.aspect=b.clientWidth/b.clientHeight;camera.updateProjectionMatrix();renderer.setSize(b.clientWidth,b.clientHeight);composer.setSize(b.clientWidth,b.clientHeight)}async function startCamera(){video=$('preview');if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;$('status').innerHTML='<span class="dot"></span>Requesting camera';$('message').textContent='🫧 Allow camera access…';$('message').classList.remove('hide');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},audio:false});video.srcObject=stream;await video.play();ready=true;$('status').classList.add('live');$('status').innerHTML='<span class="dot"></span>Camera live';$('message').classList.add('hide');setTimeout(sample,200)}catch(e){$('status').innerHTML='<span class="dot"></span>Camera permission needed';$('message').textContent='📷 Tap Flip / Camera permission, then reload'}}function flipCamera(){facing=facing==='user'?'environment':'user';startCamera()}function center(){camera.position.set(0,1,6);orbit.target.set(0,.1,0);orbit.update()}function clear(){if(points){scene.remove(points);points.geometry.dispose();points.material.dispose();points=null}contours.forEach(o=>{scene.remove(o);o.geometry.dispose();o.material.dispose()});contours=[];ribs.forEach(o=>{scene.remove(o);o.geometry.dispose();o.material.dispose()});ribs=[]}function sample(){if(!ready||video.readyState<2)return;if(!ctx){work=document.createElement('canvas');ctx=work.getContext('2d',{willReadFrequently:true})}let w=video.videoWidth,h=video.videoHeight;if(!w||!h)return;if(work.width!==w||work.height!==h){work.width=w;work.height=h}try{ctx.drawImage(video,0,0,w,h)}catch{return}let px;try{px=ctx.getImageData(0,0,w,h).data}catch{return}let pos=[],col=[],step=5,cx=w/2,cy=h/2,mr=Math.hypot(cx,cy);for(let y=0;y<h;y+=step){for(let x=0;x<w;x+=step){let i=(y*w+x)*4,r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.045)continue;let nx=(x/cx-1)*1.8,ny=-(y/cy-1)*1.8,rad=((x-cx)**2+(y-cy)**2)/(mr*mr),z=(l-.12)*(depth*.042)-rad*.5;pos.push(nx,ny,z);col.push(Math.min(1,r*1.3+.1),Math.min(1,g*1.18+.08),Math.min(1,b*1.45+.18))}}if(pos.length<30)return;baseRender(pos,col);if(scanning&&recording.length<100)recording.push({p:pos.map(v=>+v.toFixed(3)),c:col.map(v=>+v.toFixed(2))})}function baseRender(pos,col){clear();let n=pos.length/3,g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));points=new THREE.Points(g,new THREE.PointsMaterial({size:glow,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.62,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(points);for(let L=0;L<levels;L++){let z=-3+(L/(Math.max(1,levels-1)))*6,v=[],c=[];for(let i=0;i<n;i++){let j=i*3;if(Math.abs(pos[j+2]-z)<.09){v.push(pos[j],pos[j+1],z);c.push(col[j],col[j+1],col[j+2])}}if(v.length<9)continue;let cg=new THREE.BufferGeometry();cg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));cg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(c),3));let o=new THREE.Points(cg,new THREE.PointsMaterial({size:glow*2.5,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(o);contours.push(o)}$('pts').textContent=Math.round(n*(levels+1)).toLocaleString()}function toggleScan(){scanning=!scanning;let b=$('scan');if(scanning){recording=[];frames=[];playing=false;b.textContent='⏹ Stop 4D Scan';b.classList.add('on')}else{b.textContent='✨ Start 4D Scan';b.classList.remove('on');frames=recording.slice();if(frames.length){playing=true;$('play').textContent='⏸️ Pause'}}}function togglePlay(){if(!frames.length)return;playing=!playing;$('play').textContent=playing?'⏸️ Pause':'▶️ Play'}function drawFrame(){if(!frames.length)return;let f=frames[pi++%frames.length];baseRender(f.p,f.c)}function loop(now=performance.now()){requestAnimationFrame(loop);if(ready&&!playing&&now-lastSample>70){lastSample=now;sample()}if(scanning&&ready&&now-lastSample>55){lastSample=now;sample()}if(playing&&frames.length&&now-lastPlay>65){lastPlay=now;drawFrame()}orbit.autoRotate=!scanning;orbit.update();composer.render()}function photo(){composer.render();let a=document.createElement('a');a.href=$('c').toDataURL('image/png');a.download='hyperstream-bubble-'+Date.now()+'.png';a.click()}function share(){if(!navigator.share){alert('Share works best in Safari');return}let data=frames.length?frames:recording;if(!data.length){alert('Scan something first');return}let f=new File([JSON.stringify({HyperStreamXD:'Bubble 4D',frames:data})],'hyperstream-bubble.json',{type:'application/json'});navigator.share(navigator.canShare?.({files:[f]})?{title:'HyperStream XD',files:[f]}:{title:'HyperStream XD',text:'My 4D bubble hologram'}).catch(()=>{})}$('depth').oninput=e=>{depth=+e.target.value;$('dv').textContent=depth};$('levels').oninput=e=>{levels=+e.target.value;$('lv').textContent=levels};$('glow').oninput=e=>{glow=+e.target.value/1000;$('gv').textContent=e.target.value;if(points)points.material.size=glow};addEventListener('DOMContentLoaded',init)</script></body></html>
