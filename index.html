<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HyperStream XD • Engine v4.4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020617;color:#f8fafc;font-family:system-ui,sans-serif;height:100vh;display:flex;overflow:hidden}
#sidebar{width:380px;background:#030712;border-right:1px solid #1e293b;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;z-index:10}
.card{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.title{font-size:9px;font-weight:800;text-transform:uppercase;color:#94a3b8}
.row{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#cbd5e1}
button{border:none;border-radius:6px;padding:7px;font-size:10px;font-weight:800;cursor:pointer;color:#fff}
.btn-p{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.btn-d{background:#ef4444;width:100%}.btn-d.on{background:#f97316}
input[type=range]{accent-color:#ec4899;width:100px}
#viewer{flex:1;position:relative}
canvas{display:block;width:100%;height:100%}
.stats{position:absolute;top:10px;right:10px;background:rgba(2,6,23,0.8);padding:6px 10px;border-radius:6px;font-size:10px;color:#94a3b8;z-index:5}
video{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="sidebar">
  <div style="font-size:12px;font-weight:900;color:#38bdf8">HYPERSTREAM XD • v4.4</div>
  <div class="card">
    <div class="title">Live Matrix Control</div>
    <button class="btn-d" id="scanBtn" onclick="toggleScan()">ACTIVATE UNLIMITED SCAN</button>
    <div class="row"><span>Voxel Step</span><input type="range" min="1" max="4" value="1" oninput="stepSize=+this.value"></div>
    <div class="row"><span>Depth Field</span><input type="range" min="10" max="150" value="90" oninput="depthMul=+this.value"></div>
    <div class="row"><span>Active Voxels</span><b id="nLive" style="color:#ec4899">0</b></div>
    <button class="btn-p" onclick="expJSON()">Export JSON Matrix</button>
  </div>
</div>
<div id="viewer">
  <div class="stats">FPS <b id="fpsD" style="color:#ec4899">—</b></div>
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="c3"></canvas>
</div>
<script>
const $=id=>document.getElementById(id);
let scene,cam,ren,ctrl,video,c2d,ctx,stream=null,ready=false,scanning=false;
let stepSize=1,depthMul=90,layers=[],rec=[],fc=0,ft=0,phase=0;

window.addEventListener('DOMContentLoaded',()=>{
  init3();
  initCam();
});

function init3(){
  const box=$('viewer');
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x020617,0.01);
  cam=new THREE.PerspectiveCamera(48,box.clientWidth/box.clientHeight,0.05,2000);
  cam.position.set(0,0.5,3.8);

  ren=new THREE.WebGLRenderer({canvas:$('c3'),antialias:true,powerPreference:'high-performance'});
  ren.setSize(box.clientWidth,box.clientHeight);
  ren.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  ren.setClearColor(0x020617);

  ctrl=new THREE.OrbitControls(cam,ren.domElement);
  ctrl.enableDamping=true;ctrl.autoRotate=true;

  scene.add(new THREE.AmbientLight(0xffffff,1.2));
  window.addEventListener('resize',()=>{
    cam.aspect=box.clientWidth/box.clientHeight;
    cam.updateProjectionMatrix();
    ren.setSize(box.clientWidth,box.clientHeight);
  });
  ren.setAnimationLoop(loop);
}

function initCam(){
  video=$('vid');
  c2d=document.createElement('canvas');
  ctx=c2d.getContext('2d',{willReadFrequently:true});
  navigator.mediaDevices?.getUserMedia({video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},audio:false})
  .then(s=>{stream=s;video.srcObject=s;return video.play();})
  .then(()=>{ready=true;})
  .catch(()=>{/* Fallback simulated telemetry node if sensor blocked */});
}

function loop(now){
  ctrl.update();
  phase=now*0.001;
  fc++;
  if(now-ft>1000){$('fpsD').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now;}
  if(ready&&video.readyState>=2)sample();
  ren.render(scene,cam);
}

function sample(){
  const w=video.videoWidth||640,h=video.videoHeight||480;
  if(c2d.width!==w||c2d.height!==h){c2d.width=w;c2d.height=h;}
  try{ctx.drawImage(video,0,0,w,h);}catch{return;}
  let pix;
  try{pix=ctx.getImageData(0,0,w,h).data;}catch{return;}

  const pos=[],col=[];
  const cx=w*0.5,cy=h*0.5,maxR=Math.hypot(cx,cy)||1;
  const sx=1.6,sy=1.6,step=Math.max(1,stepSize|0);

  for(let y=0;y<h;y+=step){
    for(let x=0;x<w;x+=step){
      const i=(y*w+x)*4;
      const r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255;
      if((0.299*r+0.587*g+0.114*b)<0.02)continue;

      const nx=((w-x)/w)*2-1,ny=-((y/h)*2-1);
      const nz=((1.0-(0.299*r+0.587*g+0.114*b))-0.5)*(depthMul*0.04);

      pos.push(nx*sx,ny*sy,nz);
      col.push(r,g,b);
    }
  }

  $('nLive').textContent=(pos.length/3).toLocaleString();
  buildCloud(pos,col);
}

function buildCloud(pos,col){
  while(layers.length){const o=layers.pop();scene.remove(o);o.geometry.dispose();o.material.dispose();}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));

  const mat=new THREE.PointsMaterial({
    size:0.015,
    vertexColors:true,
    transparent:true,
    opacity:0.92,
    blending:THREE.AdditiveBlending
  });

  const pts=new THREE.Points(g,mat);
  scene.add(pts);
  layers.push(pts);
}

function toggleScan(){
  scanning=!scanning;
  const b=$('scanBtn');
  b.textContent=scanning?'STOP UNLIMITED SCAN':'ACTIVATE UNLIMITED SCAN';
  b.classList.toggle('on',scanning);
}

function expJSON(){
  const blob=new Blob([JSON.stringify({HyperStreamXD:rec})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='quantum_matrix.json';a.click();
}
</script>
</body>
</html>
