<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash WebAR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .top-bar, .bottom-panel {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px 20px;
            pointer-events: auto;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar { font-weight: bold; letter-spacing: 1px; }
        .status-dot { color: #ff3333; }
        .status-active { color: #00ff66; }
        button {
            background: #111;
            color: white;
            border: 1px solid #666;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background: #333; }
        #ar-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="ar-canvas"></canvas>

    <div id="hud">
        <div class="top-bar">
            <span>SPATIAL DASH AR</span>
            <span id="connection-status" class="status-dot">● OFFLINE</span>
        </div>
        
        <div class="bottom-panel">
            <div>
                <div style="font-size: 16px; font-weight: bold;">Environment Mapping</div>
                <div style="font-size: 12px; color: #aaa;" id="sub-text">Tap start to trigger AR session</div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="scan-btn" onclick="toggleARSession()">START AR SCAN</button>
                <button id="save-btn" onclick="saveEnvironmentData()" style="display:none; background:#0055ff;">SAVE MAP</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let xrSession = null;
        let gl = null;
        let renderer, scene, camera;
        let scannedPoints = [];

        async function toggleARSession() {
            if (!navigator.xr) {
                alert("WebXR not supported on this browser. Try opening this page via Mozilla WebXR Viewer.");
                return;
            }

            if (!xrSession) {
                try {
                    // Request an immersive-ar session with hit-test capability
                    xrSession = await navigator.xr.requestSession("immersive-ar", {
                        requiredFeatures: ["hit-test", "local-floor"]
                    });

                    document.getElementById('connection-status').innerText = "● SCANNING ACTIVE";
                    document.getElementById('connection-status').className = "status-active";
                    document.getElementById('scan-btn').innerText = "STOP SESSION";
                    document.getElementById('sub-text').innerText = "Walk around to map room surfaces";
                    document.getElementById('save-btn').style.display = "block";

                    setupThreeJSXR();
                    xrSession.addEventListener('end', onSessionEnded);

                } catch (e) {
                    alert("Failed to start AR session: " + e.message);
                }
            } else {
                await xrSession.end();
            }
        }

        function setupThreeJSXR() {
            const canvas = document.getElementById('ar-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, preserveDrawingBuffer: true });
            renderer.xr.enabled = true;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer.xr.setSession(xrSession);

            renderer.setAnimationCallback((timestamp, frame) => {
                if (frame) {
                    // Collect tracking data points to mock room digital structure
                    const viewerPose = frame.getViewerPose(renderer.xr.getReferenceSpace());
                    if (viewerPose) {
                        const pos = viewerPose.transform.position;
                        // Log tracking coordinates dynamically during motion
                        scannedPoints.push({ x: pos.x.toFixed(3), y: pos.y.toFixed(3), z: pos.z.toFixed(3), time: Date.now() });
                    }
                }
                renderer.render(scene, camera);
            });
        }

        function saveEnvironmentData() {
            if (scannedPoints.length === 0) {
                alert("No spatial coordinates recorded yet. Move your phone around first.");
                return;
            }

            // Clean data payload representing the scanned digital environment
            const environmentMap = {
                version: "1.0",
                device: "iOS WebAR",
                totalPointsCaptured: scannedPoints.length,
                spatialCoordinates: scannedPoints.slice(-500) // Keep the latest 500 coordinates
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(environmentMap, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "spatial_environment_map.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function onSessionEnded() {
            xrSession = null;
            document.getElementById('connection-status').innerText = "● OFFLINE";
            document.getElementById('connection-status').className = "status-dot";
            document.getElementById('scan-btn').innerText = "START AR SCAN";
            document.getElementById('sub-text').innerText = "AR session closed";
        }
    </script>
</body>
</html>
