<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>HyperStream</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--border:#38383a;--text:#f5f5f7;--muted:#8e8e93;--blue:#0a84ff;--pink:#ff375f;--green:#30d158;--orange:#ff9f0a;--purple:#bf5af2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column}
#app{display:flex;flex:1;min-height:0;overflow:hidden}
#stage{flex:1;min-width:0;min-height:0;position:relative;background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#panel{width:330px;background:rgba(28,28,30,.98);border-right:1px solid var(--border);padding:20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex-shrink:0;-webkit-overflow-scrolling:touch}
.logo{font-size:22px;font-weight:750;letter-spacing:-.6px}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.card{background:var(--card2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:11px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.45px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;min-height:28px}
button{border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:650;color:#fff;width:100%;cursor:pointer;min-height:46px}button:disabled{opacity:.3}.primary{background:linear-gradient(135deg,var(--purple),var(--pink))}.green{background:var(--green);color:#000}.red{background:var(--pink)}.blue{background:var(--blue)}.orange{background:var(--orange);color:#000}
input[type=range]{accent-color:var(--pink);width:150px;height:28px;cursor:pointer}input[type=file]{font-size:13px;color:var(--muted);width:100%;padding:4px}
.badge{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.48);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:7px 13px;border-radius:22px;font-size:12px;z-index:10;display:flex;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.08)}
.rec{display:none;color:#ff453a;font-weight:650;align-items:center;gap:6px}.rec.on{display:flex}.dot{width:8px;height:8px;background:#ff453a;border-radius:50%;animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
video{display:none}.status{font-size:13px;color:var(--blue);min-height:18px;line-height:18px}
.value{min-width:38px;text-align:right;color:#fff;font-variant-numeric:tabular-nums}
@media(max-width:768px){
 body{background:#000}
 #app{flex-direction:column}
 #stage{order:1;flex:1;min-height:0}
 #panel{order:2;width:100%;height:auto;max-height:48dvh;border-right:none;border-left:none;border-bottom:none;border-top:1px solid rgba(255,255,255,.1);padding:10px 12px calc(12px + env(safe-area-inset-bottom));gap:10px;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);background:rgba(28,28,30,.97)}
 #panel>div:first-child{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 3px}.logo{font-size:18px}.sub{margin:0;font-size:11px}
 .card{border-radius:16px;padding:12px;gap:9px}.card:first-of-type{margin-top:0}
 input[type=range]{width:45vw;max-width:190px;min-width:125px}
 button{min-height:44px;padding:11px}.badge{top:12px;right:12px}
}
@media(min-width:769px){#stage{order:1}#panel{order:2;width:100%;height:280px;border-right:none;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;align-content:start;overflow-y:auto}#panel>div:first-child{grid-column:1/-1}.card{min-width:0}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div class="badge"><span>FPS <b id="fps" style="color:var(--pink)">—</b></span><div class="rec" id="recInd"><div class="dot"></div>REC</div></div>
    <video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas>
  </div>
  <div id="panel">
    <div><div class="logo">HyperStream</div><div class="sub">Holographic capture</div></div>
    <div class="card">
      <div class="label">Live Holo Scan</div><button class="red" id="scanBtn" onclick="toggleScan()">Start Scanning</button>
      <div class="row"><span>Detail</span><input id="detail" type="range" min="1" max="8" value="8" oninput="setDetail(this.value)"><b class="value" id="detailVal">8</b></div>
      <div class="row"><span>Depth</span><input id="depth" type="range" min="20" max="320" value="145" oninput="depthMul=+this.value;depthVal.textContent=this.value"><b class="value" id="depthVal">145</b></div>
      <div class="row"><span>Brightness</span><input id="bright" type="range" min="25" max="250" value="100" oninput="brightness=+this.value/100;brightVal.textContent=this.value+'%'"><b class="value" id="brightVal">100%</b></div>
      <div class="row"><span>Points</span><b id="nLive" style="color:var(--pink)">0</b></div>
    </div>
    <div class="card">
      <div class="label">Capture</div><div class="row"><span>Status</span><b id="recStatus" style="color:var(--muted)">Ready</b></div><div class="row"><span>Time</span><b id="recTime">00:00</b></div><div class="row"><span>Frames</span><b id="frameCount" style="color:var(--purple)">0</b></div>
      <button class="green" id="recBtn" onclick="toggleRec()">Record</button><button class="blue" id="playBtn" onclick="togglePlay()" disabled>Replay</button><button class="primary" id="dlVid" onclick="dlVideo()" disabled>Save Video</button><button class="primary" id="dlSeq" onclick="dlSeq()" disabled>Save Sequence</button>
    </div>
    <div class="card">
      <div class="label">Create World</div><div class="row"><span>World Points</span><b id="envPts" style="color:var(--green)">0</b></div><div class="status" id="status"></div>
      <button class="primary" id="buildSeq" onclick="buildSeq()" disabled>Build World</button><button class="orange" id="buildVid" onclick="buildVid()" disabled>Build from Video</button><button class="green" id="saveBtn" onclick="saveEnv()" disabled>Save World</button><button class="orange" id="shareBtn" onclick="shareEnv()" disabled>Share as Video</button><button class="red" id="clearBtn" onclick="clearEnv()" disabled>Clear</button>
    </div>
    <div class="card">
      <div class="label">Load</div><input type="file" accept=".json" onchange="loadEnv(event)"><input type="file" accept=".json" onchange="loadSeq(event)"><input type="file" accept="video/*,.webm,.mp4" onchange="loadVid(event)">
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=id=>document.getElementById(id);let scene,cam,ren,ctrl,video,c2d,ctx,ready=false,scanning=false;
let stepSize=1,depthMul=145,brightness=1,fc=0,ft=0;let recording=false,mr,chunks=[],videoBlob=null,frames=[];let recStart=0,timer,lastCap=0,playing=false,pIdx=0,pLast=0;let pts,posA,colA;const MAX=120000;let env,glow,ePos,eCol,eRec=false,eMr,eChunks=[];
function setDetail(v){const n=+v;stepSize=Math.max(1,9-n);$('detailVal').textContent=n}
init();initCam();
function init(){const box=$('stage');scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,.010);cam=new THREE.PerspectiveCamera(52,box.clientWidth/box.clientHeight,.05,1000);cam.position.set(0,1.4,5.3);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:true});ren.setSize(box.clientWidth,box.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setClearColor(0x000000);ctrl=new THREE.OrbitControls(cam,ren.domElement);ctrl.enableDamping=true;ctrl.dampingFactor=.08;ctrl.autoRotate=true;ctrl.autoRotateSpeed=.35;ctrl.target.set(0,.4,0);scene.add(new THREE.AmbientLight(0xffffff,.9));const key=new THREE.DirectionalLight(0xa5f3fc,.3);key.position.set(2,5,3);scene.add(key);
 const geo=new THREE.BufferGeometry();posA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);colA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);geo.setAttribute('position',posA);geo.setAttribute('color',colA);geo.setDrawRange(0,0);pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(pts);
 const g=new THREE.Group();const grid=new THREE.GridHelper(9,26,0x1e3a8a,0x111113);grid.position.y=-1.3;grid.material.opacity=.28;grid.material.transparent=true;g.add(grid);const floor=new THREE.Mesh(new THREE.PlaneGeometry(9,9),new THREE.MeshBasicMaterial({color:0x0a0a0f,transparent:true,opacity:.5,side:THREE.DoubleSide}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.31;g.add(floor);const frame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(8.2,4.4,8.2)),new THREE.LineBasicMaterial({color:0x38bdf8,transparent:true,opacity:.1}));frame.position.y=.9;g.add(frame);scene.add(g);
 addEventListener('resize',()=>{cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix();ren.setSize(box.clientWidth,box.clientHeight)});ren.setAnimationLoop(loop)}
function initCam(){video=$('vid');c2d=document.createElement('canvas');ctx=c2d.getContext('2d',{willReadFrequently:true});if(!navigator.mediaDevices?.getUserMedia){$('scanBtn').textContent='Camera Not Supported';$('scanBtn').disabled=true;return}navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false}).then(s=>{video.srcObject=s;return video.play()}).then(()=>{ready=true;$('status').textContent='Camera ready — tap Start Scanning'}).catch(()=>{$('scanBtn').textContent='Camera Blocked';$('scanBtn').disabled=true;$('status').textContent='Allow camera access then reload'})}
function loop(now){if(scanning)ctrl.autoRotate=false;ctrl.update();fc++;if(now-ft>1000){$('fps').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}if(playing)playStep(now);else if(scanning&&ready&&video.readyState>=2)sample(now);ren.render(scene,cam)}
function sample(now){const w=video.videoWidth||640,h=video.videoHeight||480;if(c2d.width!==w||c2d.height!==h){c2d.width=w;c2d.height=h}try{ctx.drawImage(video,0,0,w,h)}catch{return}let pix;try{pix=ctx.getImageData(0,0,w,h).data}catch{return}const step=Math.max(1,stepSize|0);let n=0;for(let y=0;y<h&&n<MAX;y+=step)for(let x=0;x<w&&n<MAX;x+=step){const i=(y*w+x)*4;let r=Math.min(1,pix[i]/255*brightness),g=Math.min(1,pix[i+1]/255*brightness),b=Math.min(1,pix[i+2]/255*brightness);const lum=.299*r+.587*g+.114*b;if(lum<.025)continue;const d=Math.pow(1-lum,1.42);const idx=n*3;posA.array[idx]=((w-x)/w*2-1)*1.8;posA.array[idx+1]=(-(y/h*2-1))*1.6+.35;posA.array[idx+2]=(d-.36)*(depthMul*.047);colA.array[idx]=r;colA.array[idx+1]=g;colA.array[idx+2]=b;n++}posA.needsUpdate=true;colA.needsUpdate=true;pts.geometry.setDrawRange(0,n);$('nLive').textContent=n.toLocaleString();if(recording&&now-lastCap>=70){lastCap=now;frames.push({t:now-recStart,n,pos:new Float32Array(posA.array.buffer.slice(0,n*12)),col:new Float32Array(colA.array.buffer.slice(0,n*12))});$('frameCount').textContent=frames.length}}
function toggleScan(){if(!ready){$('status').textContent='Camera not ready yet';return}scanning=!scanning;const btn=$('scanBtn');if(scanning){btn.textContent='Stop Scanning';btn.className='orange';ctrl.autoRotate=false;$('status').textContent='Scanning… move slowly'}else{btn.textContent='Start Scanning';btn.className='red';pts.geometry.setDrawRange(0,0);$('nLive').textContent='0';if(!playing)ctrl.autoRotate=true;$('status').textContent=''}}
function toggleRec(){recording?stopRec():startRec()}function startRec(){if(!scanning)return alert('Start Scanning first');chunks=[];frames=[];videoBlob=null;lastCap=0;recStart=performance.now();const opt={mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:7000000};if(!MediaRecorder.isTypeSupported(opt.mimeType))opt.mimeType='video/webm';mr=new MediaRecorder($('c').captureStream(30),opt);mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{videoBlob=new Blob(chunks,{type:'video/webm'});$('dlVid').disabled=!chunks.length;$('dlSeq').disabled=!frames.length;$('playBtn').disabled=!frames.length;$('buildSeq').disabled=!frames.length;$('buildVid').disabled=!videoBlob};mr.start(120);recording=true;$('recBtn').textContent='Stop';$('recBtn').className='red';$('recStatus').textContent='Recording';$('recStatus').style.color='#ff453a';$('recInd').classList.add('on');$('frameCount').textContent='0';timer=setInterval(()=>{const e=(performance.now()-recStart)/1000;$('recTime').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(Math.floor(e%60)).padStart(2,'0')},250)}
function stopRec(){if(!recording)return;recording=false;if(mr?.state!=='inactive')mr.stop();clearInterval(timer);$('recBtn').textContent='Record';$('recBtn').className='green';$('recStatus').textContent='Saved';$('recStatus').style.color='var(--muted)';$('recInd').classList.remove('on')}
function dlVideo(){if(!chunks.length)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download=`hyperstream_${Date.now()}.webm`;a.click()}
function dlSeq(){if(!frames.length)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:10,frames:frames.map(f=>({t:Math.round(f.t),n:f.n,pos:Array.from(f.pos),col:Array.from(f.col)}))})],{type:'application/json'}));a.download=`sequence_${Date.now()}.json`;a.click()}
function togglePlay(){playing?stopPlay():startPlay()}function startPlay(){if(!frames.length)return;if(scanning)toggleScan();playing=true;pIdx=0;pLast=performance.now();$('playBtn').textContent='Stop Replay';$('recStatus').textContent='Replaying';$('recStatus').style.color='var(--purple)';ctrl.autoRotate=true}function stopPlay(){playing=false;$('playBtn').textContent='Replay';$('recStatus').textContent='Ready';$('recStatus').style.color='var(--muted)';pts.geometry.setDrawRange(0,0);$('nLive').textContent='0';ctrl.autoRotate=!scanning}function playStep(now){if(now-pLast<1000/12)return;pLast=now;const f=frames[pIdx];posA.array.set(f.pos);colA.array.set(f.col);posA.needsUpdate=true;colA.needsUpdate=true;pts.geometry.setDrawRange(0,f.n);$('nLive').textContent=f.n.toLocaleString();pIdx=(pIdx+1)%frames.length}
function finalize(pos,col){if(pos.length<800)return $('status').textContent='Need more data — scan longer';if(env){scene.remove(env);env.geometry.dispose();env.material.dispose()}if(glow){scene.remove(glow);glow.geometry.dispose();glow.material.dispose()}for(let i=0;i<col.length;i+=3){let r=Math.min(1,col[i]*.86+.05),g=Math.min(1,col[i+1]*.92+.1),b=Math.min(1,col[i+2]*.82+.22);const c=1.08;col[i]=Math.min(1,(r-.5)*c+.5);col[i+1]=Math.min(1,(g-.5)*c+.5);col[i+2]=Math.min(1,(b-.5)*c+.5)}ePos=new Float32Array(pos);eCol=new Float32Array(col);const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(ePos,3));geo.setAttribute('color',new THREE.BufferAttribute(eCol,3));env=new THREE.Points(geo,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:.82,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));env.position.y=.28;scene.add(env);glow=new THREE.Points(geo.clone(),new THREE.PointsMaterial({size:.032,vertexColors:true,transparent:true,opacity:.1,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));glow.position.y=.28;scene.add(glow);$('envPts').textContent=(ePos.length/3).toLocaleString();$('clearBtn').disabled=false;$('saveBtn').disabled=false;$('shareBtn').disabled=false;$('buildSeq').disabled=!frames.length;$('buildVid').disabled=!videoBlob;$('status').textContent='World ready ✨';cam.position.set(0,1.6,5.8);ctrl.target.set(0,.4,0);ctrl.autoRotate=true}
function buildSeq(){if(!frames.length)return;if(playing)stopPlay();$('status').textContent='Building world…';const TARGET=120000,maxF=Math.min(frames.length,60),step=Math.max(1,Math.floor(frames.length/maxF));const pos=[],col=[],spread=3.2;for(let i=0;i<frames.length;i+=step){const f=frames[i],z=((i/Math.max(1,frames.length-1))-.5)*spread,keep=Math.min(1,(TARGET/frames.length)/Math.max(1,f.n)*1.25);for(let p=0;p<f.n;p++){if(Math.random()>keep)continue;const j=p*3,k=.007;pos.push(f.pos[j]+(Math.random()-.5)*k,f.pos[j+1]+(Math.random()-.5)*k,f.pos[j+2]+z+(Math.random()-.5)*k);col.push(f.col[j],f.col[j+1],f.col[j+2]);if(pos.length/3>=TARGET)break}if(pos.length/3>=TARGET)break}finalize(pos,col)}
function buildVid(){if(!videoBlob)return alert('No video yet');if(playing)stopPlay();$('status').textContent='Processing video…';$('buildVid').disabled=true;const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(videoBlob);const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true}),collected=[];v.onloadedmetadata=()=>{const dur=Math.max(.1,v.duration);let t=0;const stepT=.09,next=()=>{if(t>dur){URL.revokeObjectURL(v.src);const TARGET=120000,pos=[],col=[],spread=3.2,step=Math.max(1,Math.floor(collected.length/55));for(let i=0;i<collected.length;i+=step){const f=collected[i],z=((i/Math.max(1,collected.length-1))-.5)*spread,keep=Math.min(1,(TARGET/collected.length)/Math.max(1,f.n)*1.25);for(let p=0;p<f.n;p++){if(Math.random()>keep)continue;const j=p*3,k=.007;pos.push(f.pos[j]+(Math.random()-.5)*k,f.pos[j+1]+(Math.random()-.5)*k,f.pos[j+2]+z+(Math.random()-.5)*k);col.push(f.col[j],f.col[j+1],f.col[j+2]);if(pos.length/3>=TARGET)break}if(pos.length/3>=TARGET)break}finalize(pos,col);return}v.currentTime=t};v.onseeked=()=>{const w=v.videoWidth||640,h=v.videoHeight||480;c.width=w;c.height=h;x.drawImage(v,0,0,w,h);let pix;try{pix=x.getImageData(0,0,w,h).data}catch{t+=stepT;next();return}const step=Math.max(1,stepSize|0),p=[],cl=[];let n=0;for(let y=0;y<h&&n<22000;y+=step)for(let xx=0;xx<w&&n<22000;xx+=step){const i=(y*w+xx)*4,r=Math.min(1,pix[i]/255*brightness),g=Math.min(1,pix[i+1]/255*brightness),b=Math.min(1,pix[i+2]/255*brightness),lum=.299*r+.587*g+.114*b;if(lum<.025)continue;const d=Math.pow(1-lum,1.42);p.push(((w-xx)/w*2-1)*1.8,(-(y/h*2-1))*1.6+.35,(d-.36)*(depthMul*.047));cl.push(r,g,b);n++}if(n>40)collected.push({n,pos:new Float32Array(p),col:new Float32Array(cl)});$('status').textContent=`Building… ${Math.min(100,Math.round(t/dur*100))}%`;t+=stepT;next()};next()};v.load()}
function saveEnv(){if(!ePos)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:10,n:ePos.length/3,pos:Array.from(ePos),col:Array.from(eCol)})],{type:'application/json'}));a.download=`world_${Date.now()}.json`;a.click()}
function clearEnv(){if(env){scene.remove(env);env.geometry.dispose();env.material.dispose();env=null}if(glow){scene.remove(glow);glow.geometry.dispose();glow.material.dispose();glow=null}ePos=eCol=null;$('envPts').textContent='0';$('clearBtn').disabled=true;$('saveBtn').disabled=true;$('shareBtn').disabled=true;$('buildSeq').disabled=!frames.length;$('buildVid').disabled=!videoBlob;$('status').textContent=''}
function shareEnv(){if(!env||eRec)return;if(playing)stopPlay();if(scanning)toggleScan();pts.geometry.setDrawRange(0,0);eChunks=[];const opt={mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:9000000};if(!MediaRecorder.isTypeSupported(opt.mimeType))opt.mimeType='video/webm';eMr=new MediaRecorder($('c').captureStream(30),opt);eMr.ondataavailable=e=>e.data.size&&eChunks.push(e.data);eMr.onstop=()=>{eRec=false;$('shareBtn').textContent='Share as Video';$('shareBtn').disabled=false;$('recInd').classList.remove('on');if(eChunks.length){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(eChunks,{type:'video/webm'}));a.download=`world_${Date.now()}.webm`;a.click()}};eMr.start(120);eRec=true;$('shareBtn').textContent='Recording…';$('shareBtn').disabled=true;$('recInd').classList.add('on');ctrl.autoRotate=true;ctrl.autoRotateSpeed=.6;setTimeout(()=>eMr?.state!=='inactive'&&eMr.stop(),12000)}
function loadEnv(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);clearEnv();finalize(Array.from(d.pos||d.positions),Array.from(d.col||d.colors))}catch{alert('Invalid file')}};r.readAsText(f);e.target.value=''}
function loadSeq(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);frames=(d.frames||[]).map(f=>({t:f.t,n:f.n,pos:new Float32Array(f.pos),col:new Float32Array(f.col)}));$('frameCount').textContent=frames.length;$('playBtn').disabled=!frames.length;$('dlSeq').disabled=!frames.length;$('buildSeq').disabled=!frames.length;alert(`Loaded ${frames.length} frames`)}catch{alert('Invalid file')}};r.readAsText(f);e.target.value=''}
function loadVid(e){const f=e.target.files[0];if(!f)return;videoBlob=f;$('buildVid').disabled=false;$('status').textContent='Video ready';e.target.value=''}
</script>
</body>
</html>
