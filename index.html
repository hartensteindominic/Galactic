<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HyperStream XD • Room AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#020617;
  color:#f8fafc;
  font-family:system-ui,sans-serif;
  height:100vh;
  display:flex;
  overflow:hidden
}

#sidebar{
  width:340px;
  min-width:340px;
  background:#030712;
  border-right:1px solid #1e293b;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto;
  z-index:10
}

.brand{
  font-size:12px;
  font-weight:900;
  color:#38bdf8
}

.card{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:8px;
  padding:9px;
  display:flex;
  flex-direction:column;
  gap:7px
}

.title{
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
  color:#94a3b8
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:10px;
  color:#cbd5e1
}

button{
  border:0;
  border-radius:6px;
  padding:8px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
  color:white
}

.primary{
  background:linear-gradient(135deg,#8b5cf6,#ec4899)
}

.blue{
  background:#0369a1
}

.dark{
  background:#1e293b
}

.red{
  background:#dc2626
}

input,textarea,select{
  width:100%;
  background:#020617;
  color:white;
  border:1px solid #334155;
  border-radius:6px;
  padding:7px;
  font-size:10px;
  outline:none
}

textarea{
  resize:none;
  height:55px
}

input[type=range]{
  width:100px;
  accent-color:#ec4899
}

#chat{
  height:145px;
  overflow-y:auto;
  background:#020617;
  border:1px solid #1e293b;
  border-radius:6px;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:5px
}

.msg{
  font-size:10px;
  padding:6px;
  border-radius:6px;
  white-space:pre-wrap
}

.msg.user{
  background:#312e81;
  align-self:flex-end
}

.msg.ai{
  background:#172033;
  border-left:2px solid #ec4899
}

.msg.system{
  color:#94a3b8;
  border-left:2px solid #38bdf8
}

.chatrow{
  display:flex;
  gap:5px
}

.chatrow input{
  flex:1
}

.chatrow button{
  width:60px
}

#viewer{
  flex:1;
  position:relative
}

canvas{
  display:block;
  width:100%;
  height:100%
}

#videoPreview{
  position:absolute;
  right:12px;
  bottom:12px;
  width:180px;
  border:1px solid #334155;
  border-radius:7px;
  display:none;
  z-index:4
}

.label{
  position:absolute;
  top:14px;
  left:14px;
  color:#38bdf8;
  font-size:11px;
  font-weight:900;
  pointer-events:none
}

.stats{
  position:absolute;
  top:10px;
  right:10px;
  background:rgba(2,6,23,.88);
  border:1px solid #1e293b;
  border-radius:6px;
  padding:7px 10px;
  font-size:10px;
  color:#94a3b8;
  z-index:5
}

#info{
  position:absolute;
  left:14px;
  bottom:14px;
  max-width:330px;
  background:rgba(2,6,23,.92);
  border:1px solid #334155;
  border-radius:8px;
  padding:10px;
  display:none;
  z-index:5
}

#info b{
  color:#ec4899
}

#info p{
  font-size:10px;
  color:#cbd5e1;
  margin-top:4px
}

video{
  object-fit:cover
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>

<div id="sidebar">

  <div class="brand">
    HYPERSTREAM XD • ROOM AI
  </div>

  <!-- ROOM SCANNER -->

  <div class="card">

    <div class="title">
      Spatial Room Scanner
    </div>

    <button
      id="scanBtn"
      class="primary"
      onclick="toggleScan()">
      START ROOM SCAN
    </button>

    <button
      class="dark"
      onclick="captureFrame()">
      CAPTURE FRAME
    </button>

    <div class="row">
      <span>Frames</span>
      <b id="frameCount">0</b>
    </div>

    <div class="row">
      <span>Points</span>
      <b id="pointCount">0</b>
    </div>

    <div class="row">
      <span>Scan Time</span>
      <b id="scanTime">0s</b>
    </div>

    <input
      id="roomName"
      placeholder="Room name..."
      value="My Room">

  </div>


  <!-- AI -->

  <div class="card">

    <div class="title">
      AI Room Assistant
    </div>

    <select id="model">
      <option value="llama3.2">llama3.2</option>
      <option value="llama3.1">llama3.1</option>
      <option value="qwen2.5">qwen2.5</option>
    </select>

    <div id="chat"></div>

    <div class="chatrow">

      <input
        id="chatInput"
        placeholder="Ask the room AI...">

      <button
        class="primary"
        onclick="askAI()">
        SEND
      </button>

    </div>

  </div>


  <!-- ROOM -->

  <div class="card">

    <div class="title">
      Saved Room
    </div>

    <button
      class="primary"
      onclick="saveRoom()">
      SAVE ROOM
    </button>

    <button
      class="blue"
      onclick="exportRoom()">
      EXPORT ROOM
    </button>

    <button
      class="dark"
      onclick="document.getElementById('import').click()">
      IMPORT ROOM
    </button>

    <input
      type="file"
      id="import"
      accept=".json,.room"
      style="display:none"
      onchange="importRoom(event)">

  </div>


  <!-- VIEW -->

  <div class="card">

    <div class="title">
      3D View
    </div>

    <div class="row">
      <span>Auto Rotate</span>
      <input
        type="checkbox"
        checked
        onchange="
          controls.autoRotate=this.checked
        ">
    </div>

    <div class="row">
      <span>Point Size</span>
      <input
        type="range"
        min="1"
        max="10"
        value="3"
        oninput="
          pointSize=+this.value;
          updatePointSize()
        ">
    </div>

    <button
      class="dark"
      onclick="resetView()">
      RESET VIEW
    </button>

    <button
      class="red"
      onclick="clearRoom()">
      CLEAR ROOM
    </button>

  </div>

</div>


<div id="viewer">

  <div class="label">
    HYPERSTREAM • DIGITAL ROOM
  </div>

  <div class="stats">
    FPS <b id="fps">—</b>
    &nbsp;|&nbsp;
    POINTS <b id="points">0</b>
    &nbsp;|&nbsp;
    FRAMES <b id="frames">0</b>
  </div>

  <div id="info">
    <b id="infoTitle"></b>
    <p id="infoText"></p>
  </div>

  <video
    id="videoPreview"
    autoplay
    playsinline
    muted>
  </video>

  <canvas id="canvas"></canvas>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

const $ = id =>
  document.getElementById(id);

let scene;
let camera;
let renderer;
let controls;

let video;
let stream = null;

let scanning = false;
let scanStart = 0;

let frameCount = 0;

let pointCloud = null;

let pointPositions = [];
let pointColors = [];

let scanFrames = [];

let roomObjects = [];

let pointSize = 3;

let fpsFrames = 0;
let fpsStart = 0;

const STORAGE_KEY =
  "hyperstream_room_ai_v1";


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    init3D();

    initCamera();

    loadRoom();

    addMessage(
      "system",
      "Room AI ready."
    );

  }
);


/* =====================================================
   THREE
===================================================== */

function init3D(){

  const box =
    $("viewer");


  scene =
    new THREE.Scene();


  scene.fog =
    new THREE.FogExp2(
      0x020617,
      .009
    );


  camera =
    new THREE.PerspectiveCamera(
      50,
      box.clientWidth /
      box.clientHeight,
      .01,
      2000
    );


  camera.position.set(
    0,
    2.5,
    7
  );


  renderer =
    new THREE.WebGLRenderer({
      canvas:$("canvas"),
      antialias:true,
      powerPreference:
        "high-performance"
    });


  renderer.setSize(
    box.clientWidth,
    box.clientHeight
  );


  renderer.setPixelRatio(
    Math.min(
      devicePixelRatio || 1,
      2
    )
  );


  renderer.setClearColor(
    0x020617
  );


  controls =
    new THREE.OrbitControls(
      camera,
      renderer.domElement
    );


  controls.enableDamping = true;

  controls.autoRotate = true;

  controls.autoRotateSpeed = .25;


  scene.add(
    new THREE.AmbientLight(
      0xffffff,
      1.3
    )
  );


  const light =
    new THREE.PointLight(
      0xec4899,
      4,
      60
    );


  light.position.set(
    0,
    5,
    0
  );


  scene.add(light);


  createFloor();


  window.addEventListener(
    "resize",
    resize
  );


  renderer.setAnimationLoop(
    animate
  );

}


/* =====================================================
   FLOOR
===================================================== */

function createFloor(){

  const floor =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        30,
        30
      ),
      new THREE.MeshBasicMaterial({
        color:0x07111f,
        transparent:true,
        opacity:.8
      })
    );


  floor.rotation.x =
    -Math.PI/2;


  floor.position.y =
    -2;


  scene.add(
    floor
  );


  const grid =
    new THREE.GridHelper(
      30,
      30,
      0x334155,
      0x111827
    );


  grid.position.y =
    -1.99;


  scene.add(grid);

}


/* =====================================================
   CAMERA
===================================================== */

async function initCamera(){

  video =
    $("videoPreview");


  try{

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            width:{
              ideal:1280
            },

            height:{
              ideal:720
            },

            facingMode:
              "environment"

          },

          audio:false

        });


    video.srcObject =
      stream;


    await video.play();


    video.style.display =
      "block";


  }catch(error){

    addMessage(
      "system",
      "Camera unavailable. You can still import an existing room."
    );

  }

}


/* =====================================================
   ANIMATION
===================================================== */

function animate(now){

  controls.update();


  fpsFrames++;


  if(
    now - fpsStart > 1000
  ){

    $("fps").textContent =
      fpsFrames;


    fpsFrames = 0;

    fpsStart = now;

  }


  if(
    scanning &&
    video.readyState >= 2
  ){

    scanFrame();

  }


  if(scanning){

    $("scanTime")
      .textContent =
        Math.floor(
          (Date.now()-scanStart)/1000
        ) + "s";

  }


  renderer.render(
    scene,
    camera
  );

}


/* =====================================================
   START / STOP SCAN
===================================================== */

function toggleScan(){

  scanning =
    !scanning;


  const button =
    $("scanBtn");


  if(scanning){

    scanStart =
      Date.now();


    button.textContent =
      "STOP ROOM SCAN";


    button.className =
      "red";


    addMessage(
      "system",
      "Scanning room. Move the camera slowly around the space."
    );

  }else{

    button.textContent =
      "START ROOM SCAN";


    button.className =
      "primary";


    addMessage(
      "system",
      "Scan stopped. Room data is ready to save."
    );

  }

}


/* =====================================================
   CAPTURE FRAME
===================================================== */

function captureFrame(){

  if(
    !video ||
    video.readyState < 2
  ){

    addMessage(
      "system",
      "Camera is not ready."
    );

    return;

  }


  scanFrame();


  addMessage(
    "system",
    "Spatial frame captured."
  );

}


/* =====================================================
   SCAN FRAME
===================================================== */

function scanFrame(){

  /*
   * This is deliberately a lightweight visual
   * reconstruction. Without a real depth sensor,
   * browser RGB video cannot provide metric depth.
   */

  const width =
    video.videoWidth ||
    640;

  const height =
    video.videoHeight ||
    480;


  const temp =
    document.createElement(
      "canvas"
    );


  /*
   * Keep scan processing small enough
   * for phones.
   */

  const scale =
    Math.min(
      1,
      640 / width
    );


  temp.width =
    Math.floor(
      width * scale
    );


  temp.height =
    Math.floor(
      height * scale
    );


  const context =
    temp.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  context.drawImage(
    video,
    0,
    0,
    temp.width,
    temp.height
  );


  const image =
    context.getImageData(
      0,
      0,
      temp.width,
      temp.height
    );


  const data =
    image.data;


  /*
   * Sample pixels.
   */

  const step = 8;


  const framePoints = [];


  for(
    let y=0;
    y<temp.height;
    y+=step
  ){

    for(
      let x=0;
      x<temp.width;
      x+=step
    ){

      const i =
        (y*temp.width+x)*4;


      const r =
        data[i]/255;

      const g =
        data[i+1]/255;

      const b =
        data[i+2]/255;


      const brightness =
        .299*r+
        .587*g+
        .114*b;


      if(
        brightness < .03
      )
        continue;


      const nx =
        x/temp.width-.5;

      const ny =
        .5-y/temp.height;


      /*
       * Visual depth estimate.
       *
       * This is NOT real metric depth.
       * It simply creates a useful 3D
       * visualization from the video.
       */

      const nz =
        (
          brightness-.5
        ) * 2;


      /*
       * Move each frame slightly through
       * the room so successive viewpoints
       * accumulate.
       */

      const frameIndex =
        scanFrames.length;


      const cameraOffset =
        frameIndex * .012;


      const px =
        nx*6 +
        cameraOffset;


      const py =
        ny*4;


      const pz =
        nz*3;


      pointPositions.push(
        px,
        py,
        pz
      );


      pointColors.push(
        r,
        g,
        b
      );


      framePoints.push([
        px,
        py,
        pz
      ]);

    }

  }


  scanFrames.push({

    time:
      Date.now(),

    points:
      framePoints.length

  });


  frameCount++;


  updatePointCloud();


  updateStats();

}


/* =====================================================
   POINT CLOUD
===================================================== */

function updatePointCloud(){

  if(
    pointCloud
  ){

    scene.remove(
      pointCloud
    );


    pointCloud.geometry.dispose();

    pointCloud.material.dispose();

  }


  const geometry =
    new THREE.BufferGeometry();


  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      pointPositions,
      3
    )
  );


  geometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(
      pointColors,
      3
    )
  );


  const material =
    new THREE.PointsMaterial({

      size:
        pointSize*.003,

      vertexColors:true,

      transparent:true,

      opacity:.9,

      blending:
        THREE.AdditiveBlending

    });


  pointCloud =
    new THREE.Points(
      geometry,
      material
    );


  scene.add(
    pointCloud
  );

}


/* =====================================================
   POINT SIZE
===================================================== */

function updatePointSize(){

  if(
    pointCloud
  ){

    pointCloud.material.size =
      pointSize*.003;

  }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const points =
    pointPositions.length/3;


  $("frameCount")
    .textContent =
      frameCount;


  $("frames")
    .textContent =
      frameCount;


  $("pointCount")
    .textContent =
      points.toLocaleString();


  $("points")
    .textContent =
      points.toLocaleString();

}


/* =====================================================
   SAVE
===================================================== */

function saveRoom(){

  const room =
    createRoomData();


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(room)
  );


  addMessage(
    "system",
    "Room saved locally."
  );

}


/* =====================================================
   ROOM DATA
===================================================== */

function createRoomData(){

  return {

    format:
      "HyperStream Room",

    version:
      "1.0",

    name:
      $("roomName").value ||
      "My Room",

    created:
      new Date().toISOString(),

    scan:{

      frames:
        scanFrames,

      frameCount,

      points:
        pointPositions.length/3,

      positions:
        pointPositions,

      colors:
        pointColors

    },

    objects:
      roomObjects

  };

}


/* =====================================================
   EXPORT
===================================================== */

function exportRoom(){

  const room =
    createRoomData();


  const blob =
    new Blob(
      [
        JSON.stringify(
          room
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    (
      $("roomName").value ||
      "hyperstream-room"
    )
    .replace(
      /[^a-z0-9-_]/gi,
      "_"
    ) +
    ".room.json";


  a.click();


  URL.revokeObjectURL(
    url
  );


  addMessage(
    "system",
    "Room exported."
  );

}


/* =====================================================
   LOAD ROOM
===================================================== */

function loadRoom(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!saved)
      return;


    const room =
      JSON.parse(
        saved
      );


    applyRoom(
      room
    );


    addMessage(
      "system",
      "Saved room restored."
    );

  }catch(error){

    console.error(
      error
    );

  }

}


/* =====================================================
   IMPORT ROOM
===================================================== */

function importRoom(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  const reader =
    new FileReader();


  reader.onload =
    e => {

      try{

        const room =
          JSON.parse(
            e.target.result
          );


        applyRoom(
          room
        );


        saveRoom();


        addMessage(
          "system",
          "Room imported successfully."
        );

      }catch(error){

        alert(
          "Invalid HyperStream room file."
        );

      }

    };


  reader.readAsText(
    file
  );

}


/* =====================================================
   APPLY ROOM
===================================================== */

function applyRoom(
  room
){

  $("roomName")
    .value =
      room.name ||
      "My Room";


  pointPositions =
    room.scan?.positions ||
    [];


  pointColors =
    room.scan?.colors ||
    [];


  scanFrames =
    room.scan?.frames ||
    [];


  frameCount =
    room.scan?.frameCount ||
    scanFrames.length ||
    0;


  roomObjects =
    room.objects ||
    [];


  updatePointCloud();

  updateStats();

}


/* =====================================================
   CLEAR
===================================================== */

function clearRoom(){

  if(
    !confirm(
      "Delete this room?"
    )
  )
    return;


  pointPositions = [];

  pointColors = [];

  scanFrames = [];

  roomObjects = [];

  frameCount = 0;


  if(
    pointCloud
  ){

    scene.remove(
      pointCloud
    );

    pointCloud.geometry.dispose();

    pointCloud.material.dispose();

    pointCloud = null;

  }


  localStorage.removeItem(
    STORAGE_KEY
  );


  updateStats();

  addMessage(
    "system",
    "Room cleared."
  );

}


/* =====================================================
   RESET VIEW
===================================================== */

function resetView(){

  camera.position.set(
    0,
    2.5,
    7
  );


  controls.target.set(
    0,
    0,
    0
  );

}


/* =====================================================
   AI
===================================================== */

async function askAI(){

  const input =
    $("chatInput");


  const message =
    input.value.trim();


  if(!message)
    return;


  input.value = "";


  addMessage(
    "user",
    message
  );


  try{

    const response =
      await fetch(
        "http://localhost:11434/api/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              model:
                $("model").value,

              stream:false,

              messages:[

                {
                  role:"system",

                  content:
                    `You are the AI inside a
3D digital room.

The room is named:
${$("roomName").value}

The room currently contains:
${frameCount} scan frames
${pointPositions.length/3} visual points

Explain what the user can do with
the room. Do not claim that RGB
video provides accurate physical
depth.`
                },

                {
                  role:"user",

                  content:
                    message
                }

              ]

            })

        }
      );


    if(!response.ok)
      throw new Error();


    const data =
      await response.json();


    addMessage(
      "ai",
      data.message?.content ||
      "No response."
    );


  }catch(error){

    addMessage(
      "ai",
      "AI is offline. Start Ollama locally to enable the room AI."
    );

  }

}


/* =====================================================
   CHAT
===================================================== */

function addMessage(
  type,
  text
){

  const box =
    $("chat");


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "msg " +
    type;


  div.textContent =
    text;


  box.appendChild(
    div
  );


  box.scrollTop =
    box.scrollHeight;

}


/* =====================================================
   ENTER
===================================================== */

$("chatInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        askAI();

      }

    }
  );


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  const box =
    $("viewer");


  camera.aspect =
    box.clientWidth /
    box.clientHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    box.clientWidth,
    box.clientHeight
  );

}

</script>

</body>
</html>
