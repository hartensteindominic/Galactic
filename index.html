<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream XD • 3D Video</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column}#stage{height:58dvh;position:relative;background:radial-gradient(circle at 50% 45%,#101c29 0,#030509 48%,#000 100%)}canvas{width:100%;height:100%;display:block}.badge{position:absolute;right:12px;top:12px;z-index:5;padding:7px 12px;border-radius:18px;background:#000b;backdrop-filter:blur(18px);font-size:10px}.panel{height:42dvh;overflow-y:auto;background:#19191df5;border-radius:24px 24px 0 0;padding:7px 10px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #0008}.handle{width:38px;height:4px;background:#68686f;border-radius:9px;margin:0 auto 8px}.card{background:#303035e8;border-radius:17px;padding:10px;margin-bottom:8px}.actions{display:flex;flex-direction:column;gap:7px}.actions button,.switch button{border:0;border-radius:15px;height:44px;font-weight:750;color:#fff;font-size:14px}.red{background:linear-gradient(135deg,#ff477c,#ff3561)}.green{background:linear-gradient(135deg,#65f39a,#30d158);color:#06120a!important}.blue{background:linear-gradient(135deg,#5ab5ff,#0a84ff)}.pink{background:linear-gradient(135deg,#d06cff,#ff4f91)}.green.ready{animation:g 1.35s infinite;box-shadow:0 0 18px #30d15877}@keyframes g{50%{box-shadow:0 0 28px #30d158b8}}button:disabled{opacity:.35}.title{font-size:10px;font-weight:800;color:#9a9aa3;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.switch button{background:#ffffff12}.switch button.active{background:#ff4f864d;outline:1px solid #ff4f8680}.row{display:grid;grid-template-columns:74px 1fr 42px;align-items:center;gap:6px;height:40px;font-size:12px}.value{text-align:right;font-size:10px;color:#ff76a6}input[type=range]{appearance:none;width:100%;height:28px;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,#ffffff20,#ff4f867a)}input[type=range]::-webkit-slider-thumb{appearance:none;width:21px;height:21px;margin-top:-7.5px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#fff,#ff76a6);box-shadow:0 2px 10px #ff46806b}.status{font-size:10px;color:#42a5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}video{display:none}@media(min-width:769px){#app{flex-direction:row}.panel{width:390px;height:100dvh;border-radius:0;border-right:1px solid #ff4f8630;flex-shrink:0}.handle{display:none}#stage{height:100dvh;flex:1}.actions{display:grid;grid-template-columns:1fr 1fr}}
</style></head>
<body><div id="app"><section id="stage"><div class="badge">FPS <b id="fps" style="color:#ff4f86">—</b> · <b id="nodes">0</b> nodes</div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></section><section class="panel"><div class="handle"></div><div class="card actions"><button class="red" id="scan" onclick="toggleScan()">Start Scanning</button><button class="green" id="rec" onclick="toggleRec()" disabled>Record</button><button class="blue" id="play" onclick="togglePlay()" disabled>Replay</button><button class="pink" id="share" onclick="shareVideo()" disabled>Share</button></div><div class="card"><div class="title">Camera</div><div class="switch"><button id="front" class="active" onclick="startCamera('user')">Face Camera</button><button id="back" onclick="startCamera('environment')">Back Camera</button></div></div><div class="card"><div class="title">3D Video</div><div class="row"><span>Density</span><input type="range" min="1" max="10" value="8" oninput="density=+this.value;densityVal.textContent=this.value"><b class="value" id="densityVal">8</b></div><div class="row"><span>Depth</span><input type="range" min="0" max="100" value="46" oninput="depth=+this.value/100;depthVal.textContent=this.value+'%'"><b class="value" id="depthVal">46%</b></div><div class="row"><span>Volume</span><input type="range" min="40" max="130" value="82" oninput="volume=+this.value/100;volumeVal.textContent=this.value"><b class="value" id="volumeVal">82</b></div><div class="status" id="status">Starting Face Camera…</div></div></section></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=id=>document.getElementById(id);let scene,cam,ren,ctl,video,stream,tex,plane,pts,pa,ca,work,ctx;let ready=false,scanning=false,recording=false,playing=false;let density=8,depth=.46,volume=.82;let frames=[],pidx=0,lastReplay=0,lastFrame=0,recStart=0,mr,chunks=[];const W=320,H=180,N=W*H;let smoothZ=new Float32Array(N),smoothPos=new Float32Array(N*3);
init();startCamera('user');
function init(){const b=$('stage');scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(47,b.clientWidth/b.clientHeight,.02,100);cam.position.set(0,.15,5.3);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});ren.setSize(b.clientWidth,b.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setClearColor(0);ctl=new THREE.OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.dampingFactor=.065;ctl.autoRotate=true;ctl.autoRotateSpeed=.08;ctl.target.set(0,0,0);video=$('vid');work=document.createElement('canvas');work.width=W;work.height=H;ctx=work.getContext('2d',{willReadFrequently:true});tex=new THREE.VideoTexture(video);tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;tex.format=THREE.RGBAFormat;
const geo=new THREE.PlaneGeometry(5.05,2.84,W-1,H-1);plane=new THREE.Mesh(geo,new THREE.ShaderMaterial({uniforms:{map:{value:tex},depthAmount:{value:depth},volume:{value:volume},scan:{value:0}},vertexShader:`varying vec2 vUv;uniform float depthAmount;uniform float volume;void main(){vUv=uv;vec3 p=position;float wave=sin(p.x*7.0+p.y*4.0)*0.004*depthAmount;p.z+=wave*volume;if(depthAmount>0.0){float d=sin(uv.x*3.14159)*sin(uv.y*3.14159);p.z+=d*depthAmount*0.20*volume;}gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,fragmentShader:`uniform sampler2D map;uniform float scan;varying vec2 vUv;void main(){vec4 c=texture2D(map,vUv);c.rgb=min(vec3(1.0),c.rgb*1.06+vec3(.012));gl_FragColor=vec4(c.rgb,c.a);}`,transparent:false,side:THREE.DoubleSide}));scene.add(plane);
const pg=new THREE.BufferGeometry();pa=new THREE.BufferAttribute(new Float32Array(N*3),3);ca=new THREE.BufferAttribute(new Float32Array(N*3),3);pg.setAttribute('position',pa);pg.setAttribute('color',ca);pg.setDrawRange(0,0);pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.014,vertexColors:true,transparent:true,opacity:.13,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(pts);addEventListener('resize',()=>{cam.aspect=b.clientWidth/b.clientHeight;cam.updateProjectionMatrix();ren.setSize(b.clientWidth,b.clientHeight)});ren.setAnimationLoop(loop)}
async function startCamera(mode){if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;scanning=false;$('rec').disabled=true;$('status').textContent=mode==='user'?'Starting Face Camera…':'Starting Back Camera…';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,max:60}},audio:false});video.srcObject=stream;await video.play();ready=true;$('front').classList.toggle('active',mode==='user');$('back').classList.toggle('active',mode==='environment');$('status').textContent=mode==='user'?'Face Camera ready':'Back Camera ready'}catch(e){$('status').textContent='Camera permission needed'}}
function loop(t){ctl.update();loop.fps=(loop.fps||0)+1;loop.ft=loop.ft||t;if(t-loop.ft>1000){$('fps').textContent=Math.round(loop.fps*1000/(t-loop.ft));loop.fps=0;loop.ft=t}if(playing)replayStep(t);else if(scanning&&ready&&video.readyState>=2)reconstruct(t);ren.render(scene,cam)}
function reconstruct(t){ctx.drawImage(video,0,0,W,H);const pix=ctx.getImageData(0,0,W,H).data;const stride=Math.max(1,Math.round(12-density*1.15));let n=0;const pos=new Float32Array(N*3),col=new Float32Array(N*3);for(let y=0;y<H&&n<N;y+=stride)for(let x=0;x<W&&n<N;x+=stride){const i=(y*W+x)*4,r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255,lum=.299*r+.587*g+.114*b;if(lum<.008)continue;const nx=x/(W-1),ny=y/(H-1);const l=x?pix[i-4]:pix[i],rr=x<W-1?pix[i+4]:pix[i],u=y?pix[i-W*4]:pix[i],d=y<H-1?pix[i+W*4]:pix[i];const edge=Math.min(1,(Math.abs(pix[i]-l)+Math.abs(pix[i]-rr)+Math.abs(pix[i]-u)+Math.abs(pix[i]-d))/360);const center=Math.max(0,1-Math.hypot(nx-.5,(ny-.48)*.82)*1.55);let z=((1-lum)*.22+edge*depth*.26+center*depth*.045-.10)*volume;const id=y*W+x;z*=.72+depth*.58;smoothZ[id]+=(z-smoothZ[id])*(.20+depth*.10);const j=n*3;pos[j]=(nx-.5)*5.05;pos[j+1]=(.5-ny)*2.84;pos[j+2]=smoothZ[id];col[j]=Math.min(1,r+.018);col[j+1]=Math.min(1,g+.018);col[j+2]=Math.min(1,b+.018);n++}
for(let j=0;j<n*3;j++){smoothPos[j]+=(pos[j]-smoothPos[j])*(.25+depth*.08);pa.array[j]=smoothPos[j];ca.array[j]=col[j]}pa.needsUpdate=ca.needsUpdate=true;pts.geometry.setDrawRange(0,n);pts.material.size=.009+density*.0008;pts.material.opacity=.07+depth*.08;$('nodes').textContent=n.toLocaleString();plane.material.uniforms.depthAmount.value=depth;plane.material.uniforms.volume.value=volume;tex.needsUpdate=true;if(recording&&t-lastFrame>32){lastFrame=t;frames.push({n,pos:new Float32Array(smoothPos.slice(0,n*3)),col:new Float32Array(col.slice(0,n*3))});if(frames.length>900)frames.shift()}}
function toggleScan(){if(!ready)return;scanning=!scanning;$('scan').textContent=scanning?'Stop Scanning':'Start Scanning';$('scan').className=scanning?'blue':'red';$('rec').disabled=!scanning;$('rec').classList.toggle('ready',scanning);ctl.autoRotate=!scanning;$('status').textContent=scanning?'3D reconstruction active · move slowly':'Ready · point camera at subject'}
function toggleRec(){if(recording){recording=false;if(mr&&mr.state!=='inactive')mr.stop();$('rec').textContent='Record';return}if(!scanning)return;frames=[];chunks=[];recStart=performance.now();lastFrame=0;const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';mr=new MediaRecorder($('c').captureStream(30),{mimeType:type,videoBitsPerSecond:16000000});mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{$('play').disabled=!frames.length;$('share').disabled=!chunks.length};mr.start(100);recording=true;$('rec').textContent='Stop';$('status').textContent='Recording 3D video…'}
function togglePlay(){if(!frames.length)return;playing=!playing;if(playing){pidx=0;lastReplay=performance.now();$('play').textContent='Stop';ctl.autoRotate=false;$('status').textContent='Playing reconstructed 3D video'}else{$('play').textContent='Replay';ctl.autoRotate=true;$('status').textContent='Ready'}}function replayStep(t){if(t-lastReplay<33)return;lastReplay=t;const f=frames[pidx];pa.array.set(f.pos);ca.array.set(f.col);pa.needsUpdate=ca.needsUpdate=true;pts.geometry.setDrawRange(0,f.n);$('nodes').textContent=f.n.toLocaleString();pidx=(pidx+1)%frames.length}
async function shareVideo(){if(!chunks.length)return;const blob=new Blob(chunks,{type:'video/webm'}),file=new File([blob],'hyperstream-3d-video.webm',{type:blob.type});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:'HyperStream 3D Video',text:'My HyperStream 3D holographic video ✨',files:[file]});$('status').textContent='Shared ✨';return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();$('status').textContent='Video saved'}
</script></body></html>
