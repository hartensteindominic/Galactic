<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro – Next-Gen 4D Volumetric Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #020205; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        #camera-stream, #processing-canvas, #render-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #processing-canvas, #render-container { display: none; }
        #camera-stream.front-facing { transform: scaleX(-1); }
        #hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .top-status { background: rgba(12,12,18,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(0,243,255,0.25); border-radius: 14px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 13px; background: linear-gradient(45deg, #00f3ff, #b537f2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-group { display: flex; gap: 8px; }
        .ui-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .ui-btn:hover { background: rgba(0,243,255,0.2); border-color: rgba(0,243,255,0.5); }
        input[type="file"] { display: none; }
        .badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; background: rgba(255,59,48,0.15); color: #ff453a; border: 1px solid rgba(255,59,48,0.3); }
        .badge.active { background: rgba(48,209,88,0.15); color: #30d158; border: 1px solid rgba(48,209,88,0.3); box-shadow: 0 0 12px rgba(48,209,88,0.3); }
        .control-dock { background: rgba(12,12,18,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(0,243,255,0.25); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .metric-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 8px; }
        .metric-label { font-size: 9px; color: #8a8fa3; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-value { font-size: 14px; font-weight: 800; color: #00f3ff; margin-top: 2px; }
        .btn-row { display: flex; gap: 8px; }
        button.action-btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: 800; font-size: 12px; cursor: pointer; letter-spacing: 0.8px; transition: transform 0.1s, filter 0.2s; }
        button.action-btn:active { transform: scale(0.98); }
        #scan-btn { background: linear-gradient(135deg, #00f3ff, #0066ff); color: #000; box-shadow: 0 4px 20px rgba(0,243,255,0.4); }
        #scan-btn.scanning { background: linear-gradient(135deg, #ff453a, #ff9500); color: #fff; box-shadow: 0 4px 20px rgba(255,69,58,0.4); }
        #save-btn { background: linear-gradient(135deg, #30d158, #00a86b); color: #000; display: none; box-shadow: 0 4px 20px rgba(48,209,88,0.4); }
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 10; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #0f1016; border: 1px solid rgba(0,243,255,0.3); border-radius: 16px; padding: 20px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .modal-content textarea { width: 100%; height: 130px; background: #050508; color: #00f3ff; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; font-family: monospace; font-size: 10px; resize: none; }
        .modal-btn-row { display: flex; gap: 8px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 11px; cursor: pointer; background: #00f3ff; color: #000; }
        .modal-btn.secondary { background: rgba(255,255,255,0.1); color: #fff; }
        /* FXAA / Scanline aesthetic touch */
        .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; z-index: 3; pointer-events: none; opacity: 0.3; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="scanline"></div>
    <video id="camera-stream" autoplay playsinline muted></video>
    <canvas id="processing-canvas"></canvas>
    <div id="render-container"></div>

    <div id="export-modal" class="modal interactive">
        <div class="modal-content">
            <h3 style="font-size: 14px; color: #00f3ff;">4D Volumetric Payload Ready</h3>
            <textarea id="modal-json-text" readonly></textarea>
            <div class="modal-btn-row">
                <button class="modal-btn" onclick="copyPayload()">Copy Payload</button>
                <button class="modal-btn secondary" onclick="closeModal('export-modal')">Close</button>
            </div>
        </div>
    </div>

    <div id="paste-modal" class="modal interactive">
        <div class="modal-content">
            <h3 style="font-size: 14px; color: #00f3ff;">Import 4D Dataset JSON</h3>
            <textarea id="paste-json-text" placeholder="Paste 4D JSON data here..."></textarea>
            <div class="modal-btn-row">
                <button class="modal-btn" onclick="processJSONText()">Process & Play</button>
                <button class="modal-btn secondary" onclick="closeModal('paste-modal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <div class="brand">SPATIAL DASH 4D+</div>
            <div class="btn-group">
                <button class="ui-btn" onclick="switchCamera()">📷 Flip</button>
                <label class="ui-btn">📁 Load<input type="file" accept=".json" onchange="loadFile(event)"></label>
                <button class="ui-btn" onclick="openModal('paste-modal')">📋 Paste</button>
            </div>
            <span id="status-badge" class="badge">READY</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card"><div class="metric-label">Buffer Frames</div><div id="frame-count" class="metric-value">0</div></div>
                <div class="metric-card"><div class="metric-label">Sample Rate</div><div id="fps-count" class="metric-value">0 FPS</div></div>
                <div class="metric-card"><div class="metric-label">Voxels / Frame</div><div id="node-count" class="metric-value">0</div></div>
            </div>
            <div class="btn-row">
                <button id="scan-btn" class="action-btn" onclick="toggleScan()">START 4D SPEED RECORD</button>
                <button id="save-btn" class="action-btn" onclick="exportMap()">SAVE 4D MAP (.JSON)</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('processing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const renderContainer = document.getElementById('render-container');
        const scanBtn = document.getElementById('scan-btn');
        const saveBtn = document.getElementById('save-btn');
        const badge = document.getElementById('status-badge');
        
        let isScanning = false, frames = [], stream = null;
        let cachedJSON = "", scene, camera, renderer, pointCloud, playback = [], frameIdx = 0, facing = "environment";
        let frameCounter = 0, lastFpsUpdate = 0, recordingStartTime = 0;

        async function initCam() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60, max: 120 } } 
                });
                video.srcObject = stream;
                video.className = facing === "user" ? "front-facing" : "";
            } catch (e) { console.error("Camera error:", e); }
        }

        function switchCamera() {
            facing = facing === "environment" ? "user" : "environment";
            initCam();
        }

        function initEngine() {
            function speedLoop() {
                if (isScanning && video.readyState === video.HAVE_ENOUGH_DATA) {
                    const now = performance.now();
                    frameCounter++;
                    if (now - lastFpsUpdate > 1000) {
                        document.getElementById('fps-count').innerText = frameCounter + " FPS";
                        frameCounter = 0;
                        lastFpsUpdate = now;
                    }
                    sampleFrame(now);
                }
                requestAnimationFrame(speedLoop);
            }
            requestAnimationFrame(speedLoop);
        }

        // Upgraded High-Resolution 4D Sampler: Higher spatial grid density with temporal coordinate
        function sampleFrame(now) {
            canvas.width = 160; canvas.height = 90;
            ctx.drawImage(video, 0, 0, 160, 90);
            const img = ctx.getImageData(0, 0, 160, 90).data;
            let v = [], c = [];
            
            const relativeTime = ((now - recordingStartTime) / 1000.0).toFixed(3);

            for (let y = 0; y < 90; y += 2) {
                for (let x = 0; x < 160; x += 2) {
                    let i = (y * 160 + x) * 4;
                    let r = img[i], g = img[i+1], b = img[i+2];
                    let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
                    
                    // High precision 3D Spatial + Temporal (X, Y, Z, T) components
                    let px = ((x / 160 - 0.5) * 4.5).toFixed(2);
                    let py = (-(y / 90 - 0.5) * 4.5).toFixed(2);
                    let pz = ((lum - 0.5) * 3.5).toFixed(2);
                    let pt = relativeTime;

                    v.push(px, py, pz, pt);
                    c.push((r/255).toFixed(2), (g/255).toFixed(2), (b/255).toFixed(2));
                }
            }
            
            frames.push({ vertices: v, colors: c });
            document.getElementById('frame-count').innerText = frames.length;
            document.getElementById('node-count').innerText = v.length / 4; 
        }

        function toggleScan() {
            isScanning = !isScanning;
            if (isScanning) {
                frames = [];
                recordingStartTime = performance.now();
                scanBtn.innerText = "STOP RECORDING";
                scanBtn.classList.add("scanning");
                badge.innerText = "CAPTURING 4D STREAM...";
                badge.classList.add("active");
                saveBtn.style.display = "block";
            } else {
                scanBtn.innerText = "START 4D SPEED RECORD";
                scanBtn.classList.remove("scanning");
                badge.innerText = "READY";
                badge.classList.remove("active");
            }
        }

        function exportMap() {
            if (!frames.length) return alert("No frames recorded.");
            badge.innerText = "PACKAGING 4D DATA...";
            setTimeout(() => {
                const payload = { 
                    version: "4.5-AdvancedVolumetric", 
                    dimensions: 4, 
                    axes: ["x", "y", "z", "t"],
                    frames: frames.map((f, i) => ({ frameIndex: i, geometryStream4D: f })) 
                };
                cachedJSON = JSON.stringify(payload);
                document.getElementById('modal-json-text').value = cachedJSON.substring(0, 600) + "\n...[4D Stream Packet Ready]";
                openModal('export-modal');
                badge.innerText = "READY";
            }, 30);
        }

        function processJSONText() {
            try {
                const data = JSON.parse(document.getElementById('paste-json-text').value);
                const seq = data.frames ? data.frames.map(f => f.geometryStream4D || f.geometryStream) : data.sequence;
                playSequence(seq);
                closeModal('paste-modal');
            } catch (e) { alert("Invalid JSON format."); }
        }

        function loadFile(e) {
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = JSON.parse(evt.target.result);
                    const seq = data.frames ? data.frames.map(f => f.geometryStream4D || f.geometryStream) : data.sequence;
                    playSequence(seq);
                } catch (err) { alert("Invalid Map file."); }
            };
            reader.readAsText(e.target.files[0]);
        }

        function playSequence(seq) {
            if (stream) stream.getTracks().forEach(t => t.stop());
            video.style.display = 'none';
            renderContainer.style.display = 'block';
            badge.innerText = "RENDERING 4D VOLUMETRIC ENGINE";
            badge.classList.add("active");

            playback = seq || [];
            frameIdx = 0;
            if (!playback.length) return alert("Empty sequence.");

            if (!scene) {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 4.0);
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderContainer.appendChild(renderer.domElement);
                scene.add(new THREE.AmbientLight(0xffffff, 1.5));

                // Interactive touch/mouse orbital control mechanics
                let drag = false, px = 0, py = 0;
                window.addEventListener('mousedown', e => { drag = true; px = e.clientX; py = e.clientY; });
                window.addEventListener('mousemove', e => {
                    if (!drag || !pointCloud) return;
                    pointCloud.rotation.y += (e.clientX - px) * 0.005;
                    pointCloud.rotation.x += (e.clientY - py) * 0.005;
                    px = e.clientX; py = e.clientY;
                });
                window.addEventListener('mouseup', () => drag = false);

                // Mobile touch support
                window.addEventListener('touchstart', e => { if(e.touches.length === 1) { drag = true; px = e.touches[0].clientX; py = e.touches[0].clientY; } });
                window.addEventListener('touchmove', e => {
                    if (!drag || !pointCloud || e.touches.length !== 1) return;
                    pointCloud.rotation.y += (e.touches[0].clientX - px) * 0.005;
                    pointCloud.rotation.x += (e.touches[0].clientY - py) * 0.005;
                    px = e.touches[0].clientX; py = e.touches[0].clientY;
                });
                window.addEventListener('touchend', () => drag = false);
            }

            const geom = new THREE.BufferGeometry();
            
            // Custom shader material points styling for maximum visual glow effect
            const mat = new THREE.PointsMaterial({ 
                size: 0.02, 
                vertexColors: true, 
                transparent: true, 
                opacity: 0.95,
                blending: THREE.AdditiveBlending
            });
            
            pointCloud = new THREE.Points(geom, mat);
            scene.add(pointCloud);

            function loop() {
                requestAnimationFrame(loop);
                if (playback.length) {
                    let f = playback[frameIdx];
                    let rawVals = f.vertices;
                    let posArr = [];
                    for(let k = 0; k < rawVals.length; k += 4) {
                        posArr.push(parseFloat(rawVals[k]), parseFloat(rawVals[k+1]), parseFloat(rawVals[k+2]));
                    }

                    geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(posArr), 3));
                    geom.setAttribute('color', new THREE.BufferAttribute(new Float32Array(f.colors), 3));
                    geom.attributes.position.needsUpdate = true;
                    geom.attributes.color.needsUpdate = true;
                    document.getElementById('node-count').innerText = posArr.length / 3;
                    
                    // Smooth temporal frame progression with fluid scaling effect
                    frameIdx = (frameIdx + 1) % playback.length;
                    
                    // Subtle dynamic breathing rotation loop
                    pointCloud.rotation.z = Math.sin(Date.now() * 0.001) * 0.03;
                }
                renderer.render(scene, camera);
            }
            loop();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function copyPayload() { navigator.clipboard.writeText(cachedJSON); alert("Copied 4D Payload to clipboard!"); }

        window.addEventListener('load', () => { initCam(); initEngine(); });
    </script>
</body>
</html>
