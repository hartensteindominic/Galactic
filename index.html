<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column}#stage{height:58dvh;position:relative}canvas{width:100%;height:100%;display:block}.badge{position:absolute;right:12px;top:12px;z-index:5;padding:7px 12px;border-radius:22px;background:#0008;backdrop-filter:blur(20px);font-size:12px}.panel{height:42dvh;overflow-y:auto;background:#19191cf8;border-radius:24px 24px 0 0;padding:7px 10px calc(14px + env(safe-area-inset-bottom));box-sizing:border-box}.handle{width:38px;height:4px;background:#68686f;border-radius:9px;margin:0 auto 8px}.card{background:#303034e6;border-radius:17px;padding:10px;margin-bottom:8px}.actions{display:flex;flex-direction:column;gap:7px}.actions button,.switch button{border:0;border-radius:15px;height:44px;font-weight:750;color:#fff;font-size:14px}.red{background:linear-gradient(135deg,#ff477c,#ff3561)}.green{background:linear-gradient(135deg,#65f39a,#30d158);color:#06120a!important}.green.ready{animation:g 1.35s infinite;box-shadow:0 0 18px #30d15877}@keyframes g{50%{box-shadow:0 0 28px #30d158b8}}.blue{background:linear-gradient(135deg,#5ab5ff,#0a84ff)}.primary{background:linear-gradient(135deg,#d06cff,#ff4f91)}.orange{background:linear-gradient(135deg,#ffc45c,#ff9f0a);color:#111!important}.title{font-size:10px;font-weight:800;color:#9a9aa3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.switch button{background:#ffffff12}.switch button.active{background:#ff4f864d;outline:1px solid #ff4f8680}.sliderrow{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:6px;height:40px;font-size:12px}.value{text-align:right;font-size:10px}.sliderrow input{min-width:0}input[type=range]{appearance:none;width:100%;height:28px;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,#ffffff20,#ff4f867a)}input[type=range]::-webkit-slider-thumb{appearance:none;width:21px;height:21px;margin-top:-7.5px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#fff,#ff76a6);box-shadow:0 2px 10px #ff46806b}.status{font-size:10px;color:#42a5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}button:disabled{opacity:.35}video{display:none}@media(min-width:769px){#stage{height:calc(100dvh - 330px)}.panel{height:330px}.handle{display:none}.actions{display:grid;grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="app"><section id="stage"><div class="badge">FPS <b id="fps" style="color:#ff4f86">—</b></div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></section><section class="panel"><div class="handle"></div><div class="card actions"><button class="red" id="scanBtn" onclick="toggleScan()">Start Scanning</button><button class="green" id="recBtn" onclick="toggleRec()" disabled>Record</button><button class="blue" id="playBtn" onclick="togglePlay()" disabled>Replay</button><button class="primary" id="shareBtn" onclick="shareHologram()" disabled>Share</button></div><div class="card"><div class="title">Camera</div><div class="switch"><button id="frontBtn" class="active" onclick="switchCamera('user')">Face Camera</button><button id="backBtn" onclick="switchCamera('environment')">Back Camera</button></div></div><div class="card"><div class="title">Hologram Controls</div><div class="sliderrow"><span>Detail</span><input type="range" min="1" max="12" value="4" oninput="stepSize=+this.value;detailVal.textContent=this.value"><b class="value" id="detailVal">4</b></div><div class="sliderrow"><span>Depth</span><input type="range" min="10" max="260" value="100" oninput="depthMul=+this.value;depthVal.textContent=this.value"><b class="value" id="depthVal">100</b></div><div class="sliderrow"><span>Shape</span><input type="range" min="0" max="100" value="70" oninput="shapeAmount=+this.value/100;shapeVal.textContent=this.value+'%'"><b class="value" id="shapeVal">70%</b></div><div class="status" id="status">Starting Face Camera…</div></div></section></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>const $=id=>document.getElementById(id);let scene,cam,ren,ctrl,video,cv,ctx,stream,ready=false,scanning=false,stepSize=4,depthMul=100,shapeAmount=.7,fc=0,ft=0,pts,l1,l2,posA,colA,prevPos,prevCol,frames=[],recording=false,mr,chunks=[],recStart=0,lastCap=0,playing=false,pIdx=0,pLast=0;const MAX=210000;init();startCamera('user');function init(){const b=$('stage');scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(48,b.clientWidth/b.clientHeight,.03,1000);cam.position.set(0,1.35,5.1);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});ren.setSize(b.clientWidth,b.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setClearColor(0);ctrl=new THREE.OrbitControls(cam,ren.domElement);ctrl.enableDamping=true;ctrl.dampingFactor=.065;ctrl.autoRotate=true;ctrl.autoRotateSpeed=.22;ctrl.target.set(0,.3,0);const g=new THREE.BufferGeometry();posA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);colA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);g.setAttribute('position',posA);g.setAttribute('color',colA);pts=new THREE.Points(g,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:.68,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(pts);l1=new THREE.Points(g,new THREE.PointsMaterial({size:.023,vertexColors:true,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));l2=new THREE.Points(g,new THREE.PointsMaterial({size:.034,vertexColors:true,transparent:true,opacity:.045,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(l1,l2);const grid=new THREE.GridHelper(10,30,0x2845a0,0x15151a);grid.position.y=-1.45;grid.material.opacity=.08;grid.material.transparent=true;scene.add(grid);addEventListener('resize',()=>{cam.aspect=b.clientWidth/b.clientHeight;cam.updateProjectionMatrix();ren.setSize(b.clientWidth,b.clientHeight)});ren.setAnimationLoop(loop)}function startCamera(mode){$('status').textContent=mode==='user'?'Starting Face Camera…':'Starting Back Camera…';if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720}},audio:false}).then(s=>{stream=s;video=$('vid');video.srcObject=s;return video.play()}).then(()=>{ready=true;$('status').textContent=mode==='user'?'Face Camera ready':'Back Camera ready';$('frontBtn').classList.toggle('active',mode==='user');$('backBtn').classList.toggle('active',mode==='environment')}).catch(()=>{$('status').textContent='Camera permission needed'})}function switchCamera(m){if(scanning)toggleScan();startCamera(m)}function loop(now){ctrl.update();fc++;if(now-ft>1000){$('fps').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}if(playing)playStep(now);else if(scanning&&ready&&video.readyState>=2)sample(now);ren.render(scene,cam)}function sample(now){const w=video.videoWidth||1280,h=video.videoHeight||720;if(!cv||cv.width!==w||cv.height!==h){cv=document.createElement('canvas');cv.width=w;cv.height=h;ctx=cv.getContext('2d',{willReadFrequently:true})}ctx.drawImage(video,0,0,w,h);let pix;try{pix=ctx.getImageData(0,0,w,h).data}catch{return}const total=Math.ceil(w/stepSize)*Math.ceil(h/stepSize),stride=total>MAX?Math.ceil(Math.sqrt(total/MAX))*stepSize:stepSize;let n=0;const raw=[];for(let y=0;y<h&&n<MAX;y+=stride)for(let x=0;x<w&&n<MAX;x+=stride){const i=(y*w+x)*4,r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255,lum=.299*r+.587*g+.114*b;if(lum<.008)continue;const nx=x/w,ny=y/h,L=x>0?Math.abs(pix[i]-pix[i-4]):0,R=x<w-1?Math.abs(pix[i]-pix[i+4]):0,U=y>0?Math.abs(pix[i]-pix[i-w*4]):0,D=y<h-1?Math.abs(pix[i]-pix[i+w*4]):0,edge=Math.min(1,(L+R+U+D)/650),radial=Math.min(1,Math.hypot(nx-.5,(ny-.48)*.84)*1.35),faceZone=1-radial;const base=Math.pow(1-lum,1.08)*.42;const contour=edge*shapeAmount*.34;const face=faceZone*shapeAmount*.06;const depth=base+contour+face;raw.push([(nx-.5)*4.45,(.5-ny)*3.35,(depth-.23)*(depthMul*.042),r,g,b]);n++}if(!prevPos||prevPos.length!==n*3){prevPos=new Float32Array(n*3);prevCol=new Float32Array(n*3);for(let i=0;i<n;i++){const j=i*3;prevPos[j]=raw[i][0];prevPos[j+1]=raw[i][1];prevPos[j+2]=raw[i][2];prevCol[j]=raw[i][3];prevCol[j+1]=raw[i][4];prevCol[j+2]=raw[i][5]}}const alpha=.16+.10*shapeAmount;for(let i=0;i<n;i++){const q=raw[i],j=i*3;prevPos[j]+=(q[0]-prevPos[j])*alpha;prevPos[j+1]+=(q[1]-prevPos[j+1])*alpha;prevPos[j+2]+=(q[2]-prevPos[j+2])*alpha;prevCol[j]+=(q[3]-prevCol[j])*.28;prevCol[j+1]+=(q[4]-prevCol[j+1])*.28;prevCol[j+2]+=(q[5]-prevCol[j+2])*.28;posA.array[j]=prevPos[j];posA.array[j+1]=prevPos[j+1];posA.array[j+2]=prevPos[j+2];colA.array[j]=prevCol[j];colA.array[j+1]=prevCol[j+1];colA.array[j+2]=prevCol[j+2]}posA.needsUpdate=colA.needsUpdate=true;pts.geometry.setDrawRange(0,n);const bright=Math.max(.52,Math.min(.72,.68*Math.sqrt(100000/Math.max(1,n))));pts.material.opacity=bright;l1.material.opacity=bright*.17;l2.material.opacity=bright*.065;if(recording&&now-lastCap>=80){lastCap=now;frames.push({t:now-recStart,n,pos:new Float32Array(posA.array.slice(0,n*3)),col:new Float32Array(colA.array.slice(0,n*3))})}}function toggleScan(){if(!ready)return;scanning=!scanning;$('scanBtn').textContent=scanning?'Stop Scanning':'Start Scanning';$('scanBtn').className=scanning?'orange':'red';$('recBtn').disabled=!scanning;$('recBtn').classList.toggle('ready',scanning);ctrl.autoRotate=!scanning;$('status').textContent=scanning?'Scanning · move slowly around the subject':'Ready · point camera at subject';if(!scanning){pts.geometry.setDrawRange(0,0);$('shareBtn').disabled=true}}function toggleRec(){recording?stopRec():startRec()}function startRec(){if(!scanning)return;chunks=[];frames=[];recStart=performance.now();lastCap=0;const opt={mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:9000000};if(!MediaRecorder.isTypeSupported(opt.mimeType))opt.mimeType='video/webm';mr=new MediaRecorder($('c').captureStream(30),opt);mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{$('playBtn').disabled=!frames.length;$('shareBtn').disabled=!frames.length};mr.start(120);recording=true;$('recBtn').textContent='Stop'}function stopRec(){recording=false;if(mr?.state!=='inactive')mr.stop();$('recBtn').textContent='Record'}function togglePlay(){if(!frames.length)return;playing=!playing;if(playing){pIdx=0;pLast=performance.now();$('playBtn').textContent='Stop'}else{$('playBtn').textContent='Replay';pts.geometry.setDrawRange(0,0)}}function playStep(now){if(now-pLast<1000/30)return;pLast=now;const f=frames[pIdx];posA.array.set(f.pos);colA.array.set(f.col);posA.needsUpdate=colA.needsUpdate=true;pts.geometry.setDrawRange(0,f.n);pIdx=(pIdx+1)%frames.length}async function shareHologram(){if(!chunks.length)return;$('status').textContent='Preparing share…';const blob=new Blob(chunks,{type:'video/webm'}),file=new File([blob],`hyperstream_${Date.now()}.webm`,{type:'video/webm'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:'HyperStream Hologram',text:'My HyperStream hologram ✨',files:[file]});$('status').textContent='Shared ✨';return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();$('status').textContent='Video saved · upload it to Instagram'}</script></body></html>
