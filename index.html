<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HyperStream XD • Stable v4.6</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020617;color:#f8fafc;font-family:system-ui,sans-serif;height:100vh;display:flex;overflow:hidden}
#sidebar{width:360px;background:#030712;border-right:1px solid #1e293b;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:10}
.card{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.title{font-size:9px;font-weight:800;text-transform:uppercase;color:#94a3b8}
.row{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#cbd5e1}
button{border:none;border-radius:6px;padding:7px;font-size:10px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#8b5cf6,#ec4899)}
input[type=range]{accent-color:#ec4899;width:100px}
#viewer{flex:1;position:relative}
canvas{display:block;width:100%;height:100%}
.stats{position:absolute;top:10px;right:10px;background:rgba(2,6,23,0.8);padding:6px 10px;border-radius:6px;font-size:10px;color:#94a3b8;z-index:5}
video{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="sidebar">
  <div style="font-size:12px;font-weight:900;color:#38bdf8">HYPERSTREAM XD • STABLE v4.6</div>
  <div class="card">
    <div class="title">Performance Controls</div>
    <div class="row"><span>Voxel Step Size</span><input type="range" min="2" max="6" value="3" oninput="stepSize=+this.value;$('stepV').textContent=this.value"><span id="stepV" style="color:#ec4899">3</span></div>
    <div class="row"><span>Strata Layers</span><input type="range" min="2" max="12" value="6" oninput="layerN=+this.value;$('layV').textContent=this.value"><span id="layV" style="color:#ec4899">6</span></div>
    <div class="row"><span>Active Voxels</span><b id="nLive" style="color:#ec4899">0</b></div>
  </div>
</div>
<div id="viewer">
  <div class="stats">FPS <b id="fpsD" style="color:#ec4899">—</b></div>
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="c3"></canvas>
</div>
<script>
const $=id=>document.getElementById(id);
let scene,cam,ren,ctrl,video,c2d,ctx,stream=null,ready=false;
let cloudMesh=null,stepSize=3,layerN=6,fc=0,ft=0,phase=0;

window.addEventListener('DOMContentLoaded',()=>{init3();initCam();});

function init3(){
  const box=$('viewer');
  scene=new THREE.Scene();
  cam=new THREE.PerspectiveCamera(48,box.clientWidth/box.clientHeight,0.1,1000);
  cam.position.set(0,0,3.5);

  ren=new THREE.WebGLRenderer({canvas:$('c3'),antialias:false,powerPreference:'high-performance'});
  ren.setSize(box.clientWidth,box.clientHeight);
  ren.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  ren.setClearColor(0x020617);

  ctrl=new THREE.OrbitControls(cam,ren.domElement);
  ctrl.enableDamping=true;ctrl.autoRotate=true;
  scene.add(new THREE.AmbientLight(0xffffff,1.2));

  window.addEventListener('resize',()=>{
    cam.aspect=box.clientWidth/box.clientHeight;
    cam.updateProjectionMatrix();
    ren.setSize(box.clientWidth,box.clientHeight);
  });
  ren.setAnimationLoop(loop);
}

function initCam(){
  video=$('vid');
  c2d=document.createElement('canvas');
  ctx=c2d.getContext('2d',{willReadFrequently:true});
  navigator.mediaDevices?.getUserMedia({video:{width:{ideal:480},height:{ideal:360},frameRate:{ideal:24}},audio:false})
  .then(s=>{stream=s;video.srcObject=s;return video.play();})
  .then(()=>{ready=true;})
  .catch(()=>{/* Fallback handled gracefully */});
}

function loop(now){
  ctrl.update();
  phase=now*0.001;
  fc++;
  if(now-ft>1000){$('fpsD').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now;}
  if(ready&&video.readyState>=2&&fc%2===0)sample(); // Sample every 2nd frame to protect CPU/GPU
  ren.render(scene,cam);
}

function sample(){
  const w=320,h=240; // Low resolution target to ensure zero crashing
  if(c2d.width!==w||c2d.height!==h){c2d.width=w;c2d.height=h;}
  try{ctx.drawImage(video,0,0,w,h);}catch{return;}
  let pix;
  try{pix=ctx.getImageData(0,0,w,h).data;}catch{return;}

  const pos=[],col=[];
  const step=stepSize;

  for(let y=0;y<h;y+=step){
    for(let x=0;x<w;x+=step){
      const i=(y*w+x)*4;
      const r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255;
      const lum=0.299*r+0.587*g+0.114*b;
      if(lum<0.05)continue;

      const nx=((w-x)/w)*2-1,ny=-((y/h)*2-1);
      
      for(let L=0;L<layerN;L++){
        const nz=(L/(layerN-1)-0.5)*1.5+(lum-0.5)*0.5;
        pos.push(nx*1.5,ny*1.5,nz);
        col.push(r*(1-L*0.05),g*(1-L*0.05),b*(1-L*0.05));
      }
    }
  }

  $('nLive').textContent=(pos.length/3).toLocaleString();
  updateCloud(pos,col);
}

function updateCloud(pos,col){
  if(cloudMesh){scene.remove(cloudMesh);cloudMesh.geometry.dispose();cloudMesh.material.dispose();}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));

  const mat=new THREE.PointsMaterial({size:0.012,vertexColors:true,transparent:true,opacity:0.9});
  cloudMesh=new THREE.Points(g,mat);
  scene.add(cloudMesh);
}
</script>
</body>
</html>
