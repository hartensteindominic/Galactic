<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro - Auto Spatial Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .top-status {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 14px; color: #f0f0f0; }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.2);
            color: #ff453a;
            border: 1px solid rgba(255, 59, 48, 0.4);
        }
        .badge.active {
            background: rgba(48, 209, 88, 0.2);
            color: #30d158;
            border: 1px solid rgba(48, 209, 88, 0.4);
        }
        .control-dock {
            background: rgba(15, 15, 15, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px;
        }
        .metric-label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .metric-value { font-size: 14px; font-weight: 700; color: #0a84ff; }
        .btn-row { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #scan-btn { background: #0a84ff; color: white; }
        #scan-btn.scanning { background: #ff453a; }
        #save-btn { background: #30d158; color: white; display: none; }
        button:active { transform: scale(0.97); opacity: 0.8; }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <span class="brand">SPATIAL DASH AUTO</span>
            <span id="status-badge" class="badge">SYSTEM READY</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Auto Nodes</div>
                    <div id="node-count" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Status</div>
                    <div id="surface-status" class="metric-value">Idle</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Mode</div>
                    <div class="metric-value">Hands-Free</div>
                </div>
            </div>
            
            <div class="btn-row">
                <button id="scan-btn" onclick="toggleAutoScan()">START SCANNING</button>
                <button id="save-btn" onclick="exportEnvironmentMap()">EXPORT MAP (.JSON)</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let worldGroup = new THREE.Group();
        let spatialNodes = [];
        let vectorPoints = [];
        let isScanning = false;
        let scanInterval = null;

        let scanBtn = document.getElementById('scan-btn');
        let saveBtn = document.getElementById('save-btn');
        let statusBadge = document.getElementById('status-badge');
        let nodeCountText = document.getElementById('node-count');
        let surfaceStatusText = document.getElementById('surface-status');

        function init() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 4);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene.add(worldGroup);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            function animate() {
                requestAnimationFrame(animate);
                worldGroup.rotation.y += 0.002; // Gentle orbit rotation to view the auto-generated mesh framework
                renderer.render(scene, camera);
            }
            animate();
        }

        function toggleAutoScan() {
            isScanning = !isScanning;

            if (isScanning) {
                scanBtn.innerText = "STOP SCANNING";
                scanBtn.classList.add("scanning");
                statusBadge.innerText = "AUTO-MAPPING ACTIVE";
                statusBadge.classList.add("active");
                surfaceStatusText.innerText = "Recording";
                saveBtn.style.display = "block";

                // Automatically generate and stitch nodes every 150 milliseconds hands-free
                scanInterval = setInterval(() => {
                    let x = (Math.random() * 3 - 1.5);
                    let y = (Math.random() * 2 - 1);
                    let z = (Math.random() * 3 - 1.5);

                    let newVector = new THREE.Vector3(x, y, z);
                    vectorPoints.push(newVector);

                    let nodeData = {
                        id: spatialNodes.length + 1,
                        x: x.toFixed(3),
                        y: y.toFixed(3),
                        z: z.toFixed(3),
                        timestamp: new Date().toISOString()
                    };
                    spatialNodes.push(nodeData);
                    nodeCountText.innerText = spatialNodes.length;

                    // Drop node sphere
                    const sphereGeo = new THREE.SphereGeometry(0.04, 16, 16);
                    const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
                    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                    sphere.position.copy(newVector);
                    worldGroup.add(sphere);

                    // Frame connection line automatically
                    if (vectorPoints.length > 1) {
                        let prevVector = vectorPoints[vectorPoints.length - 2];
                        const lineGeo = new THREE.BufferGeometry().setFromPoints([prevVector, newVector]);
                        const lineMat = new THREE.LineBasicMaterial({ color: 0x0a84ff, linewidth: 3 });
                        const connectingLine = new THREE.Line(lineGeo, lineMat);
                        worldGroup.add(connectingLine);
                    }
                }, 150);

            } else {
                scanBtn.innerText = "START SCANNING";
                scanBtn.classList.remove("scanning");
                statusBadge.innerText = "SCAN COMPLETE";
                statusBadge.classList.remove("active");
                surfaceStatusText.innerText = "Saved";
                clearInterval(scanInterval);
            }
        }

        function exportEnvironmentMap() {
            if (spatialNodes.length === 0) {
                alert("No nodes recorded yet. Run a scan first.");
                return;
            }

            const environmentPayload = {
                generator: "Spatial Dash Auto-Capture Engine",
                version: "7.0",
                sessionDate: new Date().toISOString(),
                totalMeshNodes: spatialNodes.length,
                coordinatesMatrix: spatialNodes
            };

            const dataBlob = new Blob([JSON.stringify(environmentPayload, null, 2)], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(dataBlob);
            
            const fileLink = document.createElement('a');
            fileLink.href = downloadUrl;
            fileLink.download = `spatial_auto_map_${Date.now()}.json`;
            document.body.appendChild(fileLink);
            fileLink.click();
            document.body.removeChild(fileLink);
            URL.revokeObjectURL(downloadUrl);
        }

        window.addEventListener('load', init);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
