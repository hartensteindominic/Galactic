<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #camera-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .top-status {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 14px; color: #f0f0f0; }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.2);
            color: #ff453a;
            border: 1px solid rgba(255, 59, 48, 0.4);
        }
        .badge.active {
            background: rgba(48, 209, 88, 0.2);
            color: #30d158;
            border: 1px solid rgba(48, 209, 88, 0.4);
        }
        .control-dock {
            background: rgba(15, 15, 15, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px;
        }
        .metric-label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .metric-value { font-size: 14px; font-weight: 700; color: #0a84ff; }
        .btn-row { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #scan-btn { background: #0a84ff; color: white; }
        #scan-btn.scanning { background: #ff453a; }
        #save-btn { background: #30d158; color: white; display: none; }
        button:active { transform: scale(0.97); opacity: 0.8; }
    </style>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <span class="brand">SPATIAL DASH</span>
            <span id="status-badge" class="badge">SYSTEM READY</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Nodes</div>
                    <div id="node-count" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Surface</div>
                    <div id="surface-status" class="metric-value">Calibrating</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Mode</div>
                    <div class="metric-value">Spatial LiDAR</div>
                </div>
            </div>
            
            <div class="btn-row">
                <button id="scan-btn" onclick="toggleScanState()">START SCANNING</button>
                <button id="save-btn" onclick="exportEnvironmentMap()">EXPORT MAP (.JSON)</button>
            </div>
        </div>
    </div>

    <script>
        let videoElement = document.getElementById('camera-stream');
        let scanBtn = document.getElementById('scan-btn');
        let saveBtn = document.getElementById('save-btn');
        let statusBadge = document.getElementById('status-badge');
        let nodeCountText = document.getElementById('node-count');
        let surfaceStatusText = document.getElementById('surface-status');

        let isScanning = false;
        let spatialNodes = [];
        let scanInterval = null;

        // Initialize high-resolution camera feed tailored for mobile browser frames
        async function initCameraFeed() {
            try {
                const constraints = {
                    video: {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };
                let stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
            } catch (err) {
                // Safe fallback for devices lacking explicit environment constraints
                try {
                    let fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    videoElement.srcObject = fallbackStream;
                } catch (e) {
                    alert("Camera permissions required for spatial tracking layout.");
                }
            }
        }

        function toggleScanState() {
            isScanning = !isScanning;

            if (isScanning) {
                scanBtn.innerText = "STOP SCANNING";
                scanBtn.classList.add("scanning");
                statusBadge.innerText = "MAPPING ACTIVE";
                statusBadge.classList.add("active");
                surfaceStatusText.innerText = "Tracking";
                saveBtn.style.display = "block";
                
                spatialNodes = []; // Reset storage array for new run

                // High-frequency telemetry stream simulating spatial mesh telemetry points
                scanInterval = setInterval(() => {
                    let mockNode = {
                        id: spatialNodes.length + 1,
                        x: (Math.random() * 4 - 2).toFixed(3),
                        y: (Math.random() * 1.5 - 0.5).toFixed(3),
                        z: (-Math.random() * 5).toFixed(3),
                        timestamp: new Date().toISOString()
                    };
                    spatialNodes.push(mockNode);
                    nodeCountText.innerText = spatialNodes.length;
                }, 150);

            } else {
                scanBtn.innerText = "START SCANNING";
                scanBtn.classList.remove("scanning");
                statusBadge.innerText = "SCAN PAUSED";
                statusBadge.classList.remove("active");
                surfaceStatusText.innerText = "Locked";
                clearInterval(scanInterval);
            }
        }

        function exportEnvironmentMap() {
            if (spatialNodes.length === 0) {
                alert("No environment nodes recorded. Start scanning first.");
                return;
            }

            const environmentPayload = {
                generator: "Spatial Dash Pro Web Engine",
                version: "2.0",
                sessionDate: new Date().toISOString(),
                totalMeshNodes: spatialNodes.length,
                coordinatesMatrix: spatialNodes
            };

            const dataBlob = new Blob([JSON.stringify(environmentPayload, null, 2)], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(dataBlob);
            
            const fileLink = document.createElement('a');
            fileLink.href = downloadUrl;
            fileLink.download = `spatial_environment_${Date.now()}.json`;
            document.body.appendChild(fileLink);
            fileLink.click();
            document.body.removeChild(fileLink);
            URL.revokeObjectURL(downloadUrl);
        }

        window.addEventListener('load', initCameraFeed);
    </script>
</body>
</html>
