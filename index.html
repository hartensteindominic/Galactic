<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro - 3D Mesh Reconstructor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #camera-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .top-status {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 14px; color: #f0f0f0; }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.2);
            color: #ff453a;
            border: 1px solid rgba(255, 59, 48, 0.4);
        }
        .badge.active {
            background: rgba(48, 209, 88, 0.2);
            color: #30d158;
            border: 1px solid rgba(48, 209, 88, 0.4);
        }
        .control-dock {
            background: rgba(15, 15, 15, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px;
        }
        .metric-label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .metric-value { font-size: 14px; font-weight: 700; color: #0a84ff; }
        .btn-row { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #scan-btn { background: #0a84ff; color: white; }
        #scan-btn.scanning { background: #ff453a; }
        #save-btn { background: #30d158; color: white; display: none; }
        button:active { transform: scale(0.97); opacity: 0.8; }
    </style>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>

    <canvas id="webgl-canvas"></canvas>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <span class="brand">SPATIAL DASH MESH</span>
            <span id="status-badge" class="badge">SYSTEM READY</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Mesh Nodes</div>
                    <div id="node-count" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Surfaces</div>
                    <div id="surface-status" class="metric-value">Idle</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Mode</div>
                    <div class="metric-value">Live Wireframe</div>
                </div>
            </div>
            
            <div class="btn-row">
                <button id="scan-btn" onclick="toggleScanState()">START SCANNING</button>
                <button id="save-btn" onclick="exportEnvironmentMap()">EXPORT MAP (.JSON)</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let videoElement = document.getElementById('camera-stream');
        let scanBtn = document.getElementById('scan-btn');
        let saveBtn = document.getElementById('save-btn');
        let statusBadge = document.getElementById('status-badge');
        let nodeCountText = document.getElementById('node-count');
        let surfaceStatusText = document.getElementById('surface-status');

        let isScanning = false;
        let spatialNodes = [];
        let scanInterval = null;

        // Three.js Scene Components
        let scene, camera, renderer;
        let worldGroup = new THREE.Group();
        let vectorPoints = [];

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);

            const canvas = document.getElementById('webgl-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene.add(worldGroup);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1);
            scene.add(ambientLight);

            function animate() {
                requestAnimationFrame(animate);
                worldGroup.rotation.y += 0.0015; // Gentle rotation to view the constructed room mesh
                renderer.render(scene, camera);
            }
            animate();
        }

        async function initCameraFeed() {
            try {
                const constraints = {
                    video: {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };
                let stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
            } catch (err) {
                try {
                    let fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    videoElement.srcObject = fallbackStream;
                } catch (e) {
                    alert("Camera permissions required.");
                }
            }
        }

        function toggleScanState() {
            isScanning = !isScanning;

            if (isScanning) {
                scanBtn.innerText = "STOP SCANNING";
                scanBtn.classList.add("scanning");
                statusBadge.innerText = "RECONSTRUCTING MESH";
                statusBadge.classList.add("active");
                surfaceStatusText.innerText = "Constructing";
                saveBtn.style.display = "block";
                
                spatialNodes = [];
                vectorPoints = [];
                
                while(worldGroup.children.length > 0){ 
                    worldGroup.remove(worldGroup.children[0]); 
                }

                // Scan loop generating spatial points and rebuilding live structural meshes
                scanInterval = setInterval(() => {
                    let px = (Math.random() * 4 - 2);
                    let py = (Math.random() * 1.5 - 0.7);
                    let pz = (-Math.random() * 4 - 1);

                    let newVector = new THREE.Vector3(px, py, pz);
                    vectorPoints.push(newVector);

                    let mockNode = {
                        id: spatialNodes.length + 1,
                        x: px.toFixed(3),
                        y: py.toFixed(3),
                        z: pz.toFixed(3),
                        timestamp: new Date().toISOString()
                    };
                    spatialNodes.push(mockNode);
                    nodeCountText.innerText = spatialNodes.length;

                    // 1. Drop a node marker sphere
                    const sphereGeo = new THREE.SphereGeometry(0.03, 8, 8);
                    const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
                    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                    sphere.position.copy(newVector);
                    worldGroup.add(sphere);

                    // 2. Connect new nodes with structural wireframe lines if we have multiple points
                    if (vectorPoints.length > 1) {
                        let prevVector = vectorPoints[vectorPoints.length - 2];
                        const lineGeo = new THREE.BufferGeometry().setFromPoints([prevVector, newVector]);
                        const lineMat = new THREE.LineBasicMaterial({ color: 0x0088ff, transparent: true, opacity: 0.7 });
                        const connectingLine = new THREE.Line(lineGeo, lineMat);
                        worldGroup.add(connectingLine);
                    }

                }, 200);

            } else {
                scanBtn.innerText = "START SCANNING";
                scanBtn.classList.remove("scanning");
                statusBadge.innerText = "MESH LOCKED";
                statusBadge.classList.remove("active");
                surfaceStatusText.innerText = "Ready";
                clearInterval(scanInterval);
            }
        }

        function exportEnvironmentMap() {
            if (spatialNodes.length === 0) {
                alert("No environment nodes recorded.");
                return;
            }

            const environmentPayload = {
                generator: "Spatial Dash Pro 3D Mesh Engine",
                version: "4.0",
                sessionDate: new Date().toISOString(),
                totalMeshNodes: spatialNodes.length,
                coordinatesMatrix: spatialNodes
            };

            const dataBlob = new Blob([JSON.stringify(environmentPayload, null, 2)], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(dataBlob);
            
            const fileLink = document.createElement('a');
            fileLink.href = downloadUrl;
            fileLink.download = `spatial_mesh_environment_${Date.now()}.json`;
            document.body.appendChild(fileLink);
            fileLink.click();
            document.body.removeChild(fileLink);
            URL.revokeObjectURL(downloadUrl);
        }

        window.addEventListener('load', () => {
            initCameraFeed();
            initThreeJS();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
