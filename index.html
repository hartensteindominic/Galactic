<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HyperStream</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--border:#38383a;--text:#f5f5f7;--muted:#8e8e93;--blue:#0a84ff;--pink:#ff375f;--green:#30d158;--orange:#ff9f0a;--purple:#bf5af2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;height:100dvh;display:flex;overflow:hidden}#app{display:flex;flex:1;overflow:hidden}#panel{width:340px;background:var(--card);border-right:1px solid var(--border);padding:18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;flex-shrink:0}.logo{font-size:22px;font-weight:700}.sub{font-size:13px;color:var(--muted);margin-top:-6px}.card{background:#2c2c2e;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px}.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase}.row{display:flex;justify-content:space-between;align-items:center;font-size:15px}button{border:0;border-radius:14px;padding:12px;font-size:15px;font-weight:600;color:#fff;width:100%;cursor:pointer}button:disabled{opacity:.3}.primary{background:linear-gradient(135deg,var(--purple),var(--pink))}.green{background:var(--green);color:#000}.red{background:var(--pink)}.blue{background:var(--blue)}.orange{background:var(--orange);color:#000}input[type=range]{accent-color:var(--pink);width:120px}input[type=file]{font-size:13px;color:var(--muted);width:100%}#stage{flex:1;position:relative;background:#000}canvas{width:100%;height:100%;display:block}.badge{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(20px);padding:6px 14px;border-radius:20px;font-size:13px;z-index:10;display:flex;gap:10px}.rec{display:none;color:#ff453a;font-weight:600;align-items:center;gap:6px}.rec.on{display:flex}.dot{width:8px;height:8px;background:#ff453a;border-radius:50%;animation:p 1s infinite}@keyframes p{50%{opacity:.3}}video{display:none}.status{font-size:13px;color:var(--blue);min-height:18px}@media(max-width:820px){#app{flex-direction:column}#panel{width:100%;max-height:46vh;border-right:0;border-bottom:1px solid var(--border);padding:14px}.logo{font-size:20px}.card{padding:12px;gap:8px}button{padding:11px;font-size:14px}}
</style>
</head>
<body>
<div id="app"><div id="panel">
<div><div class="logo">HyperStream</div><div class="sub">Make holographic worlds</div></div>
<div class="card"><div class="label">Live Holo Scan</div><button class="red" id="scanBtn" onclick="toggleScan()">Start Scanning</button><div class="row"><span>Detail</span><input type="range" min="1" max="4" value="2" oninput="stepSize=+this.value"></div><div class="row"><span>Depth</span><input type="range" min="50" max="200" value="120" oninput="depthMul=+this.value"></div><div class="row"><span>Points</span><b id="nLive" style="color:var(--pink)">0</b></div></div>
<div class="card"><div class="label">Capture</div><div class="row"><span>Status</span><b id="recStatus" style="color:var(--muted)">Ready</b></div><div class="row"><span>Time</span><b id="recTime">00:00</b></div><div class="row"><span>Frames</span><b id="frameCount" style="color:var(--purple)">0</b></div><button class="green" id="recBtn" onclick="toggleRec()">Record</button><button class="blue" id="playBtn" onclick="togglePlay()" disabled>Replay</button><button class="primary" id="dlVid" onclick="dlVideo()" disabled>Save Video</button><button class="primary" id="dlSeq" onclick="dlSeq()" disabled>Save Sequence</button></div>
<div class="card"><div class="label">Create World</div><div class="row"><span>World Points</span><b id="envPts" style="color:var(--green)">0</b></div><div class="status" id="status"></div><button class="primary" id="buildSeq" onclick="buildSeq()" disabled>Build World</button><button class="orange" id="buildVid" onclick="buildVid()" disabled>Build from Video</button><button class="green" id="saveBtn" onclick="saveEnv()" disabled>Save World</button><button class="orange" id="shareBtn" onclick="shareEnv()" disabled>Share as Video</button><button class="red" id="clearBtn" onclick="clearEnv()" disabled>Clear</button></div>
<div class="card"><div class="label">Load</div><input type="file" accept=".json" onchange="loadEnv(event)"><input type="file" accept=".json" onchange="loadSeq(event)"><input type="file" accept="video/*,.webm,.mp4" onchange="loadVid(event)"></div>
</div><div id="stage"><div class="badge"><span>FPS <b id="fps" style="color:var(--pink)">—</b></span><div class="rec" id="recInd"><div class="dot"></div>REC</div></div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=id=>document.getElementById(id);let scene,cam,ren,ctrl,video,c2d,ctx,ready=false,scanning=false;let stepSize=2,depthMul=120,fc=0,ft=0,recording=false,mr,chunks=[],videoBlob=null,frames=[],recStart=0,timer,lastCap=0,playing=false,pIdx=0,pLast=0,pts,posA,colA;const MAX=80000;let env,glow,ePos,eCol,eRec=false,eMr,eChunks=[];
function init(){const box=$("stage");scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,.012);cam=new THREE.PerspectiveCamera(52,box.clientWidth/box.clientHeight,.05,1000);cam.position.set(0,1.4,5.3);ren=new THREE.WebGLRenderer({canvas:$("c"),antialias:true,powerPreference:"high-performance",preserveDrawingBuffer:true});ren.setSize(box.clientWidth,box.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setClearColor(0);ctrl=new THREE.OrbitControls(cam,ren.domElement);ctrl.enableDamping=true;ctrl.dampingFactor=.08;ctrl.autoRotate=true;ctrl.autoRotateSpeed=.35;ctrl.target.set(0,.4,0);scene.add(new THREE.AmbientLight(0xffffff,.9));const key=new THREE.DirectionalLight(0xa5f3fc,.3);key.position.set(2,5,3);scene.add(key);const geo=new THREE.BufferGeometry();posA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);colA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);geo.setAttribute("position",posA);geo.setAttribute("color",colA);geo.setDrawRange(0,0);pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(pts);const g=new THREE.Group(),grid=new THREE.GridHelper(9,26,0x1e3a8a,0x111113);grid.position.y=-1.3;grid.material.opacity=.28;grid.material.transparent=true;g.add(grid);const floor=new THREE.Mesh(new THREE.PlaneGeometry(9,9),new THREE.MeshBasicMaterial({color:0x0a0a0f,transparent:true,opacity:.5,side:THREE.DoubleSide}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.31;g.add(floor);const frame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(8.2,4.4,8.2)),new THREE.LineBasicMaterial({color:0x38bdf8,transparent:true,opacity:.1}));frame.position.y=.9;g.add(frame);scene.add(g);addEventListener("resize",()=>{cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix();ren.setSize(box.clientWidth,box.clientHeight)});ren.setAnimationLoop(loop)}
function initCam(){video=$("vid");c2d=document.createElement("canvas");ctx=c2d.getContext("2d",{willReadFrequently:true});if(!navigator.mediaDevices?.getUserMedia){$("scanBtn").textContent="Camera Not Supported";$("scanBtn").disabled=true;return}navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false}).then(s=>{video.srcObject=s;return video.play()}).then(()=>{ready=true;$("status").textContent="Camera ready — tap Start Scanning"}).catch(()=>{$("scanBtn").textContent="Camera Blocked";$("scanBtn").disabled=true;$("status").textContent="Allow camera access then reload"})}
function loop(now){if(scanning)ctrl.autoRotate=false;ctrl.update();fc++;if(now-ft>1000){$("fps").textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}if(playing)playStep(now);else if(scanning&&ready&&video.readyState>=2)sample(now);ren.render(scene,cam)}
function sample(now){const w=video.videoWidth||640,h=video.videoHeight||480;if(c2d.width!==w||c2d.height!==h){c2d.width=w;c2d.height=h}try{ctx.drawImage(video,0,0,w,h)}catch{return}let pix;try{pix=ctx.getImageData(0,0,w,h).data}catch{return}const step=Math.max(1,stepSize|0);let n=0;for(let y=0;y<h&&n<MAX;y+=step)for(let x=0;x<w&&n<MAX;x+=step){const i=(y*w+x)*4,r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255,lum=.299*r+.587*g+.114*b;if(lum<.036)continue;const d=Math.pow(1-lum,1.55),idx=n*3;posA.array[idx]=((w-x)/w*2-1)*1.8;posA.array[idx+1]=(-(y/h*2-1))*1.6+.35;posA.array[idx+2]=(d-.36)*(depthMul*.047);colA.array[idx]=r;colA.array[idx+1]=g;colA.array[idx+2]=b;n++}posA.needsUpdate=colA.needsUpdate=true;pts.geometry.setDrawRange(0,n);$("nLive").textContent=n.toLocaleString();if(recording&&now-lastCap>=70){lastCap=now;frames.push({t:now-recStart,n,pos:new Float32Array(posA.array.slice(0,n*3)),col:new Float32Array(colA.array.slice(0,n*3))});$("frameCount").textContent=frames.length}}
function toggleScan(){if(!ready){$("status").textContent="Camera not ready yet";return}scanning=!scanning;const b=$("scanBtn");if(scanning){b.textContent="Stop Scanning";b.className="orange";ctrl.autoRotate=false;$("status").textContent="Scanning… move slowly"}else{b.textContent="Start Scanning";b.className="red";pts.geometry.setDrawRange(0,0);$("nLive").textContent="0";ctrl.autoRotate=true;$("status").textContent=""}}
function toggleRec(){recording?stopRec():startRec()}function startRec(){if(!scanning)return alert("Start Scanning first");chunks=[];frames=[];videoBlob=null;lastCap=0;recStart=performance.now();let mime="video/webm;codecs=vp9";if(!MediaRecorder.isTypeSupported(mime))mime="video/webm";mr=new MediaRecorder($("c").captureStream(30),{mimeType:mime,videoBitsPerSecond:7000000});mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{videoBlob=new Blob(chunks,{type:"video/webm"});$("dlVid").disabled=!chunks.length;$("dlSeq").disabled=!frames.length;$("playBtn").disabled=!frames.length;$("buildSeq").disabled=!frames.length;$("buildVid").disabled=!videoBlob};mr.start(120);recording=true;$("recBtn").textContent="Stop";$("recBtn").className="red";$("recStatus").textContent="Recording";$("recInd").classList.add("on");timer=setInterval(()=>{const e=(performance.now()-recStart)/1000;$("recTime").textContent=String(Math.floor(e/60)).padStart(2,"0")+":"+String(Math.floor(e%60)).padStart(2,"0")},250)}
function stopRec(){if(!recording)return;recording=false;if(mr?.state!=="inactive")mr.stop();clearInterval(timer);$("recBtn").textContent="Record";$("recBtn").className="green";$("recStatus").textContent="Saved";$("recInd").classList.remove("on")}
function dlVideo(){if(!chunks.length)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));a.download=`hyperstream_${Date.now()}.webm`;a.click()}function dlSeq(){if(!frames.length)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({v:9,frames:frames.map(f=>({t:Math.round(f.t),n:f.n,pos:Array.from(f.pos),col:Array.from(f.col)}))})],{type:"application/json"}));a.download=`sequence_${Date.now()}.json`;a.click()}
function togglePlay(){playing?stopPlay():startPlay()}function startPlay(){if(!frames.length)return;if(scanning)toggleScan();playing=true;pIdx=0;pLast=performance.now();$("playBtn").textContent="Stop Replay";$("recStatus").textContent="Replaying";ctrl.autoRotate=true}function stopPlay(){playing=false;$("playBtn").textContent="Replay";$("recStatus").textContent="Ready";pts.geometry.setDrawRange(0,0);$("nLive").textContent="0";ctrl.autoRotate=!scanning}function playStep(now){if(now-pLast<1000/12)return;pLast=now;const f=frames[pIdx];posA.array.set(f.pos);colA.array.set(f.col);posA.needsUpdate=colA.needsUpdate=true;pts.geometry.setDrawRange(0,f.n);$("nLive").textContent=f.n.toLocaleString();pIdx=(pIdx+1)%frames.length}
function finalize(pos,col){if(pos.length<800){$("status").textContent="Need more data — scan longer";return}if(env){scene.remove(env);env.geometry.dispose();env.material.dispose()}if(glow){scene.remove(glow);glow.geometry.dispose();glow.material.dispose()}ePos=new Float32Array(pos);eCol=new Float32Array(col);const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(ePos,3));geo.setAttribute("color",new THREE.BufferAttribute(eCol,3));env=new THREE.Points(geo,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:.82,blending:THREE.AdditiveBlending,depthWrite:false}));env.position.y=.28;scene.add(env);glow=new THREE.Points(geo.clone(),new THREE.PointsMaterial({size:.032,vertexColors:true,transparent:true,opacity:.1,blending:THREE.AdditiveBlending,depthWrite:false}));glow.position.y=.28;scene.add(glow);$("envPts").textContent=(ePos.length/3).toLocaleString();$("clearBtn").disabled=$("saveBtn").disabled=$("shareBtn").disabled=false;$("status").textContent="World ready ✨";cam.position.set(0,1.6,5.8);ctrl.target.set(0,.4,0);ctrl.autoRotate=true}
function buildSeq(){if(!frames.length)return;$("status").textContent="Building world…";const TARGET=120000,pos=[],col=[],spread=3.2,step=Math.max(1,Math.floor(frames.length/60));for(let i=0;i<frames.length;i+=step){const f=frames[i],z=(i/Math.max(1,frames.length-1)-.5)*spread,keep=Math.min(1,(TARGET/frames.length)/Math.max(1,f.n)*1.25);for(let p=0;p<f.n&&pos.length/3<TARGET;p++){if(Math.random()>keep)continue;const j=p*3;pos.push(f.pos[j]+(Math.random()-.5)*.007,f.pos[j+1]+(Math.random()-.5)*.007,f.pos[j+2]+z+(Math.random()-.5)*.007);col.push(f.col[j],f.col[j+1],f.col[j+2])}}finalize(pos,col)}
function buildVid(){if(!videoBlob)return alert("No video yet");$("status").textContent="Video ready for world build";buildSeq()}
function saveEnv(){if(!ePos)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({v:9,n:ePos.length/3,pos:Array.from(ePos),col:Array.from(eCol)})],{type:"application/json"}));a.download=`world_${Date.now()}.json`;a.click()}function clearEnv(){if(env){scene.remove(env);env.geometry.dispose();env.material.dispose();env=null}if(glow){scene.remove(glow);glow.geometry.dispose();glow.material.dispose();glow=null}ePos=eCol=null;$("envPts").textContent="0";$("clearBtn").disabled=$("saveBtn").disabled=$("shareBtn").disabled=true;$("status").textContent=""}function shareEnv(){if(!env||eRec)return;let mime="video/webm;codecs=vp9";if(!MediaRecorder.isTypeSupported(mime))mime="video/webm";eChunks=[];eMr=new MediaRecorder($("c").captureStream(30),{mimeType:mime,videoBitsPerSecond:9000000});eMr.ondataavailable=e=>e.data.size&&eChunks.push(e.data);eMr.onstop=()=>{eRec=false;$("shareBtn").disabled=false;$("shareBtn").textContent="Share as Video";$("recInd").classList.remove("on");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(eChunks,{type:"video/webm"}));a.download=`world_${Date.now()}.webm`;a.click()};eMr.start(120);eRec=true;$("shareBtn").textContent="Recording…";$("shareBtn").disabled=true;$("recInd").classList.add("on");ctrl.autoRotate=true;setTimeout(()=>eMr?.state!=="inactive"&&eMr.stop(),12000)}
function loadEnv(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);clearEnv();finalize(d.pos||d.positions,d.col||d.colors)}catch{alert("Invalid file")}};r.readAsText(f);e.target.value=""}function loadSeq(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);frames=(d.frames||[]).map(f=>({t:f.t,n:f.n,pos:new Float32Array(f.pos),col:new Float32Array(f.col)}));$("frameCount").textContent=frames.length;$("playBtn").disabled=!frames.length;$("dlSeq").disabled=!frames.length;$("buildSeq").disabled=!frames.length}catch{alert("Invalid file")}};r.readAsText(f);e.target.value=""}function loadVid(e){const f=e.target.files[0];if(!f)return;videoBlob=f;$("buildVid").disabled=false;$("status").textContent="Video ready";e.target.value=""}
init();initCam();
</script></body></html>
