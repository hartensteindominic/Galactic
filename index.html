<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HyperStream VR Holographic Recorder</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020409;color:#fff;font-family:system-ui,-apple-system,sans-serif}#app{height:100%;position:relative;background:radial-gradient(circle at 50% 45%,#10243a,#020409 70%)}#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;filter:contrast(1.15);transform:scaleX(-1)}#view{position:absolute;inset:0;width:100%;height:100%}#top{position:absolute;z-index:5;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.logo{font-weight:900;letter-spacing:.08em;font-size:13px}.logo span{color:#58e8ff}.status{font-size:11px;padding:8px 11px;border:1px solid #ffffff22;background:#0008;border-radius:20px}.green{color:#62ffb0}.hud{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.reticle{width:55px;height:55px;border:1px solid #58e8ff88;border-radius:50%;margin:auto;box-shadow:0 0 35px #58e8ff22}.hud b{display:block;margin-top:15px;font-size:15px}.hud small{display:block;color:#9baabd;margin-top:5px}.controls{position:absolute;z-index:6;left:50%;bottom:20px;transform:translateX(-50%);width:min(700px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.btn{border:1px solid #ffffff20;background:#111827e8;color:#fff;border-radius:15px;padding:14px 10px;font-weight:850;font-size:12px;cursor:pointer;backdrop-filter:blur(15px)}.btn.primary{background:linear-gradient(135deg,#247cff,#a15cff);border:0}.btn.record{background:linear-gradient(135deg,#ff386f,#ff4fc3);border:0}.btn:disabled{opacity:.4}.panel{position:absolute;z-index:7;right:14px;top:58px;width:245px;padding:13px;border:1px solid #ffffff1c;background:#070b14dc;border-radius:17px;backdrop-filter:blur(18px);display:none}.panel h3{font-size:12px;margin:0 0 9px}.memory{border:1px solid #ffffff16;padding:9px;border-radius:10px;margin-top:7px;display:flex;justify-content:space-between;gap:7px;align-items:center}.memory small{display:block;color:#8fa0b6}.tiny{font-size:10px;color:#8fa0b6;margin-top:8px;line-height:1.4}.modal{position:absolute;z-index:20;inset:0;background:#000b;display:none;align-items:center;justify-content:center}.box{width:min(380px,calc(100% - 30px));padding:20px;border:1px solid #ffffff20;background:#090e18;border-radius:20px;text-align:center}.box h2{margin:0 0 7px}.box p{font-size:12px;color:#9baabd;line-height:1.45}.box canvas{background:#fff;border-radius:10px;padding:8px;max-width:220px}.box button{margin-top:12px;width:100%}@media(max-width:600px){.controls{grid-template-columns:repeat(2,1fr);bottom:10px}.btn{padding:12px 8px}}
</style></head>
<body><div id="app">
<video id="camera" autoplay muted playsinline></video><canvas id="view"></canvas>
<div id="top"><div class="logo">HYPER<span>STREAM</span> VR</div><div class="status" id="status">Starting camera…</div></div>
<div class="hud"><div class="reticle"></div><b id="message">Point around your room</b><small id="hint">Camera starts automatically</small></div>
<div class="controls"><button class="btn primary" id="vr">ENTER VR</button><button class="btn record" id="record">● RECORD</button><button class="btn primary" id="holo">BUILD HOLOGRAM</button><button class="btn" id="memory">MEMORIES</button><button class="btn" id="phone">PHONE CAMERA</button><button class="btn" id="save">SAVE HOLOGRAM</button><button class="btn" id="play">PLAY RECORDING</button><button class="btn" id="clear">CLEAR</button></div>
<div class="panel" id="library"><h3>HOLOGRAM MEMORIES</h3><div id="memories"></div><div class="tiny">Memories are stored locally in this browser.</div></div>
<div class="modal" id="phoneModal"><div class="box"><h2>Connect phone</h2><p>Scan this QR code with your iPhone. It opens a simple camera sender. Keep both devices online.</p><canvas id="qr"></canvas><div id="peer" class="tiny">Starting connection…</div><button class="btn" id="close">CLOSE</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);let stream=null,rec=null,chunks=[],recorded=null,frames=[],recording=false,replay=false,replayAt=0,peer=null,holo=null,scene,camera3,renderer,controls,live;
function say(a,b){$('message').textContent=a;$('hint').textContent=b}function stat(t,on=false){$('status').textContent=t;$('status').className='status'+(on?' green':'')}
async function cameraStart(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('camera').srcObject=stream;await $('camera').play();stat('CAMERA LIVE',true);say('Point around your room','Press RECORD, then move slowly');}catch(e){stat('CAMERA PERMISSION NEEDED');say('Allow camera access','Use the GitHub Pages HTTPS address')}}
function init3(){scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x020409,.04);camera3=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,100);camera3.position.set(0,1.5,4.5);renderer=new THREE.WebGLRenderer({canvas:$('view'),alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;scene.add(new THREE.AmbientLight(0x6a8aaa,1.7));let l=new THREE.PointLight(0x58e8ff,5,12);l.position.set(0,3,2);scene.add(l);controls=new THREE.OrbitControls(camera3,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1.1,0);let ring=new THREE.Mesh(new THREE.TorusGeometry(1.6,.008,8,96),new THREE.MeshBasicMaterial({color:0x58e8ff,transparent:true,opacity:.3}));ring.rotation.x=Math.PI/2;ring.position.set(0,.02,-2.6);scene.add(ring);renderer.setAnimationLoop(()=>{controls.update();if(holo){holo.rotation.y+=.001;holo.material.opacity=.72+.18*Math.sin(performance.now()*.003)}ring.rotation.z+=.001;renderer.render(scene,camera3)})}
function build(){let v=$('camera');if(!v.videoWidth){say('Camera not ready','Try again in a second');return}let c=document.createElement('canvas'),w=300,h=Math.round(300*v.videoHeight/v.videoWidth);c.width=w;c.height=h;let x=c.getContext('2d');x.drawImage(v,0,0,w,h);let d=x.getImageData(0,0,w,h).data,arr=[],colors=[],step=6;for(let y=0;y<h;y+=step)for(let xx=0;xx<w;xx+=step){let i=(y*w+xx)*4,r=d[i],g=d[i+1],b=d[i+2],lum=(r+g+b)/765;if(lum<.04)continue;arr.push((xx/w-.5)*5.5,-(y/h-.5)*3.5,(1-lum)*2);colors.push(r/255,g/255,b/255);if(arr.length>=18000)break}let geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));if(holo)scene.remove(holo);holo=new THREE.Points(geo,new THREE.PointsMaterial({size:.028,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));holo.position.set(0,1.2,-2.6);scene.add(holo);say('Hologram created','Rotate it in VR or with the mouse');saveMemory()}
function startRecord(){if(!stream){cameraStart().then(()=>setTimeout(startRecord,300));return}chunks=[];frames=[];let mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';rec=new MediaRecorder(stream,{mimeType:mime});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{recorded=new Blob(chunks,{type:mime});say('Recording complete','Build a hologram from the current room view')};rec.start(200);recording=true;$('record').textContent='■ STOP';stat('RECORDING',true);let start=Date.now();let tick=()=>{if(!recording)return;frames.push(Date.now()-start);requestAnimationFrame(tick)};tick()}
function stopRecord(){recording=false;if(rec&&rec.state!=='inactive')rec.stop();$('record').textContent='● RECORD';stat('CAMERA LIVE',true)}
function saveBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function saveMemory(){if(!holo)return;let p=Array.from(holo.geometry.attributes.position.array),c=Array.from(holo.geometry.attributes.color.array),m=JSON.parse(localStorage.getItem('hsMemories')||'[]');m.push({id:Date.now(),name:'Memory '+(m.length+1),time:new Date().toLocaleString(),p,c});localStorage.setItem('hsMemories',JSON.stringify(m));renderMemories()}
function renderMemories(){let m=JSON.parse(localStorage.getItem('hsMemories')||'[]');$('memories').innerHTML='';m.slice().reverse().forEach(z=>{let e=document.createElement('div');e.className='memory';e.innerHTML='<div><b>'+z.name+'</b><small>'+z.time+'</small></div><button class="btn">OPEN</button>';e.querySelector('button').onclick=()=>openMemory(z);$('memories').appendChild(e)})}
function openMemory(z){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(z.p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(z.c,3));if(holo)scene.remove(holo);holo=new THREE.Points(g,new THREE.PointsMaterial({size:.028,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));holo.position.set(0,1.2,-2.6);scene.add(holo);$('library').style.display='none';say('Memory loaded','Your hologram is back in the room')}
function startPeer(){if(peer)return;peer=new Peer();peer.on('open',id=>{let u=new URL(location.href);u.searchParams.set('phone','1');u.searchParams.set('host',id);QRCode.toCanvas($('qr'),u.toString(),{width:210,margin:1});$('peer').textContent=id});peer.on('call',call=>{call.answer();call.on('stream',s=>{$('camera').srcObject=s;stat('PHONE CAMERA LIVE',true);say('Phone connected','Move the phone around, then build the hologram')})});peer.on('error',()=>stat('PHONE CONNECTION ERROR'))}
async function phoneMode(){let q=new URLSearchParams(location.search);if(q.get('phone')!=='1')return;document.body.innerHTML='<div style="height:100%;display:flex;flex-direction:column;background:#03050a;color:white;font-family:system-ui;text-align:center"><h2 style="margin:30px 20px 5px">HyperStream Camera</h2><p style="color:#9baabd">Point your phone around the room, then press SEND CAMERA.</p><video id="pv" autoplay playsinline muted style="flex:1;width:100%;object-fit:cover"></video><button id="send" style="margin:15px;padding:18px;border:0;border-radius:15px;background:#ff3f83;color:white;font-weight:900">SEND CAMERA</button></div>';let send=$('send');send.onclick=async()=>{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});$('pv').srcObject=s;let p=new Peer();p.on('open',()=>p.call(q.get('host'),s));send.textContent='CAMERA SENDING'};return}
$('vr').onclick=async()=>{try{if(!navigator.xr||!(await navigator.xr.isSessionSupported('immersive-vr'))){say('VR unavailable','Open this page in Quest Browser and try again');return}renderer.setAnimationLoop(()=>{controls.update();if(holo){holo.rotation.y+=.001}renderer.render(scene,camera3)});await renderer.xr.setSession(await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']}));say('VR connected','Your hologram is now in front of you')}catch(e){say('VR could not start','Use Quest Browser with WebXR enabled')}};
$('record').onclick=()=>recording?stopRecord():startRecord();$('holo').onclick=build;$('save').onclick=()=>holo&&saveMemory();$('play').onclick=()=>recorded&&saveBlob(recorded,'hyperstream-recording.webm');$('clear').onclick=()=>{if(holo){scene.remove(holo);holo=null}say('Cleared','Point around your room again')};$('memory').onclick=()=>{$('library').style.display=$('library').style.display==='block'?'none':'block'};$('phone').onclick=()=>{$('phoneModal').style.display='flex';startPeer()};$('close').onclick=()=>$('phoneModal').style.display='none';addEventListener('resize',()=>{camera3.aspect=innerWidth/innerHeight;camera3.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
init3();renderMemories();phoneMode().then(()=>{if(!new URLSearchParams(location.search).get('phone'))cameraStart()});
</script></body></html>
