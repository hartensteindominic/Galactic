<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream XD • 4D Quantum Holographic</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column}#stage{height:58dvh;position:relative;background:radial-gradient(circle at 50% 42%,#0b1724 0,#03060a 48%,#000 100%)}canvas{width:100%;height:100%;display:block}.badge{position:absolute;z-index:5;right:12px;top:12px;padding:7px 12px;border-radius:20px;background:#000b;backdrop-filter:blur(18px);font-size:11px}.panel{height:42dvh;overflow:auto;background:#19191cf5;border-radius:24px 24px 0 0;padding:7px 10px calc(14px + env(safe-area-inset-bottom))}.handle{width:38px;height:4px;background:#666;border-radius:8px;margin:0 auto 8px}.card{background:#303034e8;border-radius:17px;padding:10px;margin-bottom:8px}.title{font-size:10px;font-weight:800;color:#999;text-transform:uppercase;margin-bottom:7px}.actions{display:flex;flex-direction:column;gap:7px}.actions button,.switch button{height:44px;border:0;border-radius:15px;font-weight:750;font-size:14px;color:#fff}.red{background:linear-gradient(135deg,#ff477c,#ff3561)}.green{background:linear-gradient(135deg,#65f39a,#30d158);color:#06120a!important}.blue{background:linear-gradient(135deg,#5ab5ff,#0a84ff)}.pink{background:linear-gradient(135deg,#d06cff,#ff4f91)}button:disabled{opacity:.35}.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.switch button{background:#ffffff12}.switch .active{background:#ff4f864d;outline:1px solid #ff4f8680}.row{display:grid;grid-template-columns:112px 1fr 42px;align-items:center;height:36px;font-size:11px}.v{text-align:right;font-size:10px;color:#ff76a6}input[type=range]{width:100%;appearance:none;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:8px;background:linear-gradient(90deg,#ffffff20,#ff4f867a)}input[type=range]::-webkit-slider-thumb{appearance:none;width:21px;height:21px;margin-top:-7px;border-radius:50%;border:2px solid white;background:#ff76a6;box-shadow:0 2px 12px #ff4f8670}.status{font-size:10px;color:#42a5ff;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}video{display:none}@media(min-width:769px){#stage{height:calc(100dvh - 360px)}.panel{height:360px}.handle{display:none}.actions{display:grid;grid-template-columns:1fr 1fr}}</style></head><body><div id="app"><section id="stage"><div class="badge">FPS <b id="fps" style="color:#ff4f86">—</b> · <span id="nodes">0</span> nodes</div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></section><section class="panel"><div class="handle"></div><div class="card actions"><button class="red" id="scan" onclick="scan()">Start Scanning</button><button class="green" id="rec" onclick="record()" disabled>Record</button><button class="blue" id="play" onclick="replay()" disabled>Replay</button><button class="pink" id="share" onclick="share()" disabled>Share</button></div><div class="card"><div class="title">Camera</div><div class="switch"><button id="front" class="active" onclick="camera('user')">Face Camera</button><button id="back" onclick="camera('environment')">Back Camera</button></div></div><div class="card"><div class="title">HyperStream XD · 4D Quantum Structure</div><div class="row"><span>Live 4D</span><input type="range" min="0" max="100" value="72" oninput="T=+this.value/100;tv.textContent=this.value+'%'"><b class="v" id="tv">72%</b></div><div class="row"><span>Voxel Density</span><input type="range" min="20" max="100" value="86" oninput="V=+this.value/100;vv.textContent=this.value+'%'"><b class="v" id="vv">86%</b></div><div class="row"><span>Hyper Depth Field</span><input type="range" min="10" max="100" value="62" oninput="D=+this.value/100;dv.textContent=this.value+'%'"><b class="v" id="dv">62%</b></div><div class="row"><span>Quantum Node Size</span><input type="range" min="20" max="160" value="58" oninput="N=+this.value/100;nv.textContent=this.value+'%'"><b class="v" id="nv">58%</b></div><div class="row"><span>Dimensional Strata</span><input type="range" min="1" max="12" value="6" oninput="L=+this.value;lv.textContent=this.value"><b class="v" id="lv">6</b></div><div class="row"><span>Spatial Dimensions</span><input type="range" min="10" max="100" value="78" oninput="X=+this.value/100;xv.textContent=this.value+'%'"><b class="v" id="xv">78%</b></div><div class="status" id="status">Starting Face Camera…</div></div></section></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>const $=x=>document.getElementById(x);let scene,cam,ren,ctl,video,stream,ready=0,scanning=0,T=.72,V=.86,D=.62,N=.58,L=6,X=.78,fc=0,ft=0,work,ctx,geo,mesh,tex,pts,pa,ca,depth,rec=0,mr,chunks=[],frames=[],playing=0,pidx=0,lastPlay=0;const W=360,H=202,MAX=W*H;init();camera('user');function init(){const b=$("stage");scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(46,b.clientWidth/b.clientHeight,.01,100);cam.position.set(0,.05,5.2);ren=new THREE.WebGLRenderer({canvas:$("c"),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});ren.setSize(b.clientWidth,b.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ctl=new THREE.OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.dampingFactor=.06;ctl.autoRotate=true;ctl.autoRotateSpeed=.06;video=$("vid");work=document.createElement('canvas');work.width=W;work.height=H;ctx=work.getContext('2d',{willReadFrequently:true});depth=new Float32Array(MAX);geo=new THREE.PlaneGeometry(5,2.805,W-1,H-1);tex=new THREE.VideoTexture(video);tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex,color:0xb8c0c8,side:THREE.DoubleSide,transparent:true,opacity:.76}));scene.add(mesh);const pg=new THREE.BufferGeometry();pa=new THREE.BufferAttribute(new Float32Array(MAX*3),3);ca=new THREE.BufferAttribute(new Float32Array(MAX*3),3);pg.setAttribute('position',pa);pg.setAttribute('color',ca);pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.014,vertexColors:true,transparent:true,opacity:.20,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(pts);addEventListener('resize',()=>{cam.aspect=b.clientWidth/b.clientHeight;cam.updateProjectionMatrix();ren.setSize(b.clientWidth,b.clientHeight)});ren.setAnimationLoop(loop)}function camera(mode){if(stream)stream.getTracks().forEach(t=>t.stop());ready=0;$("status").textContent=mode==='user'?'Starting Face Camera…':'Starting Back Camera…';navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,max:60}},audio:false}).then(s=>{stream=s;video.srcObject=s;return video.play()}).then(()=>{ready=1;$("front").classList.toggle('active',mode==='user');$("back").classList.toggle('active',mode==='environment');$("status").textContent='Camera ready'}).catch(()=>$("status").textContent='Camera permission needed')}function loop(t){ctl.update();fc++;if(t-ft>1000){$("fps").textContent=Math.round(fc*1000/(t-ft));fc=0;ft=t}if(playing)stepReplay(t);else if(scanning&&ready&&video.readyState>=2)sample(t);tex.needsUpdate=true;ren.render(scene,cam)}function depthAt(pix,x,y,t){const i=(y*W+x)*4,r=pix[i],g=pix[i+1],b=pix[i+2],lum=(.299*r+.587*g+.114*b)/255,xl=Math.max(0,x-1),xr=Math.min(W-1,x+1),yu=Math.max(0,y-1),yd=Math.min(H-1,y+1),gx=Math.abs(pix[(y*W+xr)*4]-pix[(y*W+xl)*4]),gy=Math.abs(pix[(yd*W+x)*4]-pix[(yu*W+x)*4]),edge=Math.min(1,(gx+gy)/300),rad=Math.hypot(x/W-.5,(y/H-.5)*1.1),center=1-Math.min(1,rad*1.45),di=y*W+x;let target=((1-lum)*.24+edge*.34*T+center*.08)*(.38+D*1.18)-.18;target+=Math.sin(di*.031+t*.00035)*.012*T;depth[di]+=(target-depth[di])*(.12+.22*T);return depth[di]}function sample(t){ctx.drawImage(video,0,0,W,H);let pix;try{pix=ctx.getImageData(0,0,W,H).data}catch{return}const stride=Math.max(1,Math.round(5.2-V*3.4)),spacing=.010+N*.032;let n=0;for(let y=0;y<H;y+=stride)for(let x=0;x<W&&n<MAX;x+=stride){const z=depthAt(pix,x,y,t),i=(y*W+x)*4,j=n*3,r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255;pa.array[j]=(x/(W-1)-.5)*5*X;pa.array[j+1]=(.5-y/(H-1))*2.805*X;pa.array[j+2]=z;ca.array[j]=Math.min(1,r*.88+.015);ca.array[j+1]=Math.min(1,g*.88+.015);ca.array[j+2]=Math.min(1,b*.88+.015);n++}pts.geometry.setDrawRange(0,n);pa.needsUpdate=ca.needsUpdate=true;pts.material.size=spacing;pts.material.opacity=.12+.14*T;$("nodes").textContent=n.toLocaleString();updateSurface(pix,t);if(rec&&(!frames.length||t-frames[frames.length-1].t>=16))frames.push({t,n,pos:pa.array.slice(0,n*3),col:ca.array.slice(0,n*3),surface:geo.attributes.position.array.slice()})}function updateSurface(pix,t){const p=geo.attributes.position.array;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const z=depthAt(pix,x,y,t),j=(y*W+x)*3;p[j]=(x/(W-1)-.5)*5*X;p[j+1]=(.5-y/(H-1))*2.805*X;p[j+2]=z}geo.attributes.position.needsUpdate=true}function scan(){if(!ready)return;scanning=!scanning;$("scan").textContent=scanning?'Stop Scanning':'Start Scanning';$("scan").className=scanning?'green':'red';$("rec").disabled=!scanning;$("rec").classList.toggle('ready',scanning);ctl.autoRotate=!scanning;$("status").textContent=scanning?'Live 4D depth reconstruction active':'Ready'}function record(){if(rec){rec=0;if(mr?.state!=='inactive')mr.stop();$("rec").textContent='Record';return}if(!scanning)return;chunks=[];frames=[];const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';mr=new MediaRecorder($("c").captureStream(60),{mimeType:type,videoBitsPerSecond:18000000});mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{$("play").disabled=!frames.length;$("share").disabled=!chunks.length};mr.start(100);rec=1;$("rec").textContent='Stop'}function replay(){if(!frames.length)return;playing=!playing;if(playing){pidx=0;lastPlay=performance.now();$("play").textContent='Stop';ctl.autoRotate=false}else{$("play").textContent='Replay';pts.geometry.setDrawRange(0,0);ctl.autoRotate=true}}function stepReplay(t){if(t-lastPlay<16)return;lastPlay=t;const f=frames[pidx];pa.array.set(f.pos);ca.array.set(f.col);pts.geometry.setDrawRange(0,f.n);pa.needsUpdate=ca.needsUpdate=true;if(f.surface){geo.attributes.position.array.set(f.surface);geo.attributes.position.needsUpdate=true}$("nodes").textContent=f.n.toLocaleString();pidx=(pidx+1)%frames.length}function share(){if(!chunks.length)return;const blob=new Blob(chunks,{type:'video/webm'}),file=new File([blob],'hyperstream-xd-4d.webm',{type:blob.type});if(navigator.share&&navigator.canShare?.({files:[file]}))navigator.share({title:'HyperStream XD 4D Quantum Holographic',text:'Live 4D depth holographic video ✨',files:[file]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}}</script></body></html>
