<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro – Enterprise 4D Volumetric Depth & Rigging Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
        }
        #sidebar {
            width: 380px;
            background: #0b0f19;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            z-index: 10;
            overflow-y: auto;
        }
        .brand { font-size: 14px; font-weight: 800; letter-spacing: 1px; color: #38bdf8; }
        .section-card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #94a3b8; }
        .btn-row { display: flex; gap: 6px; }
        .primary-btn, .secondary-btn, .danger-btn {
            flex: 1; padding: 8px; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; border: none; transition: background 0.2s;
        }
        .primary-btn { background: #0284c7; color: white; }
        .primary-btn:hover { background: #0369a1; }
        .secondary-btn { background: #334155; color: #f1f5f9; }
        .danger-btn { background: #dc2626; color: white; }
        .danger-btn.scanning { background: #ea580c; }
        .file-upload-label {
            display: block; text-align: center; border: 2px dashed #334155; padding: 10px; border-radius: 8px;
            font-size: 11px; color: #94a3b8; cursor: pointer; background: rgba(255,255,255,0.01);
        }
        .file-upload-label:hover { border-color: #38bdf8; }
        input[type="file"] { display: none; }
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; text-align: center; }
        .metric-card { background: #1e293b; border-radius: 8px; padding: 6px; }
        .metric-label { font-size: 9px; color: #64748b; text-transform: uppercase; }
        .metric-value { font-size: 12px; font-weight: bold; color: #38bdf8; }
        #viewer-container {
            flex: 1; position: relative; background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        }
        #camera-stream, #render-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }
        #camera-stream.front-facing { transform: scaleX(-1); }
        #processing-canvas { display: none; }
        #render-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 2; }
        .stats-overlay {
            position: absolute; top: 16px; right: 16px; background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: #94a3b8; z-index: 5;
        }
        .stats-overlay span { color: #38bdf8; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="sidebar">
    <div class="brand">SPATIAL 4D PROCESSOR<br><span style="font-size:9px;font-weight:500;color:#7dd3fc;">Condensed Map & Camera Streamline</span></div>
    
    <div class="section-card">
        <div class="card-title">Data Ingestion & Stream</div>
        <div class="btn-row">
            <button class="secondary-btn" onclick="switchCamera()">📷 Flip Camera</button>
            <label class="file-upload-label" style="flex:1;">
                📁 Load Map JSON
                <input type="file" id="json-file-input" accept=".json" onchange="loadEnvironmentMap(event)">
            </label>
        </div>
    </div>

    <div class="section-card">
        <div class="card-title">Volumetric Metrics</div>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Frames</div>
                <div id="frame-count" class="metric-value">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Nodes / Frame</div>
                <div id="node-count" class="metric-value">0</div>
            </div>
        </div>
    </div>

    <div class="section-card">
        <div class="card-title">Recording & Export</div>
        <div class="btn-row">
            <button id="scan-btn" class="danger-btn" onclick="toggleScanState()">RECORD 4D</button>
            <button class="primary-btn" onclick="exportEnvironmentMap()">SAVE MAP</button>
        </div>
    </div>
</div>

<div id="viewer-container">
    <div class="stats-overlay">
        Status: <span id="status-badge">SYSTEM READY</span><br>
        <span id="bbox-info" style="font-size:10px;color:#64748b;">Optimized 3D Stream Pipeline</span>
    </div>
    <video id="camera-stream" autoplay playsinline muted></video>
    <canvas id="processing-canvas"></canvas>
    <div id="render-container"></div>
</div>

<script>
    const videoElement = document.getElementById('camera-stream');
    const processingCanvas = document.getElementById('processing-canvas');
    const canvasCtx = processingCanvas.getContext('2d', { willReadFrequently: true });
    const renderContainer = document.getElementById('render-container');
    const scanBtn = document.getElementById('scan-btn');
    const statusBadge = document.getElementById('status-badge');
    const frameCountText = document.getElementById('frame-count');
    const nodeCountText = document.getElementById('node-count');

    let isScanning = false;
    let recordedFrames = [];
    let currentFacingMode = "environment";
    let activeStream = null;
    let holistic = null;
    let cameraUtilsInstance = null;

    let scene, camera, renderer, pointCloud;
    let playbackFrames = [];
    let playbackFrameIndex = 0;

    async function initCameraFeed() {
        if (renderContainer.style.display === "block") return;
        if (activeStream) activeStream.getTracks().forEach(t => t.stop());

        try {
            activeStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            videoElement.srcObject = activeStream;
            videoElement.classList.toggle("front-facing", currentFacingMode === "user");
        } catch (err) {
            console.error("Camera access error:", err);
        }
    }

    function switchCamera() {
        currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
        initCameraFeed();
    }

    function setupHolisticScanner() {
        holistic = new Holistic({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}` });
        holistic.setOptions({ modelComplexity: 1, smoothLandmarks: true, refineFaceLandmarks: true, minDetectionConfidence: 0.5 });
        holistic.onResults((results) => {
            if (!isScanning || recordedFrames.length === 0) return;
            let humanVertices = [], humanColors = [];
            const add = (lms, r, g, b) => {
                if (!lms) return;
                for (let pt of lms) {
                    humanVertices.push(parseFloat(((pt.x - 0.5) * -5.2).toFixed(3)), parseFloat(((pt.y - 0.5) * -5.2).toFixed(3)), parseFloat(((pt.z || 0) * 5.2).toFixed(3)));
                    humanColors.push(r, g, b);
                }
            };
            add(results.faceLandmarks?.landmark, 0.1, 0.9, 1.0);
            add(results.poseLandmarks?.landmark, 0.2, 1.0, 0.4);
            
            if (humanVertices.length > 0) {
                let curr = recordedFrames[recordedFrames.length - 1];
                curr.vertices.push(...humanVertices);
                curr.colors.push(...humanColors);
                nodeCountText.innerText = curr.vertices.length / 3;
            }
        });

        cameraUtilsInstance = new Camera(videoElement, {
            onFrame: async () => {
                if (isScanning && videoElement) {
                    await holistic.send({ image: videoElement });
                    captureFrameSequence();
                }
            },
            width: 1280, height: 720
        });
        cameraUtilsInstance.start();
    }

    function captureFrameSequence() {
        if (!videoElement.videoWidth) return;
        processingCanvas.width = 320; processingCanvas.height = 180;
        canvasCtx.drawImage(videoElement, 0, 0, 320, 180);
        const data = canvasCtx.getImageData(0, 0, 320, 180).data;
        
        let vertices = [], colors = [];
        for (let y = 1; y < 179; y += 2) {
            for (let x = 1; x < 319; x += 2) {
                let idx = (y * 320 + x) * 4;
                let r = data[idx], g = data[idx+1], b = data[idx+2];
                let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
                
                vertices.push(parseFloat(((x / 320 - 0.5) * 5.2).toFixed(3)), parseFloat((-(y / 180 - 0.5) * 5.2).toFixed(3)), parseFloat(((lum - 0.5) * 3.4).toFixed(3)));
                colors.push(parseFloat((r/255).toFixed(2)), parseFloat((g/255).toFixed(2)), parseFloat((b/255).toFixed(2)));
            }
        }
        recordedFrames.push({ vertices, colors });
        frameCountText.innerText = recordedFrames.length;
        nodeCountText.innerText = vertices.length / 3;
    }

    function toggleScanState() {
        isScanning = !isScanning;
        if (isScanning) {
            recordedFrames = [];
            scanBtn.innerText = "STOP 4D";
            scanBtn.classList.add("scanning");
            statusBadge.innerText = "RECORDING 4D...";
        } else {
            scanBtn.innerText = "RECORD 4D";
            scanBtn.classList.remove("scanning");
            statusBadge.innerText = "READY";
        }
    }

    function exportEnvironmentMap() {
        if (recordedFrames.length === 0) { alert("No timeline data captured yet."); return; }
        const payload = {
            version: "2.0",
            mapType: "SpatialDash3DPhotoMap",
            frames: recordedFrames.map((f, i) => ({ frameIndex: i, geometryStream: f }))
        };
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `spatial_map_${Date.now()}.json`;
        a.click();
        statusBadge.innerText = "EXPORTED";
    }

    function loadEnvironmentMap(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const json = JSON.parse(e.target.result);
                const frames = json.frames ? json.frames.map(f => f.geometryStream) : json.sequence;
                if (frames) render4DPlayback({ sequence: frames });
            } catch (err) { alert("Corrupted or invalid map JSON file."); }
        };
        reader.readAsText(file);
    }

    function render4DPlayback(payload) {
        if (activeStream) activeStream.getTracks().forEach(t => t.stop());
        videoElement.style.display = 'none';
        renderContainer.style.display = 'block';
        statusBadge.innerText = "PLAYING MAP";

        playbackFrames = payload.sequence || [];
        playbackFrameIndex = 0;
        frameCountText.innerText = playbackFrames.length;

        if (!scene) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, renderContainer.clientWidth / renderContainer.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 4.0);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(renderContainer.clientWidth, renderContainer.clientHeight);
            renderContainer.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            
            let dragging = false, prev = {x:0, y:0};
            window.addEventListener('mousedown', e => { dragging = true; prev = {x: e.clientX, y: e.clientY}; });
            window.addEventListener('mousemove', e => {
                if (!dragging || !pointCloud) return;
                pointCloud.rotation.y += (e.clientX - prev.x) * 0.005;
                pointCloud.rotation.x += (e.clientY - prev.y) * 0.005;
                prev = {x: e.clientX, y: e.clientY};
            });
            window.addEventListener('mouseup', () => { dragging = false; });
        }

        const geometry = new THREE.BufferGeometry();
        const material = new THREE.PointsMaterial({ size: 0.022, vertexColors: true, transparent: true, opacity: 0.95 });
        pointCloud = new THREE.Points(geometry, material);
        scene.add(pointCloud);

        function animate() {
            requestAnimationFrame(animate);
            if (playbackFrames.length > 0) {
                let frame = playbackFrames[playbackFrameIndex];
                geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(frame.vertices), 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(frame.colors), 3));
                geometry.attributes.position.needsUpdate = true;
                geometry.attributes.color.needsUpdate = true;
                nodeCountText.innerText = frame.vertices.length / 3;
                playbackFrameIndex = (playbackFrameIndex + 1) % playbackFrames.length;
            }
            renderer.render(scene, camera);
        }
        animate();
    }

    window.addEventListener('load', () => {
        initCameraFeed();
        setupHolisticScanner();
    });
</script>
</body>
</html>
