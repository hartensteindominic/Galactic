<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column}#stage{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block}#panel{height:min(48dvh,510px);overflow:auto;background:rgba(25,25,28,.97);border-radius:25px 25px 0 0;padding:9px 12px calc(14px + env(safe-area-inset-bottom));box-sizing:border-box}.handle{width:40px;height:5px;background:#68686f;border-radius:9px;margin:0 auto 10px}.card{background:rgba(48,48,52,.9);border-radius:19px;padding:12px;margin-bottom:9px}.label{font-size:10px;font-weight:800;color:#9a9aa3;text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px}.row{display:grid;grid-template-columns:78px 1fr 50px;align-items:center;gap:8px;min-height:35px}.value{text-align:right;font-size:12px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.switch button,button{border:0;border-radius:15px;min-height:42px;font-weight:700;color:#fff;font-size:14px}.switch button{background:rgba(255,255,255,.08)}.switch button.active{background:rgba(255,79,134,.28);outline:1px solid rgba(255,79,134,.5)}.red{background:linear-gradient(135deg,#ff477c,#ff3561)}.green{background:linear-gradient(135deg,#65f39a,#30d158);color:#06120a}.blue{background:linear-gradient(135deg,#5ab5ff,#0a84ff)}.primary{background:linear-gradient(135deg,#d06cff,#ff4f91)}.orange{background:linear-gradient(135deg,#ffc45c,#ff9f0a);color:#111}input[type=range]{appearance:none;width:100%;height:30px;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,79,134,.5))}input[type=range]::-webkit-slider-thumb{appearance:none;width:23px;height:23px;margin-top:-8px;border-radius:50%;border:3px solid #fff;background:linear-gradient(135deg,#fff,#ff76a6);box-shadow:0 2px 12px rgba(255,70,130,.45)}button{width:100%;margin-top:7px}.badge{position:absolute;right:12px;top:12px;z-index:5;padding:7px 12px;border-radius:22px;background:rgba(0,0,0,.45);backdrop-filter:blur(20px);font-size:12px}video{display:none}.status{font-size:12px;color:#42a5ff;min-height:17px}@media(min-width:769px){#panel{height:330px;border-radius:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.handle{display:none}.card{margin:0}}</style></head><body><div id="app"><section id="stage"><div class="badge">FPS <b id="fps" style="color:#ff4f86">—</b></div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></section><section id="panel"><div class="handle"></div><div class="card"><div class="label">Camera</div><div class="switch"><button id="frontBtn" onclick="switchCamera('user')">Face</button><button id="backBtn" class="active" onclick="switchCamera('environment')">Back</button></div></div><div class="card"><div class="label">Hologram</div><div class="row"><span>Detail</span><input type="range" min="1" max="12" value="4" oninput="stepSize=+this.value;detailVal.textContent=this.value"><b class="value" id="detailVal">4</b></div><div class="row"><span>Depth</span><input type="range" min="10" max="420" value="145" oninput="depthMul=+this.value;depthVal.textContent=this.value"><b class="value" id="depthVal">145</b></div><div class="row"><span>Brightness</span><input type="range" min="30" max="170" value="78" oninput="brightness=+this.value/100;brightVal.textContent=this.value+'%'"><b class="value" id="brightVal">78%</b></div><div class="row"><span>Contrast</span><input type="range" min="50" max="180" value="100" oninput="contrast=+this.value/100;contrastVal.textContent=this.value+'%'"><b class="value" id="contrastVal">100%</b></div><div class="row"><span>Points</span><b id="nLive" class="value">0</b></div></div><div class="card"><div class="label">Scan & Capture</div><div class="status" id="status">Starting camera…</div><button class="red" id="scanBtn" onclick="toggleScan()">Start Scanning</button><button class="green" id="recBtn" onclick="toggleRec()">Record</button><button class="blue" id="playBtn" onclick="togglePlay()" disabled>Replay</button><button class="primary" id="buildBtn" onclick="buildWorld()" disabled>Build World</button></div></section></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>const $=id=>document.getElementById(id);let scene,cam,ren,ctrl,video,c2d,ctx,stream=null,ready=false,scanning=false,stepSize=4,depthMul=145,brightness=.78,contrast=1,fc=0,ft=0;let pts,posA,colA,frames=[],recording=false,mr,chunks=[],recStart=0,lastCap=0,timer,playing=false,pIdx=0,pLast=0;const MAX=140000;init();startCamera('environment');function init(){const box=$('stage');scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(52,box.clientWidth/box.clientHeight,.05,1000);cam.position.set(0,1.4,5.3);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});ren.setSize(box.clientWidth,box.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setClearColor(0);ctrl=new THREE.OrbitControls(cam,ren.domElement);ctrl.enableDamping=true;ctrl.dampingFactor=.08;ctrl.autoRotate=true;ctrl.target.set(0,.4,0);const geo=new THREE.BufferGeometry();posA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);colA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);geo.setAttribute('position',posA);geo.setAttribute('color',colA);pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:.82,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(pts);const grid=new THREE.GridHelper(9,26,0x2845a0,0x15151a);grid.position.y=-1.3;grid.material.opacity=.18;grid.material.transparent=true;scene.add(grid);addEventListener('resize',()=>{cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix();ren.setSize(box.clientWidth,box.clientHeight)});ren.setAnimationLoop(loop)}function startCamera(mode){if(!navigator.mediaDevices?.getUserMedia)return;$('status').textContent=mode==='user'?'Starting Face Camera…':'Starting Back Camera…';if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720}},audio:false}).then(s=>{stream=s;video=$('vid');video.srcObject=s;return video.play()}).then(()=>{ready=true;$('status').textContent=mode==='user'?'Face Camera ready':'Back Camera ready';$('frontBtn').classList.toggle('active',mode==='user');$('backBtn').classList.toggle('active',mode==='environment')}).catch(()=>{$('status').textContent='Camera permission needed'})}function switchCamera(mode){if(scanning)toggleScan();startCamera(mode)}function loop(now){ctrl.update();fc++;if(now-ft>1000){$('fps').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}if(playing)playStep(now);else if(scanning&&ready&&video.readyState>=2)sample(now);ren.render(scene,cam)}function process(v){let x=(v/255-.5)*contrast+.5;return Math.min(1,Math.max(0,x))*brightness}function sample(now){const w=video.videoWidth||1280,h=video.videoHeight||720;if(c2d?.width!==w||c2d?.height!==h){c2d=document.createElement('canvas');c2d.width=w;c2d.height=h;ctx=c2d.getContext('2d',{willReadFrequently:true})}ctx.drawImage(video,0,0,w,h);let pix;try{pix=ctx.getImageData(0,0,w,h).data}catch{return}const total=Math.ceil(w/stepSize)*Math.ceil(h/stepSize);const stride=total>MAX?Math.ceil(Math.sqrt(total/MAX))*stepSize:stepSize;let n=0;for(let y=0;y<h&&n<MAX;y+=stride){for(let x=0;x<w&&n<MAX;x+=stride){const i=(y*w+x)*4,r=process(pix[i]),g=process(pix[i+1]),b=process(pix[i+2]),lum=.299*r+.587*g+.114*b;if(lum<.014)continue;const d=Math.pow(Math.max(0,1-lum),1.38),j=n*3;posA.array[j]=((w-x)/w*2-1)*1.9;posA.array[j+1]=(-(y/h*2-1))*1.65+.3;posA.array[j+2]=(d-.35)*(depthMul*.047);colA.array[j]=r;colA.array[j+1]=g;colA.array[j+2]=b;n++}}posA.needsUpdate=true;colA.needsUpdate=true;pts.geometry.setDrawRange(0,n);$('nLive').textContent=n.toLocaleString();if(recording&&now-lastCap>=80){lastCap=now;frames.push({t:now-recStart,n,pos:new Float32Array(posA.array.slice(0,n*3)),col:new Float32Array(colA.array.slice(0,n*3))})}}function toggleScan(){if(!ready){$('status').textContent='Camera not ready';return}scanning=!scanning;$('scanBtn').textContent=scanning?'Stop Scanning':'Start Scanning';$('scanBtn').className=scanning?'orange':'red';ctrl.autoRotate=!scanning;$('status').textContent=scanning?'Scanning · move slowly around the subject':'Scan stopped';if(!scanning)pts.geometry.setDrawRange(0,0)}function toggleRec(){recording?stopRec():startRec()}function startRec(){if(!scanning)return alert('Start Scanning first');chunks=[];frames=[];recStart=performance.now();lastCap=0;const opt={mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8000000};if(!MediaRecorder.isTypeSupported(opt.mimeType))opt.mimeType='video/webm';mr=new MediaRecorder($('c').captureStream(30),opt);mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{$('playBtn').disabled=!frames.length;$('buildBtn').disabled=!frames.length};mr.start(120);recording=true;$('recBtn').textContent='Stop Recording';timer=setInterval(()=>{},250)}function stopRec(){recording=false;if(mr?.state!=='inactive')mr.stop();clearInterval(timer);$('recBtn').textContent='Record'}function togglePlay(){if(!frames.length)return;playing=!playing;if(playing){pIdx=0;pLast=performance.now();$('playBtn').textContent='Stop Replay'}else{$('playBtn').textContent='Replay';pts.geometry.setDrawRange(0,0)}}function playStep(now){if(now-pLast<1000/12)return;pLast=now;const f=frames[pIdx];posA.array.set(f.pos);colA.array.set(f.col);posA.needsUpdate=colA.needsUpdate=true;pts.geometry.setDrawRange(0,f.n);$('nLive').textContent=f.n.toLocaleString();pIdx=(pIdx+1)%frames.length}function buildWorld(){if(!frames.length)return;const pos=[],col=[],target=120000,spread=Math.max(3.2,Math.min(5.2,depthMul*.024)),step=Math.max(1,Math.floor(frames.length/70));for(let i=0;i<frames.length;i+=step){const f=frames[i],z=((i/Math.max(1,frames.length-1))-.5)*spread;const keep=Math.min(1,(target/Math.max(1,frames.length))/Math.max(1,f.n)*1.35);for(let p=0;p<f.n;p++){if(Math.random()>keep)continue;const j=p*3;pos.push(f.pos[j],f.pos[j+1],f.pos[j+2]+z);col.push(f.col[j],f.col[j+1],f.col[j+2]);if(pos.length/3>=target)break}if(pos.length/3>=target)break}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));const world=new THREE.Points(geo,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:.78,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(world);$('status').textContent='World ready ✨';}</script></body></html>
