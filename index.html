<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream XD • 4D Quantum Holographic</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column}#stage{height:58dvh;position:relative;background:radial-gradient(circle at 50% 42%,#14283d 0,#05080d 48%,#000 100%)}canvas{width:100%;height:100%;display:block}.badge{position:absolute;z-index:5;right:12px;top:12px;padding:7px 12px;border-radius:20px;background:#0009;backdrop-filter:blur(18px);font-size:11px}.panel{height:42dvh;overflow:auto;background:#19191cf5;border-radius:24px 24px 0 0;padding:7px 10px calc(14px + env(safe-area-inset-bottom))}.handle{width:38px;height:4px;background:#666;border-radius:8px;margin:0 auto 8px}.card{background:#303034e8;border-radius:17px;padding:10px;margin-bottom:8px}.title{font-size:10px;font-weight:800;color:#999;text-transform:uppercase;margin-bottom:7px}.actions{display:flex;flex-direction:column;gap:7px}.actions button,.switch button{height:44px;border:0;border-radius:15px;font-weight:750;font-size:14px;color:#fff}.red{background:linear-gradient(135deg,#ff477c,#ff3561)}.green{background:linear-gradient(135deg,#65f39a,#30d158);color:#06120a!important}.blue{background:linear-gradient(135deg,#5ab5ff,#0a84ff)}.pink{background:linear-gradient(135deg,#d06cff,#ff4f91)}button:disabled{opacity:.35}.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.switch button{background:#ffffff12}.switch .active{background:#ff4f864d;outline:1px solid #ff4f8680}.row{display:grid;grid-template-columns:112px 1fr 42px;align-items:center;height:36px;font-size:11px}.v{text-align:right;font-size:10px;color:#ff76a6}input[type=range]{width:100%;appearance:none;background:transparent}.status{font-size:10px;color:#42a5ff;margin-top:4px}video{display:none}@media(min-width:769px){#stage{height:calc(100dvh - 360px)}.panel{height:360px}.handle{display:none}.actions{display:grid;grid-template-columns:1fr 1fr}}</style></head><body><div id="app"><section id="stage"><div class="badge">FPS <b id="fps">—</b> · <span id="nodes">0</span> nodes</div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></section><section class="panel"><div class="handle"></div><div class="card actions"><button class="red" id="scan" onclick="scan()">Start Scanning</button><button class="green" id="rec" disabled>Record</button><button class="blue" id="play" disabled>Replay</button><button class="pink" id="share" disabled>Share</button></div><div class="card"><div class="title">Camera</div><div class="switch"><button id="front" class="active">Face Camera</button><button id="back">Back Camera</button></div></div><div class="card"><div class="title">HyperStream XD · 4D Quantum Structure</div><div class="row"><span>Live 4D</span><input type="range" min="0" max="100" value="72"><b class="v">72%</b></div><div class="row"><span>Voxel Density</span><input type="range" min="20" max="100" value="78"><b class="v">78%</b></div><div class="row"><span>Hyper Depth Field</span><input type="range" min="10" max="100" value="48"><b class="v">48%</b></div><div class="row"><span>Quantum Node Size</span><input type="range" min="20" max="160" value="70"><b class="v">70%</b></div><div class="row"><span>Dimensional Strata</span><input type="range" min="1" max="12" value="6"><b class="v">6</b></div><div class="row"><span>Spatial Dimensions</span><input type="range" min="10" max="100" value="68"><b class="v">68%</b></div><div class="status">Starting Face Camera…</div></div></section></div></body></html>
