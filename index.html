<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>HyperStream</title>
<style>
:root{--bg:#000;--panel:rgba(28,28,30,.97);--card:#2c2c2e;--line:rgba(255,255,255,.1);--text:#f5f5f7;--muted:#8e8e93;--pink:#ff375f;--purple:#bf5af2;--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}body{height:100dvh}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}
#panel{height:min(44dvh,440px);flex-shrink:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--panel);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -14px 45px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:9px}
.handle{width:38px;height:4px;border-radius:10px;background:#636366;margin:0 auto 2px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}.logo{font-size:19px;font-weight:750;letter-spacing:-.5px}.sub{font-size:11px;color:var(--muted)}
.card{background:var(--card);border-radius:17px;padding:12px;display:flex;flex-direction:column;gap:9px;box-shadow:inset 0 1px rgba(255,255,255,.035)}.label{font-size:10px;font-weight:750;color:var(--muted);letter-spacing:.55px;text-transform:uppercase}.row{display:grid;grid-template-columns:74px 1fr 48px;align-items:center;gap:8px;min-height:30px;font-size:14px}.value{text-align:right;font-variant-numeric:tabular-nums;color:#fff;font-size:13px}
button{width:100%;min-height:43px;border:0;border-radius:13px;padding:10px 12px;color:#fff;font-size:15px;font-weight:650;cursor:pointer}button:disabled{opacity:.3}.red{background:var(--pink)}.orange{background:var(--orange);color:#000}.green{background:var(--green);color:#000}.blue{background:var(--blue)}.primary{background:linear-gradient(135deg,var(--purple),var(--pink))}
input[type=range]{width:100%;height:28px;accent-color:var(--pink);cursor:pointer}input[type=file]{width:100%;font-size:12px;color:var(--muted)}
.badge{position:absolute;z-index:20;top:12px;right:12px;display:flex;gap:10px;align-items:center;padding:7px 12px;border:1px solid rgba(255,255,255,.09);border-radius:22px;background:rgba(0,0,0,.48);backdrop-filter:blur(20px);font-size:12px}.rec{display:none;color:#ff453a;font-weight:700;align-items:center;gap:5px}.rec.on{display:flex}.dot{width:7px;height:7px;border-radius:50%;background:#ff453a;animation:p 1s infinite}@keyframes p{50%{opacity:.25}}
.status{min-height:17px;font-size:12px;color:var(--blue);line-height:17px}.hint{font-size:11px;color:var(--muted);line-height:15px}.pill{font-size:11px;color:var(--muted);text-align:center;padding-top:1px}video{display:none}
@media(min-width:769px){#panel{height:310px;border-radius:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;padding:12px 16px 16px}.handle{display:none}.topbar{grid-column:1/-1}.card{min-width:0}.card:nth-of-type(2){grid-column:1}.card:nth-of-type(3){grid-column:2}.card:nth-of-type(4){grid-column:3}.card:nth-of-type(5){grid-column:4}}
</style>
</head>
<body>
<div id="app">
<section id="stage"><div class="badge"><span>FPS <b id="fps" style="color:var(--pink)">—</b></span><div class="rec" id="recInd"><i class="dot"></i>REC</div></div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></section>
<section id="panel">
<div class="handle"></div><div class="topbar"><div><div class="logo">HyperStream</div><div class="sub">Holographic capture</div></div><div class="pill" id="cameraState">Starting camera…</div></div>
<div class="card"><div class="label">Live Holo Scan</div><button class="red" id="scanBtn" onclick="toggleScan()">Start Scanning</button>
<div class="row"><span>Detail</span><input id="detail" type="range" min="1" max="12" value="12" oninput="setDetail(this.value)"><b class="value" id="detailVal">MAX</b></div>
<div class="row"><span>Depth</span><input id="depth" type="range" min="10" max="420" value="145" oninput="depthMul=+this.value;depthVal.textContent=this.value"><b class="value" id="depthVal">145</b></div>
<div class="row"><span>Brightness</span><input id="bright" type="range" min="35" max="240" value="100" oninput="brightness=+this.value/100;brightVal.textContent=this.value+'%'"><b class="value" id="brightVal">100%</b></div>
<div class="row"><span>Contrast</span><input id="contrast" type="range" min="50" max="190" value="100" oninput="contrast=+this.value/100;contrastVal.textContent=this.value+'%'"><b class="value" id="contrastVal">100%</b></div>
<div class="row"><span>Point Size</span><input id="pointSize" type="range" min="5" max="30" value="15" oninput="setPointSize(this.value)"><b class="value" id="pointSizeVal">15</b></div>
<div class="row"><span>Points</span><b id="nLive" style="color:var(--pink);grid-column:2/4;text-align:right">0</b></div></div>
<div class="card"><div class="label">Capture</div><div class="row"><span>Status</span><b id="recStatus" style="color:var(--muted);grid-column:2/4;text-align:right">Ready</b></div><div class="row"><span>Time</span><b id="recTime" style="grid-column:2/4;text-align:right">00:00</b></div><div class="row"><span>Frames</span><b id="frameCount" style="color:var(--purple);grid-column:2/4;text-align:right">0</b></div><button class="green" id="recBtn" onclick="toggleRec()">Record</button><button class="blue" id="playBtn" onclick="togglePlay()" disabled>Replay</button><button class="primary" id="dlVid" onclick="dlVideo()" disabled>Save Video</button><button class="primary" id="dlSeq" onclick="dlSeq()" disabled>Save Sequence</button></div>
<div class="card"><div class="label">Create World</div><div class="row"><span>World Points</span><b id="envPts" style="color:var(--green);grid-column:2/4;text-align:right">0</b></div><div class="status" id="status"></div><button class="primary" id="buildSeq" onclick="buildSeq()" disabled>Build World</button><button class="orange" id="buildVid" onclick="buildVid()" disabled>Build from Video</button><button class="green" id="saveBtn" onclick="saveEnv()" disabled>Save World</button><button class="orange" id="shareBtn" onclick="shareEnv()" disabled>Share as Video</button><button class="red" id="clearBtn" onclick="clearEnv()" disabled>Clear</button></div>
<div class="card"><div class="label">Load</div><input type="file" accept=".json" onchange="loadEnv(event)"><input type="file" accept=".json" onchange="loadSeq(event)"><input type="file" accept="video/*,.webm,.mp4" onchange="loadVid(event)"><div class="hint">Tip: move slowly around the subject. Bright, even light gives the cleanest hologram.</div></div>
</section></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=id=>document.getElementById(id);let scene,cam,ren,ctrl,video,c2d,ctx,ready=false,scanning=false;let stepSize=1,depthMul=145,brightness=1,contrast=1,fc=0,ft=0;let recording=false,mr,chunks=[],videoBlob=null,frames=[];let recStart=0,timer,lastCap=0,playing=false,pIdx=0,pLast=0;let pts,posA,colA;const MAX=140000;let env,glow,ePos,eCol,eRec=false,eMr,eChunks=[];
function setDetail(v){let n=+v;stepSize=Math.max(1,13-n);$('detailVal').textContent=n===12?'MAX':n}
function setPointSize(v){let s=+v/1000;pts.material.size=s;if(glow)glow.material.size=s*2.1;$('pointSizeVal').textContent=v}
init();initCam();
function init(){const box=$('stage');scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,.009);cam=new THREE.PerspectiveCamera(52,box.clientWidth/box.clientHeight,.05,1000);cam.position.set(0,1.4,5.3);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:true});ren.setSize(box.clientWidth,box.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setClearColor(0);ctrl=new THREE.OrbitControls(cam,ren.domElement);ctrl.enableDamping=true;ctrl.dampingFactor=.075;ctrl.autoRotate=true;ctrl.autoRotateSpeed=.32;ctrl.target.set(0,.35,0);scene.add(new THREE.AmbientLight(0xffffff,.9));const key=new THREE.DirectionalLight(0xb8f7ff,.35);key.position.set(2,5,3);scene.add(key);
const geo=new THREE.BufferGeometry();posA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);colA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);geo.setAttribute('position',posA);geo.setAttribute('color',colA);geo.setDrawRange(0,0);pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:.92,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(pts);
const g=new THREE.Group();const grid=new THREE.GridHelper(9,26,0x1e3a8a,0x111113);grid.position.y=-1.3;grid.material.opacity=.26;grid.material.transparent=true;g.add(grid);const floor=new THREE.Mesh(new THREE.PlaneGeometry(9,9),new THREE.MeshBasicMaterial({color:0x07070b,transparent:true,opacity:.45,side:THREE.DoubleSide}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.31;g.add(floor);const frame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(8.2,4.4,8.2)),new THREE.LineBasicMaterial({color:0x38bdf8,transparent:true,opacity:.08}));frame.position.y=.9;g.add(frame);scene.add(g);
addEventListener('resize',()=>{cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix();ren.setSize(box.clientWidth,box.clientHeight)});ren.setAnimationLoop(loop)}
function initCam(){video=$('vid');c2d=document.createElement('canvas');ctx=c2d.getContext('2d',{willReadFrequently:true});if(!navigator.mediaDevices?.getUserMedia){$('cameraState').textContent='No camera';$('scanBtn').disabled=true;return}navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}},audio:false}).then(s=>{video.srcObject=s;return video.play()}).then(()=>{ready=true;$('cameraState').textContent='Camera ready';$('status').textContent='Camera ready · tap Start Scanning'}).catch(()=>{$('cameraState').textContent='Camera blocked';$('scanBtn').disabled=true;$('status').textContent='Allow camera access, then reload'})}
function loop(now){ctrl.update();fc++;if(now-ft>1000){$('fps').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}if(playing)playStep(now);else if(scanning&&ready&&video.readyState>=2)sample(now);ren.render(scene,cam)}
function pixelColor(v){let x=(v/255-.5)*contrast+.5;return Math.min(1,Math.max(0,x))*brightness}
function sample(now){const w=video.videoWidth||1280,h=video.videoHeight||720;if(c2d.width!==w||c2d.height!==h){c2d.width=w;c2d.height=h}try{ctx.drawImage(video,0,0,w,h)}catch{return}let pix;try{pix=ctx.getImageData(0,0,w,h).data}catch{return}const step=Math.max(1,stepSize|0);let n=0;for(let y=0;y<h&&n<MAX;y+=step){for(let x=0;x<w&&n<MAX;x+=step){const i=(y*w+x)*4;const r=pixelColor(pix[i]),g=pixelColor(pix[i+1]),b=pixelColor(pix[i+2]);const lum=.299*r+.587*g+.114*b;if(lum<.018)continue;const edge=Math.abs(x/w-.5)*.28;const d=Math.pow(Math.max(0,1-lum),1.38);const idx=n*3;posA.array[idx]=((w-x)/w*2-1)*1.9;posA.array[idx+1]=(-(y/h*2-1))*1.65+.3;posA.array[idx+2]=(d-.35-edge)*(depthMul*.047);colA.array[idx]=r;colA.array[idx+1]=g;colA.array[idx+2]=b;n++}}posA.needsUpdate=true;colA.needsUpdate=true;pts.geometry.setDrawRange(0,n);$('nLive').textContent=n.toLocaleString();if(recording&&now-lastCap>=80){lastCap=now;frames.push({t:now-recStart,n,pos:new Float32Array(posA.array.slice(0,n*3)),col:new Float32Array(colA.array.slice(0,n*3))});$('frameCount').textContent=frames.length}}
function toggleScan(){if(!ready){$('status').textContent='Camera not ready yet';return}scanning=!scanning;const b=$('scanBtn');if(scanning){b.textContent='Stop Scanning';b.className='orange';ctrl.autoRotate=false;$('status').textContent='Scanning · move slowly around the subject'}else{b.textContent='Start Scanning';b.className='red';pts.geometry.setDrawRange(0,0);$('nLive').textContent='0';if(!playing)ctrl.autoRotate=true;$('status').textContent='Scan stopped · build a world or record'} }
function toggleRec(){recording?stopRec():startRec()}
function startRec(){if(!scanning)return alert('Start Scanning first');chunks=[];frames=[];videoBlob=null;lastCap=0;recStart=performance.now();const opt={mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8000000};if(!MediaRecorder.isTypeSupported(opt.mimeType))opt.mimeType='video/webm';mr=new MediaRecorder($('c').captureStream(30),opt);mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{videoBlob=new Blob(chunks,{type:'video/webm'});$('dlVid').disabled=!chunks.length;$('dlSeq').disabled=!frames.length;$('playBtn').disabled=!frames.length;$('buildSeq').disabled=!frames.length;$('buildVid').disabled=!videoBlob};mr.start(120);recording=true;$('recBtn').textContent='Stop';$('recBtn').className='red';$('recStatus').textContent='Recording';$('recStatus').style.color='#ff453a';$('recInd').classList.add('on');$('frameCount').textContent='0';timer=setInterval(()=>{const e=(performance.now()-recStart)/1000;$('recTime').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(Math.floor(e%60)).padStart(2,'0')},250)}
function stopRec(){if(!recording)return;recording=false;if(mr?.state!=='inactive')mr.stop();clearInterval(timer);$('recBtn').textContent='Record';$('recBtn').className='green';$('recStatus').textContent='Saved';$('recStatus').style.color='var(--muted)';$('recInd').classList.remove('on')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function dlVideo(){if(chunks.length)downloadBlob(new Blob(chunks,{type:'video/webm'}),`hyperstream_${Date.now()}.webm`)}
function dlSeq(){if(frames.length)downloadBlob(new Blob([JSON.stringify({v:10,frames:frames.map(f=>({t:Math.round(f.t),n:f.n,pos:Array.from(f.pos),col:Array.from(f.col)}))})],{type:'application/json'}),`sequence_${Date.now()}.json`)}
function togglePlay(){playing?stopPlay():startPlay()}
function startPlay(){if(!frames.length)return;if(scanning)toggleScan();playing=true;pIdx=0;pLast=performance.now();$('playBtn').textContent='Stop Replay';$('recStatus').textContent='Replaying';$('recStatus').style.color='var(--purple)';ctrl.autoRotate=true}
function stopPlay(){playing=false;$('playBtn').textContent='Replay';$('recStatus').textContent='Ready';$('recStatus').style.color='var(--muted)';pts.geometry.setDrawRange(0,0);$('nLive').textContent='0';ctrl.autoRotate=!scanning}
function playStep(now){if(now-pLast<1000/15)return;pLast=now;const f=frames[pIdx];posA.array.set(f.pos);colA.array.set(f.col);posA.needsUpdate=true;colA.needsUpdate=true;pts.geometry.setDrawRange(0,f.n);$('nLive').textContent=f.n.toLocaleString();pIdx=(pIdx+1)%frames.length}
function finalize(pos,col){if(pos.length<2400){$('status').textContent='Need more scan data · scan a little longer';return}if(env){scene.remove(env);env.geometry.dispose();env.material.dispose()}if(glow){scene.remove(glow);glow.geometry.dispose();glow.material.dispose()}ePos=new Float32Array(pos);eCol=new Float32Array(col);for(let i=0;i<eCol.length;i++){eCol[i]=Math.min(1,Math.max(0,(eCol[i]-.5)*contrast+.5)*brightness)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(ePos,3));geo.setAttribute('color',new THREE.BufferAttribute(eCol,3));env=new THREE.Points(geo,new THREE.PointsMaterial({size:pts.material.size,vertexColors:true,transparent:true,opacity:.86,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));env.position.y=.28;scene.add(env);glow=new THREE.Points(geo.clone(),new THREE.PointsMaterial({size:pts.material.size*2.1,vertexColors:true,transparent:true,opacity:.085,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));glow.position.y=.28;scene.add(glow);$('envPts').textContent=(ePos.length/3).toLocaleString();$('clearBtn').disabled=false;$('saveBtn').disabled=false;$('shareBtn').disabled=false;$('status').textContent='World ready ✨';cam.position.set(0,1.6,5.8);ctrl.target.set(0,.4,0);ctrl.autoRotate=true}
function buildSeq(){if(!frames.length)return;if(playing)stopPlay();$('status').textContent='Building world…';const TARGET=140000,maxF=Math.min(frames.length,70),stride=Math.max(1,Math.floor(frames.length/maxF)),pos=[],col=[];for(let i=0;i<frames.length;i+=stride){const f=frames[i],z=((i/Math.max(1,frames.length-1))-.5)*3.8,keep=Math.min(1,(TARGET/Math.max(1,frames.length))/Math.max(1,f.n)*1.4);for(let p=0;p<f.n;p++){if(Math.random()>keep)continue;const j=p*3,k=.006;pos.push(f.pos[j]+(Math.random()-.5)*k,f.pos[j+1]+(Math.random()-.5)*k,f.pos[j+2]+z+(Math.random()-.5)*k);col.push(f.col[j],f.col[j+1],f.col[j+2]);if(pos.length/3>=TARGET)break}if(pos.length/3>=TARGET)break}finalize(pos,col)}
function buildVid(){if(!videoBlob)return alert('No video yet');$('status').textContent='Processing video…';$('buildVid').disabled=true;const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(videoBlob);const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true}),collected=[];v.onloadedmetadata=()=>{const dur=Math.max(.1,v.duration),stepT=.08;let t=0;const next=()=>{if(t>dur){URL.revokeObjectURL(v.src);const TARGET=140000,pos=[],col=[],stride=Math.max(1,Math.floor(collected.length/65));for(let i=0;i<collected.length;i+=stride){const f=collected[i],z=((i/Math.max(1,collected.length-1))-.5)*3.8,keep=Math.min(1,(TARGET/Math.max(1,collected.length))/Math.max(1,f.n)*1.4);for(let p=0;p<f.n;p++){if(Math.random()>keep)continue;const j=p*3,k=.006;pos.push(f.pos[j]+(Math.random()-.5)*k,f.pos[j+1]+(Math.random()-.5)*k,f.pos[j+2]+z+(Math.random()-.5)*k);col.push(f.col[j],f.col[j+1],f.col[j+2]);if(pos.length/3>=TARGET)break}if(pos.length/3>=TARGET)break}finalize(pos,col);return}v.currentTime=t};v.onseeked=()=>{const w=v.videoWidth||1280,h=v.videoHeight||720;c.width=w;c.height=h;x.drawImage(v,0,0,w,h);let pix;try{pix=x.getImageData(0,0,w,h).data}catch{t+=stepT;next();return}const step=Math.max(2,stepSize|0),p=[],cl=[];let n=0;for(let y=0;y<h&&n<26000;y+=step)for(let xx=0;xx<w&&n<26000;xx+=step){const i=(y*w+xx)*4,r=pixelColor(pix[i]),g=pixelColor(pix[i+1]),b=pixelColor(pix[i+2]),lum=.299*r+.587*g+.114*b;if(lum<.018)continue;const d=Math.pow(Math.max(0,1-lum),1.38);p.push(((w-xx)/w*2-1)*1.9,(-(y/h*2-1))*1.65+.3,(d-.35)*(depthMul*.047));cl.push(r,g,b);n++}if(n>40)collected.push({n,pos:new Float32Array(p),col:new Float32Array(cl)});$('status').textContent=`Building… ${Math.min(100,Math.round(t/dur*100))}%`;t+=stepT;next()};next()};v.load()}
function saveEnv(){if(ePos)downloadBlob(new Blob([JSON.stringify({v:10,n:ePos.length/3,pos:Array.from(ePos),col:Array.from(eCol)})],{type:'application/json'}),`world_${Date.now()}.json`)}
function clearEnv(){if(env){scene.remove(env);env.geometry.dispose();env.material.dispose();env=null}if(glow){scene.remove(glow);glow.geometry.dispose();glow.material.dispose();glow=null}ePos=eCol=null;$('envPts').textContent='0';$('clearBtn').disabled=true;$('saveBtn').disabled=true;$('shareBtn').disabled=true;$('status').textContent=''}
function shareEnv(){if(!env||eRec)return;if(playing)stopPlay();if(scanning)toggleScan();pts.geometry.setDrawRange(0,0);eChunks=[];const opt={mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:9000000};if(!MediaRecorder.isTypeSupported(opt.mimeType))opt.mimeType='video/webm';eMr=new MediaRecorder($('c').captureStream(30),opt);eMr.ondataavailable=e=>e.data.size&&eChunks.push(e.data);eMr.onstop=()=>{eRec=false;$('shareBtn').textContent='Share as Video';$('shareBtn').disabled=false;$('recInd').classList.remove('on');if(eChunks.length)downloadBlob(new Blob(eChunks,{type:'video/webm'}),`world_${Date.now()}.webm`)};eMr.start(120);eRec=true;$('shareBtn').textContent='Recording…';$('shareBtn').disabled=true;$('recInd').classList.add('on');ctrl.autoRotate=true;ctrl.autoRotateSpeed=.55;setTimeout(()=>eMr?.state!=='inactive'&&eMr.stop(),12000)}
function loadEnv(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);clearEnv();finalize(d.pos||d.positions,d.col||d.colors)}catch{alert('Invalid world file')}};r.readAsText(f);e.target.value=''}
function loadSeq(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);frames=(d.frames||[]).map(f=>({t:f.t,n:f.n,pos:new Float32Array(f.pos),col:new Float32Array(f.col)}));$('frameCount').textContent=frames.length;$('playBtn').disabled=!frames.length;$('dlSeq').disabled=!frames.length;$('buildSeq').disabled=!frames.length;$('status').textContent=`Loaded ${frames.length} frames`}catch{alert('Invalid sequence file')}};r.readAsText(f);e.target.value=''}
function loadVid(e){const f=e.target.files[0];if(!f)return;videoBlob=f;$('buildVid').disabled=false;$('status').textContent='Video ready';e.target.value=''}
</script></body></html>
