<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HyperStream XD • Contour 4D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:#01030b;color:#e5e7eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}#viewer{flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at center,#111a35 0%,#030712 48%,#01030b 100%)}canvas{display:block;width:100%;height:100%}.stats{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.stats span{padding:6px 9px;border:1px solid #334155;background:#020617cc;border-radius:9px;font-size:10px;color:#94a3b8;backdrop-filter:blur(10px)}.stats b{color:#f472b6}#controls{z-index:20;background:#020617f7;border-top:1px solid #1e293b;padding:10px 12px calc(11px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:7px}.btn{flex:1;border:0;border-radius:11px;padding:12px 8px;color:#fff;font-weight:750;font-size:12px;background:#1e293b;border:1px solid #334155}.btn:active{transform:scale(.97)}.main{padding:14px;background:linear-gradient(135deg,#6d28d9,#db2777);font-size:14px}.on{background:linear-gradient(135deg,#ea580c,#be185d)}.green{background:#047857}.blue{background:#0369a1}.slider{display:flex;align-items:center;gap:9px;color:#94a3b8;font-size:11px}.slider label{width:52px}.slider input{flex:1;accent-color:#ec4899}.slider output{width:30px;text-align:right}.tiny{text-align:center;color:#64748b;font-size:10px}#vid{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
<div id="viewer"><div class="stats"><span id="status">Initializing contour field…</span><span>FPS <b id="fps">—</b> · <b id="pts">0</b> pts</span></div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></div>
<div id="controls">
<button id="scan" class="btn main" onclick="toggleScan()">▶ Start 4D Scan</button>
<div class="row"><button id="cam" class="btn" onclick="flip()">📷 Flip</button><button id="play" class="btn" onclick="togglePlay()">⏯ Play</button><button class="btn" onclick="center()">↺ Center</button></div>
<div class="slider"><label>Depth</label><input id="depth" type="range" min="35" max="150" value="100"><output id="dv">100</output></div>
<div class="slider"><label>Contours</label><input id="cont" type="range" min="5" max="24" value="15"><output id="cv">15</output></div>
<div class="slider"><label>Point</label><input id="size" type="range" min="6" max="24" value="11"><output id="sv">11</output></div>
<div class="row"><button class="btn green" onclick="photo()">📸 Photo</button><button class="btn blue" onclick="share()">📤 Share</button></div>
<div class="tiny">Drag / pinch to orbit • contours preserve the shape while you turn it</div>
</div>
<script>
const $=id=>document.getElementById(id);let scene,camera,renderer,composer,controls,video,stream,ctx,work,ready=false,facing='user';let cloud=null,contours=[],ghosts=[],rings=null;let depth=100,levels=15,pointSize=.011,scanning=false,frames=[],recording=[],playing=false,playIndex=0,lastFrame=0,lastSample=0,phase=0,fc=0,ft=0;
$('depth').oninput=e=>{depth=+e.target.value;$('dv').textContent=depth};$('cont').oninput=e=>{levels=+e.target.value;$('cv').textContent=levels;rebuild()};$('size').oninput=e=>{pointSize=+e.target.value/1000;$('sv').textContent=e.target.value;rebuild()};
function init(){const b=$('viewer');scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x01030b,.018);camera=new THREE.PerspectiveCamera(38,b.clientWidth/b.clientHeight,.1,900);camera.position.set(0,1.1,6.2);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setSize(b.clientWidth,b.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setClearColor(0x01030b);composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(b.clientWidth,b.clientHeight),.72,.55,.72));controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.09;controls.rotateSpeed=.58;controls.zoomSpeed=.75;controls.autoRotate=true;controls.autoRotateSpeed=.18;controls.enablePan=false;controls.minDistance=2;controls.maxDistance=18;controls.target.set(0,.2,0);addBackdrop();addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));initCamera('user');loop();}
function addBackdrop(){const g=new THREE.BufferGeometry(),p=new Float32Array(900*3);for(let i=0;i<900;i++){const r=25+Math.random()*50,t=Math.random()*6.283,a=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(a)*Math.cos(t);p[i*3+1]=r*Math.sin(a)*Math.sin(t)*.55;p[i*3+2]=r*Math.cos(a)}g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x475569,size:.018,transparent:true,opacity:.32,depthWrite:false})));const grid=new THREE.GridHelper(60,48,0x312e81,0x111827);grid.position.y=-2.4;grid.material.transparent=true;grid.material.opacity=.34;scene.add(grid);scene.add(new THREE.AmbientLight(0x64748b,.42));let a=new THREE.DirectionalLight(0x38bdf8,1.2);a.position.set(4,6,5);scene.add(a);a=new THREE.DirectionalLight(0xec4899,.9);a.position.set(-4,-2,-5);scene.add(a)}
function resize(){const b=$('viewer');camera.aspect=b.clientWidth/b.clientHeight;camera.updateProjectionMatrix();renderer.setSize(b.clientWidth,b.clientHeight);composer.setSize(b.clientWidth,b.clientHeight)}
function initCamera(face){video=$('vid');if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;stream=null;if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='Camera unavailable';return}navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face},width:{ideal:640},height:{ideal:480},frameRate:{ideal:24}},audio:false}).then(s=>{stream=s;facing=face;video.srcObject=s;return video.play()}).then(()=>{ready=true;$('cam').textContent=facing==='environment'?'📷 Back':'📷 Front';$('status').textContent='Contour camera live'}).catch(()=>{$('status').textContent='Camera error'})}
function flip(){initCamera(facing==='user'?'environment':'user')}function center(){camera.position.set(0,1.1,6.2);controls.target.set(0,.2,0);controls.update()}
function makeTextureField(){if(!ctx){work=document.createElement('canvas');ctx=work.getContext('2d',{willReadFrequently:true})}}
function sample(){if(!ready||video.readyState<2)return;makeTextureField();const w=video.videoWidth||640,h=video.videoHeight||480;if(work.width!==w||work.height!==h){work.width=w;work.height=h}try{ctx.drawImage(video,0,0,w,h)}catch{return}let px;try{px=ctx.getImageData(0,0,w,h).data}catch{return}const step=3,pos=[],col=[];const cx=w*.5,cy=h*.5,maxR=Math.hypot(cx,cy);for(let y=0;y<h;y+=step){for(let x=0;x<w;x+=step){const i=(y*w+x)*4,r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.035)continue;const nx=((w-x)/w)*2-1,ny=-((y/h)*2-1),rad=((x-cx)*(x-cx)+(y-cy)*(y-cy))/(maxR*maxR);const z=(l-.16)*(depth*.042)-rad*.5;pos.push(nx*1.65,ny*1.65,z);const edge=Math.min(1,l*1.7);col.push(Math.min(1,r*1.25+.08),Math.min(1,g*1.15+.06),Math.min(1,b*1.4+.16))}}if(pos.length<12)return;renderField(pos,col,w,h);if(scanning&&recording.length<110){recording.push({p:pos.map(v=>+v.toFixed(3)),c:col.map(v=>+v.toFixed(2))})}}
function renderField(pos,col,w,h){clearObjects();const n=pos.length/3;const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));cloud=new THREE.Points(geo,new THREE.PointsMaterial({size:pointSize,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.72,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(cloud);buildContourLines(pos,col);$('pts').textContent=(n*(levels+1)).toLocaleString()}
function clearObjects(){if(cloud){scene.remove(cloud);cloud.geometry.dispose();cloud.material.dispose();cloud=null}contours.forEach(o=>{scene.remove(o);o.geometry.dispose();o.material.dispose()});contours=[];ghosts.forEach(o=>{scene.remove(o);o.geometry.dispose();o.material.dispose()});ghosts=[]}
function buildContourLines(pos,col){const n=pos.length/3;const bins=levels;const minZ=-3,maxZ=3;for(let L=0;L<bins;L++){const z=minZ+(L/(bins-1))*(maxZ-minZ),v=[],c=[];for(let i=0;i<n;i++){const j=i*3,d=Math.abs(pos[j+2]-z);if(d<.045+(L%2)*.012){v.push(pos[j],pos[j+1],z);c.push(col[j],col[j+1],col[j+2])}}if(v.length<9)continue;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(c),3));const m=new THREE.PointsMaterial({size:pointSize*1.8,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.82,depthWrite:false,blending:THREE.AdditiveBlending});const o=new THREE.Points(g,m);scene.add(o);contours.push(o)}
// depth ribs: connect nearby projected contour samples to make the silhouette read as a 3D contour map
for(let k=0;k<Math.min(7,bins-1);k++){const a=contours[k],b=contours[k+1];if(!a||!b)continue;const ap=a.geometry.attributes.position.array,bp=b.geometry.attributes.position.array,count=Math.min(ap.length,bp.length)/3;const v=[];for(let i=0;i<count;i+=5){v.push(ap[i*3],ap[i*3+1],ap[i*3+2],bp[i*3],bp[i*3+1],bp[i*3+2])}if(v.length){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));const m=new THREE.LineBasicMaterial({color:0x8b5cf6,transparent:true,opacity:.18,blending:THREE.AdditiveBlending});const o=new THREE.LineSegments(g,m);scene.add(o);ghosts.push(o)}}}
function rebuild(){if(cloud&&cloud.geometry.attributes.position){const p=Array.from(cloud.geometry.attributes.position.array),c=Array.from(cloud.geometry.attributes.color.array);renderField(p,c,0,0)}}
function toggleScan(){scanning=!scanning;const b=$('scan');if(scanning){recording=[];frames=[];playing=false;$('play').textContent='⏯ Play';b.textContent='⏹ Stop Scan';b.classList.add('on');$('status').textContent='Building 4D contour volume…'}else{b.textContent='▶ Start 4D Scan';b.classList.remove('on');frames=recording.slice();if(frames.length){playing=true;$('play').textContent='⏸ Pause';$('status').textContent=frames.length+' contour frames ready'}}}
function togglePlay(){if(!frames.length)return;playing=!playing;$('play').textContent=playing?'⏸ Pause':'⏯ Play'}
function drawFrame(){if(!frames.length)return;const f=frames[playIndex%frames.length];renderField(f.p,f.c,0,0);playIndex=(playIndex+1)%frames.length}
function loop(now=performance.now()){requestAnimationFrame(loop);phase=now*.001;controls.autoRotate=!scanning;controls.update();fc++;if(now-ft>1000){$('fps').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}if(ready&&!playing&&!scanning&&now-lastSample>45){lastSample=now;sample()}if(scanning&&ready&&now-lastSample>55){lastSample=now;sample()}if(playing&&frames.length&&now-lastFrame>45){lastFrame=now;drawFrame()}contours.forEach((o,i)=>o.rotation.z=Math.sin(phase*.35+i*.08)*.002);composer.render()}
function photo(){composer.render();const a=document.createElement('a');a.href=$('c').toDataURL('image/png');a.download='hyperstream-contour-'+Date.now()+'.png';a.click()}
function share(){if(!navigator.share){alert('Share works best on iPhone Safari');return}const payload=frames.length?{HyperStreamXD:'Contour 4D',frames}:recording.length?{HyperStreamXD:'Contour 4D',frames:recording}:null;if(!payload){alert('Scan something first');return}const file=new File([JSON.stringify(payload)],'hyperstream-contour.json',{type:'application/json'});if(navigator.canShare?.({files:[file]}))navigator.share({title:'HyperStream XD Contour 4D',files:[file]}).catch(()=>{});else navigator.share({title:'HyperStream XD Contour 4D',text:'My contour hologram',url:location.href}).catch(()=>{})}
addEventListener('DOMContentLoaded',init);
</script>
</body></html>
