<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash - Streamlined Camera Processor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030303;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #camera-stream, #processing-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #processing-canvas { display: none; }
        #camera-stream.front-facing { transform: scaleX(-1); }
        #hud-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .top-status {
            background: rgba(15, 15, 15, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 14px; color: #f0f0f0; }
        
        .btn-style {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-style:hover { background: rgba(255, 255, 255, 0.2); }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(48, 209, 88, 0.2);
            color: #30d158;
            border: 1px solid rgba(48, 209, 88, 0.4);
        }
        .control-dock {
            background: rgba(15, 15, 15, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(18px);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px;
        }
        .metric-label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .metric-value { font-size: 14px; font-weight: 700; color: #0a84ff; }
        
        #export-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #151515;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-content h3 { font-size: 15px; color: #fff; }
        .modal-content textarea {
            width: 100%;
            height: 160px;
            background: #0a0a0a;
            color: #0a84ff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px;
            font-family: monospace;
            font-size: 10px;
            resize: none;
        }
        .modal-btn-row { display: flex; gap: 8px; }
        .modal-btn {
            flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor: pointer;
        }
        #modal-copy-btn { background: #0a84ff; color: white; }
        #modal-close-btn { background: #333; color: white; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>
    <canvas id="processing-canvas"></canvas>

    <div id="export-modal" class="interactive">
        <div class="modal-content">
            <h3>Condensed Camera Telemetry Payload</h3>
            <p style="font-size:11px; color:#aaa;">Compact JSON export containing normalized tracking matrices and metadata ready to copy.</p>
            <textarea id="modal-json-text" readonly></textarea>
            <div class="modal-btn-row">
                <button id="modal-copy-btn" class="modal-btn" onclick="copyPayload()">COPY PAYLOAD</button>
                <button id="modal-close-btn" class="modal-btn" onclick="closeModal()">CLOSE</button>
            </div>
        </div>
    </div>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <div class="brand-group">
                <span class="brand">CAMERA PROCESSOR</span>
                <button class="btn-style" onclick="switchCamera()">📷 Flip</button>
                <button class="btn-style" onclick="exportTelemetry()">📋 Export Data</button>
            </div>
            <span id="status-badge" class="badge">ACTIVE</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Frame Index</div>
                    <div id="frame-counter" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Landmarks</div>
                    <div id="node-count" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Mode</div>
                    <div class="metric-value">Realtime</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let videoElement = document.getElementById('camera-stream');
        let processingCanvas = document.getElementById('processing-canvas');
        let canvasCtx = processingCanvas.getContext('2d', { willReadFrequently: true });
        let statusBadge = document.getElementById('status-badge');
        let nodeCountText = document.getElementById('node-count');
        let frameCounterText = document.getElementById('frame-counter');
        let exportModal = document.getElementById('export-modal');
        let modalJsonText = document.getElementById('modal-json-text');

        let currentFacingMode = "environment";
        let activeStream = null;
        let holistic = null;
        let cameraUtilsInstance = null;
        let frameIndex = 0;
        let latestTelemetry = { timestamp: null, facing: currentFacingMode, landmarksDetected: 0, summary: [] };

        async function initCameraFeed() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = { video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } } };
                activeStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = activeStream;

                if (currentFacingMode === "user") {
                    videoElement.classList.add("front-facing");
                } else {
                    videoElement.classList.remove("front-facing");
                }
            } catch (err) {
                console.log("Camera error:", err);
            }
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            initCameraFeed();
        }

        function setupOmniScanner() {
            holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
            
            holistic.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: false,
                refineFaceLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            holistic.onResults(onHolisticResults);

            cameraUtilsInstance = new Camera(videoElement, {
                onFrame: async () => {
                    if (videoElement) {
                        await holistic.send({image: videoElement});
                        frameIndex++;
                        frameCounterText.innerText = frameIndex;
                    }
                },
                width: 1280,
                height: 720
            });
            cameraUtilsInstance.start();
        }

        function onHolisticResults(results) {
            let count = 0;
            let summaryData = {};

            if (results.faceLandmarks) { count += results.faceLandmarks.landmark.length; summaryData.face = results.faceLandmarks.landmark.length; }
            if (results.poseLandmarks) { count += results.poseLandmarks.landmark.length; summaryData.pose = results.poseLandmarks.landmark.length; }
            if (results.leftHandLandmarks) { count += results.leftHandLandmarks.landmark.length; summaryData.leftHand = results.leftHandLandmarks.landmark.length; }
            if (results.rightHandLandmarks) { count += results.rightHandLandmarks.landmark.length; summaryData.rightHand = results.rightHandLandmarks.landmark.length; }

            nodeCountText.innerText = count;

            latestTelemetry = {
                version: "1.0",
                type: "CameraProcessorSnapshot",
                timestamp: new Date().toISOString(),
                facingMode: currentFacingMode,
                frame: frameIndex,
                totalLandmarks: count,
                breakdown: summaryData
            };
        }

        function exportTelemetry() {
            modalJsonText.value = JSON.stringify(latestTelemetry, null, 2);
            exportModal.style.display = 'flex';
        }

        function copyPayload() {
            navigator.clipboard.writeText(modalJsonText.value).then(() => {
                let btn = document.getElementById('modal-copy-btn');
                btn.innerText = "COPIED!";
                setTimeout(() => { btn.innerText = "COPY PAYLOAD"; }, 2000);
            });
        }

        function closeModal() { exportModal.style.display = 'none'; }

        window.addEventListener('load', () => {
            initCameraFeed();
            setupOmniScanner();
        });
    </script>
</body>
</html>
