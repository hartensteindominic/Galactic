<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HyperStream XD • 4D Quantum Holographic Suite</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#0a0a0f;--panel:#12121a;--panel-border:#1e1e2a;--accent-purple:#a855f7;--accent-pink:#ec4899;--accent-red:#ef4444;--accent-green:#22c55e;--text:#e2e8f0;--text-dim:#94a3b8;--slider-track:#2a2a3a}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}.top-bar{height:42px;background:#0d0d14;border-bottom:1px solid #1a1a24;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:13px;color:var(--text-dim)}.top-bar .blob{background:#1a1a24;border-radius:6px;padding:4px 12px;flex:1;max-width:320px;font-family:monospace;font-size:12px}.main{flex:1;display:flex;overflow:hidden}.left-panel{width:340px;min-width:300px;background:var(--panel);border-right:1px solid var(--panel-border);display:flex;flex-direction:column;overflow-y:auto;padding:16px;gap:14px}.title{font-size:15px;font-weight:700;letter-spacing:.5px;background:linear-gradient(90deg,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.btn-row{display:flex;gap:8px}.btn{flex:1;padding:9px 12px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}.btn:active{transform:scale(.97)}.btn-live{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff}.btn-secondary{background:#1e1e2a;color:var(--text);border:1px solid #2a2a3a}.section{background:#0f0f16;border:1px solid #1e1e2a;border-radius:14px;padding:14px}.section-title{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--text-dim);margin-bottom:12px;text-transform:uppercase}.viewport{flex:1;position:relative;background:#050508;overflow:hidden}#canvas-container{width:100%;height:100%}canvas{display:block;width:100%!important;height:100%!important}.status-badge{position:absolute;top:16px;right:16px;background:rgba(15,15,22,.85);backdrop-filter:blur(8px);padding:7px 10px;border-radius:10px;font-size:11px;color:var(--text-dim);z-index:5}.status-badge b{color:var(--accent-green)}.controls{display:flex;flex-direction:column;gap:12px}.control-buttons{display:flex;gap:8px}.control-buttons button{flex:1}.btn-activate{width:100%;background:#ef4444;color:#fff;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:13px;letter-spacing:.5px;cursor:pointer}.btn-activate.active{background:#22c55e}.mode-row{display:flex;gap:8px}.mode-btn{flex:1;background:#1a1a24;border:1px solid #2a2a3a;color:var(--text);padding:9px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}.mode-btn.active{background:#2a1a3a;border-color:#a855f7;color:#c084fc}.slider-group{display:flex;flex-direction:column;gap:11px}.slider-item{display:flex;align-items:center;gap:10px}.slider-label{width:120px;font-size:12px;color:var(--text-dim)}input[type=range]{flex:1;accent-color:#ec4899}.slider-value{width:38px;text-align:right;font-size:12px;font-weight:600;color:var(--text)}.stats{font-size:11px;color:var(--text-dim);margin-top:10px;display:flex;justify-content:space-between}.stats span{color:var(--accent-green);font-weight:600}@media(max-width:768px){.top-bar{height:38px}.main{flex-direction:column}.left-panel{order:2;width:100%;min-width:0;height:43vh;border-right:0;border-top:1px solid var(--panel-border);padding:10px 12px calc(12px + env(safe-area-inset-bottom));gap:9px}.viewport{order:1;height:57vh;flex:none}.title{font-size:13px}.section{padding:10px}.slider-label{width:112px;font-size:11px}.slider-item{gap:7px}.slider-group{gap:7px}}
</style>
</head>
<body>
<div class="top-bar"><span>✦</span><span class="title">HYPERSTREAM XD</span><span class="blob">4D QUANTUM HOLOGRAPHIC SUITE</span></div>
<div class="main">
<aside class="left-panel">
<div class="controls">
<div class="control-buttons"><button class="btn btn-live" id="scanBtn" onclick="toggleScan()">▶ Start Scanning</button><button class="btn btn-secondary" id="recordBtn" onclick="toggleRecord()">● Record</button></div>
<div class="btn-row"><button class="btn btn-secondary" onclick="replay()">↻ Replay</button><button class="btn btn-secondary" onclick="share()">↗ Share</button></div>
</div>
<section class="section"><div class="section-title">Camera</div><div class="mode-row"><button class="mode-btn active" id="frontBtn" onclick="setCamera('user')">◉ Face Camera</button><button class="mode-btn" id="backBtn" onclick="setCamera('environment')">◉ Back Camera</button></div><div id="status" class="stats">Starting camera…</div></section>
<section class="section"><div class="section-title">4D Quantum Structure</div><div class="slider-group">
<label class="slider-item"><span class="slider-label">Live 4D</span><input id="live4d" type="range" min="0" max="100" value="72"><span class="slider-value" id="live4dv">72%</span></label>
<label class="slider-item"><span class="slider-label">Voxel Density</span><input id="density" type="range" min="20" max="100" value="78"><span class="slider-value" id="densityv">78%</span></label>
<label class="slider-item"><span class="slider-label">Hyper Depth Field</span><input id="depth" type="range" min="10" max="100" value="48"><span class="slider-value" id="depthv">48%</span></label>
<label class="slider-item"><span class="slider-label">Quantum Node Size</span><input id="node" type="range" min="20" max="160" value="70"><span class="slider-value" id="nodev">70%</span></label>
<label class="slider-item"><span class="slider-label">Dimensional Strata</span><input id="strata" type="range" min="1" max="12" value="6"><span class="slider-value" id="stratav">6</span></label>
<label class="slider-item"><span class="slider-label">Spatial Dimensions</span><input id="spatial" type="range" min="10" max="100" value="68"><span class="slider-value" id="spatialv">68%</span></label>
</div><div class="stats"><span id="fps">FPS —</span><span id="nodes">0 nodes</span></div></section>
</aside>
<main class="viewport"><div id="canvas-container"></div><div class="status-badge">● <b>HOLOGRAPHIC</b></div></main>
</div>
<video id="video" autoplay playsinline muted style="display:none"></video>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=id=>document.getElementById(id);let scene,cam,renderer,controls,video,stream,scanning=false,recording=false,mediaRecorder,chunks=[],frames=[],playing=false,playIndex=0,lastFrame=0,work,ctx,points,geometry,colors,depthData;const W=288,H=162,MAX=W*H;let T=.72,V=.78,D=.48,N=.70,L=6,X=.68,frameCount=0,fpsTime=performance.now();
function init(){const box=$('canvas-container');scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(48,box.clientWidth/box.clientHeight,.01,100);cam.position.set(0,0,5.6);renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setSize(box.clientWidth,box.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));box.appendChild(renderer.domElement);controls=new THREE.OrbitControls(cam,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.autoRotate=true;controls.autoRotateSpeed=.08;video=$('video');work=document.createElement('canvas');work.width=W;work.height=H;ctx=work.getContext('2d',{willReadFrequently:true});depthData=new Float32Array(MAX);geometry=new THREE.BufferGeometry();const pos=new Float32Array(MAX*3),col=new Float32Array(MAX*3);geometry.setAttribute('position',new THREE.BufferAttribute(pos,3));geometry.setAttribute('color',new THREE.BufferAttribute(col,3));points=new THREE.Points(geometry,new THREE.PointsMaterial({size:.05,vertexColors:true,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(points);window.addEventListener('resize',resize);renderer.setAnimationLoop(loop)}
function resize(){const b=$('canvas-container');cam.aspect=b.clientWidth/b.clientHeight;cam.updateProjectionMatrix();renderer.setSize(b.clientWidth,b.clientHeight)}
async function setCamera(mode){if(stream)stream.getTracks().forEach(t=>t.stop());$('status').textContent=mode==='user'?'Starting Face Camera…':'Starting Back Camera…';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,max:60}},audio:false});video.srcObject=stream;await video.play();$('frontBtn').classList.toggle('active',mode==='user');$('backBtn').classList.toggle('active',mode==='environment');$('status').textContent='Camera ready'}catch(e){$('status').textContent='Camera permission needed'}}
function toggleScan(){if(!stream){$('status').textContent='Camera not ready';return}scanning=!scanning;$('scanBtn').textContent=scanning?'■ Stop Scanning':'▶ Start Scanning';$('scanBtn').classList.toggle('btn-live',!scanning);$('scanBtn').classList.toggle('btn-secondary',scanning);controls.autoRotate=!scanning;$('status').textContent=scanning?'Live 4D reconstruction active':'Ready'}
function sample(t){ctx.drawImage(video,0,0,W,H);let pix;try{pix=ctx.getImageData(0,0,W,H).data}catch{return}const stride=Math.max(1,Math.round(4.5-V*2.8)),pos=geometry.attributes.position.array,col=geometry.attributes.color.array;let n=0;for(let y=0;y<H;y+=stride)for(let x=0;x<W&&n<MAX;x+=stride){const i=(y*W+x)*4,r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255,lum=.299*r+.587*g+.114*b,edge=Math.min(1,(Math.abs(pix[(y*W+Math.min(W-1,x+1))*4]-pix[(y*W+Math.max(0,x-1))*4])+Math.abs(pix[(Math.min(H-1,y+1)*W+x)*4]-pix[(Math.max(0,y-1)*W+x)*4]))/255),rad=Math.hypot(x/W-.5,(y/H-.5)*1.12),center=1-Math.min(1,rad*1.5),target=((1-lum)*.3+edge*.2+center*.05)*D-.08,di=y*W+x;depthData[di]+=(target-depthData[di])*(.16+.18*T);const j=n*3;pos[j]=(x/(W-1)-.5)*5*X+.02*Math.sin(di*.17+t*.001);pos[j+1]=(.5-y/(H-1))*2.8125*X+.02*Math.cos(di*.13+t*.001);pos[j+2]=depthData[di];col[j]=Math.min(1,r*1.04+.01);col[j+1]=Math.min(1,g*1.04+.01);col[j+2]=Math.min(1,b*1.04+.01);n++}geometry.setDrawRange(0,n);geometry.attributes.position.needsUpdate=true;geometry.attributes.color.needsUpdate=true;points.material.size=.018+N*.045;points.material.opacity=.22+.48*T;$('nodes').textContent=n.toLocaleString()+' nodes';if(recording&&(!frames.length||t-frames[frames.length-1].t>=16))frames.push({t,n,pos:pos.slice(0,n*3),col:col.slice(0,n*3)})}
function loop(t){controls.update();frameCount++;if(t-fpsTime>1000){$('fps').textContent='FPS '+Math.round(frameCount*1000/(t-fpsTime));frameCount=0;fpsTime=t}if(playing)playFrame(t);else if(scanning&&video.readyState>=2)sample(t);renderer.render(scene,cam)}
function toggleRecord(){if(recording){recording=false;if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();$('recordBtn').textContent='● Record';return}if(!scanning)return;chunks=[];frames=[];const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';mediaRecorder=new MediaRecorder(renderer.domElement.captureStream(60),{mimeType:type,videoBitsPerSecond:18000000});mediaRecorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);mediaRecorder.start(100);recording=true;$('recordBtn').textContent='■ Stop'}
function replay(){if(!frames.length){$('status').textContent='Record a hologram first';return}playing=!playing;playIndex=0;lastFrame=performance.now();controls.autoRotate=!playing;$('status').textContent=playing?'Replaying holographic capture':'Ready'}
function playFrame(t){if(t-lastFrame<16)return;lastFrame=t;const f=frames[playIndex],p=geometry.attributes.position.array,c=geometry.attributes.color.array;p.set(f.pos);c.set(f.col);geometry.setDrawRange(0,f.n);geometry.attributes.position.needsUpdate=true;geometry.attributes.color.needsUpdate=true;$('nodes').textContent=f.n.toLocaleString()+' nodes';playIndex=(playIndex+1)%frames.length}
function share(){if(!chunks.length){$('status').textContent='Record something first';return}const blob=new Blob(chunks,{type:'video/webm'}),file=new File([blob],'hyperstream-xd-4d.webm',{type:blob.type});if(navigator.share&&navigator.canShare?.({files:[file]}))navigator.share({title:'HyperStream XD 4D Quantum Holographic',text:'Live 4D holographic video ✨',files:[file]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}}
[['live4d','T','live4dv',v=>v+'%'],['density','V','densityv',v=>v+'%'],['depth','D','depthv',v=>v+'%'],['node','N','nodev',v=>v+'%'],['strata','L','stratav',v=>v],['spatial','X','spatialv',v=>v+'%']].forEach(([id,key,out,fmt])=>$(id).oninput=e=>{const v=+e.target.value;window[key]=key==='L'?v:v/100;$(out).textContent=fmt(v)});init();setCamera('user');
</script>
</body></html>
