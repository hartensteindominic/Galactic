<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column}#stage{height:58dvh;flex:0 0 58dvh;position:relative}canvas{width:100%;height:100%;display:block}.badge{position:absolute;right:12px;top:12px;z-index:5;padding:7px 12px;border-radius:22px;background:#0008;backdrop-filter:blur(20px);font-size:12px}.panel{height:42dvh;flex:0 0 42dvh;overflow-y:auto;background:#19191cf8;border-radius:24px 24px 0 0;padding:7px 10px calc(14px + env(safe-area-inset-bottom));box-sizing:border-box}.handle{width:38px;height:4px;background:#68686f;border-radius:9px;margin:0 auto 8px}.card{background:#303034e6;border-radius:17px;padding:10px;margin-bottom:8px}.actions{display:flex;flex-direction:column;gap:7px}.actions button{border:0;border-radius:15px;height:44px;font-weight:750;color:#fff;font-size:14px}.red{background:linear-gradient(135deg,#ff477c,#ff3561)}.green{background:linear-gradient(135deg,#65f39a,#30d158);color:#06120a!important}.green.ready{animation:g 1.35s infinite;box-shadow:0 0 18px #30d15877}@keyframes g{50%{box-shadow:0 0 0 7px #30d15800,0 0 28px #30d158b8}}.blue{background:linear-gradient(135deg,#5ab5ff,#0a84ff)}.primary{background:linear-gradient(135deg,#d06cff,#ff4f91)}.orange{background:linear-gradient(135deg,#ffc45c,#ff9f0a);color:#111!important}.title{font-size:10px;font-weight:800;color:#9a9aa3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.switch button{border:0;border-radius:13px;height:38px;background:#ffffff12;color:#fff;font-weight:700;font-size:12px}.switch button.active{background:#ff4f864d;outline:1px solid #ff4f8680}.sliderrow{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:6px;height:38px;font-size:12px}.value{text-align:right;font-size:10px}.sliderrow input{min-width:0}input[type=range]{appearance:none;width:100%;height:28px;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,#ffffff20,#ff4f867a)}input[type=range]::-webkit-slider-thumb{appearance:none;width:21px;height:21px;margin-top:-7.5px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#fff,#ff76a6);box-shadow:0 2px 10px #ff46806b}.status{font-size:10px;color:#42a5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}button:disabled{opacity:.35}video{display:none}@media(min-width:769px){#stage{height:calc(100dvh - 330px);flex-basis:calc(100dvh - 330px)}.panel{height:330px;flex-basis:330px}.handle{display:none}.actions{display:grid;grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="app"><section id="stage"><div class="badge">FPS <b id="fps" style="color:#ff4f86">—</b></div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></section><section class="panel"><div class="handle"></div><div class="card actions"><button class="red" id="scanBtn" onclick="toggleScan()">Start Scanning</button><button class="green" id="recBtn" onclick="toggleRec()" disabled>Record</button><button class="blue" id="playBtn" onclick="togglePlay()" disabled>Replay</button><button class="primary" id="shareBtn" onclick="shareHologram()" disabled>Share</button></div><div class="card"><div class="title">Camera</div><div class="switch"><button id="frontBtn" class="active" onclick="switchCamera('user')">Face Camera</button><button id="backBtn" onclick="switchCamera('environment')">Back Camera</button></div></div><div class="card"><div class="title">Hologram Controls</div><div class="sliderrow"><span>Detail</span><input type="range" min="1" max="12" value="4" oninput="stepSize=+this.value;detailVal.textContent=this.value"><b class="value" id="detailVal">4</b></div><div class="sliderrow"><span>Depth</span><input type="range" min="10" max="320" value="105" oninput="depthMul=+this.value;depthVal.textContent=this.value"><b class="value" id="depthVal">105</b></div><div class="sliderrow"><span>Brightness</span><input type="range" min="30" max="170" value="78" oninput="brightness=+this.value/100;brightVal.textContent=this.value+'%'"><b class="value" id="brightVal">78%</b></div><div class="sliderrow"><span>Contrast</span><input type="range" min="50" max="180" value="100" oninput="contrast=+this.value/100;contrastVal.textContent=this.value+'%'"><b class="value" id="contrastVal">100%</b></div><div class="sliderrow"><span>Smoothing</span><input type="range" min="0" max="100" value="22" oninput="smoothAmount=+this.value/100;smoothVal.textContent=this.value+'%'"><b class="value" id="smoothVal">22%</b></div><div class="sliderrow"><span>Contour</span><input type="range" min="0" max="100" value="24" oninput="contourAmount=+this.value/100;contourVal.textContent=this.value+'%'"><b class="value" id="contourVal">24%</b></div><div class="sliderrow"><span>Relief</span><input type="range" min="0" max="100" value="42" oninput="reliefAmount=+this.value/100;reliefVal.textContent=this.value+'%'"><b class="value" id="reliefVal">42%</b></div><div class="status" id="status">Starting Face Camera…</div></div></section></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>const $=id=>document.getElementById(id);let scene,cam,ren,ctrl,video,c2d,ctx,stream=null,ready=false,scanning=false,stepSize=4,depthMul=105,brightness=.78,contrast=1,smoothAmount=.22,contourAmount=.24,reliefAmount=.42,fc=0,ft=0;let pts,layerA,layerB,posA,colA,frames=[],recording=false,mr,chunks=[],recStart=0,lastCap=0,playing=false,pIdx=0,pLast=0,faceDetector=null,lastFace=null;const MAX=210000,BASE_OPACITY=.64,REFERENCE_POINTS=90000;init();startCamera('user');if('FaceDetector'in window)try{faceDetector=new FaceDetector({fastMode:true,maxDetectedFaces:1})}catch{}function init(){let b=$('stage');scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,.014);cam=new THREE.PerspectiveCamera(50,b.clientWidth/b.clientHeight,.05,1000);cam.position.set(0,1.4,5.6);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});ren.setSize(b.clientWidth,b.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setClearColor(0);ctrl=new THREE.OrbitControls(cam,ren.domElement);ctrl.enableDamping=true;ctrl.dampingFactor=.07;ctrl.autoRotate=true;ctrl.autoRotateSpeed=.25;ctrl.target.set(0,.35,0);let geo=new THREE.BufferGeometry();posA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);colA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);geo.setAttribute('position',posA);geo.setAttribute('color',colA);pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:BASE_OPACITY,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(pts);layerA=new THREE.Points(geo,new THREE.PointsMaterial({size:.024,vertexColors:true,transparent:true,opacity:.13,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));layerA.position.z=-.018;scene.add(layerA);layerB=new THREE.Points(geo,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.055,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));layerB.position.z=.024;scene.add(layerB);let grid=new THREE.GridHelper(10,30,0x2845a0,0x15151a);grid.position.y=-1.45;grid.material.opacity=.11;grid.material.transparent=true;scene.add(grid);addEventListener('resize',()=>{cam.aspect=b.clientWidth/b.clientHeight;cam.updateProjectionMatrix();ren.setSize(b.clientWidth,b.clientHeight)});ren.setAnimationLoop(loop)}function startCamera(mode){$('status').textContent=mode==='user'?'Starting Face Camera…':'Starting Back Camera…';if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720}},audio:false}).then(s=>{stream=s;video=$('vid');video.srcObject=s;return video.play()}).then(()=>{ready=true;$('status').textContent=mode==='user'?'Face Camera ready':'Back Camera ready';$('frontBtn').classList.toggle('active',mode==='user');$('backBtn').classList.toggle('active',mode==='environment')}).catch(()=>$('status').textContent='Camera permission needed')}function switchCamera(m){if(scanning)toggleScan();startCamera(m)}async function detectFace(){if(!faceDetector||!video||video.readyState<2)return;try{let f=await faceDetector.detect(video);if(f[0]){let r=f[0].boundingBox;lastFace={x:(r.x+r.width/2)/video.videoWidth,y:(r.y+r.height/2)/video.videoHeight,w:r.width/video.videoWidth,h:r.height/video.videoHeight}}}catch{}}function loop(now){ctrl.update();fc++;if(now-ft>1000){$('fps').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}if(playing)playStep(now);else if(scanning&&ready&&video.readyState>=2)sample(now);ren.render(scene,cam)}function process(v){return Math.min(1,Math.max(0,(v/255-.5)*contrast+.5))*brightness}function faceWeights(x,y){let cx=.5,cy=.48,fw=.34,fh=.45;if(lastFace){cx=lastFace.x;cy=lastFace.y;fw=Math.max(.18,Math.min(.48,lastFace.w*.82));fh=Math.max(.25,Math.min(.58,lastFace.h*.82))}let dx=(x-cx)/fw,dy=(y-cy)/fh,m=Math.exp(-(dx*dx+dy*dy)*1.35);let nose=Math.exp(-(((x-cx)/(.105*fw))**2+((y-(cy+.02*fh))/(.22*fh))**2)*1.2);let cheeks=Math.exp(-((((Math.abs(x-cx)/fw)-.43)/.38)**2+((y-(cy+.08*fh))/(.24*fh))**2)*1.4);return{mask:m,nose,cheeks,cx,cy,fw,fh}}function sample(now){let w=video.videoWidth||1280,h=video.videoHeight||720;if(!c2d||c2d.width!==w||c2d.height!==h){c2d=document.createElement('canvas');c2d.width=w;c2d.height=h;ctx=c2d.getContext('2d',{willReadFrequently:true})}ctx.drawImage(video,0,0,w,h);let pix;try{pix=ctx.getImageData(0,0,w,h).data}catch{return}if(faceDetector&&now-(sample.lastFace||0)>180){sample.lastFace=now;detectFace()}let total=Math.ceil(w/stepSize)*Math.ceil(h/stepSize),stride=total>MAX?Math.ceil(Math.sqrt(total/MAX))*stepSize:stepSize,n=0;for(let y=0;y<h&&n<MAX;y+=stride)for(let x=0;x<w&&n<MAX;x+=stride){let i=(y*w+x)*4,r=process(pix[i]),g=process(pix[i+1]),b=process(pix[i+2]),lum=.299*r+.587*g+.114*b;if(lum<.012)continue;let xm=Math.min(w-1,x+stride),ym=Math.min(h-1,y+stride),l2=.299*process(pix[(y*w+xm)*4])+.587*process(pix[(y*w+xm)*4+1])+.114*process(pix[(y*w+xm)*4+2]),l3=.299*process(pix[(ym*w+x)*4])+.587*process(pix[(ym*w+x)*4+1])+.114*process(pix[(ym*w+x)*4+2]),edge=Math.min(1,Math.hypot(l2-lum,l3-lum)*2.5),nx=x/w,ny=y/h,fw=faceWeights(nx,ny),face=fw.mask,depthBase=Math.pow(Math.max(0,1-lum),1.25),faceRelief=(face*(.08+.22*fw.nose+.10*fw.cheeks))*reliefAmount,edgeRelief=edge*contourAmount*.10,depth=Math.max(0,depthBase*.56+edgeRelief+faceRelief),j=n*3;posA.array[j]=(nx-.5)*4.25;posA.array[j+1]=(.5-ny)*3.25;posA.array[j+2]=(depth-.34)*(depthMul*.040);colA.array[j]=r;colA.array[j+1]=g;colA.array[j+2]=b;n++}if(smoothAmount&&n>1){let a=smoothAmount*.16;for(let p=1;p<n;p++){let j=p*3;posA.array[j]=posA.array[j]*(1-a)+posA.array[j-3]*a;posA.array[j+1]=posA.array[j+1]*(1-a)+posA.array[j-2]*a;posA.array[j+2]=posA.array[j+2]*(1-a)+posA.array[j-1]*a}}if(contourAmount){for(let p=0;p<n;p++){let j=p*3,k=contourAmount;colA.array[j]=Math.min(1,colA.array[j]*(1+.12*k)+.035*k);colA.array[j+1]*=1-.05*k;colA.array[j+2]=Math.min(1,colA.array[j+2]*(1+.16*k)+.045*k)}}posA.needsUpdate=colA.needsUpdate=true;pts.geometry.setDrawRange(0,n);pts.material.opacity=Math.max(.45,Math.min(.82,BASE_OPACITY*Math.sqrt(REFERENCE_POINTS/Math.max(1,n))));if(recording&&now-lastCap>=80){lastCap=now;frames.push({t:now-recStart,n,pos:new Float32Array(posA.array.slice(0,n*3)),col:new Float32Array(colA.array.slice(0,n*3))})}}function toggleScan(){if(!ready)return;$('status').textContent=scanning?'Ready · point camera at subject':'Scanning · move slowly around the subject';scanning=!scanning;$('scanBtn').textContent=scanning?'Stop Scanning':'Start Scanning';$('scanBtn').className=scanning?'orange':'red';$('recBtn').disabled=!scanning;$('recBtn').classList.toggle('ready',scanning);ctrl.autoRotate=!scanning;if(!scanning){pts.geometry.setDrawRange(0,0);pts.material.opacity=BASE_OPACITY}}function toggleRec(){recording?stopRec():startRec()}function startRec(){if(!scanning)return;chunks=[];frames=[];recStart=performance.now();lastCap=0;let o={mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8000000};if(!MediaRecorder.isTypeSupported(o.mimeType))o.mimeType='video/webm';mr=new MediaRecorder($('c').captureStream(30),o);mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{$('playBtn').disabled=!frames.length;$('shareBtn').disabled=!frames.length};mr.start(120);recording=true;$('recBtn').textContent='Stop'}function stopRec(){recording=false;if(mr?.state!=='inactive')mr.stop();$('recBtn').textContent='Record'}function togglePlay(){if(!frames.length)return;playing=!playing;if(playing){pIdx=0;pLast=performance.now();$('playBtn').textContent='Stop'}else{$('playBtn').textContent='Replay';pts.geometry.setDrawRange(0,0)}}function playStep(now){if(now-pLast<83)return;pLast=now;let f=frames[pIdx];posA.array.set(f.pos);colA.array.set(f.col);posA.needsUpdate=colA.needsUpdate=true;pts.geometry.setDrawRange(0,f.n);pts.material.opacity=Math.max(.45,Math.min(.82,BASE_OPACITY*Math.sqrt(REFERENCE_POINTS/Math.max(1,f.n))));pIdx=(pIdx+1)%frames.length}async function shareHologram(){if(!frames.length&&!chunks.length)return;$('status').textContent='Preparing share…';let blob;if(chunks.length)blob=new Blob(chunks,{type:'video/webm'});else{let parts=[],r=new MediaRecorder($('c').captureStream(30),{mimeType:'video/webm'});r.ondataavailable=e=>e.data.size&&parts.push(e.data);r.start();await new Promise(x=>setTimeout(x,3500));r.stop();await new Promise(x=>r.onstop=x);blob=new Blob(parts,{type:'video/webm'})}let file=new File([blob],`hyperstream_${Date.now()}.webm`,{type:'video/webm'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:'HyperStream Hologram',text:'My HyperStream hologram ✨',files:[file]});$('status').textContent='Shared ✨';return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();$('status').textContent='Saved · upload to Instagram'}</script></body></html>
