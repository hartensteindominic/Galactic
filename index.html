<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0a20"><title>HyperStream XD • Bubble 4D</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08081a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}#viewer{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#45427f 0,#211e4c 28%,#0d0c22 62%,#070716 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#preview{position:absolute;z-index:8;right:12px;bottom:12px;width:92px;height:120px;object-fit:cover;border-radius:24px;border:2px solid #ffffff42;box-shadow:0 10px 30px #0009;background:#121126;transform:scaleX(-1)}.top{position:absolute;z-index:10;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{padding:8px 12px;border-radius:999px;background:#17162dcc;border:1px solid #ffffff1c;backdrop-filter:blur(20px);box-shadow:0 8px 24px #0005;font-size:10px;color:#d9d8ed}.pink{color:#ff9bd4;font-weight:800}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fb7185;box-shadow:0 0 10px #fb7185;margin-right:5px}.live .dot{background:#5ee7b7;box-shadow:0 0 12px #5ee7b7}.liveText{color:#9ef5d3}#message{position:absolute;z-index:9;left:50%;top:47%;transform:translate(-50%,-50%);width:max-content;max-width:82%;padding:14px 18px;border-radius:24px;background:#17162ddd;border:1px solid #ffffff1b;backdrop-filter:blur(20px);box-shadow:0 12px 35px #0007;text-align:center;font-size:12px}.hidden{display:none!important}.bubble{position:absolute;border-radius:50%;filter:blur(1px);opacity:.18;pointer-events:none}.b1{width:150px;height:150px;left:8%;top:15%;background:#ff8bc7}.b2{width:110px;height:110px;right:18%;top:28%;background:#70dfff}.b3{width:80px;height:80px;left:35%;bottom:15%;background:#b28cff}#controls{z-index:20;padding:10px 11px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:linear-gradient(#121126f7,#0b0a1cf7);border-top:1px solid #ffffff15;box-shadow:0 -18px 45px #0009}.row{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:20px;padding:12px 8px;color:#fff;font-weight:800;font-size:12px;background:linear-gradient(180deg,#303157,#1b1c39);box-shadow:inset 0 1px #ffffff22,0 7px 18px #0005;transition:.12s transform}.btn:active{transform:scale(.95)}.hero{padding:15px;border-radius:23px;font-size:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899 55%,#ff7b9d)}.on{background:linear-gradient(135deg,#ff557f,#f43f5e)}.blue{background:linear-gradient(135deg,#42cfff,#6366f1)}.green{background:linear-gradient(135deg,#4adeb0,#10a779)}.slider{display:flex;align-items:center;gap:9px;color:#bfc1d8;font-size:11px}.slider label{width:53px}.slider input{flex:1;accent-color:#f472b6}.slider output{width:31px;text-align:right;color:#ff9bd4;font-weight:800}.tiny{text-align:center;color:#8588a8;font-size:10px;padding-top:1px}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script></head><body><div id="viewer"><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="top"><div id="status" class="pill"><span class="dot"></span><span id="statusText">Starting…</span></div><div class="pill">🫧 <span id="fps">—</span> FPS · <span id="pts" class="pink">0</span></div></div><video id="preview" autoplay muted playsinline></video><div id="message">🫧 Getting your camera ready…</div><canvas id="c"></canvas></div><div id="controls"><button id="scan" class="btn hero">✨ Start 4D Scan</button><div class="row"><button id="cam" class="btn">📷 Flip</button><button id="play" class="btn">▶️ Play</button><button id="center" class="btn">🎯 Center</button></div><div class="slider"><label>Depth</label><input id="depth" type="range" min="30" max="160" value="105"><output id="dv">105</output></div><div class="slider"><label>Bubbles</label><input id="levels" type="range" min="7" max="24" value="16"><output id="lv">16</output></div><div class="slider"><label>Glow</label><input id="glow" type="range" min="6" max="24" value="14"><output id="gv">14</output></div><div class="row"><button id="photo" class="btn green">📸 Photo</button><button id="share" class="btn blue">💌 Share</button></div><div class="tiny">☝️ drag to turn · 🤏 pinch to zoom · 🫧 live video → layered 3D contour</div></div><script>(()=>{const $=id=>document.getElementById(id);let scene,camera,renderer,composer,orbit,video,work,ctx,stream=null,ready=false,facing='user',depth=105,levels=16,pointSize=.014,sampleBusy=false,lastSample=0,frameCount=0,fpsTime=0,scanning=false,playing=false,recording=[],frames=[],playIndex=0,lastPlay=0,basePoints=null,contourGroups=[],contourMaterial,pointMaterial;function setStatus(text,live=false){$('statusText').textContent=text;$('status').classList.toggle('live',live)}function init(){const box=$('viewer');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(38,box.clientWidth/box.clientHeight,.05,800);camera.position.set(0,1,6);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,alpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));renderer.setSize(box.clientWidth,box.clientHeight,false);renderer.setClearColor(0x08081a);composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(box.clientWidth,box.clientHeight),.62,.42,.82));orbit=new THREE.OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.dampingFactor=.08;orbit.rotateSpeed=.55;orbit.zoomSpeed=.7;orbit.enablePan=false;orbit.minDistance=2.2;orbit.maxDistance=15;orbit.target.set(0,.1,0);orbit.update();const l1=new THREE.PointLight(0xff72c6,1.8,28);l1.position.set(-4,3,5);scene.add(l1);const l2=new THREE.PointLight(0x5edcff,1.7,28);l2.position.set(4,-2,5);scene.add(l2);window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSampling();else if(ready)sample(true)});$('scan').onclick=toggleScan;$('play').onclick=togglePlay;$('cam').onclick=flipCamera;$('center').onclick=center;$('photo').onclick=photo;$('share').onclick=share;$('depth').oninput=e=>{depth=+e.target.value;$('dv').textContent=depth};$('levels').oninput=e=>{levels=+e.target.value;$('lv').textContent=levels;rebuildContours()};$('glow').oninput=e=>{pointSize=+e.target.value/1000;$('gv').textContent=e.target.value;if(pointMaterial)pointMaterial.size=pointSize};startCamera();loop()}function resize(){const b=$('viewer');camera.aspect=b.clientWidth/b.clientHeight;camera.updateProjectionMatrix();renderer.setSize(b.clientWidth,b.clientHeight,false);composer.setSize(b.clientWidth,b.clientHeight)}function stopSampling(){sampleBusy=false}async function startCamera(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('Camera unavailable');$('message').textContent='📷 Camera needs a secure HTTPS page';return}if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;setStatus('Requesting camera');$('message').textContent='🫧 Allow camera access…';$('message').classList.remove('hidden');video=$('preview');try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:facing},width:{ideal:640},height:{ideal:480},frameRate:{ideal:24}}})}catch(e){try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:640},height:{ideal:480}}})}catch(err){setStatus('Camera permission needed');$('message').textContent='📷 Open camera permission in Safari Settings, then reload';return}}try{video.srcObject=stream;video.muted=true;video.playsInline=true;await video.play();}catch(e){setStatus('Tap to start camera');$('message').textContent='👆 Tap this message to start the camera';$('message').onclick=()=>video.play().then(()=>cameraReady()).catch(()=>{}) ;return}cameraReady()}function cameraReady(){ready=true;$('message').classList.add('hidden');setStatus(facing==='user'?'Front camera live':'Back camera live',true);if(!ctx){work=document.createElement('canvas');ctx=work.getContext('2d',{willReadFrequently:true})}sample(true)}async function flipCamera(){facing=facing==='user'?'environment':'user';await startCamera()}function center(){camera.position.set(0,1,6);orbit.target.set(0,.1,0);orbit.update()}function makeBase(pos,col){const n=pos.length/3;if(!basePoints){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));pointMaterial=new THREE.PointsMaterial({size:pointSize,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.72,depthWrite:false,blending:THREE.AdditiveBlending});basePoints=new THREE.Points(g,pointMaterial);scene.add(basePoints)}else{const pg=basePoints.geometry,old=pg.getAttribute('position');if(!old||old.count!==n){pg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));pg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3))}else{old.array.set(pos);old.needsUpdate=true;pg.getAttribute('color').array.set(col);pg.getAttribute('color').needsUpdate=true}}$('pts').textContent=Math.round(n*(levels+1)).toLocaleString();rebuildContours(pos,col)}function disposeContour(o){scene.remove(o);o.geometry.dispose();o.material.dispose()}function rebuildContours(pos=lastPos,lastCol=lastColData){if(!pos||!pos.length)return;contourGroups.forEach(disposeContour);contourGroups=[];const n=pos.length/3;for(let L=0;L<levels;L++){const z=-2.8+(L/Math.max(1,levels-1))*5.6,v=[],c=[];for(let i=0;i<n;i++){const j=i*3;if(Math.abs(pos[j+2]-z)<.12){v.push(pos[j],pos[j+1],z);c.push(lastCol[j],lastCol[j+1],lastCol[j+2])}}if(v.length<12)continue;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(c),3));const m=new THREE.PointsMaterial({size:pointSize*2.2,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.82,depthWrite:false,blending:THREE.AdditiveBlending});const o=new THREE.Points(g,m);scene.add(o);contourGroups.push(o)}}let lastPos=null,lastColData=null;function sample(force=false){if(!ready||sampleBusy||playing||document.hidden||video.readyState<2)return;if(!force&&performance.now()-lastSample<75)return;sampleBusy=true;lastSample=performance.now();const w=video.videoWidth||640,h=video.videoHeight||480;if(!w||!h){sampleBusy=false;return}if(work.width!==w||work.height!==h){work.width=w;work.height=h}try{ctx.drawImage(video,0,0,w,h);const px=ctx.getImageData(0,0,w,h).data;const pos=[],col=[],step=Math.max(4,Math.round(Math.min(w,h)/120)),cx=w/2,cy=h/2,mr=Math.hypot(cx,cy);for(let y=0;y<h;y+=step){for(let x=0;x<w;x+=step){const i=(y*w+x)*4,r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.035)continue;const nx=(x/cx-1)*1.8,ny=-(y/cy-1)*1.8,rad=((x-cx)*(x-cx)+(y-cy)*(y-cy))/(mr*mr),z=(l-.10)*(depth*.04)-rad*.55;pos.push(nx,ny,z);col.push(Math.min(1,r*1.35+.08),Math.min(1,g*1.2+.07),Math.min(1,b*1.5+.16))}}if(pos.length>20){lastPos=pos;lastColData=col;makeBase(pos,col);if(scanning&&recording.length<90)recording.push({p:pos.map(v=>+v.toFixed(3)),c:col.map(v=>+v.toFixed(2))})} }catch(e){setStatus('3D camera paused')}sampleBusy=false}function toggleScan(){if(!ready){$('message').textContent='📷 Camera is not ready yet';$('message').classList.remove('hidden');return}scanning=!scanning;if(scanning){recording=[];frames=[];playing=false;$('scan').textContent='⏹ Stop 4D Scan';$('scan').classList.add('on');setStatus('Scanning 4D…',true)}else{$('scan').textContent='✨ Start 4D Scan';$('scan').classList.remove('on');frames=recording.slice();if(frames.length){playing=true;playIndex=0;$('play').textContent='⏸️ Pause';setStatus(frames.length+' frames ready',true)}else setStatus('Scan finished',true)}}function togglePlay(){if(!frames.length)return;playing=!playing;$('play').textContent=playing?'⏸️ Pause':'▶️ Play'}function drawFrame(){if(!frames.length)return;const f=frames[playIndex++%frames.length];lastPos=f.p;lastColData=f.c;makeBase(f.p,f.c)}function photo(){composer.render();const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='hyperstream-bubble-'+Date.now()+'.png';a.click()}async function share(){const data=frames.length?frames:recording;if(!data.length){alert('Scan something first 🫧');return}const file=new File([JSON.stringify({HyperStreamXD:'Bubble 4D',frames:data})],'hyperstream-bubble.json',{type:'application/json'});try{if(navigator.share&&navigator.canShare?.({files:[file]}))await navigator.share({title:'HyperStream XD',files:[file]});else if(navigator.share)await navigator.share({title:'HyperStream XD',text:'My 4D bubble hologram'});else alert('Sharing is not available in this browser')}catch(e){}}function loop(now=performance.now()){requestAnimationFrame(loop);frameCount++;if(now-fpsTime>1000){$('fps').textContent=Math.round(frameCount*1000/(now-fpsTime||1));frameCount=0;fpsTime=now}if(ready&&!playing)sample(false);if(scanning&&!playing&&ready)sample(false);if(playing&&frames.length&&now-lastPlay>70){lastPlay=now;drawFrame()}orbit.autoRotate=!scanning&&!playing;orbit.update();composer.render()}init()})();</script></body></html>
