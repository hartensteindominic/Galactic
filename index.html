<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperStream4D • Live Camera Scanner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030712;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;overflow:hidden}
#sidebar{width:380px;background:#0b0f19;border-right:1px solid #1f2937;display:flex;flex-direction:column;padding:16px;gap:12px;z-index:10}
.brand{font-size:15px;font-weight:800;letter-spacing:1.2px;color:#38bdf8}
.brand span{background: -webkit-linear-gradient(#7dd3fc, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
.section-card{background:rgba(17,24,39,.7);border:1px solid #1f2937;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#94a3b8}
button.primary-btn{background:#4f46e5;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
button.primary-btn:hover{background:#4338ca}
button.danger-btn{background:#dc2626;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;width:100%}
button.danger-btn.scanning{background:#ea580c}
#viewer-container{flex:1;position:relative;background:radial-gradient(circle at center,#0f172a 0%,#030712 100%);display:flex;align-items:center;justify-content:center}
video{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0.85}
canvas{position:absolute;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
.stats-overlay{position:absolute;top:16px;right:16px;background:rgba(3,7,18,.85);backdrop-filter:blur(8px);padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.08);font-size:12px;color:#94a3b8;z-index:5}
.stats-overlay span{color:#818cf8;font-weight:700}
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="sidebar">
    <div class="brand">HYPERSTREAM 4D<br><span>CAMERA SCANNER NODE</span></div>
    
    <div class="section-card">
        <div class="card-title">Live 4D Capture Control</div>
        <button id="scan-toggle-btn" class="danger-btn" onclick="toggleScanning()">START 4D STREAM CAPTURE</button>
        <button class="primary-btn" onclick="exportScannedData()" style="background:#059669;">Export Scanned JSON</button>
    </div>

    <div class="section-card" style="flex:1">
        <div class="card-title">Scanner Telemetry</div>
        <div style="font-size:12px;color:#cbd5e1;display:flex;flex-direction:column;gap:6px">
            <div>Status: <span id="status-text" style="color:#38bdf8">Standby</span></div>
            <div>Frames Captured: <span id="frame-counter">0</span></div>
            <div>Nodes per Frame: <span id="node-counter">0</span></div>
        </div>
    </div>
</div>

<div id="viewer-container">
    <div class="stats-overlay">Mode: <span>Active Webcam Stream</span></div>
    <video id="webcam-video" autoplay playsinline muted></video>
    <canvas id="output-canvas"></canvas>
</div>

<script>
let faceMesh, cameraUtils;
let isScanning = false;
let recordedSequence = [];
let frameIndex = 0;

const videoElement = document.getElementById('webcam-video');
const canvasElement = document.getElementById('output-canvas');
const canvasCtx = canvasElement.getContext('2d');

function initScanner() {
    faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    faceMesh.onResults(onMeshResults);

    cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            if (isScanning) {
                await faceMesh.send({ image: videoElement });
            }
        },
        width: 640,
        height: 480
    });
    cameraUtils.start();
}

function onMeshResults(results) {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        let vertices = [];
        let colors = [];
        
        const w = canvasElement.width;
        const h = canvasElement.height;

        for (const pt of landmarks) {
            let x = (pt.x - 0.5) * -3.2;
            let y = (pt.y - 0.5) * -3.2;
            let z = (pt.z || 0.0) * 10.0;

            vertices.push(Number(x.toFixed(4)), Number(y.toFixed(4)), Number(z.toFixed(4)), Number(frameIndex));
            colors.push(0.85, 0.68, 0.55);

            // Draw visual points on canvas overlay
            canvasCtx.fillStyle = '#818cf8';
            canvasCtx.beginPath();
            canvasCtx.arc(pt.x * w, pt.y * h, 2, 0, 2 * Math.PI);
            canvasCtx.fill();
        }

        recordedSequence.push({ v: vertices, c: colors });
        frameIndex++;

        document.getElementById('frame-counter').innerText = recordedSequence.length;
        document.getElementById('node-counter').innerText = vertices.length / 4;
        document.getElementById('status-text').innerText = `Recording Frame ${frameIndex}`;
    }
    canvasCtx.restore();
}

function toggleScanning() {
    isScanning = !isScanning;
    const btn = document.getElementById('scan-toggle-btn');
    if (isScanning) {
        recordedSequence = [];
        frameIndex = 0;
        btn.innerText = 'HALT & FINISH STREAM';
        btn.classList.add('scanning');
        document.getElementById('status-text').innerText = 'Scanning Active';
    } else {
        btn.innerText = 'START 4D STREAM CAPTURE';
        btn.classList.remove('scanning');
        document.getElementById('status-text').innerText = `Captured ${recordedSequence.length} frames`;
    }
}

function exportScannedData() {
    if (recordedSequence.length === 0) {
        alert('No 4D stream data recorded yet.');
        return;
    }
    const payload = { HyperStream4D: recordedSequence };
    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `hyperstream_camera_capture_${Date.now()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

window.addEventListener('DOMContentLoaded', initScanner);
</script>
</body>
</html>
