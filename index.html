<script>
    let videoElement = document.getElementById('camera-stream');
    let scanBtn = document.getElementById('scan-btn');
    let saveBtn = document.getElementById('save-btn');
    let statusBadge = document.getElementById('status-badge');
    let nodeCountText = document.getElementById('node-count');
    let surfaceStatusText = document.getElementById('surface-status');

    let isScanning = false;
    let spatialNodes = [];
    let xrSession = null;
    let xrRefSpace = null;

    // Fallback camera feed if WebXR isn't initialized yet
    async function initCameraFeed() {
        try {
            let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            videoElement.srcObject = stream;
        } catch (err) {
            console.warn("Standard camera stream fallback active.");
        }
    }

    async function toggleScanState() {
        if (!isScanning) {
            // Check if WebXR is supported for true spatial mapping
            if (navigator.xr) {
                try {
                    xrSession = await navigator.xr.requestSession('immersive-ar', { 
                        requiredFeatures: ['hit-test', 'local'] 
                    });
                    xrRefSpace = await xrSession.requestReferenceSpace('local');
                    
                    xrSession.addEventListener('end', () => {
                        isScanning = false;
                        resetUIState();
                    });

                    isScanning = true;
                    updateUIForScanning();
                    xrSession.requestAnimationFrame(onXRFrame);
                } catch (e) {
                    console.warn("Immersive AR session failed, falling back to sensor simulation mode.");
                    startSimulatedFallbackScan();
                }
            } else {
                startSimulatedFallbackScan();
            }
        } else {
            stopScanning();
        }
    }

    function startSimulatedFallbackScan() {
        isScanning = true;
        updateUIForScanning();
        // Keep your fallback loop here if needed, but flag it as simulated in metadata
    }

    function onXRFrame(time, frame) {
        if (!isScanning) return;

        let viewerPose = frame.getViewerPose(xrRefSpace);
        if (viewerPose) {
            let pos = viewerPose.transform.position;
            let rot = viewerPose.transform.orientation;

            let spatialNode = {
                id: spatialNodes.length + 1,
                position: { x: pos.x.toFixed(4), y: pos.y.toFixed(4), z: pos.z.toFixed(4) },
                orientation: { x: rot.x.toFixed(4), y: rot.y.toFixed(4), z: rot.z.toFixed(4), w: rot.w.toFixed(4) },
                timestamp: new Date().toISOString()
            };

            spatialNodes.push(spatialNode);
            nodeCountText.innerText = spatialNodes.length;
        }

        xrSession.requestAnimationFrame(onXRFrame);
    }

    function updateUIForScanning() {
        scanBtn.innerText = "STOP SCANNING";
        scanBtn.classList.add("scanning");
        statusBadge.innerText = "MAPPING ACTIVE";
        statusBadge.classList.add("active");
        surfaceStatusText.innerText = "Tracking";
        saveBtn.style.display = "block";
        spatialNodes = [];
    }

    function stopScanning() {
        isScanning = false;
        if (xrSession) {
            xrSession.end();
            xrSession = null;
        }
        resetUIState();
    }

    function resetUIState() {
        scanBtn.innerText = "START SCANNING";
        scanBtn.classList.remove("scanning");
        statusBadge.innerText = "SCAN PAUSED";
        statusBadge.classList.remove("active");
        surfaceStatusText.innerText = "Locked";
    }

    function exportEnvironmentMap() {
        if (spatialNodes.length === 0) {
            alert("No environment nodes recorded. Start scanning first.");
            return;
        }

        const environmentPayload = {
            generator: "Spatial Dash Pro Web Engine",
            version: "2.1",
            sessionDate: new Date().toISOString(),
            totalMeshNodes: spatialNodes.length,
            // Format tailored to match standard 3D constructor inputs (like Three.js point clouds)
            format: "3D-Cartesian-Matrix",
            coordinatesMatrix: spatialNodes
        };

        const dataBlob = new Blob([JSON.stringify(environmentPayload, null, 2)], { type: 'application/json' });
        const downloadUrl = URL.createObjectURL(dataBlob);
        
        const fileLink = document.createElement('a');
        fileLink.href = downloadUrl;
        fileLink.download = `spatial_environment_${Date.now()}.json`;
        document.body.appendChild(fileLink);
        fileLink.click();
        document.body.removeChild(fileLink);
        URL.revokeObjectURL(downloadUrl);
    }

    window.addEventListener('load', initCameraFeed);
</script>
