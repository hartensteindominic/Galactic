<script>

/* =====================================================
   STATE
===================================================== */

const $ = id =>
  document.getElementById(id);


/*
 * Hard safety limit for mobile.
 * Prevents scans from growing forever.
 */
const MAX_POINTS = 60000;


/*
 * Process camera approximately 8 times/second
 * instead of once per render frame.
 */
const SCAN_INTERVAL = 125;


const MEMORY_KEY =
  "hyperstream_room_memories_v7";


let scene;
let camera;
let renderer;
let controls;

let video;
let stream = null;

let scanning = false;
let scanStart = 0;
let lastScanTime = 0;

let frameCount = 0;

let pointCloud = null;

let pointPositions = [];
let pointColors = [];

let scanFrames = [];

let roomObjects = [];

let pointSize = 3;

let fpsFrames = 0;
let fpsStart = 0;

let memories = [];


/*
 * Prevents multiple camera initialization
 * attempts.
 */
let cameraInitializing = false;


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    init3D();

    loadMemories();

    renderMemories();

    initCamera();

    addMessage(
      "system",
      "Room AI ready."
    );

  }
);


/* =====================================================
   TABS
===================================================== */

function openTab(
  id,
  button
){

  document
    .querySelectorAll(".tabPanel")
    .forEach(panel => {
      panel.classList.remove("active");
    });


  document
    .querySelectorAll(".tab")
    .forEach(tab => {
      tab.classList.remove("active");
    });


  $(id)
    .classList.add("active");


  button.classList.add("active");

}


/* =====================================================
   THREE INITIALIZATION
===================================================== */

function init3D(){

  const box =
    $("viewer");


  scene =
    new THREE.Scene();


  scene.fog =
    new THREE.FogExp2(
      0x020617,
      .006
    );


  camera =
    new THREE.PerspectiveCamera(
      50,
      box.clientWidth /
      Math.max(
        box.clientHeight,
        1
      ),
      .01,
      2000
    );


  camera.position.set(
    0,
    2.5,
    7
  );


  renderer =
    new THREE.WebGLRenderer({
      canvas:$("canvas"),
      antialias:true,
      powerPreference:"high-performance"
    });


  renderer.setSize(
    box.clientWidth,
    box.clientHeight
  );


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio || 1,
      2
    )
  );


  renderer.setClearColor(
    0x020617
  );


  controls =
    new THREE.OrbitControls(
      camera,
      renderer.domElement
    );


  controls.enableDamping =
    true;

  controls.autoRotate =
    true;

  controls.autoRotateSpeed =
    .25;


  scene.add(
    new THREE.AmbientLight(
      0xffffff,
      1.4
    )
  );


  const light =
    new THREE.PointLight(
      0xec4899,
      4,
      60
    );


  light.position.set(
    0,
    5,
    0
  );


  scene.add(light);


  createFloor();


  window.addEventListener(
    "resize",
    resize
  );


  renderer.setAnimationLoop(
    animate
  );

}


/* =====================================================
   FLOOR
===================================================== */

function createFloor(){

  const floor =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        30,
        30
      ),
      new THREE.MeshBasicMaterial({
        color:0x07111f,
        transparent:true,
        opacity:.8
      })
    );


  floor.rotation.x =
    -Math.PI / 2;


  floor.position.y =
    -2;


  scene.add(floor);


  const grid =
    new THREE.GridHelper(
      30,
      30,
      0x334155,
      0x111827
    );


  grid.position.y =
    -1.99;


  scene.add(grid);

}


/* =====================================================
   CAMERA
===================================================== */

async function initCamera(){

  if(cameraInitializing)
    return;


  cameraInitializing = true;


  const status =
    $("cameraStatus");


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera API unavailable. Use HTTPS or localhost."
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          },

          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });


    video =
      $("videoPreview");


    video.srcObject =
      stream;


    await video.play();


    video.style.display =
      "block";


    status.textContent =
      "Camera ready.";


  }catch(error){

    console.error(
      "Camera error:",
      error
    );


    status.textContent =
      cameraErrorMessage(
        error
      );


    addMessage(
      "system",
      cameraErrorMessage(
        error
      )
    );

  }finally{

    cameraInitializing =
      false;

  }

}


/* =====================================================
   CAMERA ERROR
===================================================== */

function cameraErrorMessage(
  error
){

  if(
    !error
  )
    return "Camera unavailable.";


  switch(
    error.name
  ){

    case "NotAllowedError":
      return "Camera permission denied. Allow camera access and reload.";

    case "NotFoundError":
      return "No camera was found.";

    case "NotReadableError":
      return "Camera is busy or unavailable.";

    case "OverconstrainedError":
      return "Camera settings were unsupported.";

    case "SecurityError":
      return "Camera blocked by browser security.";

    default:
      return error.message ||
        "Camera unavailable.";

  }

}


/* =====================================================
   ANIMATION
===================================================== */

function animate(now){

  controls.update();


  fpsFrames++;


  if(
    now - fpsStart >= 1000
  ){

    $("fps").textContent =
      fpsFrames;


    fpsFrames = 0;

    fpsStart = now;

  }


  if(
    scanning &&
    video &&
    video.readyState >= 2 &&
    now - lastScanTime >= SCAN_INTERVAL
  ){

    lastScanTime =
      now;

    scanFrame();

  }


  if(scanning){

    $("scanTime")
      .textContent =
        Math.floor(
          (
            Date.now() -
            scanStart
          ) / 1000
        ) + "s";

  }


  renderer.render(
    scene,
    camera
  );

}


/* =====================================================
   SCAN CONTROL
===================================================== */

function toggleScan(){

  if(!video){

    addMessage(
      "system",
      "Camera is not ready."
    );

    return;

  }


  if(
    video.readyState < 2
  ){

    addMessage(
      "system",
      "Camera is still starting."
    );

    return;

  }


  scanning =
    !scanning;


  const button =
    $("scanBtn");


  if(scanning){

    scanStart =
      Date.now();


    lastScanTime =
      0;


    button.textContent =
      "STOP ROOM SCAN";


    button.className =
      "red";


    addMessage(
      "system",
      "Scanning environment..."
    );


  }else{

    button.textContent =
      "START ROOM SCAN";


    button.className =
      "primary";


    addMessage(
      "system",
      "Scan stopped."
    );

  }

}


/* =====================================================
   MANUAL FRAME
===================================================== */

function captureFrame(){

  if(
    !video ||
    video.readyState < 2
  ){

    addMessage(
      "system",
      "Camera is not ready."
    );

    return;

  }


  scanFrame();


  addMessage(
    "system",
    "Frame captured."
  );

}


/* =====================================================
   SCAN FRAME
===================================================== */

function scanFrame(){

  if(
    pointPositions.length / 3 >=
    MAX_POINTS
  ){

    if(scanning){

      scanning = false;

      $("scanBtn").textContent =
        "START ROOM SCAN";

      $("scanBtn").className =
        "primary";

    }


    addMessage(
      "system",
      "Point limit reached. Save the room to preserve the scan."
    );


    return;

  }


  const width =
    video.videoWidth ||
    640;

  const height =
    video.videoHeight ||
    480;


  const temp =
    document.createElement(
      "canvas"
    );


  const scale =
    Math.min(
      1,
      640 / width
    );


  temp.width =
    Math.max(
      1,
      Math.floor(
        width * scale
      )
    );


  temp.height =
    Math.max(
      1,
      Math.floor(
        height * scale
      )
    );


  const context =
    temp.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  if(!context)
    return;


  context.drawImage(
    video,
    0,
    0,
    temp.width,
    temp.height
  );


  const image =
    context.getImageData(
      0,
      0,
      temp.width,
      temp.height
    );


  const data =
    image.data;


  const step = 8;


  const framePoints = [];


  const remaining =
    MAX_POINTS -
    pointPositions.length / 3;


  let added = 0;


  for(
    let y=1;
    y<temp.height-1;
    y+=step
  ){

    for(
      let x=1;
      x<temp.width-1;
      x+=step
    ){

      if(
        added >= remaining
      )
        break;


      const i =
        (y*temp.width+x)*4;


      const r =
        data[i] / 255;

      const g =
        data[i+1] / 255;

      const b =
        data[i+2] / 255;


      const brightness =
        .299*r +
        .587*g +
        .114*b;


      if(
        brightness < .025
      )
        continue;


      const left =
        (
          y*temp.width +
          x-1
        ) * 4;


      const right =
        (
          y*temp.width +
          x+1
        ) * 4;


      const top =
        (
          (y-1)*temp.width +
          x
        ) * 4;


      const bottom =
        (
          (y+1)*temp.width +
          x
        ) * 4;


      const leftLum =
        .299*(data[left]/255) +
        .587*(data[left+1]/255) +
        .114*(data[left+2]/255);


      const rightLum =
        .299*(data[right]/255) +
        .587*(data[right+1]/255) +
        .114*(data[right+2]/255);


      const topLum =
        .299*(data[top]/255) +
        .587*(data[top+1]/255) +
        .114*(data[top+2]/255);


      const bottomLum =
        .299*(data[bottom]/255) +
        .587*(data[bottom+1]/255) +
        .114*(data[bottom+2]/255);


      const edge =
        Math.min(
          1,
          (
            Math.abs(
              leftLum -
              rightLum
            ) +
            Math.abs(
              topLum -
              bottomLum
            )
          ) * 3
        );


      /*
       * Contrast enhancement.
       */

      const contrast =
        Math.max(
          0,
          Math.min(
            1,
            (
              brightness -
              .5
            ) * 1.8 +
            .5
          )
        );


      /*
       * Skip extremely flat pixels.
       */

      if(
        contrast < .035 &&
        edge < .06
      )
        continue;


      const nx =
        x /
        temp.width -
        .5;


      const ny =
        .5 -
        y /
        temp.height;


      /*
       * Visual depth estimate.
       *
       * This is intentionally described
       * as visual depth rather than measured
       * physical depth.
       */

      const depth =
        .65 +
        contrast*.9 +
        edge*1.5;


      /*
       * Accumulate successive frames.
       */

      const frameOffset =
        Math.min(
          scanFrames.length,
          250
        ) * .012;


      const px =
        nx * 7 +
        frameOffset;


      const py =
        ny * 5;


      const pz =
        depth * 2.1;


      pointPositions.push(
        px,
        py,
        pz
      );


      /*
       * Slightly boost contrast
       * in the rendered point colors.
       */

      pointColors.push(

        Math.min(
          1,
          r*.7 +
          edge*.65
        ),

        Math.min(
          1,
          g*.7 +
          edge*.65
        ),

        Math.min(
          1,
          b*.7 +
          edge*.8
        )

      );


      framePoints.push([
        px,
        py,
        pz
      ]);


      added++;

    }


    if(
      added >= remaining
    )
      break;

  }


  scanFrames.push({

    time:
      Date.now(),

    points:
      framePoints.length

  });


  frameCount++;


  updatePointCloud();

  updateStats();

}


/* =====================================================
   POINT CLOUD
===================================================== */

function updatePointCloud(){

  if(pointCloud){

    scene.remove(
      pointCloud
    );


    pointCloud.geometry.dispose();

    pointCloud.material.dispose();

    pointCloud = null;

  }


  if(
    pointPositions.length === 0
  ){

    return;

  }


  const geometry =
    new THREE.BufferGeometry();


  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      new Float32Array(
        pointPositions
      ),
      3
    )
  );


  geometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(
      new Float32Array(
        pointColors
      ),
      3
    )
  );


  geometry.computeBoundingSphere();


  const material =
    new THREE.PointsMaterial({

      size:
        pointSize * .004,

      vertexColors:
        true,

      transparent:
        true,

      opacity:
        .95,

      sizeAttenuation:
        true

    });


  pointCloud =
    new THREE.Points(
      geometry,
      material
    );


  scene.add(
    pointCloud
  );

}


/* =====================================================
   POINT SIZE
===================================================== */

function updatePointSize(){

  if(pointCloud){

    pointCloud.material.size =
      pointSize * .004;

  }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const points =
    Math.floor(
      pointPositions.length / 3
    );


  $("frameCount")
    .textContent =
      frameCount;


  $("frames")
    .textContent =
      frameCount;


  $("pointCount")
    .textContent =
      points.toLocaleString();


  $("points")
    .textContent =
      points.toLocaleString();

}


/* =====================================================
   MEMORY STORAGE
===================================================== */

function loadMemories(){

  try{

    const saved =
      localStorage.getItem(
        MEMORY_KEY
      );


    if(!saved){

      memories = [];

      return;

    }


    const parsed =
      JSON.parse(saved);


    memories =
      Array.isArray(parsed)
      ? parsed
      : [];


  }catch(error){

    console.error(
      "Memory load error:",
      error
    );


    memories = [];

  }

}


/* =====================================================
   PERSIST MEMORIES
===================================================== */

function persistMemories(){

  try{

    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(memories)
    );


    return true;

  }catch(error){

    console.error(
      "Memory storage error:",
      error
    );


    addMessage(
      "system",
      "Memory could not be saved. Browser storage may be full."
    );


    return false;

  }

}


/* =====================================================
   SAVE MEMORY
===================================================== */

function saveMemory(){

  if(
    pointPositions.length === 0
  ){

    addMessage(
      "system",
      "Scan the room before saving a memory."
    );

    return;

  }


  const memory = {

    id:
      generateId(),

    name:
      $("roomName").value.trim() ||
      "My Room",

    created:
      new Date().toISOString(),

    scan:{

      frames:
        scanFrames.map(
          frame => ({
            time:frame.time,
            points:frame.points
          })
        ),

      frameCount:
        frameCount,

      points:
        pointPositions.length / 3,

      positions:
        Array.from(
          pointPositions
        ),

      colors:
        Array.from(
          pointColors
        )

    },

    objects:
      Array.isArray(roomObjects)
      ? roomObjects
      : []

  };


  memories.push(
    memory
  );


  /*
   * Keep local storage manageable.
   * The newest memories are retained.
   */

  while(
    memories.length > 20
  ){

    memories.shift();

  }


  if(
    persistMemories()
  ){

    renderMemories();

    addMessage(
      "system",
      `"${memory.name}" saved to Memories.`
    );

  }

}


/* =====================================================
   MEMORY ID
===================================================== */

function generateId(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID ===
      "function"
  ){

    return window.crypto.randomUUID();

  }


  return (
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


/* =====================================================
   MEMORY LIST
===================================================== */

function renderMemories(){

  const list =
    $("memoryList");


  list.innerHTML = "";


  if(
    memories.length === 0
  ){

    list.innerHTML =
      `<div class="emptyMemory">
        No saved memories yet.
      </div>`;

    return;

  }


  [...memories]
    .reverse()
    .forEach(
      memory => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "memory";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "memoryName";


        name.textContent =
          memory.name ||
          "Unnamed Room";


        const meta =
          document.createElement(
            "div"
          );


        meta.className =
          "memoryMeta";


        const date =
          new Date(
            memory.created
          );


        const frames =
          memory.scan?.frameCount ||
          0;


        const points =
          Number(
            memory.scan?.points ||
            0
          );


        meta.textContent =
          `${frames} frames · ` +
          `${points.toLocaleString()} points · ` +
          `${isNaN(date.getTime())
            ? "Unknown date"
            : date.toLocaleDateString()}`;


        item.appendChild(
          name
        );


        item.appendChild(
          meta
        );


        item.onclick =
          () => loadMemory(
            memory.id
          );


        list.appendChild(
          item
        );

      }
    );

}


/* =====================================================
   LOAD MEMORY
===================================================== */

function loadMemory(
  id
){

  const memory =
    memories.find(
      item =>
        item.id === id
    );


  if(!memory){

    addMessage(
      "system",
      "Memory could not be found."
    );

    return;

  }


  const scan =
    memory.scan || {};


  $("roomName")
    .value =
      memory.name ||
      "My Room";


  pointPositions =
    Array.isArray(
      scan.positions
    )
    ? [...scan.positions]
    : [];


  pointColors =
    Array.isArray(
      scan.colors
    )
    ? [...scan.colors]
    : [];


  scanFrames =
    Array.isArray(
      scan.frames
    )
    ? [...scan.frames]
    : [];


  frameCount =
    Number(
      scan.frameCount ||
      scanFrames.length ||
      0
    );


  roomObjects =
    Array.isArray(
      memory.objects
    )
    ? [...memory.objects]
    : [];


  updatePointCloud();

  updateStats();

  resetView();


  openTab(
    "roomTab",
    $("roomTabButton")
  );


  addMessage(
    "system",
    `Loaded memory: ${memory.name}`
  );

}


/* =====================================================
   EXPORT
===================================================== */

function exportRoom(){

  const room =
    createRoomData();


  const blob =
    new Blob(
      [
        JSON.stringify(
          room,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    (
      $("roomName").value ||
      "hyperstream-room"
    )
    .replace(
      /[^a-z0-9-_]/gi,
      "_"
    ) +
    ".room.json";


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    100
  );


  addMessage(
    "system",
    "Room exported."
  );

}


/* =====================================================
   ROOM DATA
===================================================== */

function createRoomData(){

  return {

    format:
      "HyperStream Room",

    version:
      "7.0",

    name:
      $("roomName").value ||
      "My Room",

    created:
      new Date().toISOString(),

    scan:{

      frames:
        scanFrames,

      frameCount:
        frameCount,

      points:
        pointPositions.length / 3,

      positions:
        pointPositions,

      colors:
        pointColors

    },

    objects:
      roomObjects

  };

}


/* =====================================================
   IMPORT
===================================================== */

function importRoom(event){

  const file =
    event.target.files?.[0];


  if(!file)
    return;


  const reader =
    new FileReader();


  reader.onload =
    e => {

      try{

        const room =
          JSON.parse(
            e.target.result
          );


        applyRoom(
          room
        );


        /*
         * Imported rooms become a memory
         * only when the user explicitly
         * chooses Save Memory.
         */

        addMessage(
          "system",
          "Room imported. Press SAVE MEMORY to store it."
        );


      }catch(error){

        console.error(
          "Import error:",
          error
        );


        addMessage(
          "system",
          "Invalid HyperStream room file."
        );

      }


      event.target.value =
        "";

    };


  reader.onerror =
    () => {

      addMessage(
        "system",
        "Could not read the room file."
      );

    };


  reader.readAsText(
    file
  );

}


/* =====================================================
   APPLY ROOM
===================================================== */

function applyRoom(
  room
){

  if(
    !room ||
    typeof room !== "object"
  ){

    throw new Error(
      "Invalid room"
    );

  }


  $("roomName")
    .value =
      room.name ||
      "My Room";


  const scan =
    room.scan || {};


  pointPositions =
    Array.isArray(
      scan.positions
    )
    ? [...scan.positions]
    : [];


  pointColors =
    Array.isArray(
      scan.colors
    )
    ? [...scan.colors]
    : [];


  /*
   * Keep imported files from bypassing
   * the mobile safety limit.
   */

  const maxValues =
    MAX_POINTS * 3;


  if(
    pointPositions.length >
    maxValues
  ){

    pointPositions =
      pointPositions.slice(
        0,
        maxValues
      );


    pointColors =
      pointColors.slice(
        0,
        maxValues
      );

  }


  scanFrames =
    Array.isArray(
      scan.frames
    )
    ? [...scan.frames]
    : [];


  frameCount =
    Number(
      scan.frameCount ||
      scanFrames.length ||
      0
    );


  roomObjects =
    Array.isArray(
      room.objects
    )
    ? [...room.objects]
    : [];


  updatePointCloud();

  updateStats();

  resetView();

}


/* =====================================================
   CLEAR CURRENT ROOM
===================================================== */

function clearCurrentRoom(){

  if(
    !confirm(
      "Clear the current room? Saved memories will remain."
    )
  )
    return;


  stopScanning();


  pointPositions = [];

  pointColors = [];

  scanFrames = [];

  roomObjects = [];

  frameCount = 0;


  if(pointCloud){

    scene.remove(
      pointCloud
    );


    pointCloud.geometry.dispose();

    pointCloud.material.dispose();

    pointCloud = null;

  }


  updateStats();


  addMessage(
    "system",
    "Current room cleared. Memories remain safe."
  );

}


/* =====================================================
   STOP SCANNING
===================================================== */

function stopScanning(){

  scanning =
    false;


  const button =
    $("scanBtn");


  if(button){

    button.textContent =
      "START ROOM SCAN";

    button.className =
      "primary";

  }

}


/* =====================================================
   RESET
===================================================== */

function resetView(){

  camera.position.set(
    0,
    2.5,
    7
  );


  controls.target.set(
    0,
    0,
    0
  );


  controls.update();

}


/* =====================================================
   AI
===================================================== */

async function askAI(){

  const input =
    $("chatInput");


  const message =
    input.value.trim();


  if(!message)
    return;


  input.value = "";


  addMessage(
    "user",
    message
  );


  try{

    const response =
      await fetch(
        "http://localhost:11434/api/chat",
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              model:
                $("model").value,

              stream:
                false,

              messages:[

                {
                  role:
                    "system",

                  content:
                    `You are the AI inside a 3D digital room.

Room:
${$("roomName").value}

Scan frames:
${frameCount}

Visual points:
${Math.floor(
  pointPositions.length / 3
)}

The scanner creates a visual spatial
reconstruction from RGB camera frames.
It does not provide measured physical
depth.

Keep answers concise.`
                },

                {
                  role:
                    "user",

                  content:
                    message
                }

              ]

            })

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    addMessage(
      "ai",
      data?.message?.content ||
      "No response received."
    );


  }catch(error){

    console.error(
      "AI error:",
      error
    );


    addMessage(
      "ai",
      "AI is offline. Make sure Ollama is running and reachable from this browser."
    );

  }

}


/* =====================================================
   CHAT
===================================================== */

function addMessage(
  type,
  text
){

  const box =
    $("chat");


  const div =
    document.createElement(
      "div"
    );


  div.className =
    `msg ${type}`;


  div.textContent =
    text;


  box.appendChild(
    div
  );


  box.scrollTop =
    box.scrollHeight;

}


/* =====================================================
   ENTER KEY
===================================================== */

$("chatInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        askAI();

      }

    }
  );


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  if(
    !camera ||
    !renderer
  )
    return;


  const box =
    $("viewer");


  const width =
    Math.max(
      box.clientWidth,
      1
    );


  const height =
    Math.max(
      box.clientHeight,
      1
    );


  camera.aspect =
    width / height;


  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height,
    false
  );

}


/* =====================================================
   PAGE CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  () => {

    stopScanning();


    if(stream){

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if(pointCloud){

      pointCloud.geometry.dispose();

      pointCloud.material.dispose();

    }


    if(renderer){

      renderer.dispose();

    }

  }
);
