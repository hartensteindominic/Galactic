<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro - WebXR AR Hit-Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .top-status {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 14px; color: #f0f0f0; }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.2);
            color: #ff453a;
            border: 1px solid rgba(255, 59, 48, 0.4);
        }
        .badge.active {
            background: rgba(48, 209, 88, 0.2);
            color: #30d158;
            border: 1px solid rgba(48, 209, 88, 0.4);
        }
        .control-dock {
            background: rgba(15, 15, 15, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px;
        }
        .metric-label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .metric-value { font-size: 14px; font-weight: 700; color: #0a84ff; }
        .btn-row { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #ar-button { background: #0a84ff; color: white; }
        #save-btn { background: #30d158; color: white; display: none; }
        button:active { transform: scale(0.97); opacity: 0.8; }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <span class="brand">SPATIAL DASH WEBXR</span>
            <span id="status-badge" class="badge">READY FOR AR</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">AR Anchors</div>
                    <div id="node-count" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Surface</div>
                    <div id="surface-status" class="metric-value">Scanning</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Mode</div>
                    <div class="metric-value">WebXR Hit-Test</div>
                </div>
            </div>
            
            <div class="btn-row">
                <button id="ar-button">START AR SCAN</button>
                <button id="save-btn" onclick="exportEnvironmentMap()">EXPORT MAP (.JSON)</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let container;
        let camera, scene, renderer;
        let controller;

        let spatialNodes = [];
        let vectorPoints = [];
        let worldGroup = new THREE.Group();

        let nodeCountText = document.getElementById('node-count');
        let surfaceStatusText = document.getElementById('surface-status');
        let statusBadge = document.getElementById('status-badge');
        let saveBtn = document.getElementById('save-btn');
        let arButton = document.getElementById('ar-button');

        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        init();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            scene.add(worldGroup);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // Enable native WebXR rendering pipeline

            // Setup Reticle (The surface tracking target ring)
            initReticle();

            // Handle Controller / Screen Tap Events in AR
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelectPointPlaced);
            scene.add(controller);

            // Configure WebXR AR Session startup button trigger
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                        arButton.onclick = () => {
                            let sessionInit = { requiredFeatures: ['hit-test', 'local-floor'] };
                            navigator.xr.requestSession('immersive-ar', sessionInit).then(onSessionStarted);
                        };
                    } else {
                        arButton.innerText = "AR NOT SUPPORTED ON DEVICE";
                        arButton.style.background = "#333";
                    }
                });
            } else {
                arButton.innerText = "WEBXR UNAVAILABLE";
                arButton.style.background = "#333";
            }

            window.addEventListener('resize', onWindowResize);
        }

        function initReticle() {
            let ringGeo = new THREE.RingGeometry(0.15, 0.18, 32).rotateX(-Math.PI / 2);
            let ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
            reticle = new THREE.Mesh(ringGeo, ringMat);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);
        }

        function onSessionStarted(session) {
            session.addEventListener('end', onSessionEnded);
            renderer.xr.setSession(session);
            
            arButton.innerText = "AR ACTIVE";
            arButton.style.background = "#ff453a";
            statusBadge.innerText = "MAPPING SURFACE";
            statusBadge.classList.add("active");
            surfaceStatusText.innerText = "Detecting";
            saveBtn.style.display = "block";
        }

        function onSessionEnded() {
            arButton.innerText = "START AR SCAN";
            arButton.style.background = "#0a84ff";
            statusBadge.innerText = "SESSION ENDED";
            statusBadge.classList.remove("active");
            surfaceStatusText.innerText = "Idle";
            reticle.visible = false;
            hitTestSourceRequested = false;
            hitTestSource = null;
        }

        // Triggered every time you tap your phone screen while pointing at a surface
        function onSelectPointPlaced() {
            if (reticle.visible) {
                let position = new THREE.Vector3();
                let quaternion = new THREE.Quaternion();
                let scale = new THREE.Vector3();
                reticle.matrix.decompose(position, quaternion, scale);

                vectorPoints.push(position);

                let mockNode = {
                    id: spatialNodes.length + 1,
                    x: position.x.toFixed(3),
                    y: position.y.toFixed(3),
                    z: position.z.toFixed(3),
                    timestamp: new Date().toISOString()
                };
                spatialNodes.push(mockNode);
                nodeCountText.innerText = spatialNodes.length;
                surfaceStatusText.innerText = "Surface Locked";

                // Drop physical anchor sphere directly onto the real-world surface point
                const sphereGeo = new THREE.SphereGeometry(0.025, 16, 16);
                const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                sphere.position.copy(position);
                worldGroup.add(sphere);

                // Draw connecting wireframe line across physical anchors
                if (vectorPoints.length > 1) {
                    let prevPos = vectorPoints[vectorPoints.length - 2];
                    const lineGeo = new THREE.BufferGeometry().setFromPoints([prevPos, position]);
                    const lineMat = new THREE.LineBasicMaterial({ color: 0x0a84ff, linewidth: 3 });
                    const connectingLine = new THREE.Line(lineGeo, lineMat);
                    worldGroup.add(connectingLine);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // WebXR Render Loop handling real-world surface hit-testing updates
        renderer.setAnimationLoop(function (timestamp, frame) {
            if (frame) {
                let referenceSpace = renderer.xr.getReferenceSpace();
                let session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then((viewerSpace) => {
                        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    let hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        let hit = hitTestResults[0];
                        let hitPose = hit.getPose(referenceSpace);
                        reticle.visible = true;
                        reticle.matrix.fromArray(hitPose.transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        });

        function exportEnvironmentMap() {
            if (spatialNodes.length === 0) {
                alert("No AR surface anchors placed yet. Tap your screen during AR mode to place nodes.");
                return;
            }

            const environmentPayload = {
                generator: "Spatial Dash WebXR Hit-Test Engine",
                version: "5.0",
                sessionDate: new Date().toISOString(),
                totalMeshNodes: spatialNodes.length,
                coordinatesMatrix: spatialNodes
            };

            const dataBlob = new Blob([JSON.stringify(environmentPayload, null, 2)], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(dataBlob);
            
            const fileLink = document.createElement('a');
            fileLink.href = downloadUrl;
            fileLink.download = `spatial_webxr_map_${Date.now()}.json`;
            document.body.appendChild(fileLink);
            fileLink.click();
            document.body.removeChild(fileLink);
            URL.revokeObjectURL(downloadUrl);
        }
    </script>
</body>
</html>
