<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial 3D Environment Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        #sidebar {
            width: 380px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 16px;
            z-index: 10;
        }
        .brand { font-size: 16px; font-weight: 800; letter-spacing: 1px; color: #60a5fa; }
        
        .action-toggle-row { display: flex; gap: 8px; }
        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

        .input-panel { display: flex; flex-direction: column; gap: 10px; }
        .upload-section {
            border: 2px dashed #374151;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .upload-section:hover { border-color: #60a5fa; }
        input[type="file"] { display: none; }
        .upload-label { font-size: 12px; color: #9ca3af; cursor: pointer; display: block; }

        .paste-section { display: none; flex-direction: column; gap: 8px; }
        textarea {
            width: 100%;
            height: 110px;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: #ffffff;
            font-family: monospace;
            font-size: 11px;
            resize: none;
        }
        textarea:focus { outline: none; border-color: #60a5fa; }

        #chat-container {
            flex: 1;
            background: #1f2937;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 180px;
            font-size: 13px;
        }
        .chat-message {
            padding: 8px 12px;
            border-radius: 8px;
            background: #374151;
            color: #d1d5db;
        }
        .chat-message.system { background: #1e3a8a; color: #93c5fd; }

        .chat-input-row { display: flex; gap: 8px; }
        input[type="text"] {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
        }
        button.primary-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        button.primary-btn:hover { background: #1d4ed8; }

        #viewer-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        .stats-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #9ca3af;
        }
        .stats-overlay span { color: #60a5fa; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <div class="brand">SPATIAL 3D VIEWER</div>
        
        <div class="action-toggle-row">
            <button id="btn-tab-file" class="tab-btn active" onclick="switchInputMode('file')">📂 Upload File</button>
            <button id="btn-tab-paste" class="tab-btn" onclick="switchInputMode('paste')">📋 Paste JSON Code</button>
        </div>

        <!-- File Upload Panel -->
        <div id="panel-file" class="input-panel">
            <div class="upload-section" onclick="document.getElementById('file-input').click()">
                <span class="upload-label">Drop JSON Map or Click to Upload</span>
                <input type="file" id="file-input" accept=".json" onchange="handleFileUpload(event)">
            </div>
        </div>

        <!-- Paste Code Panel -->
        <div id="panel-paste" class="input-panel" style="display: none;">
            <textarea id="json-paste-box" placeholder="Paste your BufferGeometry JSON payload here..."></textarea>
            <button class="primary-btn" onclick="handleCodePaste()">Load Pasted Code</button>
        </div>

        <div style="font-size: 12px; color: #9ca3af;">
            Nodes Loaded: <span id="node-counter" style="color: #60a5fa; font-weight: bold;">0</span>
        </div>

        <div id="chat-container">
            <div class="chat-message system">System ready. Upload or paste your Spatial Dash JSON map data to construct the 3D environment.</div>
        </div>

        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Ask AI about the map..." onkeypress="handleKeyPress(event)">
            <button class="primary-btn" onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <div id="viewer-container">
        <div class="stats-overlay">
            Status: <span id="render-status">Awaiting Dataset</span>
        </div>
        <canvas id="three-canvas"></canvas>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let activeEnvironmentGroup;

        function init3D() {
            const container = document.getElementById('viewer-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 4);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            scene.add(new THREE.GridHelper(20, 20, 0x374151, 0x1f2937));
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));

            activeEnvironmentGroup = new THREE.Group();
            scene.add(activeEnvironmentGroup);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function switchInputMode(mode) {
            const fileBtn = document.getElementById('btn-tab-file');
            const pasteBtn = document.getElementById('btn-tab-paste');
            const filePanel = document.getElementById('panel-file');
            const pastePanel = document.getElementById('panel-paste');

            if (mode === 'file') {
                fileBtn.classList.add('active');
                pasteBtn.classList.remove('active');
                filePanel.style.display = 'flex';
                pastePanel.style.display = 'none';
            } else {
                pasteBtn.classList.add('active');
                fileBtn.classList.remove('active');
                pastePanel.style.display = 'flex';
                filePanel.style.display = 'none';
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    processEnvironmentData(data);
                } catch (err) {
                    appendChat("Error parsing JSON file structure.", "system");
                }
            };
            reader.readAsText(file);
        }

        function handleCodePaste() {
            const rawText = document.getElementById('json-paste-box').value.trim();
            if (!rawText) {
                appendChat("Paste area is empty. Please paste valid JSON text.", "system");
                return;
            }

            try {
                const data = JSON.parse(rawText);
                processEnvironmentData(data);
            } catch (err) {
                appendChat("Invalid JSON format. Please verify your pasted code structure.", "system");
            }
        }

        function processEnvironmentData(data) {
            let positions = [];

            if (data.data && data.data.attributes && data.data.attributes.position && data.data.attributes.position.array) {
                positions = data.data.attributes.position.array;
            } else if (data.coordinatesMatrix) {
                data.coordinatesMatrix.forEach(node => {
                    positions.push(parseFloat(node.x), parseFloat(node.y), parseFloat(node.z));
                });
            }

            if (positions.length === 0) {
                appendChat("No valid coordinate positions located in the JSON structure.", "system");
                return;
            }

            const totalNodes = positions.length / 3;
            document.getElementById('node-counter').innerText = totalNodes;
            document.getElementById('render-status').innerText = "Rendered Active";

            // Clear old geometries
            while(activeEnvironmentGroup.children.length > 0){ 
                activeEnvironmentGroup.remove(activeEnvironmentGroup.children[0]); 
            }

            // Build optimized BufferGeometry for Points & Lines
            const geometry = new THREE.BufferGeometry();
            const floatArray = new Float32Array(positions);
            geometry.setAttribute('position', new THREE.BufferAttribute(floatArray, 3));
            geometry.computeBoundingSphere();

            // Center camera focus on the middle of the scanned point cloud
            const center = geometry.boundingSphere.center;
            controls.target.copy(center);
            camera.position.set(center.x, center.y, center.z + 3.5);
            controls.update();

            // Create glowing point markers
            const pointsMaterial = new THREE.PointsMaterial({
                color: 0x3b82f6,
                size: 0.06,
                transparent: true,
                opacity: 0.9
            });
            const pointCloud = new THREE.Points(geometry, pointsMaterial);
            activeEnvironmentGroup.add(pointCloud);

            // Create wireframe linking paths to show contour flow structure
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0x60a5fa,
                transparent: true,
                opacity: 0.25
            });
            const lineSegments = new THREE.Line(geometry, lineMaterial);
            activeEnvironmentGroup.add(lineSegments);

            const generatorName = data.metadata ? data.metadata.generator : 'Unknown Engine';
            appendChat(`Successfully loaded ${totalNodes} spatial nodes generated by ${generatorName}.`, "system");
        }

        function appendChat(text, sender = "") {
            const chatContainer = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `chat-message ${sender}`;
            msg.innerText = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendChat(text);
            input.value = "";

            setTimeout(() => {
                const count = document.getElementById('node-counter').innerText;
                if (count === "0") {
                    appendChat("Please load your spatial environment file or paste code first.", "system");
                } else {
                    appendChat(`Analysis complete: Displaying ${count} mapped vector nodes securely inside the WebGL viewport.`, "system");
                }
            }, 600);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        window.onload = init3D;
    </script>
</body>
</html>
