<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name=theme-color content=#000><title>HyperStream</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column}#stage{height:58dvh;position:relative;background:#000}canvas{width:100%;height:100%;display:block}.badge{position:absolute;z-index:2;right:12px;top:12px;padding:7px 12px;border-radius:20px;background:#0009;font-size:12px}.panel{height:42dvh;overflow:auto;background:#19191cf5;border-radius:24px 24px 0 0;padding:7px 10px calc(14px + env(safe-area-inset-bottom))}.handle{width:38px;height:4px;background:#666;border-radius:8px;margin:0 auto 8px}.card{background:#303034e8;border-radius:17px;padding:10px;margin-bottom:8px}.title{font-size:10px;font-weight:800;color:#999;text-transform:uppercase;margin-bottom:7px}.actions{display:flex;flex-direction:column;gap:7px}.actions button,.switch button{height:44px;border:0;border-radius:15px;font-weight:750;font-size:14px;color:#fff}.red{background:linear-gradient(135deg,#ff477c,#ff3561)}.green{background:linear-gradient(135deg,#65f39a,#30d158);color:#06120a!important}.blue{background:linear-gradient(135deg,#5ab5ff,#0a84ff)}.pink{background:linear-gradient(135deg,#d06cff,#ff4f91)}button:disabled{opacity:.35}.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.switch button{background:#ffffff12}.switch .active{background:#ff4f864d;outline:1px solid #ff4f8680}.row{display:grid;grid-template-columns:74px 1fr 42px;align-items:center;height:40px;font-size:12px}.v{text-align:right;font-size:10px}input[type=range]{width:100%;appearance:none;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:8px;background:linear-gradient(90deg,#ffffff20,#ff4f867a)}input[type=range]::-webkit-slider-thumb{appearance:none;width:21px;height:21px;margin-top:-7px;border-radius:50%;border:2px solid white;background:#ff76a6}.status{font-size:10px;color:#42a5ff;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}video{display:none}@media(min-width:769px){#stage{height:calc(100dvh - 330px)}.panel{height:330px}.handle{display:none}.actions{display:grid;grid-template-columns:1fr 1fr}}
</style></head><body><div id=app><section id=stage><div class=badge>FPS <b id=fps style=color:#ff4f86>—</b></div><video id=vid autoplay playsinline muted></video><canvas id=c></canvas></section><section class=panel><div class=handle></div><div class="card actions"><button class=red id=scan onclick=scan()>Start Scanning</button><button class=green id=rec onclick=record() disabled>Record</button><button class=blue id=play onclick=replay() disabled>Replay</button><button class=pink id=share onclick=share() disabled>Share</button></div><div class=card><div class=title>Camera</div><div class=switch><button id=front class=active onclick=camera('user')>Face Camera</button><button id=back onclick=camera('environment')>Back Camera</button></div></div><div class=card><div class=title>3D Video</div><div class=row><span>Depth</span><input type=range min=20 max=130 value=55 oninput="D=+this.value;dv.textContent=this.value"><b class=v id=dv>55</b></div><div class=row><span>Detail</span><input type=range min=1 max=8 value=4 oninput="Q=+this.value;qv.textContent=this.value"><b class=v id=qv>4</b></div><div class=row><span>Structure</span><input type=range min=0 max=100 value=60 oninput="S=+this.value/100;sv.textContent=this.value+'%'"><b class=v id=sv>60%</b></div><div class=status id=status>Starting Face Camera…</div></div></section></div><script src=https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js></script><script src=https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js></script><script>const $=x=>document.getElementById(x);let s,v,r,cam,ctl,tex,mesh,pts,g,pa,ca,ctx,wk,stream,ready=0,sc=0,D=55,Q=4,S=.6,fc=0,ft=0,rec=0,mr,ch=[],fs=[],play=0,pi=0,pl=0;const W=192,H=108,N=W*H;init();camera('user');function init(){let b=$('stage');s=new THREE.Scene();cam=new THREE.PerspectiveCamera(45,b.clientWidth/b.clientHeight,.01,100);cam.position.z=5;v=$('vid');r=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});r.setSize(b.clientWidth,b.clientHeight);r.setPixelRatio(Math.min(devicePixelRatio||1,2));ctl=new THREE.OrbitControls(cam,r.domElement);ctl.enableDamping=true;ctl.autoRotate=true;ctl.autoRotateSpeed=.12;g=new THREE.PlaneGeometry(4.6,2.58,W-1,H-1);tex=new THREE.VideoTexture(v);tex.minFilter=THREE.LinearFilter;mesh=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));s.add(mesh);let pg=new THREE.BufferGeometry();pa=new THREE.BufferAttribute(new Float32Array(N*3),3);ca=new THREE.BufferAttribute(new Float32Array(N*3),3);pg.setAttribute('position',pa);pg.setAttribute('color',ca);pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.022,vertexColors:true,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false}));s.add(pts);wk=document.createElement('canvas');wk.width=W;wk.height=H;ctx=wk.getContext('2d',{willReadFrequently:true});addEventListener('resize',()=>{cam.aspect=b.clientWidth/b.clientHeight;cam.updateProjectionMatrix();r.setSize(b.clientWidth,b.clientHeight)});r.setAnimationLoop(loop)}function camera(mode){if(stream)stream.getTracks().forEach(x=>x.stop());ready=0;$('status').textContent=mode==='user'?'Starting Face Camera…':'Starting Back Camera…';navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,max:60}},audio:false}).then(x=>{stream=x;v.srcObject=x;return v.play()}).then(()=>{ready=1;$('front').classList.toggle('active',mode==='user');$('back').classList.toggle('active',mode==='environment');$('status').textContent='Camera ready'}).catch(()=>$('status').textContent='Camera permission needed')}function loop(t){ctl.update();fc++;if(t-ft>1000){$('fps').textContent=Math.round(fc*1000/(t-ft));fc=0;ft=t}if(play)draw(fs[pi]);else if(sc&&ready)sample(t);r.render(s,cam)}function sample(t){tex.needsUpdate=1;ctx.drawImage(v,0,0,W,H);let z=ctx.getImageData(0,0,W,H).data,step=Math.max(1,Math.round(6-Q*.65)),n=0;for(let y=0;y<H;y+=step)for(let x=0;x<W&&n<N;x+=step){let i=(y*W+x)*4,rr=z[i]/255,gg=z[i+1]/255,bb=z[i+2]/255,l=.299*rr+.587*gg+.114*bb,x1=Math.max(0,x-1),x2=Math.min(W-1,x+1),e=Math.abs(z[(y*W+x1)*4]-z[(y*W+x2)*4])/180,center=1-Math.min(1,Math.hypot(x/W-.5,(y/H-.5)*1.1)*1.3),dep=((1-l)*.11+e*.08+center*.025)*D/55*S,j=n*3;pa.array[j]=(x/(W-1)-.5)*4.6;pa.array[j+1]=(.5-y/(H-1))*2.58;pa.array[j+2]=dep;ca.array[j]=rr;ca.array[j+1]=gg;ca.array[j+2]=bb;n++}pts.geometry.setDrawRange(0,n);pa.needsUpdate=ca.needsUpdate=1;pts.material.opacity=.22+.2*S;if(rec&&t-(fs.length?fs[fs.length-1].t:0)>30)fs.push({t:performance.now(),n,pos:pa.array.slice(0,n*3),col:ca.array.slice(0,n*3)})}function scan(){if(!ready)return;sc=!sc;$('scan').textContent=sc?'Stop Scanning':'Start Scanning';$('scan').className=sc?'green':'red';$('rec').disabled=!sc;$('rec').classList.toggle('ready',sc);ctl.autoRotate=!sc;$('status').textContent=sc?'3D video reconstruction active':'Ready'}function record(){if(rec){rec=0;if(mr?.state!=='inactive')mr.stop();$('rec').textContent='Record';return}if(!sc)return;ch=[];fs=[];mr=new MediaRecorder($('c').captureStream(60),MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:12000000}:{mimeType:'video/webm'});mr.ondataavailable=e=>e.data.size&&ch.push(e.data);mr.onstop=()=>{$('play').disabled=!fs.length;$('share').disabled=!ch.length};mr.start(100);rec=1;$('rec').textContent='Stop'}function draw(f){if(!f)return;pa.array.set(f.pos);ca.array.set(f.col);pts.geometry.setDrawRange(0,f.n);pa.needsUpdate=ca.needsUpdate=1;tex.needsUpdate=1}function replay(){if(!fs.length)return;play=!play;if(play){pi=0;pl=performance.now();$('play').textContent='Stop';ctl.autoRotate=0}else{$('play').textContent='Replay';pts.geometry.setDrawRange(0,0)}}function share(){let b=new Blob(ch,{type:'video/webm'}),f=new File([b],'hyperstream-3d.webm',{type:b.type});if(navigator.share&&navigator.canShare?.({files:[f]}))navigator.share({title:'HyperStream 3D',files:[f]}).catch(()=>{});else{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}}</script></body></html>
