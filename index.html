<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>HyperStream</title>
<style>
:root{--bg:#000;--panel:rgba(25,25,28,.96);--card:rgba(48,48,52,.86);--line:rgba(255,255,255,.1);--text:#f7f7fb;--muted:#9a9aa3;--pink:#ff4f86;--purple:#bf6cff;--blue:#42a5ff;--green:#55e98a;--orange:#ffb84d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}body{height:100dvh}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}#stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}
#panel{height:min(48dvh,510px);flex-shrink:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--panel);border-top:1px solid var(--line);border-radius:25px 25px 0 0;padding:8px 12px calc(13px + env(safe-area-inset-bottom));box-shadow:0 -18px 55px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:9px}.handle{width:40px;height:5px;border-radius:9px;background:#68686f;margin:0 auto 2px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}.logo{font-size:19px;font-weight:800;letter-spacing:-.6px}.sub{font-size:11px;color:var(--muted)}.cameraPill{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);border-radius:20px;padding:6px 10px;font-size:11px;color:#ddd}
.card{background:var(--card);border:1px solid rgba(255,255,255,.035);border-radius:19px;padding:12px;display:flex;flex-direction:column;gap:9px;box-shadow:inset 0 1px rgba(255,255,255,.04)}.label{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.65px;text-transform:uppercase}.row{display:grid;grid-template-columns:82px 1fr 52px;align-items:center;gap:8px;min-height:34px;font-size:14px}.value{text-align:right;font-variant-numeric:tabular-nums;color:#fff;font-size:12px}
button{width:100%;min-height:44px;border:0;border-radius:15px;padding:10px 12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,filter .12s}button:active{transform:scale(.98);filter:brightness(.94)}button:disabled{opacity:.3}.red{background:linear-gradient(135deg,#ff477c,#ff3561)}.orange{background:linear-gradient(135deg,#ffc45c,#ff9f0a);color:#111}.green{background:linear-gradient(135deg,#65f39a,#30d158);color:#07140b}.blue{background:linear-gradient(135deg,#5ab5ff,#0a84ff)}.primary{background:linear-gradient(135deg,#d06cff,#ff4f91)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,79,134,.55))}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:linear-gradient(135deg,#fff,#ff76a6);box-shadow:0 2px 12px rgba(255,70,130,.45)}input[type=range]::-moz-range-track{height:6px;border-radius:8px;background:rgba(255,255,255,.15)}input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;border:3px solid #fff;background:#ff5d92;box-shadow:0 2px 12px rgba(255,70,130,.45)}
.badge{position:absolute;z-index:20;top:12px;right:12px;display:flex;gap:10px;align-items:center;padding:7px 12px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(0,0,0,.42);backdrop-filter:blur(22px);font-size:12px}.rec{display:none;color:#ff453a;font-weight:800;align-items:center;gap:5px}.rec.on{display:flex}.dot{width:7px;height:7px;border-radius:50%;background:#ff453a;animation:p 1s infinite}@keyframes p{50%{opacity:.25}}video{display:none}.status{min-height:17px;font-size:12px;color:var(--blue);line-height:17px}.hint{font-size:11px;color:var(--muted);line-height:15px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.switch button{font-size:13px;min-height:38px;background:rgba(255,255,255,.08);color:#ddd}.switch button.active{background:rgba(255,79,134,.22);color:#fff;border:1px solid rgba(255,79,134,.45)}
@media(min-width:769px){#panel{height:330px;border-radius:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;padding:12px 16px 16px}.handle{display:none}.topbar{grid-column:1/-1}.card{min-width:0}}
</style>
</head>
<body>
<div id="app">
<section id="stage"><div class="badge"><span>FPS <b id="fps" style="color:var(--pink)">—</b></span><div class="rec" id="recInd"><i class="dot"></i>REC</div></div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></section>
<section id="panel">
<div class="handle"></div>
<div class="topbar"><div><div class="logo">HyperStream ✦</div><div class="sub">Holographic capture</div></div><div class="cameraPill" id="cameraState">Starting…</div></div>
<div class="card">
<div class="label">Live Holo Scan</div>
<button class="red" id="scanBtn" onclick="toggleScan()">Start Scanning</button>
<div class="switch"><button id="frontBtn" onclick="setCamera('user')">Front</button><button id="backBtn" class="active" onclick="setCamera('environment')">Back</button></div>
<div class="row"><span>Detail</span><input id="detail" type="range" min="1" max="12" value="12" oninput="setDetail(this.value)"><b class="value" id="detailVal">MAX</b></div>
<div class="row"><span>Depth</span><input id="depth" type="range" min="10" max="420" value="145" oninput="depthMul=+this.value;depthVal.textContent=this.value"><b class="value" id="depthVal">145</b></div>
<div class="row"><span>Brightness</span><input id="bright" type="range" min="35" max="240" value="100" oninput="brightness=+this.value/100;brightVal.textContent=this.value+'%'"><b class="value" id="brightVal">100%</b></div>
<div class="row"><span>Contrast</span><input id="contrast" type="range" min="50" max="190" value="100" oninput="contrast=+this.value/100;contrastVal.textContent=this.value+'%'"><b class="value" id="contrastVal">100%</b></div>
<div class="row"><span>Points</span><b id="nLive" style="color:var(--pink);grid-column:2/4;text-align:right">0</b></div>
</div>
<div class="card"><div class="label">Capture</div><div class="row"><span>Status</span><b id="recStatus" style="color:var(--muted);grid-column:2/4;text-align:right">Ready</b></div><div class="row"><span>Time</span><b id="recTime" style="grid-column:2/4;text-align:right">00:00</b></div><div class="row"><span>Frames</span><b id="frameCount" style="color:var(--purple);grid-column:2/4;text-align:right">0</b></div><button class="green" id="recBtn" onclick="toggleRec()">Record</button><button class="blue" id="playBtn" onclick="togglePlay()" disabled>Replay</button><button class="primary" id="dlVid" onclick="dlVideo()" disabled>Save Video</button><button class="primary" id="dlSeq" onclick="dlSeq()" disabled>Save Sequence</button></div>
<div class="card"><div class="label">Create World</div><div class="row"><span>World Points</span><b id="envPts" style="color:var(--green);grid-column:2/4;text-align:right">0</b></div><div class="status" id="status"></div><button class="primary" id="buildSeq" onclick="buildSeq()" disabled>Build World</button><button class="orange" id="buildVid" onclick="buildVid()" disabled>Build from Video</button><button class="green" id="saveBtn" onclick="saveEnv()" disabled>Save World</button><button class="orange" id="shareBtn" onclick="shareEnv()" disabled>Share as Video</button><button class="red" id="clearBtn" onclick="clearEnv()" disabled>Clear</button></div>
<div class="card"><div class="label">Load</div><input type="file" accept=".json" onchange="loadEnv(event)"><input type="file" accept=".json" onchange="loadSeq(event)"><input type="file" accept="video/*,.webm,.mp4" onchange="loadVid(event)"><div class="hint">Move slowly around the subject. More angles + even lighting = a cleaner hologram.</div></div>
</section></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=id=>document.getElementById(id);let scene,cam,ren,ctrl,video,c2d,ctx,ready=false,scanning=false,stream=null,cameraMode='environment';let stepSize=1,depthMul=145,brightness=1,contrast=1,fc=0,ft=0;let recording=false,mr,chunks=[],videoBlob=null,frames=[];let recStart=0,timer,lastCap=0,playing=false,pIdx=0,pLast=0;let pts,posA,colA;const MAX=140000;let env,glow,ePos,eCol,eRec=false,eMr,eChunks=[];
function setDetail(v){const n=+v;stepSize=Math.max(1,13-n);$('detailVal').textContent=n===12?'MAX':n}
function setCamera(mode){if(mode===cameraMode&&ready)return;cameraMode=mode;startCamera()}
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;$('cameraState').textContent='Switching…';$('scanBtn').disabled=true;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cameraMode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}},audio:false});video.srcObject=stream;await video.play();ready=true;$('scanBtn').disabled=false;$('cameraState').textContent=cameraMode==='environment'?'Back camera':'Front camera';$('frontBtn').classList.toggle('active',cameraMode==='user');$('backBtn').classList.toggle('active',cameraMode==='environment');$('status').textContent='Camera ready · tap Start Scanning'}catch(e){ready=false;$('cameraState').textContent='Camera unavailable';$('status').textContent='Camera access is needed to scan';$('scanBtn').disabled=true}}
function init(){const box=$('stage');scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,.008);cam=new THREE.PerspectiveCamera(52,box.clientWidth/box.clientHeight,.05,1000);cam.position.set(0,1.4,5.3);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:true});ren.setSize(box.clientWidth,box.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setClearColor(0);ctrl=new THREE.OrbitControls(cam,ren.domElement);ctrl.enableDamping=true;ctrl.dampingFactor=.075;ctrl.autoRotate=true;ctrl.autoRotateSpeed=.3;ctrl.target.set(0,.35,0);scene.add(new THREE.AmbientLight(0xffffff,.9));const key=new THREE.DirectionalLight(0xb8f7ff,.4);key.position.set(2,5,3);scene.add(key);
const geo=new THREE.BufferGeometry();posA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);colA=new THREE.BufferAttribute(new Float32Array(MAX*3),3);geo.setAttribute('position',posA);geo.setAttribute('color',colA);geo.setDrawRange(0,0);pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:.94,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(pts);
const g=new THREE.Group();const grid=new THREE.GridHelper(9,26,0x2845a0,0x15151a);grid.position.y=-1.3;grid.material.opacity=.22;grid.material.transparent=true;g.add(grid);const floor=new THREE.Mesh(new THREE.PlaneGeometry(9,9),new THREE.MeshBasicMaterial({color:0x08080d,transparent:true,opacity:.38,side:THREE.DoubleSide}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.31;g.add(floor);const frame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(8.2,4.4,8.2)),new THREE.LineBasicMaterial({color:0x55cfff,transparent:true,opacity:.07}));frame.position.y=.9;g.add(frame);scene.add(g);addEventListener('resize',()=>{cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix();ren.setSize(box.clientWidth,box.clientHeight)});ren.setAnimationLoop(loop)}
function initCam(){video=$('vid');c2d=document.createElement('canvas');ctx=c2d.getContext('2d',{willReadFrequently:true});if(!navigator.mediaDevices?.getUserMedia){$('cameraState').textContent='No camera';$('scanBtn').disabled=true;return}startCamera()}
function loop(now){ctrl.update();fc++;if(now-ft>1000){$('fps').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}if(playing)playStep(now);else if(scanning&&ready&&video.readyState>=2)sample(now);ren.render(scene,cam)}
function processChannel(v){let x=(v/255-.5)*contrast+.5;return Math.min(1,Math.max(0,x))*brightness}
function sample(now){const w=video.videoWidth||1280,h=video.videoHeight||720;if(c2d.width!==w||c2d.height!==h){c2d.width=w;c2d.height=h}try{ctx.drawImage(video,0,0,w,h)}catch{return}let pix;try{pix=ctx.getImageData(0,0,w,h).data}catch{return}const step=Math.max(1,stepSize|0);let n=0;for(let y=0;y<h&&n<MAX;y+=step){for(let x=0;x<w&&n<MAX;x+=step){const i=(y*w+x)*4;const r=processChannel(pix[i]),g=processChannel(pix[i+1]),b=processChannel(pix[i+2]);const lum=.299*r+.587*g+.114*b;if(lum<.018)continue;const edge=Math.abs(x/w-.5)*.22;const d=Math.pow(Math.max(0,1-lum),1.38);const idx=n*3;posA.array[idx]=((w-x)/w*2-1)*1.9;posA.array[idx+1]=(-(y/h*2-1))*1.65+.3;posA.array[idx+2]=(d-.35-edge)*(depthMul*.047);colA.array[idx]=r;colA.array[idx+1]=g;colA.array[idx+2]=b;n++}}posA.needsUpdate=true;colA.needsUpdate=true;pts.geometry.setDrawRange(0,n);$('nLive').textContent=n.toLocaleString();if(recording&&now-lastCap>=80){lastCap=now;frames.push({t:now-recStart,n,pos:new Float32Array(posA.array.slice(0,n*3)),col:new Float32Array(colA.array.slice(0,n*3))});$('frameCount').textContent=frames.length}}
function toggleScan(){if(!ready){$('status').textContent='Camera not ready yet';return}scanning=!scanning;const b=$('scanBtn');if(scanning){b.textContent='Stop Scanning';b.className='orange';ctrl.autoRotate=false;$('status').textContent='Scanning · move slowly around the subject'}else{b.textContent='Start Scanning';b.className='red';pts.geometry.setDrawRange(0,0);$('nLive').textContent='0';if(!playing)ctrl.autoRotate=true;$('status').textContent='Scan stopped · build a world or record'}}
function toggleRec(){recording?stopRec():startRec()}
function startRec(){if(!scanning)return alert('Start Scanning first');chunks=[];frames=[];videoBlob=null;lastCap=0;recStart=performance.now();const opt={mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8000000};if(!MediaRecorder.isTypeSupported(opt.mimeType))opt.mimeType='video/webm';mr=new MediaRecorder($('c').captureStream(30),opt);mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{videoBlob=new Blob(chunks,{type:'video/webm'});$('dlVid').disabled=!chunks.length;$('dlSeq').disabled=!frames.length;$('playBtn').disabled=!frames.length;$('buildSeq').disabled=!frames.length;$('buildVid').disabled=!videoBlob};mr.start(120);recording=true;$('recBtn').textContent='Stop';$('recBtn').className='red';$('recStatus').textContent='Recording';$('recStatus').style.color='#ff453a';$('recInd').classList.add('on');$('frameCount').textContent='0';timer=setInterval(()=>{const e=(performance.now()-recStart)/1000;$('recTime').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(Math.floor(e%60)).padStart(2,'0')},250)}
function stopRec(){if(!recording)return;recording=false;if(mr&&mr.state!=='inactive')mr.stop();clearInterval(timer);$('recBtn').textContent='Record';$('recBtn').className='green';$('recStatus').textContent='Saved';$('recStatus').style.color='var(--muted)';$('recInd').classList.remove('on')}
function dlVideo(){if(!chunks.length)return;download(new Blob(chunks,{type:'video/webm'}),`hyperstream_${Date.now()}.webm`)}
function dlSeq(){if(!frames.length)return;download(new Blob([JSON.stringify({v:10,frames:frames.map(f=>({t:Math.round(f.t),n:f.n,pos:Array.from(f.pos),col:Array.from(f.col)}))})],{type:'application/json'}),`sequence_${Date.now()}.json`)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function togglePlay(){playing?stopPlay():startPlay()}
function startPlay(){if(!frames.length)return;if(scanning)toggleScan();playing=true;pIdx=0;pLast=performance.now();$('playBtn').textContent='Stop Replay';$('recStatus').textContent='Replaying';$('recStatus').style.color='var(--purple)';ctrl.autoRotate=true}
function stopPlay(){playing=false;$('playBtn').textContent='Replay';$('recStatus').textContent='Ready';$('recStatus').style.color='var(--muted)';pts.geometry.setDrawRange(0,0);$('nLive').textContent='0';ctrl.autoRotate=!scanning}
function playStep(now){if(now-pLast<1000/12)return;pLast=now;const f=frames[pIdx];posA.array.set(f.pos);colA.array.set(f.col);posA.needsUpdate=true;colA.needsUpdate=true;pts.geometry.setDrawRange(0,f.n);$('nLive').textContent=f.n.toLocaleString();pIdx=(pIdx+1)%frames.length}
function finalize(pos,col){if(pos.length<800){$('status').textContent='Need more data · scan longer';return}if(env){scene.remove(env);env.geometry.dispose();env.material.dispose()}if(glow){scene.remove(glow);glow.geometry.dispose();glow.material.dispose()}const p=new Float32Array(pos),c=new Float32Array(col);for(let i=0;i<c.length;i+=3){const l=.299*c[i]+.587*c[i+1]+.114*c[i+2];const boost=.88+.28*l;c[i]=Math.min(1,c[i]*boost+.03);c[i+1]=Math.min(1,c[i+1]*boost+.07);c[i+2]=Math.min(1,c[i+2]*boost+.18)}ePos=p;eCol=c;const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(ePos,3));geo.setAttribute('color',new THREE.BufferAttribute(eCol,3));env=new THREE.Points(geo,new THREE.PointsMaterial({size:.015,vertexColors:true,transparent:true,opacity:.88,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));env.position.y=.28;scene.add(env);glow=new THREE.Points(geo.clone(),new THREE.PointsMaterial({size:.034,vertexColors:true,transparent:true,opacity:.075,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));glow.position.y=.28;scene.add(glow);$('envPts').textContent=(ePos.length/3).toLocaleString();$('clearBtn').disabled=false;$('saveBtn').disabled=false;$('shareBtn').disabled=false;$('status').textContent='World ready ✨';cam.position.set(0,1.6,5.8);ctrl.target.set(0,.4,0);ctrl.autoRotate=true}
function buildSeq(){if(!frames.length)return;if(playing)stopPlay();$('status').textContent='Building world…';const TARGET=130000,maxF=Math.min(frames.length,70),step=Math.max(1,Math.floor(frames.length/maxF));const pos=[],col=[],spread=Math.max(3.2,Math.min(5.2,depthMul*.024));for(let i=0;i<frames.length;i+=step){const f=frames[i],z=((i/Math.max(1,frames.length-1))-.5)*spread,keep=Math.min(1,(TARGET/Math.max(1,frames.length))/Math.max(1,f.n)*1.45);for(let p=0;p<f.n;p++){if(Math.random()>keep)continue;const j=p*3,k=.006;pos.push(f.pos[j]+(Math.random()-.5)*k,f.pos[j+1]+(Math.random()-.5)*k,f.pos[j+2]+z+(Math.random()-.5)*k);col.push(f.col[j],f.col[j+1],f.col[j+2]);if(pos.length/3>=TARGET)break}if(pos.length/3>=TARGET)break}finalize(pos,col)}
function buildVid(){if(!videoBlob)return alert('No video yet');if(playing)stopPlay();$('status').textContent='Processing video…';$('buildVid').disabled=true;const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(videoBlob);const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true}),collected=[];v.onloadedmetadata=()=>{const dur=Math.max(.1,v.duration),stepT=.09;let t=0;const next=()=>{if(t>dur){URL.revokeObjectURL(v.src);const TARGET=130000,pos=[],col=[],spread=Math.max(3.2,Math.min(5.2,depthMul*.024)),step=Math.max(1,Math.floor(collected.length/60));for(let i=0;i<collected.length;i+=step){const f=collected[i],z=((i/Math.max(1,collected.length-1))-.5)*spread,keep=Math.min(1,(TARGET/Math.max(1,collected.length))/Math.max(1,f.n)*1.45);for(let p=0;p<f.n;p++){if(Math.random()>keep)continue;const j=p*3,k=.006;pos.push(f.pos[j]+(Math.random()-.5)*k,f.pos[j+1]+(Math.random()-.5)*k,f.pos[j+2]+z+(Math.random()-.5)*k);col.push(f.col[j],f.col[j+1],f.col[j+2]);if(pos.length/3>=TARGET)break}if(pos.length/3>=TARGET)break}finalize(pos,col);$('buildVid').disabled=false;return}v.currentTime=t};v.onseeked=()=>{const w=v.videoWidth||1280,h=v.videoHeight||720;c.width=w;c.height=h;x.drawImage(v,0,0,w,h);let pix;try{pix=x.getImageData(0,0,w,h).data}catch{t+=stepT;next();return}const step=Math.max(1,stepSize|0),p=[],cl=[];let n=0;for(let y=0;y<h&&n<26000;y+=step)for(let xx=0;xx<w&&n<26000;xx+=step){const i=(y*w+xx)*4,r=processChannel(pix[i]),g=processChannel(pix[i+1]),b=processChannel(pix[i+2]),lum=.299*r+.587*g+.114*b;if(lum<.018)continue;const d=Math.pow(Math.max(0,1-lum),1.38);p.push(((w-xx)/w*2-1)*1.9,(-(y/h*2-1))*1.65+.3,(d-.35)*(depthMul*.047));cl.push(r,g,b);n++}if(n>40)collected.push({n,pos:new Float32Array(p),col:new Float32Array(cl)});$('status').textContent=`Building… ${Math.min(100,Math.round(t/dur*100))}%`;t+=stepT;next()};next()};v.load()}
function saveEnv(){if(!ePos)return;download(new Blob([JSON.stringify({v:10,n:ePos.length/3,pos:Array.from(ePos),col:Array.from(eCol)})],{type:'application/json'}),`world_${Date.now()}.json`)}
function clearEnv(){if(env){scene.remove(env);env.geometry.dispose();env.material.dispose();env=null}if(glow){scene.remove(glow);glow.geometry.dispose();glow.material.dispose();glow=null}ePos=eCol=null;$('envPts').textContent='0';$('clearBtn').disabled=true;$('saveBtn').disabled=true;$('shareBtn').disabled=true;$('status').textContent='';}
function shareEnv(){if(!env||eRec)return;if(playing)stopPlay();if(scanning)toggleScan();pts.geometry.setDrawRange(0,0);eChunks=[];const opt={mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:9000000};if(!MediaRecorder.isTypeSupported(opt.mimeType))opt.mimeType='video/webm';eMr=new MediaRecorder($('c').captureStream(30),opt);eMr.ondataavailable=e=>e.data.size&&eChunks.push(e.data);eMr.onstop=()=>{eRec=false;$('shareBtn').textContent='Share as Video';$('shareBtn').disabled=false;$('recInd').classList.remove('on');if(eChunks.length)download(new Blob(eChunks,{type:'video/webm'}),`world_${Date.now()}.webm`)};eMr.start(120);eRec=true;$('shareBtn').textContent='Recording…';$('shareBtn').disabled=true;$('recInd').classList.add('on');ctrl.autoRotate=true;ctrl.autoRotateSpeed=.55;setTimeout(()=>eMr&&eMr.state!=='inactive'&&eMr.stop(),12000)}
function loadEnv(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);clearEnv();finalize(d.pos||d.positions,d.col||d.colors)}catch{alert('Invalid world file')}};r.readAsText(f);e.target.value=''}
function loadSeq(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);frames=(d.frames||[]).map(f=>({t:f.t,n:f.n,pos:new Float32Array(f.pos),col:new Float32Array(f.col)}));$('frameCount').textContent=frames.length;$('playBtn').disabled=!frames.length;$('dlSeq').disabled=!frames.length;$('buildSeq').disabled=!frames.length;$('status').textContent=`Loaded ${frames.length} frames`}catch{alert('Invalid sequence file')}};r.readAsText(f);e.target.value=''}
function loadVid(e){const f=e.target.files[0];if(!f)return;videoBlob=f;$('buildVid').disabled=false;$('status').textContent='Video ready';e.target.value=''}
addEventListener('beforeunload',()=>stream&&stream.getTracks().forEach(t=>t.stop()));init();initCam();
</script>
