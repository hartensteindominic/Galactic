<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro - Virtual Environment Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #viewport-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .top-status {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 14px; color: #38bdf8; }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .control-dock {
            background: rgba(15, 23, 42, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 8px;
        }
        .metric-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
        .metric-value { font-size: 14px; font-weight: 700; color: #38bdf8; }
        .btn-row { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #generate-btn { background: #0ea5e9; color: white; }
        #export-btn { background: #10b981; color: white; }
        button:active { transform: scale(0.97); opacity: 0.8; }
    </style>
</head>
<body>

    <canvas id="viewport-canvas"></canvas>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <span class="brand">SPATIAL DASH ENGINE</span>
            <span id="status-badge" class="badge">VIRTUAL READY</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Entities</div>
                    <div id="entity-count" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Environment</div>
                    <div id="env-status" class="metric-value">Stable</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Format</div>
                    <div class="metric-value">JSON Matrix</div>
                </div>
            </div>
            
            <div class="btn-row">
                <button id="generate-btn" onclick="buildVirtualEnvironment()">BUILD ENVIRONMENT</button>
                <button id="export-btn" onclick="exportVirtualMap()">EXPORT JSON MAP</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let worldContainer = new THREE.Group();
        let virtualDataPayload = null;

        let entityCountText = document.getElementById('entity-count');
        let envStatusText = document.getElementById('env-status');
        let statusBadge = document.getElementById('status-badge');

        function initVirtualEngine() {
            const canvas = document.getElementById('viewport-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.08);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 6);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene.add(worldContainer);

            // Lighting setup for the virtual space
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // Generate initial default environment right away
            buildVirtualEnvironment();

            // Render loop with smooth orbital rotation
            function animate() {
                requestAnimationFrame(animate);
                worldContainer.rotation.y += 0.002;
                renderer.render(scene, camera);
            }
            animate();
        }

        function buildVirtualEnvironment() {
            // Clear prior objects
            while(worldContainer.children.length > 0){ 
                worldContainer.remove(worldContainer.children[0]); 
            }

            envStatusText.innerText = "Compiling";
            statusBadge.innerText = "GENERATING NODES";

            let nodeMatrix = [];
            let geometriesList = [
                new THREE.BoxGeometry(0.4, 0.4, 0.4),
                new THREE.SphereGeometry(0.25, 16, 16),
                new THREE.CylinderGeometry(0.2, 0.2, 0.5, 16)
            ];

            let colorPalette = [0x38bdf8, 0x818cf8, 0x34d399, 0xf472b6, 0xfbbf24];

            // Generate structured virtual coordinates optimized for environment building
            let totalNodes = 45;
            for (let i = 1; i <= totalNodes; i++) {
                let px = Number((Math.random() * 5 - 2.5).toFixed(3));
                let py = Number((Math.random() * 2 - 0.5).toFixed(3));
                let pz = Number((Math.random() * 5 - 2.5).toFixed(3));

                nodeMatrix.push({
                    id: i,
                    x: px.toString(),
                    y: py.toString(),
                    z: pz.toString(),
                    timestamp: new Date().toISOString()
                });

                // Pick random shape & color for visual structure
                let randomGeo = geometriesList[Math.floor(Math.random() * geometriesList.length)];
                let randomColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];

                let material = new THREE.MeshStandardMaterial({ 
                    color: randomColor, 
                    roughness: 0.3, 
                    metalness: 0.2 
                });
                
                let meshObject = new THREE.Mesh(randomGeo, material);
                meshObject.position.set(px, py, pz);
                
                // Add subtle random rotation
                meshObject.rotation.x = Math.random() * Math.PI;
                meshObject.rotation.y = Math.random() * Math.PI;

                worldContainer.add(meshObject);
            }

            // Construct exportable virtual JSON payload structure
            virtualDataPayload = {
                generator: "Spatial Dash Virtual Environment Engine",
                version: "8.0",
                sessionDate: new Date().toISOString(),
                totalMeshNodes: nodeMatrix.length,
                coordinatesMatrix: nodeMatrix
            };

            entityCountText.innerText = nodeMatrix.length;
            envStatusText.innerText = "Online";
            statusBadge.innerText = "VIRTUAL READY";
        }

        function exportVirtualMap() {
            if (!virtualDataPayload) {
                alert("No virtual environment generated yet.");
                return;
            }

            const dataBlob = new Blob([JSON.stringify(virtualDataPayload, null, 2)], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(dataBlob);
            
            const fileLink = document.createElement('a');
            fileLink.href = downloadUrl;
            fileLink.download = `spatial_virtual_environment_${Date.now()}.json`;
            document.body.appendChild(fileLink);
            fileLink.click();
            document.body.removeChild(fileLink);
            URL.revokeObjectURL(downloadUrl);
        }

        window.addEventListener('load', initVirtualEngine);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
