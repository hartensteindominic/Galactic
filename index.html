<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro – Multi-Frame 4D Volumetric Streamer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #030303; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        #camera-stream, #processing-canvas, #render-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #processing-canvas, #render-container { display: none; }
        #camera-stream.front-facing { transform: scaleX(-1); }
        #hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .top-status { background: rgba(15,15,15,0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: 800; letter-spacing: 1.2px; font-size: 13px; color: #f0f0f0; }
        .btn-group { display: flex; gap: 8px; }
        .ui-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .ui-btn:hover { background: rgba(255,255,255,0.2); }
        input[type="file"] { display: none; }
        .badge { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 12px; background: rgba(255,59,48,0.2); color: #ff453a; border: 1px solid rgba(255,59,48,0.4); }
        .badge.active { background: rgba(48,209,88,0.2); color: #30d158; border: 1px solid rgba(48,209,88,0.4); }
        .control-dock { background: rgba(15,15,15,0.92); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .metric-card { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 6px; }
        .metric-label { font-size: 9px; color: #888; text-transform: uppercase; }
        .metric-value { font-size: 13px; font-weight: 700; color: #0a84ff; }
        .btn-row { display: flex; gap: 8px; }
        button.action-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 700; font-size: 12px; cursor: pointer; }
        #scan-btn { background: #0a84ff; color: white; }
        #scan-btn.scanning { background: #ff453a; }
        #save-btn { background: #30d158; color: white; display: none; }
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 10; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #151515; border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; padding: 18px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; }
        .modal-content textarea { width: 100%; height: 130px; background: #0a0a0a; color: #0a84ff; border: 1px solid #333; border-radius: 6px; padding: 6px; font-family: monospace; font-size: 9px; resize: none; }
        .modal-btn-row { display: flex; gap: 6px; }
        .modal-btn { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: 700; font-size: 11px; cursor: pointer; background: #0a84ff; color: white; }
        .modal-btn.secondary { background: #333; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>
    <canvas id="processing-canvas"></canvas>
    <div id="render-container"></div>

    <div id="export-modal" class="modal interactive">
        <div class="modal-content">
            <h3 style="font-size: 14px;">Multi-Frame 4D Data Payload Ready</h3>
            <textarea id="modal-json-text" readonly></textarea>
            <div class="modal-btn-row">
                <button class="modal-btn" onclick="copyPayload()">Copy Payload</button>
                <button class="modal-btn secondary" onclick="closeModal('export-modal')">Close</button>
            </div>
        </div>
    </div>

    <div id="paste-modal" class="modal interactive">
        <div class="modal-content">
            <h3 style="font-size: 14px;">Import 4D Dataset JSON</h3>
            <textarea id="paste-json-text" placeholder="Paste JSON data here..."></textarea>
            <div class="modal-btn-row">
                <button class="modal-btn" onclick="processJSONText()">Process & Play</button>
                <button class="modal-btn secondary" onclick="closeModal('paste-modal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <div class="brand">SPATIAL DASH 4D (MULTI-FRAME)</div>
            <div class="btn-group">
                <button class="ui-btn" onclick="switchCamera()">📷 Flip</button>
                <label class="ui-btn">📁 Load<input type="file" accept=".json" onchange="loadFile(event)"></label>
                <button class="ui-btn" onclick="openModal('paste-modal')">📋 Paste</button>
            </div>
            <span id="status-badge" class="badge">READY</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card"><div class="metric-label">Frames Captured</div><div id="frame-count" class="metric-value">0</div></div>
                <div class="metric-card"><div class="metric-label">Nodes / Frame</div><div id="node-count" class="metric-value">0</div></div>
                <div class="metric-card"><div class="metric-label">Buffer MB</div><div id="buffer-size" class="metric-value">0.0 MB</div></div>
            </div>
            <div class="btn-row">
                <button id="scan-btn" class="action-btn" onclick="toggleScan()">RECORD MULTI-FRAME 4D</button>
                <button id="save-btn" class="action-btn" onclick="exportMap()">SAVE MAP (.JSON)</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('processing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const renderContainer = document.getElementById('render-container');
        const scanBtn = document.getElementById('scan-btn');
        const saveBtn = document.getElementById('save-btn');
        const badge = document.getElementById('status-badge');
        
        let isScanning = false, frames = [], stream = null, holistic = null, cameraUtil = null;
        let cachedJSON = "", scene, camera, renderer, pointCloud, playback = [], frameIdx = 0, facing = "environment";
        let totalByteSize = 0;
        let activeHolisticResults = null;

        async function initCam() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 360 } } });
                video.srcObject = stream;
                video.className = facing === "user" ? "front-facing" : "";
            } catch (e) { console.error("Camera error:", e); }
        }

        function switchCamera() {
            facing = facing === "environment" ? "user" : "environment";
            initCam();
        }

        function initHolistic() {
            holistic = new Holistic({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${f}` });
            holistic.setOptions({ modelComplexity: 1, smoothLandmarks: true, refineFaceLandmarks: true, minDetectionConfidence: 0.5 });
            
            // Continuously update reference landmarks independent of frame push timing
            holistic.onResults(res => {
                activeHolisticResults = res;
            });

            cameraUtil = new Camera(video, {
                onFrame: async () => { 
                    if (video) { 
                        await holistic.send({ image: video }); 
                        if (isScanning) {
                            sampleAndPushFrame(); 
                        }
                    } 
                },
                width: 640, height: 360
            });
            cameraUtil.start();
        }

        // Multi-frame pipeline: Guarantees continuous temporal frame collection on every requestAnimationFrame/Camera loop execution
        function sampleAndPushFrame() {
            canvas.width = 160; canvas.height = 90;
            ctx.drawImage(video, 0, 0, 160, 90);
            const img = ctx.getImageData(0, 0, 160, 90).data;
            let v = [], c = [];

            for (let y = 0; y < 90; y += 4) {
                for (let x = 0; x < 160; x += 4) {
                    let i = (y * 160 + x) * 4;
                    let r = img[i], g = img[i+1], b = img[i+2];
                    let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
                    
                    v.push(((x / 160 - 0.5) * 4.0).toFixed(2), (-(y / 90 - 0.5) * 4.0).toFixed(2), ((lum - 0.5) * 3.0).toFixed(2));
                    c.push((r/255).toFixed(2), (g/255).toFixed(2), (b/255).toFixed(2));
                }
            }

            // Append holistic mesh nodes if available
            if (activeHolisticResults) {
                const addPts = (pts, red, green, blue) => {
                    if (!pts) return;
                    pts.landmark.forEach(p => {
                        v.push(((p.x - 0.5) * -4.0).toFixed(2), ((p.y - 0.5) * -4.0).toFixed(2), ((p.z || 0) * 4.0).toFixed(2));
                        c.push(red, green, blue);
                    });
                };
                addPts(activeHolisticResults.faceLandmarks, '0.1', '0.9', '1.0');
                addPts(activeHolisticResults.poseLandmarks, '0.2', '1.0', '0.4');
                addPts(activeHolisticResults.leftHandLandmarks, '1.0', '0.6', '0.1');
                addPts(activeHolisticResults.rightHandLandmarks, '1.0', '0.2', '0.8');
            }
            
            const frameObj = { vertices: v, colors: c };
            frames.push(frameObj);
            
            totalByteSize += (v.length * 4 + c.length * 4);
            document.getElementById('frame-count').innerText = frames.length;
            document.getElementById('node-count').innerText = v.length / 3;
            document.getElementById('buffer-size').innerText = (totalByteSize / (1024 * 1024)).toFixed(1) + " MB";
        }

        function toggleScan() {
            isScanning = !isScanning;
            if (isScanning) {
                frames = [];
                totalByteSize = 0;
                scanBtn.innerText = "STOP RECORDING";
                scanBtn.classList.add("scanning");
                badge.innerText = "RECORDING MULTI-FRAME...";
                badge.classList.add("active");
                saveBtn.style.display = "block";
            } else {
                scanBtn.innerText = "RECORD MULTI-FRAME 4D";
                scanBtn.classList.remove("scanning");
                badge.innerText = "READY";
                badge.classList.remove("active");
            }
        }

        function exportMap() {
            if (!frames.length) return alert("No frames recorded.");
            badge.innerText = "BUILDING MAP PAYLOAD...";
            setTimeout(() => {
                const payload = { version: "4.0", frames: frames.map((f, i) => ({ frameIndex: i, geometryStream: f })) };
                cachedJSON = JSON.stringify(payload);
                document.getElementById('modal-json-text').value = cachedJSON.substring(0, 600) + "\n...[Payload Ready]";
                openModal('export-modal');
                badge.innerText = "READY";
            }, 50);
        }

        function processJSONText() {
            try {
                const data = JSON.parse(document.getElementById('paste-json-text').value);
                playSequence(data.frames ? data.frames.map(f => f.geometryStream) : data.sequence);
                closeModal('paste-modal');
            } catch (e) { alert("Invalid JSON format."); }
        }

        function loadFile(e) {
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = JSON.parse(evt.target.result);
                    playSequence(data.frames ? data.frames.map(f => f.geometryStream) : data.sequence);
                } catch (err) { alert("Invalid Map file."); }
            };
            reader.readAsText(e.target.files[0]);
        }

        function playSequence(seq) {
            if (stream) stream.getTracks().forEach(t => t.stop());
            video.style.display = 'none';
            renderContainer.style.display = 'block';
            badge.innerText = "PLAYING MULTI-FRAME 4D MAP";
            badge.classList.add("active");

            playback = seq || [];
            frameIdx = 0;
            if (!playback.length) return alert("Empty sequence.");

            if (!scene) {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 3.5);
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderContainer.appendChild(renderer.domElement);
                scene.add(new THREE.AmbientLight(0xffffff, 1.2));

                let drag = false, px = 0, py = 0;
                window.addEventListener('mousedown', e => { drag = true; px = e.clientX; py = e.clientY; });
                window.addEventListener('mousemove', e => {
                    if (!drag || !pointCloud) return;
                    pointCloud.rotation.y += (e.clientX - px) * 0.005;
                    pointCloud.rotation.x += (e.clientY - py) * 0.005;
                    px = e.clientX; py = e.clientY;
                });
                window.addEventListener('mouseup', () => drag = false);
            }

            const geom = new THREE.BufferGeometry();
            const mat = new THREE.PointsMaterial({ size: 0.02, vertexColors: true, transparent: true, opacity: 0.95 });
            pointCloud = new THREE.Points(geom, mat);
            scene.add(pointCloud);

            function loop() {
                requestAnimationFrame(loop);
                if (playback.length) {
                    let f = playback[frameIdx];
                    geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(f.vertices), 3));
                    geom.setAttribute('color', new THREE.BufferAttribute(new Float32Array(f.colors), 3));
                    geom.attributes.position.needsUpdate = true;
                    geom.attributes.color.needsUpdate = true;
                    document.getElementById('node-count').innerText = f.vertices.length / 3;
                    document.getElementById('frame-count').innerText = `${frameIdx + 1} / ${playback.length}`;
                    frameIdx = (frameIdx + 1) % playback.length;
                }
                renderer.render(scene, camera);
            }
            loop();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function copyPayload() { navigator.clipboard.writeText(cachedJSON); alert("Copied!"); }

        window.addEventListener('load', () => { initCam(); initHolistic(); });
    </script>
</body>
</html>
