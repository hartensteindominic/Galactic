<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#09081b"><title>HyperStream XD • Bubble 4D</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#080719;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}#viewer{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#514b92,#24224f 35%,#0b0a20 78%)}canvas{position:absolute;inset:0;width:100%;height:100%}#preview{position:absolute;right:12px;bottom:12px;width:92px;height:120px;z-index:8;object-fit:cover;border-radius:24px;border:2px solid #fff5;box-shadow:0 10px 28px #0009;transform:scaleX(-1);background:#111}#top{position:absolute;z-index:9;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}.pill{padding:8px 12px;border-radius:999px;background:#17162ddd;border:1px solid #fff3;backdrop-filter:blur(18px);font-size:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fb7185;margin-right:5px}.live .dot{background:#5ee7b7;box-shadow:0 0 10px #5ee7b7}.pink{color:#ff9bd4;font-weight:800}#msg{position:absolute;z-index:10;left:50%;top:48%;transform:translate(-50%,-50%);padding:15px 18px;border-radius:24px;background:#17162deb;border:1px solid #fff3;backdrop-filter:blur(18px);font-size:12px;text-align:center}.hide{display:none!important}#controls{z-index:20;padding:10px 11px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:#101024f7;border-top:1px solid #fff2;box-shadow:0 -16px 40px #0009}.row{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:20px;padding:13px 8px;color:#fff;font-weight:800;font-size:12px;background:linear-gradient(#303157,#1b1c39);box-shadow:inset 0 1px #fff2,0 7px 18px #0005}.btn:active{transform:scale(.95)}.hero{padding:15px;font-size:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#ff7b9d)}.on{background:linear-gradient(135deg,#ff557f,#f43f5e)}.blue{background:linear-gradient(135deg,#42cfff,#6366f1)}.green{background:linear-gradient(135deg,#4adeb0,#10a779)}.slider{display:flex;align-items:center;gap:9px;color:#c4c5dc;font-size:11px}.slider label{width:55px}.slider input{flex:1;accent-color:#f472b6}.slider output{width:30px;text-align:right;color:#ff9bd4;font-weight:800}.tiny{text-align:center;color:#8588a8;font-size:10px}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script></head><body><div id="viewer"><div id="top"><div id="status" class="pill"><span class="dot"></span><span id="st">Tap Start Camera</span></div><div class="pill">🫧 <span id="fps">—</span> FPS · <span id="pts" class="pink">0</span></div></div><video id="preview" autoplay muted playsinline></video><div id="msg">📷 Tap <b>Start Camera</b></div><canvas id="c"></canvas></div><div id="controls"><button id="start" class="btn hero">📷 Start Camera</button><button id="scan" class="btn">✨ Start 4D Scan</button><div class="row"><button id="flip" class="btn">📷 Flip</button><button id="play" class="btn">▶️ Play</button><button id="center" class="btn">🎯 Center</button></div><div class="slider"><label>Depth</label><input id="depth" type="range" min="30" max="180" value="110"><output id="dv">110</output></div><div class="slider"><label>Contours</label><input id="levels" type="range" min="6" max="24" value="15"><output id="lv">15</output></div><div class="slider"><label>Bubble</label><input id="size" type="range" min="7" max="24" value="13"><output id="sv">13</output></div><div class="row"><button id="photo" class="btn green">📸 Photo</button><button id="share" class="btn blue">💌 Share</button></div><div class="tiny">☝️ drag · 🤏 pinch · 🫧 live camera → bubbly 3D contour</div></div><script>(()=>{const $=x=>document.getElementById(x);let scene,cam,ren,orbit,video,work,ctx,stream=null,ready=false,facing='user',depth=110,levels=15,size=.013,cloud=null,layers=new THREE.Group(),busy=false,last=0,scanning=false,recording=[],frames=[],playing=false,pi=0,lastPlay=0,lastPos=null,lastCol=null,fc=0,ft=0;function stat(t,live=false){$('st').textContent=t;$('status').classList.toggle('live',live)}function init(){let b=$('viewer');scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(40,b.clientWidth/b.clientHeight,.05,500);cam.position.set(0,.3,6);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio||1,1.2));ren.setSize(b.clientWidth,b.clientHeight,false);ren.setClearColor(0x080719);orbit=new THREE.OrbitControls(cam,ren.domElement);orbit.enableDamping=true;orbit.dampingFactor=.08;orbit.rotateSpeed=.6;orbit.zoomSpeed=.8;orbit.enablePan=false;orbit.minDistance=2;orbit.maxDistance=16;scene.add(layers);let a=new THREE.PointLight(0xff72c6,2.2,30);a.position.set(-4,3,5);scene.add(a);let d=new THREE.PointLight(0x5edcff,2.2,30);d.position.set(4,-2,5);scene.add(d);addEventListener('resize',resize);loop()}function resize(){let b=$('viewer');cam.aspect=b.clientWidth/b.clientHeight;cam.updateProjectionMatrix();ren.setSize(b.clientWidth,b.clientHeight,false)}async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){stat('HTTPS camera required');$('msg').innerHTML='🔒 Camera needs the secure GitHub Pages HTTPS address';$('msg').classList.remove('hide');return}if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;stat('Requesting camera');$('msg').textContent='🫧 Allow camera access…';$('msg').classList.remove('hide');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});video=$('preview');video.srcObject=stream;video.muted=true;video.playsInline=true;await video.play();ready=true;stat(facing==='user'?'Front camera live':'Back camera live',true);$('msg').classList.add('hide');if(!work){work=document.createElement('canvas');ctx=work.getContext('2d',{willReadFrequently:true})}sample(true)}catch(e){stat('Camera blocked');$('msg').innerHTML='📷 Camera blocked. Allow camera access for this site, then tap <b>Start Camera</b> again.'}}async function flip(){facing=facing==='user'?'environment':'user';await startCamera()}function clearLayers(){while(layers.children.length){let o=layers.children.pop();o.geometry.dispose();o.material.dispose()}}function draw3D(pos,col){let n=pos.length/3;if(!n)return;if(!cloud){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));cloud=new THREE.Points(g,new THREE.PointsMaterial({size,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.8,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(cloud)}else{let g=cloud.geometry,p=g.getAttribute('position'),c=g.getAttribute('color');if(p.count!==n){g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3))}else{p.array.set(pos);p.needsUpdate=true;c.array.set(col);c.needsUpdate=true}cloud.material.size=size}clearLayers();for(let L=0;L<levels;L++){let z=-4+(L/(levels-1))*8,v=[],c=[];for(let i=0;i<n;i++){let j=i*3;if(Math.abs(pos[j+2]-z)<.22){v.push(pos[j],pos[j+1],z);c.push(col[j],col[j+1],col[j+2])}}if(v.length<12)continue;let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(c),3));layers.add(new THREE.Points(g,new THREE.PointsMaterial({size:size*2.5,vertexColors:true,transparent:true,opacity:.95,depthWrite:false,blending:THREE.AdditiveBlending})))}$('pts').textContent=Math.round(n*(levels+1)).toLocaleString()}function sample(force=false){if(!ready||busy||playing||video.readyState<2)return;if(!force&&performance.now()-last<80)return;busy=true;last=performance.now();let w=video.videoWidth,h=video.videoHeight;if(!w||!h){busy=false;return}if(work.width!==w||work.height!==h){work.width=w;work.height=h}try{ctx.drawImage(video,0,0,w,h);let px=ctx.getImageData(0,0,w,h).data,pos=[],col=[],step=Math.max(4,Math.round(Math.min(w,h)/120)),cx=w/2,cy=h/2,mr=Math.hypot(cx,cy);for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){let i=(y*w+x)*4,r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.025)continue;let nx=(x/cx-1)*1.8,ny=-(y/cy-1)*1.8,rad=((x-cx)**2+(y-cy)**2)/(mr*mr),z=(l-.08)*(depth*.043)-rad*.58;pos.push(nx,ny,z);col.push(Math.min(1,r*1.4+.1),Math.min(1,g*1.25+.08),Math.min(1,b*1.55+.18))}if(pos.length>30){lastPos=pos;lastCol=col;draw3D(pos,col);if(scanning&&recording.length<90)recording.push({p:pos.map(v=>+v.toFixed(3)),c:col.map(v=>+v.toFixed(2))})}}catch(e){stat('3D camera error')}busy=false}function scan(){if(!ready){$('msg').textContent='📷 Tap Start Camera first';$('msg').classList.remove('hide');return}scanning=!scanning;if(scanning){recording=[];frames=[];playing=false;$('scan').textContent='⏹ Stop 4D Scan';$('scan').classList.add('on');stat('Scanning 4D…',true)}else{$('scan').textContent='✨ Start 4D Scan';$('scan').classList.remove('on');frames=recording.slice();if(frames.length){pi=0;playing=true;$('play').textContent='⏸️ Pause';stat(frames.length+' frames ready',true)}}}function togglePlay(){if(!frames.length)return;playing=!playing;$('play').textContent=playing?'⏸️ Pause':'▶️ Play'}function frame(){if(!frames.length)return;let f=frames[pi++%frames.length];lastPos=f.p;lastCol=f.c;draw3D(f.p,f.c)}function center(){cam.position.set(0,.3,6);orbit.target.set(0,0,0);orbit.update()}function photo(){ren.render(scene,cam);let a=document.createElement('a');a.href=ren.domElement.toDataURL('image/png');a.download='hyperstream-bubble-'+Date.now()+'.png';a.click()}async function share(){let data=frames.length?frames:recording;if(!data.length){alert('Scan something first 🫧');return}let f=new File([JSON.stringify({HyperStreamXD:'Bubble 4D',frames:data})],'hyperstream-bubble.json',{type:'application/json'});if(navigator.share&&navigator.canShare?.({files:[f]}))await navigator.share({title:'HyperStream XD',files:[f]});else if(navigator.share)await navigator.share({title:'HyperStream XD',text:'My 4D bubble hologram'})}function loop(now=performance.now()){requestAnimationFrame(loop);fc++;if(now-ft>1000){$('fps').textContent=Math.round(fc*1000/(now-ft||1));fc=0;ft=now}if(ready&&!playing)sample();if(playing&&frames.length&&now-lastPlay>75){lastPlay=now;frame()}orbit.update();ren.render(scene,cam)}$('start').onclick=startCamera;$('flip').onclick=flip;$('scan').onclick=scan;$('play').onclick=togglePlay;$('center').onclick=center;$('photo').onclick=photo;$('share').onclick=share;$('depth').oninput=e=>{depth=+e.target.value;$('dv').textContent=depth};$('levels').oninput=e=>{levels=+e.target.value;$('lv').textContent=levels;if(lastPos)draw3D(lastPos,lastCol)};$('size').oninput=e=>{size=+e.target.value/1000;$('sv').textContent=e.target.value;if(cloud)cloud.material.size=size;if(lastPos)draw3D(lastPos,lastCol)};init()})();</script></body></html>
