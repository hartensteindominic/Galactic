<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HyperStream XD • Ultra-Dense Engine v4.5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020617;color:#f8fafc;font-family:system-ui,sans-serif;height:100vh;display:flex;overflow:hidden}
#sidebar{width:380px;background:#030712;border-right:1px solid #1e293b;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;z-index:10}
.card{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.title{font-size:9px;font-weight:800;text-transform:uppercase;color:#94a3b8}
.row{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#cbd5e1}
button{border:none;border-radius:6px;padding:7px;font-size:10px;font-weight:800;cursor:pointer;color:#fff}
.btn-p{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.btn-d{background:#ef4444;width:100%}.btn-d.on{background:#f97316}
input[type=range]{accent-color:#ec4899;width:100px}
#viewer{flex:1;position:relative}
canvas{display:block;width:100%;height:100%}
.stats{position:absolute;top:10px;right:10px;background:rgba(2,6,23,0.8);padding:6px 10px;border-radius:6px;font-size:10px;color:#94a3b8;z-index:5}
video{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="sidebar">
  <div style="font-size:12px;font-weight:900;color:#38bdf8">HYPERSTREAM XD • v4.5 MAX NODES</div>
  <div class="card">
    <div class="title">Maximum Density Configuration</div>
    <div class="row"><span>Dimensional Strata Layers</span><input type="range" min="4" max="32" value="32" id="layerRange" oninput="layerN=+this.value;$('layV').textContent=this.value"><span id="layV" style="color:#ec4899">32</span></div>
    <div class="row"><span>Depth Dispersion Field</span><input type="range" min="0.5" max="5.0" value="2.4" step="0.1" oninput="layerSp=+this.value"></div>
    <div class="row"><span>Total Active Voxels</span><b id="nLive" style="color:#ec4899">0</b></div>
    <button class="btn-p" onclick="expJSON()">Export Hyper-Matrix JSON</button>
  </div>
</div>
<div id="viewer">
  <div class="stats">FPS <b id="fpsD" style="color:#ec4899">—</b> · Nodes <b id="nodesD" style="color:#38bdf8">0</b></div>
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="c3"></canvas>
</div>
<script>
const $=id=>document.getElementById(id);
let scene,cam,ren,ctrl,video,c2d,ctx,stream=null,ready=false;
let layers=[],layerN=32,layerSp=2.4,fc=0,ft=0,phase=0;

window.addEventListener('DOMContentLoaded',()=>{
  init3();
  initCam();
});

function init3(){
  const box=$('viewer');
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x020617,0.008);
  cam=new THREE.PerspectiveCamera(48,box.clientWidth/box.clientHeight,0.05,2000);
  cam.position.set(0,0.5,3.8);

  ren=new THREE.WebGLRenderer({canvas:$('c3'),antialias:true,powerPreference:'high-performance'});
  ren.setSize(box.clientWidth,box.clientHeight);
  ren.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  ren.setClearColor(0x020617);

  ctrl=new THREE.OrbitControls(cam,ren.domElement);
  ctrl.enableDamping=true;ctrl.autoRotate=true;

  scene.add(new THREE.AmbientLight(0xffffff,1.4));
  window.addEventListener('resize',()=>{
    cam.aspect=box.clientWidth/box.clientHeight;
    cam.updateProjectionMatrix();
    ren.setSize(box.clientWidth,box.clientHeight);
  });
  ren.setAnimationLoop(loop);
}

function initCam(){
  video=$('vid');
  c2d=document.createElement('canvas');
  ctx=c2d.getContext('2d',{willReadFrequently:true});
  navigator.mediaDevices?.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false})
  .then(s=>{stream=s;video.srcObject=s;return video.play();})
  .then(()=>{ready=true;})
  .catch(()=>{/* Fallback handling */});
}

function loop(now){
  ctrl.update();
  phase=now*0.001;
  fc++;
  if(now-ft>1000){$('fpsD').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now;}
  if(ready&&video.readyState>=2)sample();
  ren.render(scene,cam);
}

function sample(){
  const w=video.videoWidth||640,h=video.videoHeight||480;
  if(c2d.width!==w||c2d.height!==h){c2d.width=w;c2d.height=h;}
  try{ctx.drawImage(video,0,0,w,h);}catch{return;}
  let pix;
  try{pix=ctx.getImageData(0,0,w,h).data;}catch{return;}

  const basePos=[],baseCol=[];
  const cx=w*0.5,cy=h*0.5,maxR=Math.hypot(cx,cy)||1;
  const sx=1.6,sy=1.6;
  const step=1; // Strict 1:1 max pixel resolution node sampling

  for(let y=0;y<h;y+=step){
    for(let x=0;x<w;x+=step){
      const i=(y*w+x)*4;
      const r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255;
      const lum=0.299*r+0.587*g+0.114*b;
      if(lum<0.01)continue;

      const nx=((w-x)/w)*2-1,ny=-((y/h)*2-1);
      const nz=(lum-0.5)*1.8;

      basePos.push(nx*sx,ny*sy,nz);
      baseCol.push(r,g,b);
    }
  }

  const n=basePos.length/3;
  $('nLive').textContent=n.toLocaleString();
  $('nodesD').textContent=(n*layerN).toLocaleString();
  buildMultiStrata(basePos,baseCol);
}

function buildMultiStrata(basePos,baseCol){
  while(layers.length>layerN){const o=layers.pop();scene.remove(o);o.geometry.dispose();o.material.dispose();}
  const n=basePos.length/3;
  if(n<5)return;

  const maxL=Math.max(1,layerN-1);
  for(let L=0;L<layerN;L++){
    const t=L/maxL;
    const zOff=(t-0.5)*layerSp;
    const depthTint=1.0-(L/layerN)*0.3;

    const pos=new Float32Array(n*3);
    const col=new Float32Array(n*3);

    for(let i=0,j=0;i<n;i++,j+=3){
      pos[j]=basePos[j];
      pos[j+1]=basePos[j+1];
      pos[j+2]=basePos[j+2]+zOff+Math.sin(phase+basePos[j]*2)*0.04;

      col[j]=Math.min(1,baseCol[j]*depthTint);
      col[j+1]=Math.min(1,baseCol[j+1]*depthTint);
      col[j+2]=Math.min(1,baseCol[j+2]*depthTint);
    }

    let o=layers[L];
    if(!o){
      const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
      const mat=new THREE.PointsMaterial({
        size:0.009,
        vertexColors:true,
        transparent:true,
        opacity:0.85,
        blending:THREE.AdditiveBlending
      });
      o=new THREE.Points(g,mat);
      scene.add(o);
      layers[L]=o;
    }else{
      o.geometry.attributes.position.array.set(pos);
      o.geometry.attributes.color.array.set(col);
      o.geometry.attributes.position.needsUpdate=true;
      o.geometry.attributes.color.needsUpdate=true;
    }
  }
}

function expJSON(){
  const blob=new Blob([JSON.stringify({HyperStreamXD:'max-density',layers:layerN})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='ultra_dense_matrix.json';a.click();
}
</script>
</body>
</html>
