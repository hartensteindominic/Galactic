<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro - Universal Omni Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #camera-stream, #processing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #processing-canvas { display: none; }
        #camera-stream.front-facing { transform: scaleX(-1); }
        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .top-status {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-group { display: flex; align-items: center; gap: 12px; }
        .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 14px; color: #f0f0f0; }
        
        .camera-switch-btn, .file-upload-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .camera-switch-btn:hover, .file-upload-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .file-upload-btn { display: inline-block; text-align: center; }
        #json-file-input { display: none; }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.2);
            color: #ff453a;
            border: 1px solid rgba(255, 59, 48, 0.4);
        }
        .badge.active {
            background: rgba(48, 209, 88, 0.2);
            color: #30d158;
            border: 1px solid rgba(48, 209, 88, 0.4);
        }
        .control-dock {
            background: rgba(15, 15, 15, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px;
        }
        .metric-label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .metric-value { font-size: 14px; font-weight: 700; color: #0a84ff; }
        .btn-row { display: flex; gap: 10px; }
        button.action-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #scan-btn { background: #0a84ff; color: white; }
        #scan-btn.scanning { background: #ff453a; }
        #save-btn { background: #30d158; color: white; display: none; }
        button.action-btn:active { transform: scale(0.97); opacity: 0.8; }
        
        #render-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>
    <canvas id="processing-canvas"></canvas>
    <div id="render-container"></div>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <div class="brand-group">
                <span class="brand">SPATIAL DASH OMNI</span>
                <button class="camera-switch-btn" onclick="switchCamera()">📷 Flip</button>
                <label class="file-upload-btn">
                    📁 Load JSON
                    <input type="file" id="json-file-input" accept=".json" onchange="loadEnvironmentMap(event)">
                </label>
            </div>
            <span id="status-badge" class="badge">SYSTEM READY</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Total Nodes</div>
                    <div id="node-count" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Scan Field</div>
                    <div id="surface-status" class="metric-value">Standby</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Engine</div>
                    <div id="mode-status" class="metric-value">Omni + Surface Mesh</div>
                </div>
            </div>
            
            <div class="btn-row">
                <button id="scan-btn" class="action-btn" onclick="toggleScanState()">START OMNI SCAN</button>
                <button id="save-btn" class="action-btn" onclick="exportEnvironmentMap()">EXPORT MAP (.JSON)</button>
            </div>
        </div>
    </div>

    <script>
        let videoElement = document.getElementById('camera-stream');
        let processingCanvas = document.getElementById('processing-canvas');
        let canvasCtx = processingCanvas.getContext('2d', { willReadFrequently: true });
        let renderContainer = document.getElementById('render-container');
        let scanBtn = document.getElementById('scan-btn');
        let saveBtn = document.getElementById('save-btn');
        let statusBadge = document.getElementById('status-badge');
        let nodeCountText = document.getElementById('node-count');
        let surfaceStatusText = document.getElementById('surface-status');

        let isScanning = false;
        let spatialVertices = []; 
        let spatialColors = [];
        let spatialIntensity = [];
        let currentFacingMode = "environment"; // Defaults to back camera for room scanning
        let activeStream = null;
        let holistic = null;
        let cameraUtilsInstance = null;

        let scene, camera, renderer, pointCloud;

        async function initCameraFeed() {
            if (renderContainer.style.display === "block") return; 
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = { video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } } };
                activeStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = activeStream;

                if (currentFacingMode === "user") {
                    videoElement.classList.add("front-facing");
                } else {
                    videoElement.classList.remove("front-facing");
                }
            } catch (err) {
                console.log("Camera access error:", err);
            }
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            initCameraFeed();
        }

        function setupOmniScanner() {
            holistic = new Holistic({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
            }});
            
            holistic.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: false,
                refineFaceLandmarks: true,
                minDetectionConfidence: 0.3,
                minTrackingConfidence: 0.3
            });

            holistic.onResults(onHolisticResults);

            cameraUtilsInstance = new Camera(videoElement, {
                onFrame: async () => {
                    if (isScanning && videoElement) {
                        // 1. Run AI skeleton/face/hand tracking
                        await holistic.send({image: videoElement});
                        
                        // 2. Run active environment pixel-depth surface point extraction
                        captureEnvironmentPointCloud();
                    }
                },
                width: 1280,
                height: 720
            });
            cameraUtilsInstance.start();
        }

        // Active background grid generator sampling the video frame pixels as a depth grid
        function captureEnvironmentPointCloud() {
            if (!videoElement.videoWidth) return;
            
            processingCanvas.width = 320; // Lower resolution matrix for high performance sampling
            processingCanvas.height = 180;
            canvasCtx.drawImage(videoElement, 0, 0, processingCanvas.width, processingCanvas.height);
            
            const frameData = canvasCtx.getImageData(0, 0, processingCanvas.width, processingCanvas.height).data;
            const step = 6; // Sample density step

            let envVertices = [];
            let envColors = [];
            let envIntensity = [];

            for (let y = 0; y < processingCanvas.height; y += step) {
                for (let x = 0; x < processingCanvas.width; x += step) {
                    let index = (y * processingCanvas.width + x) * 4;
                    let r = frameData[index];
                    let g = frameData[index + 1];
                    let b = frameData[index + 2];

                    // Approximate surface depth using luminance contrast
                    let luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
                    
                    let posX = parseFloat(((x / processingCanvas.width - 0.5) * 4.0).toFixed(3));
                    let posY = parseFloat((-(y / processingCanvas.height - 0.5) * 4.0).toFixed(3));
                    let posZ = parseFloat(((luminance - 0.5) * 1.5).toFixed(3)); // Depth variation mapped from light/shadow

                    envVertices.push(posX, posY, posZ);
                    // Environment surface color mapped dynamically from feed
                    envColors.push(parseFloat((r/255).toFixed(2)), parseFloat((g/255).toFixed(2)), parseFloat((b/255).toFixed(2)));
                    envIntensity.push(parseFloat(luminance.toFixed(2)));
                }
            }

            // Append environment batch data continuously
            spatialVertices.push(...envVertices);
            spatialColors.push(...envColors);
            spatialIntensity.push(...envIntensity);

            nodeCountText.innerText = spatialVertices.length / 3;
            surfaceStatusText.innerText = "Mapping Environment";
        }

        function onHolisticResults(results) {
            if (!isScanning) return;
            
            let humanVertices = [];
            let humanColors = [];
            let humanIntensity = [];

            function addLandmarks(landmarks, rc, gc, bc) {
                if (!landmarks) return;
                for (let pt of landmarks) {
                    let x = parseFloat(((pt.x - 0.5) * -4.0).toFixed(3));
                    let y = parseFloat(((pt.y - 0.5) * -4.0).toFixed(3));
                    let z = parseFloat(((pt.z || 0) * 4.0).toFixed(3));

                    humanVertices.push(x, y, z);
                    humanColors.push(rc, gc, bc);
                    humanIntensity.push(1.0);
                }
            }

            if (results.faceLandmarks) addLandmarks(results.faceLandmarks.landmark, 0.0, 0.8, 1.0); // Cyan Face
            if (results.poseLandmarks) addLandmarks(results.poseLandmarks.landmark, 0.1, 0.9, 0.3); // Green Skeleton
            if (results.leftHandLandmarks) addLandmarks(results.leftHandLandmarks.landmark, 1.0, 0.5, 0.0); // Orange Hands
            if (results.rightHandLandmarks) addLandmarks(results.rightHandLandmarks.landmark, 0.9, 0.1, 0.9); // Purple Hands

            if (humanVertices.length > 0) {
                spatialVertices.push(...humanVertices);
                spatialColors.push(...humanColors);
                spatialIntensity.push(...humanIntensity);
            }
        }

        function toggleScanState() {
            isScanning = !isScanning;

            if (isScanning) {
                scanBtn.innerText = "STOP SCANNING";
                scanBtn.classList.add("scanning");
                statusBadge.innerText = "OMNI-SURFACE ACTIVE";
                statusBadge.classList.add("active");
                saveBtn.style.display = "block";
            } else {
                scanBtn.innerText = "START OMNI SCAN";
                scanBtn.classList.remove("scanning");
                statusBadge.innerText = "SCAN CAPTURED";
                statusBadge.classList.remove("active");
                surfaceStatusText.innerText = "Ready to Export";
            }
        }

        function exportEnvironmentMap() {
            if (spatialVertices.length === 0) {
                alert("No structural nodes recorded. Press start and pan your camera around the room.");
                return;
            }

            const environmentPayload = {
                metadata: {
                    generator: "Spatial Dash Omni Environment Engine",
                    version: "5.2",
                    type: "BufferGeometry",
                    totalVertices: spatialVertices.length / 3,
                    timestamp: new Date().toISOString()
                },
                data: {
                    attributes: {
                        position: { itemSize: 3, type: "Float32Array", array: spatialVertices },
                        color: { itemSize: 3, type: "Float32Array", array: spatialColors },
                        intensity: { itemSize: 1, type: "Float32Array", array: spatialIntensity }
                    }
                }
            };

            const dataBlob = new Blob([JSON.stringify(environmentPayload, null, 2)], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(dataBlob);
            
            const fileLink = document.createElement('a');
            fileLink.href = downloadUrl;
            fileLink.download = `spatial_environment_${Date.now()}.json`;
            document.body.appendChild(fileLink);
            fileLink.click();
            document.body.removeChild(fileLink);
            URL.revokeObjectURL(downloadUrl);
        }

        function loadEnvironmentMap(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsonContent = JSON.parse(e.target.result);
                    render3DModelFromJSON(jsonContent);
                } catch (err) {
                    alert("Invalid JSON map file.");
                }
            };
            reader.readAsText(file);
        }

        function render3DModelFromJSON(payload) {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }
            videoElement.style.display = 'none';
            renderContainer.style.display = 'block';
            
            statusBadge.innerText = "ENVIRONMENT LOADED";
            statusBadge.classList.add("active");

            let rawArray = payload.data.attributes.position.array;
            nodeCountText.innerText = rawArray.length / 3;
            surfaceStatusText.innerText = "Mesh Active";

            if (!scene) {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 4.0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderContainer.appendChild(renderer.domElement);

                scene.add(new THREE.AmbientLight(0xffffff, 1.0));
                
                let isDragging = false;
                let prevMousePos = { x: 0, y: 0 };

                window.addEventListener('mousedown', (e) => { isDragging = true; prevMousePos = { x: e.clientX, y: e.clientY }; });
                window.addEventListener('mousemove', (e) => {
                    if (!isDragging || !pointCloud) return;
                    pointCloud.rotation.y += (e.clientX - prevMousePos.x) * 0.005;
                    pointCloud.rotation.x += (e.clientY - prevMousePos.y) * 0.005;
                    prevMousePos = { x: e.clientX, y: e.clientY };
                });
                window.addEventListener('mouseup', () => { isDragging = false; });
            }

            if (pointCloud) scene.remove(pointCloud);

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(rawArray), 3));

            let materialConfig = { size: 0.03, transparent: true, opacity: 0.85 };
            if (payload.data.attributes.color) {
                geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(payload.data.attributes.color.array), 3));
                materialConfig.vertexColors = true;
            } else {
                materialConfig.color = 0x0a84ff;
            }

            pointCloud = new THREE.Points(geometry, new THREE.PointsMaterial(materialConfig));
            scene.add(pointCloud);

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();
        }

        window.addEventListener('load', () => {
            initCameraFeed();
            setupOmniScanner();
        });
    </script>
</body>
</html>
