<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro – Ultimate 4D Engine</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:#010103;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;height:100vh;width:100vw;}
        #cam,#cvs,#rnd{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
        #cvs,#rnd{display:none;}
        #cam.front{transform:scaleX(-1);}
        #hud{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:16px;pointer-events:none;}
        .interact{pointer-events:auto;}
        .panel{background:rgba(12,12,18,0.85);backdrop-filter:blur(16px);border:1px solid rgba(0,243,255,0.25);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
        .top-bar{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;}
        .brand{font-weight:900;letter-spacing:1px;font-size:12px;background:linear-gradient(45deg,#00f3ff,#b537f2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .btn-group{display:flex;gap:6px;}
        .btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:6px 10px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;transition:0.2s;}
        .btn:hover{background:rgba(0,243,255,0.2);border-color:rgba(0,243,255,0.5);}
        input[type="file"]{display:none;}
        .badge{font-size:9px;font-weight:700;padding:4px 8px;border-radius:10px;background:rgba(255,59,48,0.15);color:#ff453a;border:1px solid rgba(255,59,48,0.3);}
        .badge.active{background:rgba(48,209,88,0.15);color:#30d158;border:1px solid rgba(48,209,88,0.3);box-shadow:0 0 10px rgba(48,209,88,0.3);}
        .dock{padding:14px;display:flex;flex-direction:column;gap:10px;}
        .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;}
        .m-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:8px;padding:6px;}
        .m-lbl{font-size:8px;color:#8a8fa3;text-transform:uppercase;}
        .m-val{font-size:13px;font-weight:800;color:#00f3ff;margin-top:1px;}
        .row{display:flex;gap:6px;}
        .act-btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:800;font-size:11px;cursor:pointer;letter-spacing:0.5px;}
        #scan-btn{background:linear-gradient(135deg,#00f3ff,#0066ff);color:#000;box-shadow:0 4px 15px rgba(0,243,255,0.4);}
        #scan-btn.scanning{background:linear-gradient(135deg,#ff453a,#ff9500);color:#fff;box-shadow:0 4px 15px rgba(255,69,58,0.4);}
        #save-btn{background:linear-gradient(135deg,#30d158,#00a86b);color:#000;display:none;box-shadow:0 4px 15px rgba(48,209,88,0.4);}
        .modal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:10;display:none;justify-content:center;align-items:center;padding:16px;}
        .modal-box{background:#0b0c10;border:1px solid rgba(0,243,255,0.3);border-radius:14px;padding:16px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;}
        .modal-box textarea{width:100%;height:120px;background:#040406;color:#00f3ff;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:6px;font-family:monospace;font-size:9px;resize:none;}
        .scanline{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 50%);background-size:100% 4px;z-index:3;pointer-events:none;opacity:0.25;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
</head>
<body>
    <div class="scanline"></div>
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="cvs"></canvas>
    <div id="rnd"></div>

    <div id="export-modal" class="modal interact">
        <div class="modal-box">
            <h3 style="font-size:13px;color:#00f3ff;">Hyper-Compressed 4D Payload</h3>
            <textarea id="json-out" readonly></textarea>
            <div class="row">
                <button class="btn act-btn" style="background:#00f3ff;color:#000;" onclick="navigator.clipboard.writeText(cachedPayload);alert('Compressed Stream Copied!');">Copy Compressed</button>
                <button class="btn act-btn" style="background:rgba(255,255,255,0.1);color:#fff;" onclick="toggleModal('export-modal',false)">Close</button>
            </div>
        </div>
    </div>

    <div id="paste-modal" class="modal interact">
        <div class="modal-box">
            <h3 style="font-size:13px;color:#00f3ff;">Import 4D Payload</h3>
            <textarea id="json-in" placeholder="Paste raw JSON or LZ-string compressed token payload here..."></textarea>
            <div class="row">
                <button class="btn act-btn" style="background:#00f3ff;color:#000;" onclick="importData()">Play Stream</button>
                <button class="btn act-btn" style="background:rgba(255,255,255,0.1);color:#fff;" onclick="toggleModal('paste-modal',false)">Cancel</button>
            </div>
        </div>
    </div>

    <div id="hud">
        <div class="panel top-bar interact">
            <div class="brand">SPATIAL DASH 4D+</div>
            <div class="btn-group">
                <button class="btn" onclick="facing=facing==='environment'?'user':'environment';initCam();">📷 Flip</button>
                <label class="btn">📁 Load<input type="file" accept=".json,.txt" onchange="loadFile(event)"></label>
                <button class="btn" onclick="toggleModal('paste-modal',true)">📋 Paste</button>
            </div>
            <span id="badge" class="badge">READY</span>
        </div>

        <div class="panel dock interact">
            <div class="metrics">
                <div class="m-card"><div class="m-lbl">Frames</div><div id="f-count" class="m-val">0</div></div>
                <div class="m-card"><div class="m-lbl">Rate</div><div id="fps" class="m-val">0 FPS</div></div>
                <div class="m-card"><div class="m-lbl">Voxels</div><div id="v-count" class="m-val">0</div></div>
            </div>
            <div class="row">
                <button id="scan-btn" class="act-btn" onclick="toggleScan()">START 4D SPEED RECORD</button>
                <button id="save-btn" class="act-btn" onclick="exportData()">EXPORT COMPRESSED (.JSON)</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('cam'), canvas = document.getElementById('cvs'), ctx = canvas.getContext('2d', { willReadFrequently: true });
        const renderBox = document.getElementById('rnd'), scanBtn = document.getElementById('scan-btn'), saveBtn = document.getElementById('save-btn'), badge = document.getElementById('badge');
        let isScanning = false, frames = [], stream = null, cachedPayload = "", scene, camera, renderer, cloud, playback = [], fIdx = 0, facing = "environment";
        let fCount = 0, lastTime = 0, recStart = 0, targetFPS = 60, frameInterval = 1000 / targetFPS, lastFrameTime = 0;

        async function initCam() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } } });
                video.srcObject = stream;
                video.className = facing === "user" ? "front" : "";
            } catch(e) { console.error(e); }
        }

        function loop(now) {
            requestAnimationFrame(loop);
            if (!isScanning || video.readyState < video.HAVE_ENOUGH_DATA) return;

            const delta = now - lastFrameTime;
            if (delta < frameInterval) return;
            lastFrameTime = now - (delta % frameInterval);

            fCount++;
            if (now - lastTime > 1000) { document.getElementById('fps').innerText = fCount + " FPS"; fCount = 0; lastTime = now; }
            
            canvas.width = 120; canvas.height = 68; // Optimized spatial matrix footprint
            ctx.drawImage(video, 0, 0, 120, 68);
            const img = ctx.getImageData(0, 0, 120, 68).data, v = [], c = [];

            for (let y = 0; y < 68; y += 2) {
                for (let x = 0; x < 120; x += 2) {
                    let i = (y * 120 + x) * 4, r = img[i], g = img[i+1], b = img[i+2], lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                    // Store delta positions rounded tightly to optimize token count
                    v.push(Math.round((x / 120 - 0.5) * 400), Math.round((-(y / 68 - 0.5) * 400)), Math.round((lum - 0.5) * 300));
                    // Quantize RGB into compact 4-bit indices or compact packed integer format
                    c.push((r >> 4) << 8 | (g >> 4) << 4 | (b >> 4)); 
                }
            }
            frames.push({ p: v, cols: c });
            document.getElementById('f-count').innerText = frames.length;
            document.getElementById('v-count').innerText = v.length / 3;
        }

        function toggleScan() {
            isScanning = !isScanning;
            if (isScanning) {
                frames = []; recStart = performance.now();
                scanBtn.innerText = "STOP RECORDING"; scanBtn.classList.add("scanning");
                badge.innerText = "CAPTURING 4D..."; badge.classList.add("active"); saveBtn.style.display = "block";
            } else {
                scanBtn.innerText = "START 4D SPEED RECORD"; scanBtn.classList.remove("scanning");
                badge.innerText = "READY"; badge.classList.remove("active");
            }
        }

        function exportData() {
            if (!frames.length) return alert("No frames recorded.");
            badge.innerText = "COMPRESSING STREAM...";
            setTimeout(() => {
                const payload = JSON.stringify({ ver: "4.7", seq: frames });
                // LZ-String compression for text sharing & clipboard optimization
                cachedPayload = LZString.compressToEncodedURIComponent(payload);
                document.getElementById('json-out').value = cachedPayload;
                toggleModal('export-modal', true); badge.innerText = "READY";
            }, 20);
        }

        function importData() {
            try {
                let val = document.getElementById('json-in').value.trim();
                let raw = val.startsWith('{') ? val : LZString.decompressFromEncodedURIComponent(val) || LZString.decompress(val);
                let data = JSON.parse(raw);
                startPlayback(data.seq || data.frames);
                toggleModal('paste-modal', false);
            } catch(e) { alert("Invalid compressed payload or JSON structure."); }
        }

        function loadFile(e) {
            const r = new FileReader();
            r.onload = (evt) => {
                try {
                    let val = evt.target.result.trim();
                    let raw = val.startsWith('{') ? val : LZString.decompressFromEncodedURIComponent(val) || LZString.decompress(val);
                    let data = JSON.parse(raw);
                    startPlayback(data.seq || data.frames);
                } catch(err) { alert("Failed to parse file input."); }
            };
            r.readAsText(e.target.files[0]);
        }

        function startPlayback(seq) {
            if (stream) stream.getTracks().forEach(t => t.stop());
            video.style.display = 'none'; renderBox.style.display = 'block';
            badge.innerText = "PLAYING 4D STREAM"; badge.classList.add("active");
            playback = seq || []; fIdx = 0; if (!playback.length) return alert("Empty sequence data.");

            if (!scene) {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 4);
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderBox.appendChild(renderer.domElement);
                scene.add(new THREE.AmbientLight(0xffffff, 1.5));

                let drag = false, px = 0, py = 0;
                const updateRot = (x, y) => { if(cloud) { cloud.rotation.y += x; cloud.rotation.x += y; } };
                window.addEventListener('mousedown', e => { drag = true; px = e.clientX; py = e.clientY; });
                window.addEventListener('mousemove', e => { if (!drag) return; updateRot((e.clientX - px) * 0.005, (e.clientY - py) * 0.005); px = e.clientX; py = e.clientY; });
                window.addEventListener('mouseup', () => drag = false);
                window.addEventListener('touchstart', e => { if(e.touches.length === 1){ drag = true; px = e.touches[0].clientX; py = e.touches[0].clientY; } });
                window.addEventListener('touchmove', e => { if (!drag || e.touches.length !== 1) return; updateRot((e.touches[0].clientX - px) * 0.005, (e.touches[0].clientY - py) * 0.005); px = e.touches[0].clientX; py = e.touches[0].clientY; });
                window.addEventListener('touchend', () => drag = false);
            }

            const geom = new THREE.BufferGeometry();
            const mat = new THREE.PointsMaterial({ size: 0.025, vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
            cloud = new THREE.Points(geom, mat);
            scene.add(cloud);

            // Pre-process buffers for zero GC allocation overhead during rendering loop
            const parsedPlayback = playback.map(f => {
                const rawP = f.p;
                const rawC = f.cols;
                const pos = new Float32Array(rawP.length);
                const col = new Float32Array(rawC.length * 3);
                
                for(let i = 0, p = 0; i < rawP.length; i += 3, p += 3) {
                    pos[p]   = rawP[i] / 100;
                    pos[p+1] = rawP[i+1] / 100;
                    pos[p+2] = rawP[i+2] / 100;
                }
                for(let i = 0, cIdx = 0; i < rawC.length; i++, cIdx += 3) {
                    let packed = rawC[i];
                    col[cIdx]   = ((packed >> 8) & 0xF) / 15;
                    col[cIdx+1] = ((packed >> 4) & 0xF) / 15;
                    col[cIdx+2] = (packed & 0xF) / 15;
                }
                return { pos, colors: col };
            });

            (function anim() {
                requestAnimationFrame(anim);
                if (parsedPlayback.length) {
                    let f = parsedPlayback[fIdx];
                    geom.setAttribute('position', new THREE.BufferAttribute(f.pos, 3));
                    geom.setAttribute('color', new THREE.BufferAttribute(f.colors, 3));
                    geom.attributes.position.needsUpdate = true;
                    geom.attributes.color.needsUpdate = true;
                    document.getElementById('v-count').innerText = f.pos.length / 3;
                    fIdx = (fIdx + 1) % parsedPlayback.length;
                    cloud.rotation.z = Math.sin(Date.now() * 0.001) * 0.02;
                }
                renderer.render(scene, camera);
            })();
        }

        function toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; }
        window.addEventListener('load', () => { initCam(); requestAnimationFrame(loop); });
    </script>
</body>
</html>
