<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro - Face Scan Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #camera-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #camera-stream.front-facing {
            transform: scaleX(-1);
        }
        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .top-status {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-group { display: flex; align-items: center; gap: 12px; }
        .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 14px; color: #f0f0f0; }
        
        .camera-switch-btn, .file-upload-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .camera-switch-btn:hover, .file-upload-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .file-upload-btn { display: inline-block; text-align: center; }
        #json-file-input { display: none; }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.2);
            color: #ff453a;
            border: 1px solid rgba(255, 59, 48, 0.4);
        }
        .badge.active {
            background: rgba(48, 209, 88, 0.2);
            color: #30d158;
            border: 1px solid rgba(48, 209, 88, 0.4);
        }
        .control-dock {
            background: rgba(15, 15, 15, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px;
        }
        .metric-label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .metric-value { font-size: 14px; font-weight: 700; color: #0a84ff; }
        .btn-row { display: flex; gap: 10px; }
        button.action-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #scan-btn { background: #0a84ff; color: white; }
        #scan-btn.scanning { background: #ff453a; }
        #save-btn { background: #30d158; color: white; display: none; }
        button.action-btn:active { transform: scale(0.97); opacity: 0.8; }
        
        #render-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>
    <div id="render-container"></div>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <div class="brand-group">
                <span class="brand">SPATIAL DASH</span>
                <button class="camera-switch-btn" onclick="switchCamera()">📷 Flip</button>
                <label class="file-upload-btn">
                    📁 Load JSON
                    <input type="file" id="json-file-input" accept=".json" onchange="loadEnvironmentMap(event)">
                </label>
            </div>
            <span id="status-badge" class="badge">SYSTEM READY</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Nodes</div>
                    <div id="node-count" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Surface</div>
                    <div id="surface-status" class="metric-value">Calibrating</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Mode</div>
                    <div id="mode-status" class="metric-value">Face Mesh AI</div>
                </div>
            </div>
            
            <div class="btn-row">
                <button id="scan-btn" class="action-btn" onclick="toggleScanState()">START FACE SCAN</button>
                <button id="save-btn" class="action-btn" onclick="exportEnvironmentMap()">EXPORT MAP (.JSON)</button>
            </div>
        </div>
    </div>

    <script>
        let videoElement = document.getElementById('camera-stream');
        let renderContainer = document.getElementById('render-container');
        let scanBtn = document.getElementById('scan-btn');
        let saveBtn = document.getElementById('save-btn');
        let statusBadge = document.getElementById('status-badge');
        let nodeCountText = document.getElementById('node-count');
        let surfaceStatusText = document.getElementById('surface-status');
        let modeStatusText = document.getElementById('mode-status');

        let isScanning = false;
        let spatialVertices = []; 
        let spatialColors = [];
        let spatialIntensity = [];
        let currentFacingMode = "user"; // Best for face tracking
        let activeStream = null;
        let faceMesh = null;
        let cameraUtilsInstance = null;

        let scene, camera, renderer, pointCloud;

        async function initCameraFeed() {
            if (renderContainer.style.display === "block") return; 
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = { video: { facingMode: currentFacingMode, width: 1280, height: 720 } };
                activeStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = activeStream;

                if (currentFacingMode === "user") {
                    videoElement.classList.add("front-facing");
                } else {
                    videoElement.classList.remove("front-facing");
                }
            } catch (err) {
                console.log("Camera access error:", err);
            }
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            initCameraFeed();
            if (cameraUtilsInstance) {
                // Re-initialize camera utils stream mapping if active
            }
        }

        // Initialize MediaPipe FaceMesh
        function setupFaceMesh() {
            faceMesh = new FaceMesh({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
            }});
            
            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true, // Adds detailed lip and iris landmarks (468+ points)
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults(onFaceResults);

            cameraUtilsInstance = new Camera(videoElement, {
                onFrame: async () => {
                    if (isScanning && videoElement) {
                        await faceMesh.send({image: videoElement});
                    }
                },
                width: 1280,
                height: 720
            });
            cameraUtilsInstance.start();
        }

        function onFaceResults(results) {
            if (!isScanning) return;
            
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                let landmarks = results.multiFaceLandmarks[0];
                
                spatialVertices = [];
                spatialColors = [];
                spatialIntensity = [];

                // Extract all 468+ 3D coordinates mapped directly from your face
                for (let pt of landmarks) {
                    // Center and scale coordinates properly for 3D space
                    let x = parseFloat(((pt.x - 0.5) * -3.0).toFixed(3));
                    let y = parseFloat(((pt.y - 0.5) * -3.0).toFixed(3));
                    let z = parseFloat((pt.z * 3.0).toFixed(3)); // Depth estimation coordinate

                    spatialVertices.push(x, y, z);
                    
                    // Assign glowing cybernetic colors based on depth (Z axis) or position
                    spatialColors.push(
                        parseFloat((Math.abs(x)).toFixed(2)), 
                        0.6, 
                        parseFloat((1.0 - Math.abs(z)).toFixed(2))
                    );
                    
                    spatialIntensity.push(parseFloat((0.8 + (pt.z * 0.2)).toFixed(2)));
                }

                nodeCountText.innerText = spatialVertices.length / 3;
                surfaceStatusText.innerText = "Face Tracked";
            } else {
                surfaceStatusText.innerText = "Searching Face...";
            }
        }

        function toggleScanState() {
            isScanning = !isScanning;

            if (isScanning) {
                scanBtn.innerText = "STOP SCANNING";
                scanBtn.classList.add("scanning");
                statusBadge.innerText = "FACE MAPPING ACTIVE";
                statusBadge.classList.add("active");
                saveBtn.style.display = "block";
                
                spatialVertices = []; 
                spatialColors = [];
                spatialIntensity = [];
            } else {
                scanBtn.innerText = "START FACE SCAN";
                scanBtn.classList.remove("scanning");
                statusBadge.innerText = "SCAN CAPTURED";
                statusBadge.classList.remove("active");
                surfaceStatusText.innerText = "Locked";
            }
        }

        function exportEnvironmentMap() {
            if (spatialVertices.length === 0) {
                alert("No facial nodes recorded. Look at the camera and scan first.");
                return;
            }

            const environmentPayload = {
                metadata: {
                    generator: "Spatial Dash Pro Face Engine",
                    version: "4.2",
                    type: "BufferGeometry",
                    totalVertices: spatialVertices.length / 3,
                    timestamp: new Date().toISOString()
                },
                data: {
                    attributes: {
                        position: { itemSize: 3, type: "Float32Array", array: spatialVertices },
                        color: { itemSize: 3, type: "Float32Array", array: spatialColors },
                        intensity: { itemSize: 1, type: "Float32Array", array: spatialIntensity }
                    }
                }
            };

            const dataBlob = new Blob([JSON.stringify(environmentPayload, null, 2)], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(dataBlob);
            
            const fileLink = document.createElement('a');
            fileLink.href = downloadUrl;
            fileLink.download = `face_contour_${Date.now()}.json`;
            document.body.appendChild(fileLink);
            fileLink.click();
            document.body.removeChild(fileLink);
            URL.revokeObjectURL(downloadUrl);
        }

        function loadEnvironmentMap(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsonContent = JSON.parse(e.target.result);
                    render3DModelFromJSON(jsonContent);
                } catch (err) {
                    alert("Invalid JSON map file.");
                }
            };
            reader.readAsText(file);
        }

        function render3DModelFromJSON(payload) {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }
            videoElement.style.display = 'none';
            renderContainer.style.display = 'block';
            
            modeStatusText.innerText = "3D Face Reconstructed";
            statusBadge.innerText = "MODEL LOADED";
            statusBadge.classList.add("active");

            let rawArray = payload.data.attributes.position.array;
            nodeCountText.innerText = rawArray.length / 3;
            surfaceStatusText.innerText = "Mesh Active";

            if (!scene) {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 3.0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderContainer.appendChild(renderer.domElement);

                scene.add(new THREE.AmbientLight(0xffffff, 0.9));
                
                let isDragging = false;
                let prevMousePos = { x: 0, y: 0 };

                window.addEventListener('mousedown', (e) => { isDragging = true; prevMousePos = { x: e.clientX, y: e.clientY }; });
                window.addEventListener('mousemove', (e) => {
                    if (!isDragging || !pointCloud) return;
                    pointCloud.rotation.y += (e.clientX - prevMousePos.x) * 0.005;
                    pointCloud.rotation.x += (e.clientY - prevMousePos.y) * 0.005;
                    prevMousePos = { x: e.clientX, y: e.clientY };
                });
                window.addEventListener('mouseup', () => { isDragging = false; });
            }

            if (pointCloud) scene.remove(pointCloud);

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(rawArray), 3));

            let materialConfig = { size: 0.04, transparent: true, opacity: 0.9 };
            if (payload.data.attributes.color) {
                geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(payload.data.attributes.color.array), 3));
                materialConfig.vertexColors = true;
            } else {
                materialConfig.color = 0x0a84ff;
            }

            pointCloud = new THREE.Points(geometry, new THREE.PointsMaterial(materialConfig));
            // Rotate model orientation to look directly forward
            pointCloud.rotation.y = Math.PI; 
            scene.add(pointCloud);

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();
        }

        window.addEventListener('load', () => {
            initCameraFeed();
            setupFaceMesh();
        });
    </script>
</body>
</html>
