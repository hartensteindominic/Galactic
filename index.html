<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream XD • 3D Video</title><style>:root{--pink:#ff4f86;--panel:#17171cf5;--card:#292930e8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column}#stage{height:58dvh;position:relative;background:radial-gradient(circle at 50% 45%,#102033 0,#04070b 48%,#000 100%)}canvas{width:100%;height:100%;display:block}.badge{position:absolute;right:12px;top:12px;z-index:5;padding:7px 11px;border-radius:18px;background:#0009;border:1px solid #ff4f8630;backdrop-filter:blur(18px);font-size:10px}.panel{height:42dvh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:7px 10px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -12px 35px #0008}.handle{width:38px;height:4px;background:#68686f;border-radius:9px;margin:0 auto 8px}.card{background:var(--card);border-radius:17px;padding:10px;margin-bottom:8px}.actions{display:flex;flex-direction:column;gap:7px}.actions button,.switch button{border:0;border-radius:15px;height:44px;font-weight:750;color:#fff;font-size:14px}.red{background:linear-gradient(135deg,#ff477c,#ff3561)}.green{background:linear-gradient(135deg,#65f39a,#30d158);color:#06120a!important}.blue{background:linear-gradient(135deg,#5ab5ff,#0a84ff)}.pink{background:linear-gradient(135deg,#d06cff,#ff4f91)}button:disabled{opacity:.35}.green.ready{animation:p 1.35s infinite;box-shadow:0 0 18px #30d15877}@keyframes p{50%{box-shadow:0 0 28px #30d158b8}}.title{font-size:10px;font-weight:800;color:#9a9aa3;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.switch button{background:#ffffff12}.switch button.active{background:#ff4f864d;outline:1px solid #ff4f8680}.row{display:grid;grid-template-columns:74px 1fr 44px;align-items:center;gap:6px;height:40px;font-size:12px}.value{text-align:right;font-size:10px;color:#ff76a6}input[type=range]{appearance:none;width:100%;height:28px;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,#ffffff20,#ff4f867a)}input[type=range]::-webkit-slider-thumb{appearance:none;width:21px;height:21px;margin-top:-7.5px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#fff,#ff76a6);box-shadow:0 2px 10px #ff46806b}.status{font-size:10px;color:#42a5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}video{display:none}@media(min-width:769px){#app{flex-direction:row-reverse}#stage{height:100dvh;flex:1}.panel{width:360px;height:100dvh;border-radius:0;border-right:1px solid #ff4f8630}.handle{display:none}}</style></head><body><div id="app"><section id="stage"><div class="badge">FPS <b id="fps" style="color:#ff4f86">—</b> · <b id="nodes">0</b> points</div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></section><section class="panel"><div class="handle"></div><div class="card actions"><button class="red" id="scan" onclick="toggleScan()">Start Scanning</button><button class="green" id="rec" onclick="toggleRec()" disabled>Record</button><button class="blue" id="play" onclick="togglePlay()" disabled>Replay</button><button class="pink" id="share" onclick="shareVideo()" disabled>Share</button></div><div class="card"><div class="title">Camera</div><div class="switch"><button id="front" class="active" onclick="startCamera('user')">Face Camera</button><button id="back" onclick="startCamera('environment')">Back Camera</button></div></div><div class="card"><div class="title">3D Video</div><div class="row"><span>Density</span><input id="density" type="range" min="1" max="10" value="8"><b class="value" id="densityVal">8</b></div><div class="row"><span>Depth</span><input id="depth" type="range" min="0" max="100" value="42"><b class="value" id="depthVal">42%</b></div><div class="row"><span>Volume</span><input id="volume" type="range" min="40" max="130" value="80"><b class="value" id="volumeVal">80</b></div><div class="status" id="status">Starting Face Camera…</div></div></section></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>const $=id=>document.getElementById(id);let scene,cam,ren,ctl,video,work,ctx,stream,mesh,tex,geom,wire,points,pPos,pCol;let ready=false,scanning=false,recording=false,playing=false,density=8,depth=.42,volume=.8;let W=320,H=180,N=W*H,depthField=null,smoothDepth=null,frames=[],chunks=[],mr,recStart=0,lastFrame=0,pidx=0,lastPlay=0,fc=0,ft=0;init();bind();startCamera('user');function bind(){density.oninput=()=>{densityVal.textContent=density.value;density=+density.value};depth.oninput=()=>{depthVal.textContent=depth.value+'%';depth=+depth.value/100};volume.oninput=()=>{volumeVal.textContent=volume.value;volume=+volume.value/100}}function init(){const s=$('stage');scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(47,s.clientWidth/s.clientHeight,.02,100);cam.position.set(0,.05,5.4);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});ren.setSize(s.clientWidth,s.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setClearColor(0);ctl=new THREE.OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.dampingFactor=.065;ctl.autoRotate=true;ctl.autoRotateSpeed=.08;ctl.target.set(0,0,0);video=$('vid');work=document.createElement('canvas');work.width=W;work.height=H;ctx=work.getContext('2d',{willReadFrequently:true});tex=new THREE.VideoTexture(video);tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;tex.format=THREE.RGBAFormat;geom=new THREE.PlaneGeometry(5.05,2.84,W-1,H-1);const pos=geom.attributes.position.array;for(let i=0;i<pos.length;i+=3){pos[i+2]=0}mesh=new THREE.Mesh(geom,new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,transparent:true,depthWrite:false}));scene.add(mesh);wire=new THREE.Mesh(geom,new THREE.MeshBasicMaterial({color:0xff4f86,wireframe:true,transparent:true,opacity:.018,depthWrite:false}));scene.add(wire);const pg=new THREE.BufferGeometry();pPos=new THREE.BufferAttribute(new Float32Array(N*3),3);pCol=new THREE.BufferAttribute(new Float32Array(N*3),3);pg.setAttribute('position',pPos);pg.setAttribute('color',pCol);points=new THREE.Points(pg,new THREE.PointsMaterial({size:.014,vertexColors:true,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(points);depthField=new Float32Array(N);smoothDepth=new Float32Array(N);addEventListener('resize',()=>{cam.aspect=s.clientWidth/s.clientHeight;cam.updateProjectionMatrix();ren.setSize(s.clientWidth,s.clientHeight)});ren.setAnimationLoop(loop)}async function startCamera(mode){if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;scanning=false;recording=false;$('rec').disabled=true;$('rec').classList.remove('ready');$('status').textContent=mode==='user'?'Starting Face Camera…':'Starting Back Camera…';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,max:60}},audio:false});video.srcObject=stream;await video.play();ready=true;tex.needsUpdate=true;$('front').classList.toggle('active',mode==='user');$('back').classList.toggle('active',mode==='environment');$('status').textContent=mode==='user'?'Face Camera ready':'Back Camera ready'}catch(e){$('status').textContent='Camera permission needed'}}function loop(t){ctl.update();fc++;if(t-ft>1000){$('fps').textContent=Math.round(fc*1000/(t-ft));fc=0;ft=t}if(playing)replay(t);else if(scanning&&ready&&video.readyState>=2)reconstruct(t);if(tex)tex.needsUpdate=true;ren.render(scene,cam)}function reconstruct(t){ctx.drawImage(video,0,0,W,H);let pix;try{pix=ctx.getImageData(0,0,W,H).data}catch{return}const step=Math.max(1,Math.round(12-density));let count=0;const pos=geom.attributes.position.array,pp=pPos.array,cc=pCol.array;for(let y=0;y<H;y+=step){for(let x=0;x<W;x+=step){const q=y*W+x,i=q*4,r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255,lum=.299*r+.587*g+.114*b;if(lum<.008){depthField[q]=0;continue}const l=x?pix[i-4]:pix[i],rr=x<W-1?pix[i+4]:pix[i],u=y?pix[i-W*4]:pix[i],d=y<H-1?pix[i+W*4]:pix[i],edge=Math.min(1,(Math.abs(pix[i]-l)+Math.abs(pix[i]-rr)+Math.abs(pix[i]-u)+Math.abs(pix[i]-d))/360),cx=x/(W-1)-.5,cy=y/(H-1)-.5,subject=Math.max(0,1-Math.hypot(cx,cy*.9)*1.55);let z=((1-lum)*.16+edge*depth*.22+subject*depth*.035-.075)*volume;depthField[q]=z;const a=.2+depth*.12;smoothDepth[q]+=(z-smoothDepth[q])*a;const j=q*3;pos[j]=cx*5.05;pos[j+1]=-cy*2.84;pos[j+2]=smoothDepth[q];pp[j]=pos[j];pp[j+1]=pos[j+1];pp[j+2]=pos[j+2];cc[j]=Math.min(1,r+.01);cc[j+1]=Math.min(1,g+.01);cc[j+2]=Math.min(1,b+.01);count++}}geom.attributes.position.needsUpdate=true;wire.geometry.attributes.position.needsUpdate=true;pPos.needsUpdate=true;pCol.needsUpdate=true;points.geometry.setDrawRange(0,N);points.material.size=.009+density*.0008;points.material.opacity=.10+depth*.18;mesh.material.opacity=1;wire.visible=depth>.65;wire.material.opacity=.012;$('nodes').textContent=count.toLocaleString();if(recording&&t-lastFrame>32){lastFrame=t;frames.push({pos:new Float32Array(pos),col:new Float32Array(cc)});if(frames.length>900)frames.shift()}}function toggleScan(){if(!ready)return;scanning=!scanning;ctl.autoRotate=!scanning;$('scan').textContent=scanning?'Stop Scanning':'Start Scanning';$('scan').className=scanning?'blue':'red';$('rec').disabled=!scanning;$('rec').classList.toggle('ready',scanning);$('status').textContent=scanning?'Live 3D depth reconstruction · move slowly':'Ready · point camera at subject'}function toggleRec(){if(recording){recording=false;if(mr&&mr.state!=='inactive')mr.stop();$('rec').textContent='Record';return}if(!scanning)return;frames=[];chunks=[];recStart=performance.now();lastFrame=0;const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';mr=new MediaRecorder($('c').captureStream(30),{mimeType:type,videoBitsPerSecond:16000000});mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{$('play').disabled=!frames.length;$('share').disabled=!chunks.length};mr.start(100);recording=true;$('rec').textContent='Stop';$('status').textContent='Recording 3D video…'}function togglePlay(){if(!frames.length)return;playing=!playing;if(playing){pidx=0;lastPlay=performance.now();ctl.autoRotate=false;$('play').textContent='Stop';$('status').textContent='Playing 3D reconstruction'}else{$('play').textContent='Replay';ctl.autoRotate=true;$('status').textContent='Ready'}}function replay(t){if(t-lastPlay<33)return;lastPlay=t;const f=frames[pidx++%frames.length];geom.attributes.position.array.set(f.pos);geom.attributes.position.needsUpdate=true;pPos.array.set(f.pos);pCol.array.set(f.col);pPos.needsUpdate=pCol.needsUpdate=true;points.geometry.setDrawRange(0,N)}async function shareVideo(){if(!chunks.length)return;const blob=new Blob(chunks,{type:'video/webm'}),file=new File([blob],'hyperstream-3d-video.webm',{type:blob.type});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:'HyperStream 3D Video',text:'My HyperStream 3D holographic video ✨',files:[file]});$('status').textContent='Shared ✨';return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();$('status').textContent='Video saved'}</script></body></html>
