<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Web</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        /* Tesla-style HUD overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .top-bar, .bottom-panel {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px 20px;
            pointer-events: auto;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar { font-weight: bold; letter-spacing: 1px; }
        .status-dot { color: #00ff66; }
        button {
            background: #222;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background: #444; }
        /* Camera background feed */
        #cam-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>

    <video id="cam-feed" autoplay playsinline muted></video>

    <div id="hud">
        <div class="top-bar">
            <span>SPATIAL DASH</span>
            <span class="status-dot">● LIVE FEED</span>
        </div>
        
        <div class="bottom-panel">
            <div>
                <div style="font-size: 16px; font-weight: bold;">Environment Map</div>
                <div style="font-size: 12px; color: #aaa;" id="sub-text">Camera stream active</div>
            </div>
            <button id="scan-btn" onclick="toggleScan()">START SCAN</button>
        </div>
    </div>

    <script>
        // Access iPhone Rear Camera via Web APIs
        async function initCamera() {
            try {
                const constraints = {
                    video: { facingMode: { exact: "environment" } } // Attempts to use rear camera
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('cam-feed').srcObject = stream;
            } catch (err) {
                // Fallback to any available camera if exact rear fails
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    document.getElementById('cam-feed').srcObject = fallbackStream;
                } catch (e) {
                    alert("Camera access denied or unavailable.");
                }
            }
        }

        let scanning = false;
        function toggleScan() {
            scanning = !scanning;
            const btn = document.getElementById('scan-btn');
            const sub = document.getElementById('sub-text');
            if (scanning) {
                btn.innerText = "STOP SCAN";
                sub.innerText = "Analyzing spatial boundaries...";
            } else {
                btn.innerText = "START SCAN";
                sub.innerText = "Camera stream active";
            }
        }

        // Start camera on page load
        window.onload = initCamera;
    </script>
</body>
</html>
