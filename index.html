tElementById(id);let scene,cam,ren,composer,bloom,orbit,video,work,ctx,stream=null,ready=false,facing='user',layers=new THREE.Group(),cloud=null,contours=14,depth=80,nodeSize=.013,spread=1.6,mode='points',scanning=false,frames=[],playing=false,frameIndex=0,lastFrame=0,busy=false,lastSample=0,fc=0,ft=0,lastPos=null,lastCol=null;function status(t,live=false){$('st').textContent=t;$('status').classList.toggle('live',live)}function init(){const b=$('viewer');scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x080719,.012);cam=new THREE.PerspectiveCamera(46,b.clientWidth/b.clientHeight,.05,300);cam.position.set(0,.2,4.8);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio||1,1.7));ren.setSize(b.clientWidth,b.clientHeight,false);ren.setClearColor(0x080719);composer=new THREE.EffectComposer(ren);composer.addPass(new THREE.RenderPass(scene,cam));bloom=new THREE.UnrealBloomPass(new THREE.Vector2(b.clientWidth,b.clientHeight),1.35,.45,.78);composer.addPass(bloom);orbit=new THREE.OrbitControls(cam,ren.domElement);orbit.enableDamping=true;orbit.dampingFactor=.075;orbit.rotateSpeed=.55;orbit.zoomSpeed=.8;orbit.enablePan=false;orbit.minDistance=1.8;orbit.maxDistance=14;orbit.autoRotate=false;scene.add(layers);const a=new THREE.PointLight(0xff7bc8,2.3,25);a.position.set(-3,3,5);scene.add(a);const b2=new THREE.PointLight(0x63ddff,1.8,25);b2.position.set(4,-1,4);scene.add(b2);const c=new THREE.PointLight(0xa78bfa,1.2,24);c.position.set(0,4,-5);scene.add(c);addEventListener('resize',resize);loop()}function resize(){const b=$('viewer');cam.aspect=b.clientWidth/b.clientHeight;cam.updateProjectionMatrix();ren.setSize(b.clientWidth,b.clientHeight,false);composer.setSize(b.clientWidth,b.clientHeight)}async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){status('HTTPS camera required');$('msg').innerHTML='🔒 Open the GitHub Pages HTTPS site';$('msg').classList.remove('hide');return}if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;status('Requesting camera');$('msg').innerHTML='🫧 Allow camera access…';$('msg').classList.remove('hide');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false});video=$('preview');video.srcObject=stream;video.muted=true;video.playsInline=true;await video.play();ready=true;status(facing==='user'?'Front camera live':'Back camera live',true);$('msg').classList.add('hide');work=work||document.createElement('canvas');ctx=ctx||work.getContext('2d',{willReadFrequently:true});sample(true)}catch(e){status('Camera blocked');$('msg').innerHTML='📷 Camera blocked. Allow access and tap Start Camera again.'}}async function flip(){facing=facing==='user'?'environment':'user';await startCamera()}function clearLayers(){while(layers.children.length){const o=layers.children.pop();o.geometry?.dispose();o.material?.dispose()}}function makePointCloud(pos,col){const n=pos.length/3;if(!n)return;if(!cloud){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));cloud=new THREE.Points(g,new THREE.PointsMaterial({size:nodeSize,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.72,depthWrite:true,depthTest:true,blending:THREE.NormalBlending}));scene.add(cloud)}else{const p=cloud.geometry.attributes.position,c=cloud.geometry.attributes.color;if(p.count!==n){cloud.geometry.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));cloud.geometry.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3))}else{p.array.set(pos);c.array.set(col);p.needsUpdate=c.needsUpdate=true}cloud.material.size=nodeSize}clearLayers();if(mode==='solid'){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));const m=new THREE.MeshBasicMaterial({vertexColors:true,wireframe:true,transparent:true,opacity:.72});layers.add(new THREE.Mesh(g,m))}for(let L=0;L<contours;L++){const t=L/Math.max(1,contours-1),z0=-spread*.5+t*spread,v=[],c=[];for(let i=0;i<n;i++){const j=i*3,z=pos[j+2];if(Math.abs(z-z0)<Math.max(.045,spread/(contours*2.4))){v.push(pos[j],pos[j+1],z);c.push(Math.min(1,col[j]*1.08),Math.min(1,col[j+1]*1.05),Math.min(1,col[j+2]*1.2))}}if(v.length<8)continue;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(c),3));layers.add(new THREE.Points(g,new THREE.PointsMaterial({size:nodeSize*2.0,vertexColors:true,transparent:true,opacity:.82,depthWrite:false,depthTest:true,blending:THREE.AdditiveBlending})))}$('pts').textContent=Math.round(n*(contours+1)).toLocaleString()}function sample(force=false){if(!ready||busy||playing||!video||video.readyState<2)return;if(!force&&performance.now()-lastSample<55)return;busy=true;lastSample=performance.now();const w=video.videoWidth||640,h=video.videoHeight||480;if(!w||!h){busy=false;return}if(work.width!==w||work.height!==h){work.width=w;work.height=h}try{ctx.drawImage(video,0,0,w,h);const px=ctx.getImageData(0,0,w,h).data,pos=[],col=[],step=Math.max(2,Math.round(Math.min(w,h)/135)),cx=w/2,cy=h/2,aspect=w/h;for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){const i=(y*w+x)*4,r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.018)continue;const nx=x/cx-1,ny=-(y/cy-1),rad=nx*nx+ny*ny,t=Math.pow(Math.max(0,Math.min(1,(l-.018)/.982)),.82),edge=Math.min(1,Math.abs(l-.5)*1.8),wave=mode==='wave'?Math.sin(nx*7+performance.now()*.003)*.12:0,vortex=mode==='vortex'?Math.sin(Math.atan2(ny,nx)*5+performance.now()*.002)*.18:0,z=(t-.5)*(depth*.045)+(edge-.5)*.32-rad*.18+wave+vortex;pos.push(nx*1.55*Math.min(aspect,1.5),ny*1.55,z);col.push(Math.min(1,r*1.25+.08+t*.08),Math.min(1,g*1.12+.05+t*.05),Math.min(1,b*1.45+.14+t*.1))}if(pos.length>30){lastPos=pos;lastCol=col;makePointCloud(pos,col);if(scanning&&frames.length<180)frames.push({p:pos.map(v=>+v.toFixed(3)),c:col.map(v=>+v.toFixed(2))})}}catch(e){status('3D video sample error')}busy=false}function scan(){if(!ready){$('msg').innerHTML='📷 Tap <b>Start Camera</b> first';$('msg').classList.remove('hide');return}scanning=!scanning;if(scanning){frames=[];playing=false;frameIndex=0;$('scan').textContent='⏹ Stop 4D Scan';$('scan').classList.add('on');status('Scanning layered 4D contours…',true)}else{$('scan').textContent='✨ Start 4D Matrix Scan';$('scan').classList.remove('on');if(frames.length){playing=true;$('play').textContent='⏸️ Pause';status(frames.length+' temporal frames ready',true)}}}function togglePlay(){if(!frames.length)return;playing=!playing;$('play').textContent=playing?'⏸️ Pause':'▶️ Play'}function showFrame(){if(!frames.length)return;const f=frames[frameIndex++%frames.length];lastPos=f.p;lastCol=f.c;makePointCloud(f.p,f.c)}function center(){cam.position.set(0,.2,4.8);orbit.target.set(0,0,0);orbit.update()}function photo(){composer.render();const a=document.createElement('a');a.href=ren.domElement.toDataURL('image/png');a.download='hyperstream-4d-contour-'+Date.now()+'.png';a.click()}async function share(){if(!navigator.share){alert('Share requires Safari or a compatible mobile browser.');return}try{await navigator.share({title:'HyperStream XD',text:'My 4D contour hologram',url:location.href})}catch(e){}}function recordVideo(){if(typeof MediaRecorder==='undefined'||!HTMLCanvasElement.prototype.captureStream){$('hint').textContent='🎥 This browser cannot record canvas video.';return}if(!lastPos&&!frames.length){$('hint').textContent='🫧 Start the camera or make a scan first.';return}const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){$('hint').textContent='🎥 No supported recording codec.';return}const old=playing;playing=false;const stream2=ren.domElement.captureStream(30),mr=new MediaRecorder(stream2,{mimeType:mime,videoBitsPerSecond:7000000}),chunks=[];mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{const blob=new Blob(chunks,{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hyperstream-4d-contour-'+Date.now()+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);playing=old};mr.start();let n=0,total=180;const tick=()=>{if(n++>=total){mr.stop();return}if(frames.length)showFrame();else{orbit.autoRotate=true;orbit.autoRotateSpeed=.8}composer.render();setTimeout(tick,33)};tick()}function loop(now=performance.now()){requestAnimationFrame(loop);fc++;if(now-ft>1000){$('fps').textContent=Math.round(fc*1000/(now-ft||1));fc=0;ft=now}if(ready&&!playing)sample();if(playing&&frames.length&&now-lastFrame>70){lastFrame=now;showFrame()}orbit.update();composer.render()}$('start').onclick=startCamera;$('flip').onclick=flip;$('scan').onclick=scan;$('play').onclick=togglePlay;$('center').onclick=center;$('photo').onclick=photo;$('share').onclick=share;$('video').onclick=recordVideo;$('depth').oninput=e=>{depth=+e.target.value;$('dv').textContent=depth;if(lastPos)sample(true)};$('levels').oninput=e=>{contours=+e.target.value;$('lv').textContent=contours;if(lastPos)makePointCloud(lastPos,lastCol)};$('size').oninput=e=>{nodeSize=+e.target.value/1000;$('sv').textContent=e.target.value;if(cloud)cloud.material.size=nodeSize;if(lastPos)makePointCloud(lastPos,lastCol)};$('spread').oninput=e=>{spread=+e.target.value/10;$('spv').textContent=e.target.value;if(lastPos)makePointCloud(lastPos,lastCol)};[['points','points'],['wave','wave'],['vortex','vortex'],['solid','solid']].forEach(([id,m])=>$(id).onclick=()=>{$$('.mini')});function $$(sel){return document.querySelectorAll(sel)}document.querySelectorAll('.mini').forEach(b=>b.addEventListener('click',()=>{document.querySelector
