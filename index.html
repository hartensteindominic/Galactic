<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro - 4D Volumetric Time-Series Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #camera-stream, #processing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #processing-canvas { display: none; }
        #camera-stream.front-facing { transform: scaleX(-1); }
        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .top-status {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-group { display: flex; align-items: center; gap: 12px; }
        .brand { font-weight: 800; letter-spacing: 1.5px; font-size: 14px; color: #f0f0f0; }
        
        .camera-switch-btn, .file-upload-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .camera-switch-btn:hover, .file-upload-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .file-upload-btn { display: inline-block; text-align: center; }
        #json-file-input { display: none; }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.2);
            color: #ff453a;
            border: 1px solid rgba(255, 59, 48, 0.4);
        }
        .badge.active {
            background: rgba(48, 209, 88, 0.2);
            color: #30d158;
            border: 1px solid rgba(48, 209, 88, 0.4);
        }
        .control-dock {
            background: rgba(15, 15, 15, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px;
        }
        .metric-label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .metric-value { font-size: 14px; font-weight: 700; color: #0a84ff; }
        .btn-row { display: flex; gap: 10px; }
        button.action-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #scan-btn { background: #0a84ff; color: white; }
        #scan-btn.scanning { background: #ff453a; }
        #save-btn { background: #30d158; color: white; display: none; }
        button.action-btn:active { transform: scale(0.97); opacity: 0.8; }
        
        #render-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }

        #export-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #151515;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-content h3 { font-size: 15px; color: #fff; }
        .modal-content textarea {
            width: 100%;
            height: 120px;
            background: #0a0a0a;
            color: #0a84ff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px;
            font-family: monospace;
            font-size: 10px;
            resize: none;
        }
        .modal-btn-row { display: flex; gap: 8px; }
        .modal-btn {
            flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor: pointer;
        }
        #modal-copy-btn { background: #0a84ff; color: white; }
        #modal-close-btn { background: #333; color: white; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>
    <canvas id="processing-canvas"></canvas>
    <div id="render-container"></div>

    <div id="export-modal" class="interactive">
        <div class="modal-content">
            <h3>4D Video Payload Ready</h3>
            <p id="modal-desc" style="font-size:11px; color:#aaa;">Temporal sequence compiled successfully. Tap copy to save data.</p>
            <textarea id="modal-json-text" readonly></textarea>
            <div class="modal-btn-row">
                <button id="modal-copy-btn" class="modal-btn" onclick="copyPayloadToClipboard()">COPY DATA</button>
                <button id="modal-close-btn" class="modal-btn" onclick="closeModal()">CLOSE</button>
            </div>
        </div>
    </div>

    <div id="hud-overlay">
        <div class="top-status interactive">
            <div class="brand-group">
                <span class="brand">SPATIAL DASH 4D</span>
                <button class="camera-switch-btn" onclick="switchCamera()">📷 Flip</button>
                <label class="file-upload-btn">
                    📁 Load 4D JSON
                    <input type="file" id="json-file-input" accept=".json" onchange="loadEnvironmentMap(event)">
                </label>
            </div>
            <span id="status-badge" class="badge">SYSTEM READY</span>
        </div>

        <div class="control-dock interactive">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Timeline Frames</div>
                    <div id="frame-count" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Nodes / Frame</div>
                    <div id="node-count" class="metric-value">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Engine Mode</div>
                    <div id="mode-status" class="metric-value">4D Sequence</div>
                </div>
            </div>
            
            <div class="btn-row">
                <button id="scan-btn" class="action-btn" onclick="toggleScanState()">RECORD 4D VIDEO</button>
                <button id="save-btn" class="action-btn" onclick="exportEnvironmentMap()">SAVE 4D (.JSON)</button>
            </div>
        </div>
    </div>

    <script>
        let videoElement = document.getElementById('camera-stream');
        let processingCanvas = document.getElementById('processing-canvas');
        let canvasCtx = processingCanvas.getContext('2d', { willReadFrequently: true });
        let renderContainer = document.getElementById('render-container');
        let scanBtn = document.getElementById('scan-btn');
        let saveBtn = document.getElementById('save-btn');
        let statusBadge = document.getElementById('status-badge');
        let frameCountText = document.getElementById('frame-count');
        let nodeCountText = document.getElementById('node-count');
        let exportModal = document.getElementById('export-modal');
        let modalJsonText = document.getElementById('modal-json-text');
        let modalDesc = document.getElementById('modal-desc');

        let isScanning = false;
        let recordedFrames = []; // Stores sequence of frames over time (4D format)
        let currentFacingMode = "environment";
        let activeStream = null;
        let holistic = null;
        let cameraUtilsInstance = null;
        let cachedJsonString = "";

        let scene, camera, renderer, pointCloud;
        let playbackFrames = [];
        let playbackFrameIndex = 0;

        async function initCameraFeed() {
            if (renderContainer.style.display === "block") return; 
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = { video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } } };
                activeStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = activeStream;

                if (currentFacingMode === "user") {
                    videoElement.classList.add("front-facing");
                } else {
                    videoElement.classList.remove("front-facing");
                }
            } catch (err) {
                console.log("Camera access error:", err);
            }
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            initCameraFeed();
        }

        function setupOmniScanner() {
            holistic = new Holistic({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
            }});
            
            holistic.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: false,
                refineFaceLandmarks: true,
                minDetectionConfidence: 0.3,
                minTrackingConfidence: 0.3
            });

            holistic.onResults(onHolisticResults);

            cameraUtilsInstance = new Camera(videoElement, {
                onFrame: async () => {
                    if (isScanning && videoElement) {
                        await holistic.send({image: videoElement});
                        captureFrameSequence();
                    }
                },
                width: 1280,
                height: 720
            });
            cameraUtilsInstance.start();
        }

        function captureFrameSequence() {
            if (!videoElement.videoWidth) return;
            
            processingCanvas.width = 480;
            processingCanvas.height = 270;
            canvasCtx.drawImage(videoElement, 0, 0, processingCanvas.width, processingCanvas.height);
            
            const frameData = canvasCtx.getImageData(0, 0, processingCanvas.width, processingCanvas.height).data;
            const step = 2; // Ultra-dense tracking nodes per frame (~15,000+ points per frame)

            let envVertices = [];
            let envColors = [];

            for (let y = 0; y < processingCanvas.height; y += step) {
                for (let x = 0; x < processingCanvas.width; x += step) {
                    let index = (y * processingCanvas.width + x) * 4;
                    let r = frameData[index];
                    let g = frameData[index + 1];
                    let b = frameData[index + 2];

                    let luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
                    
                    let posX = parseFloat(((x / processingCanvas.width - 0.5) * 4.0).toFixed(3));
                    let posY = parseFloat((-(y / processingCanvas.height - 0.5) * 4.0).toFixed(3));
                    let posZ = parseFloat(((luminance - 0.5) * 2.2).toFixed(3));

                    envVertices.push(posX, posY, posZ);
                    envColors.push(parseFloat((r/255).toFixed(2)), parseFloat((g/255).toFixed(2)), parseFloat((b/255).toFixed(2)));
                }
            }

            // Append current frame data to the 4D timeline sequence buffer
            recordedFrames.push({
                vertices: envVertices,
                colors: envColors
            });

            frameCountText.innerText = recordedFrames.length;
            nodeCountText.innerText = envVertices.length / 3;
        }

        function onHolisticResults(results) {
            if (!isScanning || recordedFrames.length === 0) return;
            
            let humanVertices = [];
            let humanColors = [];

            function addLandmarks(landmarks, rc, gc, bc) {
                if (!landmarks) return;
                for (let pt of landmarks) {
                    let x = parseFloat(((pt.x - 0.5) * -4.0).toFixed(3));
                    let y = parseFloat(((pt.y - 0.5) * -4.0).toFixed(3));
                    let z = parseFloat(((pt.z || 0) * 4.0).toFixed(3));

                    humanVertices.push(x, y, z);
                    humanColors.push(rc, gc, bc);
                }
            }

            if (results.faceLandmarks) addLandmarks(results.faceLandmarks.landmark, 0.0, 0.8, 1.0);
            if (results.poseLandmarks) addLandmarks(results.poseLandmarks.landmark, 0.1, 0.9, 0.3);
            if (results.leftHandLandmarks) addLandmarks(results.leftHandLandmarks.landmark, 1.0, 0.5, 0.0);
            if (results.rightHandLandmarks) addLandmarks(results.rightHandLandmarks.landmark, 0.9, 0.1, 0.9);

            if (humanVertices.length > 0) {
                let currentFrame = recordedFrames[recordedFrames.length - 1];
                currentFrame.vertices.push(...humanVertices);
                currentFrame.colors.push(...humanColors);
                nodeCountText.innerText = currentFrame.vertices.length / 3;
            }
        }

        function toggleScanState() {
            isScanning = !isScanning;

            if (isScanning) {
                recordedFrames = []; // reset timeline buffer
                scanBtn.innerText = "STOP RECORDING";
                scanBtn.classList.add("scanning");
                statusBadge.innerText = "RECORDING 4D VIDEO...";
                statusBadge.classList.add("active");
                saveBtn.style.display = "block";
            } else {
                scanBtn.innerText = "RECORD 4D VIDEO";
                scanBtn.classList.remove("scanning");
                statusBadge.innerText = "4D SEQUENCE READY";
                statusBadge.classList.remove("active");
            }
        }

        function exportEnvironmentMap() {
            if (recordedFrames.length === 0) {
                alert("No timeline frames recorded. Press record and capture motion.");
                return;
            }

            statusBadge.innerText = "PACKAGING 4D PAYLOAD...";

            setTimeout(() => {
                const video4DPayload = {
                    metadata: {
                        generator: "Spatial Dash 4D Engine",
                        version: "7.0",
                        type: "VolumetricSequence",
                        totalFrames: recordedFrames.length,
                        timestamp: new Date().toISOString()
                    },
                    sequence: recordedFrames
                };

                cachedJsonString = JSON.stringify(video4DPayload);
                
                modalJsonText.value = cachedJsonString.substring(0, 1000) + "\n\n... [Full 4D sequence cached in memory (" + (cachedJsonString.length / 1024 / 1024).toFixed(2) + " MB). Tap copy to get all data] ...";
                modalDesc.innerText = `4D Video ready! Frames: ${recordedFrames.length}, Size: ${(cachedJsonString.length / 1024 / 1024).toFixed(2)} MB.`;
                
                exportModal.style.display = 'flex';
                statusBadge.innerText = "4D SEQUENCE READY";
            }, 100);
        }

        function copyPayloadToClipboard() {
            if (!cachedJsonString) return;
            
            navigator.clipboard.writeText(cachedJsonString).then(() => {
                let copyBtn = document.getElementById('modal-copy-btn');
                copyBtn.innerText = "COPIED SUCCESSFULLY!";
                copyBtn.style.background = "#30d158";
                setTimeout(() => {
                    copyBtn.innerText = "COPY DATA";
                }, 2000);
            }).catch(err => {
                let tempInput = document.createElement("textarea");
                tempInput.value = cachedJsonString;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                
                let copyBtn = document.getElementById('modal-copy-btn');
                copyBtn.innerText = "COPIED VIA FALLBACK!";
                copyBtn.style.background = "#30d158";
            });
        }

        function closeModal() {
            exportModal.style.display = 'none';
        }

        function loadEnvironmentMap(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsonContent = JSON.parse(e.target.result);
                    render4DVideoFromJSON(jsonContent);
                } catch (err) {
                    alert("Invalid 4D JSON sequence file.");
                }
            };
            reader.readAsText(file);
        }

        function render4DVideoFromJSON(payload) {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }
            videoElement.style.display = 'none';
            renderContainer.style.display = 'block';
            
            statusBadge.innerText = "PLAYING 4D VIDEO";
            statusBadge.classList.add("active");

            playbackFrames = payload.sequence;
            playbackFrameIndex = 0;
            frameCountText.innerText = playbackFrames.length;

            if (!scene) {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 4.0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderContainer.appendChild(renderer.domElement);

                scene.add(new THREE.AmbientLight(0xffffff, 1.0));
                
                let isDragging = false;
                let prevMousePos = { x: 0, y: 0 };

                window.addEventListener('mousedown', (e) => { isDragging = true; prevMousePos = { x: e.clientX, y: e.clientY }; });
                window.addEventListener('mousemove', (e) => {
                    if (!isDragging || !pointCloud) return;
                    pointCloud.rotation.y += (e.clientX - prevMousePos.x) * 0.005;
                    pointCloud.rotation.x += (e.clientY - prevMousePos.y) * 0.005;
                    prevMousePos = { x: e.clientX, y: e.clientY };
                });
                window.addEventListener('mouseup', () => { isDragging = false; });
            }

            const geometry = new THREE.BufferGeometry();
            const material = new THREE.PointsMaterial({ size: 0.02, vertexColors: true, transparent: true, opacity: 0.85 });
            pointCloud = new THREE.Points(geometry, material);
            scene.add(pointCloud);

            function animate4D() {
                requestAnimationFrame(animate4D);

                if (playbackFrames.length > 0) {
                    let frame = playbackFrames[playbackFrameIndex];
                    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(frame.vertices), 3));
                    geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(frame.colors), 3));
                    geometry.attributes.position.needsUpdate = true;
                    geometry.attributes.color.needsUpdate = true;

                    nodeCountText.innerText = frame.vertices.length / 3;

                    // Loop timeline forward
                    playbackFrameIndex = (playbackFrameIndex + 1) % playbackFrames.length;
                }

                renderer.render(scene, camera);
            }
            animate4D();
        }

        window.addEventListener('load', () => {
            initCameraFeed();
            setupOmniScanner();
        });
    </script>
</body>
</html>
