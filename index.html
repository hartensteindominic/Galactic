<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08091a">
<title>HyperStream XD • Bubble Contour</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#08091a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}#viewer{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 42%,#27306b 0,#111632 35%,#08091a 78%)}#c{display:block;width:100%;height:100%}.top{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{padding:7px 10px;border-radius:999px;background:rgba(18,20,46,.72);border:1px solid rgba(255,255,255,.12);box-shadow:0 5px 20px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(16px);font-size:10px;color:#cbd5e1}.pill b{color:#f9a8d4}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fb7185;box-shadow:0 0 10px #fb7185;margin-right:5px}.live .dot{background:#34d399;box-shadow:0 0 10px #34d399}#controls{z-index:20;background:linear-gradient(180deg,rgba(12,13,31,.96),rgba(7,8,21,.99));border-top:1px solid rgba(255,255,255,.1);padding:9px 11px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;box-shadow:0 -12px 35px rgba(0,0,0,.28)}.row{display:flex;gap:7px}.btn{appearance:none;flex:1;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:11px 7px;color:#fff;font-weight:800;font-size:12px;background:linear-gradient(180deg,#252847,#181a36);box-shadow:0 5px 12px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.1);transition:.12s}.btn:active{transform:scale(.96)}.hero{padding:14px;border:0;border-radius:19px;background:linear-gradient(135deg,#8b5cf6,#ec4899 58%,#fb7185);font-size:14px;box-shadow:0 7px 22px rgba(236,72,153,.24),inset 0 1px rgba(255,255,255,.28)}.hero.on{background:linear-gradient(135deg,#f97316,#ec4899)}.green{background:linear-gradient(180deg,#10b981,#047857)}.blue{background:linear-gradient(180deg,#38bdf8,#0369a1)}.slider{display:flex;align-items:center;gap:8px;padding:3px 4px;color:#aeb6cc;font-size:11px}.slider label{width:54px;font-weight:700}.slider input{flex:1;height:24px;accent-color:#ec4899}.slider output{width:31px;text-align:right;color:#f9a8d4;font-weight:800}.tiny{text-align:center;color:#7f8aaa;font-size:10px}.bubble{position:absolute;z-index:3;border-radius:50%;pointer-events:none;border:1px solid rgba(255,255,255,.08);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(236,72,153,.04) 55%,transparent 70%);filter:blur(.2px)}.b1{width:80px;height:80px;right:7%;top:18%;animation:float 5s ease-in-out infinite}.b2{width:35px;height:35px;left:8%;top:34%;animation:float 4s ease-in-out infinite reverse}.b3{width:55px;height:55px;right:18%;bottom:13%;animation:float 6s ease-in-out infinite}.hint{position:absolute;z-index:4;left:50%;bottom:10px;transform:translateX(-50%);white-space:nowrap;padding:6px 11px;border-radius:999px;background:rgba(10,11,28,.48);border:1px solid rgba(255,255,255,.08);font-size:9px;color:#a5b0c8;backdrop-filter:blur(12px)}@keyframes float{50%{transform:translateY(-8px) scale(1.04)}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
<div id="viewer">
 <div class="top"><div id="status" class="pill"><span class="dot"></span>Starting camera…</div><div class="pill">✨ <b id="fps">—</b> FPS · <b id="pts">0</b> bubbles</div></div>
 <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
 <canvas id="c"></canvas><div class="hint">☝️ drag to turn · pinch to zoom</div>
 <video id="video" autoplay muted playsinline style="display:none"></video>
</div>
<div id="controls">
 <button id="scan" class="btn hero" onclick="toggleScan()">✨ Start 4D Scan</button>
 <div class="row"><button id="cam" class="btn" onclick="flipCamera()">📷 Camera</button><button id="play" class="btn" onclick="togglePlay()">▶️ Play</button><button class="btn" onclick="centerView()">🎯 Center</button></div>
 <div class="slider"><label>Depth</label><input id="depth" type="range" min="30" max="160" value="105"><output id="dv">105</output></div>
 <div class="slider"><label>Bubbles</label><input id="levels" type="range" min="7" max="26" value="17"><output id="lv">17</output></div>
 <div class="slider"><label>Glow</label><input id="glow" type="range" min="6" max="24" value="12"><output id="gv">12</output></div>
 <div class="row"><button class="btn green" onclick="savePhoto()">📸 Photo</button><button class="btn blue" onclick="shareScan()">💌 Share</button></div>
 <div class="tiny">Live camera → layered contour volume → soft bubbly hologram</div>
</div>
<script>
const $=id=>document.getElementById(id);let scene,camera,renderer,composer,orbit,video,stream,work,ctx,ready=false,facing='user';let base=null,points=null,contourGroups=[],ribGroups=[];let depth=105,levels=17,glow=.012,scanning=false,frames=[],recording=[],playing=false,frameIndex=0,lastSample=0,lastPlay=0,ft=0,fc=0;
$('depth').oninput=e=>{depth=+e.target.value;$('dv').textContent=depth};$('levels').oninput=e=>{levels=+e.target.value;$('lv').textContent=levels;if(base)renderBase(base.p,base.c)};$('glow').oninput=e=>{glow=+e.target.value/1000;$('gv').textContent=e.target.value;if(points)points.material.size=glow};
function init(){const box=$('viewer');scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x08091a,.014);camera=new THREE.PerspectiveCamera(37,box.clientWidth/box.clientHeight,.08,1000);camera.position.set(0,1,6.3);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setSize(box.clientWidth,box.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setClearColor(0x08091a);composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(box.clientWidth,box.clientHeight),.8,.52,.66));orbit=new THREE.OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.dampingFactor=.085;orbit.rotateSpeed=.55;orbit.zoomSpeed=.7;orbit.enablePan=false;orbit.minDistance=2;orbit.maxDistance=17;orbit.autoRotate=true;orbit.autoRotateSpeed=.14;orbit.target.set(0,.15,0);backdrop();addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));startCamera();loop()}
function backdrop(){const g=new THREE.BufferGeometry(),p=new Float32Array(700*3);for(let i=0;i<700;i++){const r=25+Math.random()*45,t=Math.random()*6.283,a=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(a)*Math.cos(t);p[i*3+1]=r*Math.sin(a)*Math.sin(t)*.55;p[i*3+2]=r*Math.cos(a)}g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x64748b,size:.018,transparent:true,opacity:.25,depthWrite:false})));const grid=new THREE.GridHelper(55,44,0x6d28d9,0x171a34);grid.position.y=-2.45;grid.material.transparent=true;grid.material.opacity=.22;scene.add(grid);scene.add(new THREE.AmbientLight(0x94a3b8,.35));let l=new THREE.DirectionalLight(0x67e8f9,1.15);l.position.set(4,6,5);scene.add(l);l=new THREE.DirectionalLight(0xf472b6,1);l.position.set(-4,-2,-5);scene.add(l)}
function resize(){const b=$('viewer');camera.aspect=b.clientWidth/b.clientHeight;camera.updateProjectionMatrix();renderer.setSize(b.clientWidth,b.clientHeight);composer.setSize(b.clientWidth,b.clientHeight)}
async function startCamera(){video=$('video');if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('no camera');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:640},height:{ideal:480},frameRate:{ideal:24}},audio:false});video.srcObject=stream;await video.play();ready=true;$('status').classList.add('live');$('status').innerHTML='<span class="dot"></span>Camera live · 3D bubble field';setTimeout(sample,150)}catch(e){$('status').innerHTML='<span class="dot"></span>Tap Camera to allow video';$('status').classList.remove('live')}}
function flipCamera(){facing=facing==='user'?'environment':'user';startCamera()}
function centerView(){camera.position.set(0,1,6.3);orbit.target.set(0,.15,0);orbit.update()}
function clearVolume(){if(points){scene.remove(points);points.geometry.dispose();points.material.dispose();points=null}contourGroups.forEach(o=>{scene.remove(o);o.geometry.dispose();o.material.dispose()});contourGroups=[];ribGroups.forEach(o=>{scene.remove(o);o.geometry.dispose();o.material.dispose()});ribGroups=[]}
function sample(){if(!ready||video.readyState<2)return;if(!work){work=document.createElement('canvas');ctx=work.getContext('2d',{willReadFrequently:true})}const w=video.videoWidth||640,h=video.videoHeight||480;if(work.width!==w||work.height!==h){work.width=w;work.height=h}try{ctx.drawImage(video,0,0,w,h)}catch{return}let pix;try{pix=ctx.getImageData(0,0,w,h).data}catch{return}const step=4,pos=[],col=[],cx=w*.5,cy=h*.5,mr=Math.hypot(cx,cy);for(let y=0;y<h;y+=step){for(let x=0;x<w;x+=step){const i=(y*w+x)*4,r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.055)continue;const nx=((w-x)/w)*2-1,ny=-((y/h)*2-1),rad=((x-cx)**2+(y-cy)**2)/(mr*mr);const z=(l-.13)*(depth*.043)-rad*.55;pos.push(nx*1.7,ny*1.7,z);col.push(Math.min(1,r*1.35+.1),Math.min(1,g*1.18+.08),Math.min(1,b*1.48+.2))}}if(pos.length<30)return;base={p:pos,c:col};renderBase(pos,col);if(scanning&&recording.length<90)recording.push({p:pos.map(v=>+v.toFixed(3)),c:col.map(v=>+v.toFixed(2))})}
function renderBase(pos,col){clearVolume();const n=pos.length/3;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));points=new THREE.Points(g,new THREE.PointsMaterial({size:glow,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.52,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(points);buildBubbles(pos,col);$('pts').textContent=Math.round(n*(levels+1)).toLocaleString()}
function buildBubbles(pos,col){const n=pos.length/3,min=-3.2,max=3.2;const groups=[];for(let L=0;L<levels;L++){const z=min+(L/(Math.max(1,levels-1)))*(max-min),v=[],c=[];for(let i=0;i<n;i++){const j=i*3,d=Math.abs(pos[j+2]-z);if(d<.07){v.push(pos[j],pos[j+1],z);c.push(col[j],col[j+1],col[j+2])}}if(v.length<12)continue;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(c),3));const m=new THREE.PointsMaterial({size:glow*2.15,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending});const o=new THREE.Points(g,m);scene.add(o);contourGroups.push(o);groups.push(o)}
for(let k=0;k<groups.length-1;k++){const a=groups[k].geometry.attributes.position.array,b=groups[k+1].geometry.attributes.position.array,count=Math.min(a.length,b.length)/3,v=[];for(let i=0;i<count;i+=7)v.push(a[i*3],a[i*3+1],a[i*3+2],b[i*3],b[i*3+1],b[i*3+2]);if(!v.length)continue;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));const m=new THREE.LineBasicMaterial({color:k%2?0xf472b6:0x67e8f9,transparent:true,opacity:.13,blending:THREE.AdditiveBlending});const o=new THREE.LineSegments(g,m);scene.add(o);ribGroups.push(o)}}
function toggleScan(){scanning=!scanning;const b=$('scan');if(scanning){recording=[];frames=[];playing=false;b.textContent='⏹ Stop 4D Scan';b.classList.add('on');$('play').textContent='▶️ Play';$('status').innerHTML='<span class="dot"></span>Capturing bubbly 4D volume…'}else{b.textContent='✨ Start 4D Scan';b.classList.remove('on');frames=recording.slice();if(frames.length){playing=true;$('play').textContent='⏸️ Pause';$('status').innerHTML='<span class="dot"></span>'+frames.length+' contour moments ready'}}}
function togglePlay(){if(!frames.length)return;playing=!playing;$('play').textContent=playing?'⏸️ Pause':'▶️ Play'}
function drawFrame(){if(!frames.length)return;const f=frames[frameIndex%frames.length];renderBase(f.p,f.c);frameIndex=(frameIndex+1)%frames.length}
function loop(now=performance.now()){requestAnimationFrame(loop);orbit.autoRotate=!scanning&&!playing;orbit.update();fc++;if(now-ft>1000){$('fps').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}if(ready&&!playing&&now-lastSample>60){lastSample=now;sample()}if(playing&&now-lastPlay>55){lastPlay=now;drawFrame()}const t=now*.001;contourGroups.forEach((o,i)=>{o.scale.setScalar(1+Math.sin(t*1.8+i*.19)*.006)});composer.render()}
function savePhoto(){composer.render();const a=document.createElement('a');a.href=$('c').toDataURL('image/png');a.download='hyperstream-bubble-4d-'+Date.now()+'.png';a.click()}
function shareScan(){if(!navigator.share){alert('Share works best on iPhone Safari');return}const data=frames.length?frames:recording;if(!data.length){alert('Start a 4D scan first');return}const file=new File([JSON.stringify({HyperStreamXD:'Bubble Contour 4D',frames:data})],'hyperstream-bubble-4d.json',{type:'application/json'});if(navigator.canShare?.({files:[file]}))navigator.share({title:'HyperStream XD • Bubble Contour',files:[file]}).catch(()=>{});else navigator.share({title:'HyperStream XD • Bubble Contour',text:'My bubbly 4D hologram',url:location.href}).catch(()=>{})}
addEventListener('DOMContentLoaded',init);
</script>
</body></html>
