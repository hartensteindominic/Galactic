<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream XD</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column}#stage{height:58dvh;position:relative;background:#030508}canvas{width:100%;height:100%;display:block}.badge{position:absolute;right:12px;top:12px;z-index:5;padding:7px 12px;border-radius:20px;background:#000a;backdrop-filter:blur(18px);font-size:11px}.panel{height:42dvh;overflow:auto;background:#19191cf7;border-radius:24px 24px 0 0;padding:7px 10px calc(14px + env(safe-area-inset-bottom))}.handle{width:38px;height:4px;background:#666;border-radius:8px;margin:0 auto 8px}.card{background:#303034e8;border-radius:17px;padding:10px;margin-bottom:8px}.title{font-size:10px;font-weight:800;color:#999;text-transform:uppercase;margin-bottom:7px}.actions{display:flex;flex-direction:column;gap:7px}.actions button,.switch button{height:44px;border:0;border-radius:15px;font-weight:750;font-size:14px;color:#fff}.red{background:linear-gradient(135deg,#ff477c,#ff3561)}.green{background:linear-gradient(135deg,#65f39a,#30d158);color:#06120a!important}.blue{background:linear-gradient(135deg,#5ab5ff,#0a84ff)}.pink{background:linear-gradient(135deg,#d06cff,#ff4f91)}button:disabled{opacity:.35}.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.switch button{background:#ffffff12}.switch .active{background:#ff4f864d;outline:1px solid #ff4f8680}.row{display:grid;grid-template-columns:112px 1fr 42px;align-items:center;height:36px;font-size:11px}.v{text-align:right;font-size:10px;color:#ff76a6}input[type=range]{width:100%;appearance:none;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:8px;background:linear-gradient(90deg,#ffffff20,#ff4f867a)}input[type=range]::-webkit-slider-thumb{appearance:none;width:21px;height:21px;margin-top:-7px;border-radius:50%;border:2px solid white;background:#ff76a6;box-shadow:0 2px 12px #ff4f8670}.status{font-size:10px;color:#42a5ff;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}video{display:none}@media(min-width:769px){#stage{height:calc(100dvh - 360px)}.panel{height:360px}.handle{display:none}.actions{display:grid;grid-template-columns:1fr 1fr}}</style></head><body><div id="app"><section id="stage"><div class="badge">FPS <b id="fps" style="color:#ff4f86">—</b> · <span id="nodes">0</span> nodes</div><video id="vid" autoplay playsinline muted></video><canvas id="c"></canvas></section><section class="panel"><div class="handle"></div><div class="card actions"><button class="red" id="scan" onclick="toggleScan()">Start Scanning</button><button class="green" id="rec" onclick="toggleRecord()" disabled>Record</button><button class="blue" id="play" onclick="toggleReplay()" disabled>Replay</button><button class="pink" id="share" onclick="shareVideo()" disabled>Share</button></div><div class="card"><div class="title">Camera</div><div class="switch"><button id="front" class="active" onclick="startCamera('user')">Face Camera</button><button id="back" onclick="startCamera('environment')">Back Camera</button></div></div><div class="card"><div class="title">HyperStream XD · 4D Quantum Structure</div><div class="row"><span>Live 4D</span><input type="range" min="0" max="100" value="72" oninput="T=this.value/100;tv.textContent=this.value+'%'"><b class="v" id="tv">72%</b></div><div class="row"><span>Voxel Density</span><input type="range" min="20" max="100" value="88" oninput="V=this.value/100;vv.textContent=this.value+'%' "><b class="v" id="vv">88%</b></div><div class="row"><span>Hyper Depth Field</span><input type="range" min="10" max="100" value="58" oninput="D=this.value/100;dv.textContent=this.value+'%'"><b class="v" id="dv">58%</b></div><div class="row"><span>Quantum Node Size</span><input type="range" min="20" max="160" value="62" oninput="N=this.value/100;nv.textContent=this.value+'%'"><b class="v" id="nv">62%</b></div><div class="row"><span>Dimensional Strata</span><input type="range" min="1" max="10" value="5" oninput="L=+this.value;lv.textContent=this.value"><b class="v" id="lv">5</b></div><div class="row"><span>Spatial Dimensions</span><input type="range" min="10" max="100" value="72" oninput="X=this.value/100;xv.textContent=this.value+'%'"><b class="v" id="xv">72%</b></div><div class="status" id="status">Starting Face Camera…</div></div></section></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>const $=id=>document.getElementById(id);let scene,cam,ren,ctl,video,stream,ready=false,scanning=false,playing=false,recording=false;let T=.72,V=.88,D=.58,N=.62,L=5,X=.72;let work,ctx,tex,surface,geo,pa,ca,pts,strata=[],depth,fc=0,ft=0;let mr,chunks=[],frames=[],pidx=0,lastPlay=0;const W=320,H=180,MAX=W*H;init();startCamera('user');function init(){const b=$('stage');scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(47,b.clientWidth/b.clientHeight,.01,100);cam.position.set(0,0,5.7);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});ren.setSize(b.clientWidth,b.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ctl=new THREE.OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.dampingFactor=.065;ctl.autoRotate=true;ctl.autoRotateSpeed=.07;video=$('vid');work=document.createElement('canvas');work.width=W;work.height=H;ctx=work.getContext('2d',{willReadFrequently:true});depth=new Float32Array(MAX);geo=new THREE.PlaneGeometry(5,2.8125,W-1,H-1);tex=new THREE.VideoTexture(video);tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;surface=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex,color:0xbfc5cc,side:THREE.DoubleSide}));scene.add(surface);for(let i=0;i<10;i++){const g=geo.clone(),m=new THREE.MeshBasicMaterial({map:tex,color:0x9ca5b0,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});const q=new THREE.Mesh(g,m);scene.add(q);strata.push(q)}const pg=new THREE.BufferGeometry();pa=new THREE.BufferAttribute(new Float32Array(MAX*3),3);ca=new THREE.BufferAttribute(new Float32Array(MAX*3),3);pg.setAttribute('position',pa);pg.setAttribute('color',ca);pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.018,vertexColors:true,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(pts);addEventListener('resize',()=>{cam.aspect=b.clientWidth/b.clientHeight;cam.updateProjectionMatrix();ren.setSize(b.clientWidth,b.clientHeight)});ren.setAnimationLoop(loop)}async function startCamera(mode){if(stream)stream.getTracks().forEach(t=>t.stop());ready=false;scanning=false;$('rec').disabled=true;$('rec').classList.remove('ready');$('status').textContent=mode==='user'?'Starting Face Camera…':'Starting Back Camera…';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,max:60}},audio:false});video.srcObject=stream;await video.play();ready=true;$('front').classList.toggle('active',mode==='user');$('back').classList.toggle('active',mode==='environment');$('status').textContent=mode==='user'?'Face Camera ready':'Back Camera ready'}catch(e){$('status').textContent='Camera permission needed'}}function loop(t){ctl.update();fc++;if(t-ft>1000){$('fps').textContent=Math.round(fc*1000/(t-ft));fc=0;ft=t}if(playing)replayStep(t);else if(scanning&&ready&&video.readyState>=2)sample(t);tex.needsUpdate=true;ren.render(scene,cam)}function sample(t){ctx.drawImage(video,0,0,W,H);let pix;try{pix=ctx.getImageData(0,0,W,H).data}catch{return}const stride=Math.max(1,Math.round(5-V*3.6));let n=0;const pos=pa.array,col=ca.array;for(let y=0;y<H&&n<MAX;y+=stride)for(let x=0;x<W&&n<MAX;x+=stride){const p=(y*W+x)*4,r=pix[p]/255,g=pix[p+1]/255,b=pix[p+2]/255,lum=.299*r+.587*g+.114*b;const xl=Math.max(0,x-1),xr=Math.min(W-1,x+1),yu=Math.max(0,y-1),yd=Math.min(H-1,y+1);const edge=Math.min(1,(Math.abs(pix[(y*W+xr)*4]-pix[(y*W+xl)*4])+Math.abs(pix[(yd*W+x)*4]-pix[(yu*W+x)*4]))/510);const radial=Math.hypot(x/W-.5,(y/H-.5)*1.08),center=1-Math.min(1,radial*1.35);const target=((1-lum)*.42+edge*.34+center*.06)*D-.14;const di=y*W+x;depth[di]+=(target-depth[di])*(.14+.22*T);const j=n*3;pos[j]=(x/(W-1)-.5)*5*X;pos[j+1]=(.5-y/(H-1))*2.8125*X;pos[j+2]=depth[di];col[j]=r*.86;col[j+1]=g*.86;col[j+2]=b*.86;n++}pgDraw(n);updateSurface(pix);$('nodes').textContent=n.toLocaleString();if(recording&&(!frames.length||t-frames[frames.length-1].t>=33))frames.push({t,n,pos:pos.slice(0,n*3),col:col.slice(0,n*3),surface:geo.attributes.position.array.slice()})}function pgDraw(n){pts.geometry.setDrawRange(0,n);pa.needsUpdate=true;ca.needsUpdate=true;pts.material.size=.012+N*.025;pts.material.opacity=.12+.14*T}function updateSurface(pix){const a=geo.attributes.position.array;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=(y*W+x)*4,r=pix[p]/255,g=pix[p+1]/255,b=pix[p+2]/255,lum=.299*r+.587*g+.114*b,xl=Math.max(0,x-1),xr=Math.min(W-1,x+1),yu=Math.max(0,y-1),yd=Math.min(H-1,y+1),edge=Math.min(1,(Math.abs(pix[(y*W+xr)*4]-pix[(y*W+xl)*4])+Math.abs(pix[(yd*W+x)*4]-pix[(yu*W+x)*4]))/510),z=((1-lum)*.42+edge*.34)*D-.14,j=(y*W+x)*3;a[j]=(x/(W-1)-.5)*5*X;a[j+1]=(.5-y/(H-1))*2.8125*X;a[j+2]=z}geo.attributes.position.needsUpdate=true;const count=Math.min(L,strata.length);for(let i=0;i<strata.length;i++){const q=strata[i],on=i<count;q.visible=on;if(on){q.position.z=(i-(count-1)/2)*.012*(D*1.7);q.position.x=(i-(count-1)/2)*.0015;q.material.opacity=.018*Math.max(0,1-Math.abs(i-(count-1)/2)/(count+1))*T}}}function toggleScan(){if(!ready)return;scanning=!scanning;$('scan').textContent=scanning?'Stop Scanning':'Start Scanning';$('scan').className=scanning?'green':'red';$('rec').disabled=!scanning;$('status').textContent=scanning?'Live 4D reconstruction active':'Ready';ctl.autoRotate=!scanning}function toggleRecord(){if(recording){recording=false;if(mr?.state!=='inactive')mr.stop();$('rec').textContent='Record';return}if(!scanning)return;chunks=[];frames=[];const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';mr=new MediaRecorder($('c').captureStream(60),{mimeType:type,videoBitsPerSecond:16000000});mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.onstop=()=>{$('play').disabled=!frames.length;$('share').disabled=!chunks.length};mr.start(100);recording=true;$('rec').textContent='Stop'}function toggleReplay(){if(!frames.length)return;playing=!playing;if(playing){pidx=0;lastPlay=performance.now();$('play').textContent='Stop';ctl.autoRotate=false}else{$('play').textContent='Replay';ctl.autoRotate=true}}function replayStep(t){if(t-lastPlay<33)return;lastPlay=t;const f=frames[pidx];pa.array.set(f.pos);ca.array.set(f.col);pa.needsUpdate=ca.needsUpdate=true;pts.geometry.setDrawRange(0,f.n);geo.attributes.position.array.set(f.surface);geo.attributes.position.needsUpdate=true;$('nodes').textContent=f.n.toLocaleString();pidx=(pidx+1)%frames.length}async function shareVideo(){if(!chunks.length)return;const blob=new Blob(chunks,{type:'video/webm'}),file=new File([blob],'hyperstream-xd-4d.webm',{type:blob.type});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:'HyperStream XD',text:'3D holographic video ✨',files:[file]});return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}</script></body></html>
