name: Galactic Trust Evidence Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  evidence-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Evidence integrity checks
        run: node scripts/banking-evidence-check.mjs
