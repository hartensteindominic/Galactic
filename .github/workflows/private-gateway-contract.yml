name: Galactic Trust Gateway Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gateway contract drift checks
        run: node scripts/private-gateway-contract-check.mjs
