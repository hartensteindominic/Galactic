name: App Store Screenshots

on:
  push:
    paths:
      - .github/workflows/app-store-screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/GalacticTrustBusiness
        run: |
          set -euo pipefail
          python3 scripts/generate_app_icon.py
          xcodegen generate

      - name: Build simulator app
        working-directory: ios/GalacticTrustBusiness
        run: |
          set -euo pipefail
          xcodebuild \
            -project GalacticTrustBusiness.xcodeproj \
            -scheme GalacticTrustBusiness \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/GalacticDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/GalacticDerivedData/Build/Products/Release-iphonesimulator/GalacticTrustBusiness.app"
          BUNDLE_ID="com.hartensteindominic.galactictrustbusiness"
          OUT="$GITHUB_WORKSPACE/app-store-screenshots"
          mkdir -p "$OUT"

          python3 <<'PY' > "$RUNNER_TEMP/simulators.env"
          import json, subprocess

          def data(*args):
              return json.loads(subprocess.check_output(args, text=True))

          runtimes = data('xcrun', 'simctl', 'list', 'runtimes', '--json')['runtimes']
          ios = [r for r in runtimes if r.get('isAvailable') and (r.get('platform') == 'iOS' or 'iOS' in r.get('name', ''))]
          if not ios:
              raise SystemExit('No available iOS Simulator runtime found')
          runtime = ios[-1]['identifier']

          types = data('xcrun', 'simctl', 'list', 'devicetypes', '--json')['devicetypes']
          by_name = {d['name']: d for d in types}

          def pick(names, fallback_words):
              for name in names:
                  if name in by_name:
                      return by_name[name]['identifier']
              for d in reversed(types):
                  lower = d['name'].lower()
                  if all(word in lower for word in fallback_words):
                      return d['identifier']
              raise SystemExit('No matching simulator device type found')

          iphone_id = pick(
              ['iPhone 11 Pro Max', 'iPhone 16 Pro Max', 'iPhone 16 Plus', 'iPhone 15 Pro Max'],
              ['iphone', 'max']
          )
          ipad_id = pick(
              ['iPad Pro 13-inch (M4)', 'iPad Pro 13-inch (M5)', 'iPad Pro (13-inch) (M4)', 'iPad Pro (12.9-inch) (6th generation)'],
              ['ipad', 'pro']
          )

          print(f'RUNTIME={runtime}')
          print(f'IPHONE_TYPE={iphone_id}')
          print(f'IPAD_TYPE={ipad_id}')
          PY

          source "$RUNNER_TEMP/simulators.env"

          run_with_timeout() {
            seconds="$1"
            shift
            python3 - "$seconds" "$@" <<'PY'
          import subprocess, sys
          seconds = int(sys.argv[1])
          subprocess.run(sys.argv[2:], check=True, timeout=seconds)
          PY
          }

          wait_for_boot() {
            udid="$1"
            for attempt in $(seq 1 75); do
              if xcrun simctl list devices | grep "$udid" | grep -q '(Booted)'; then
                return 0
              fi
              sleep 2
            done
            echo "Simulator $udid did not reach Booted state" >&2
            return 1
          }

          wait_for_app_process() {
            for attempt in $(seq 1 45); do
              if pgrep -f 'GalacticTrustBusiness.app/GalacticTrustBusiness' >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          capture() {
            label="$1"
            dtype="$2"
            raw="$3"
            final="$4"
            width="$5"
            height="$6"
            launch_log="$OUT/${label}-launch.log"

            udid=$(xcrun simctl create "Galactic-${label}-${GITHUB_RUN_ID}" "$dtype" "$RUNTIME")
            echo "Created $label simulator $udid"

            run_with_timeout 30 xcrun simctl boot "$udid" || true
            wait_for_boot "$udid"

            # A simulator can report Booted before SpringBoard and app-launch services
            # are fully ready. Give them a short settling window before installation.
            sleep 10

            run_with_timeout 30 xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
            run_with_timeout 60 xcrun simctl install "$udid" "$APP"

            # On hosted macOS runners, simctl launch can occasionally stay attached
            # even after it has successfully started the app. Launch it in the
            # background and verify the actual app process instead of treating that
            # attached CLI process as a failure.
            (xcrun simctl launch --terminate-running-process "$udid" "$BUNDLE_ID" >"$launch_log" 2>&1) &
            launch_cli_pid=$!

            if ! wait_for_app_process; then
              echo "The Galactic Trust Business process did not appear after launch." >&2
              echo "--- simctl launch output ---" >&2
              cat "$launch_log" >&2 || true
              echo "--- simulator devices ---" >&2
              xcrun simctl list devices >&2 || true
              kill "$launch_cli_pid" >/dev/null 2>&1 || true
              wait "$launch_cli_pid" >/dev/null 2>&1 || true
              return 1
            fi

            echo "Galactic Trust Business is running on the $label simulator."
            sleep 12
            run_with_timeout 45 xcrun simctl io "$udid" screenshot "$raw"

            # Produce App Store Connect-compatible dimensions while preserving the
            # real pixels captured from the native simulator session.
            sips --resampleHeightWidth "$height" "$width" "$raw" --out "$final" >/dev/null
            sips -g pixelWidth -g pixelHeight "$final"
            file "$final"

            kill "$launch_cli_pid" >/dev/null 2>&1 || true
            wait "$launch_cli_pid" >/dev/null 2>&1 || true
            xcrun simctl terminate "$udid" "$BUNDLE_ID" || true
            xcrun simctl shutdown "$udid" || true
            xcrun simctl delete "$udid" || true
          }

          trap 'xcrun simctl shutdown all >/dev/null 2>&1 || true; xcrun simctl delete unavailable >/dev/null 2>&1 || true' EXIT

          capture iphone "$IPHONE_TYPE" "$OUT/iphone-raw.png" "$OUT/Galactic-Trust-Business-iPhone-6.5.png" 1242 2688
          capture ipad "$IPAD_TYPE" "$OUT/ipad-raw.png" "$OUT/Galactic-Trust-Business-iPad-13.png" 2064 2752
          rm -f "$OUT/iphone-raw.png" "$OUT/ipad-raw.png" "$OUT/iphone-launch.log" "$OUT/ipad-launch.log"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: galactic-trust-app-store-screenshots
          path: app-store-screenshots
          if-no-files-found: error
          retention-days: 30
