name: App Store Screenshots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/app-store-screenshots.yml
      - 'ios/GalacticTrustBusiness/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/GalacticTrustBusiness
        run: |
          set -euo pipefail
          python3 scripts/generate_app_icon.py
          xcodegen generate

      - name: Create App Store simulators
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-18-6"
          if ! xcrun simctl list runtimes | grep -q 'iOS 18.6'; then
            echo "iOS 18.6 simulator runtime is unavailable on this runner." >&2
            exit 1
          fi

          IPHONE_TYPE=$(xcrun simctl list devicetypes | awk -F '[()]' '/iPhone 11 Pro Max/ {print $2; exit}')
          IPAD_TYPE=$(xcrun simctl list devicetypes | awk -F '[()]' '/iPad Pro 13-inch \(M4\)/ {print $(NF-1); exit}')

          if [ -z "$IPHONE_TYPE" ]; then
            echo "Could not find the iPhone 11 Pro Max simulator device type." >&2
            xcrun simctl list devicetypes >&2
            exit 1
          fi
          if [ -z "$IPAD_TYPE" ]; then
            IPAD_TYPE=$(xcrun simctl list devicetypes | awk -F '[()]' '/iPad Pro \(13-inch\) \(M4\)/ {print $(NF-1); exit}')
          fi
          if [ -z "$IPAD_TYPE" ]; then
            echo "Could not find the iPad Pro 13-inch (M4) simulator device type." >&2
            xcrun simctl list devicetypes >&2
            exit 1
          fi

          IPHONE_UDID=$(xcrun simctl create "Galactic-AppStore-iPhone-${GITHUB_RUN_ID}" "$IPHONE_TYPE" "$RUNTIME")
          IPAD_UDID=$(xcrun simctl create "Galactic-AppStore-iPad-${GITHUB_RUN_ID}" "$IPAD_TYPE" "$RUNTIME")

          echo "IPHONE_UDID=$IPHONE_UDID" >> "$GITHUB_ENV"
          echo "IPAD_UDID=$IPAD_UDID" >> "$GITHUB_ENV"
          echo "Created iPhone: $IPHONE_UDID"
          echo "Created iPad: $IPAD_UDID"

      - name: Capture real iPhone screenshot with XCUITest
        working-directory: ios/GalacticTrustBusiness
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/iphone-app-store.xcresult"
          EXPORT="$RUNNER_TEMP/iphone-attachments"
          OUT="$GITHUB_WORKSPACE/app-store-screenshots"
          mkdir -p "$OUT"

          xcrun simctl boot "$IPHONE_UDID" || true
          xcrun simctl bootstatus "$IPHONE_UDID" -b
          xcrun simctl status_bar "$IPHONE_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

          rm -rf "$RESULT" "$EXPORT"
          xcodebuild test \
            -project GalacticTrustBusiness.xcodeproj \
            -scheme GalacticTrustBusiness \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -only-testing:GalacticTrustBusinessUITests/AppStoreScreenshotTests/testAppStoreScreenshot \
            -derivedDataPath "$RUNNER_TEMP/GalacticScreenshotDerivedData" \
            -resultBundlePath "$RESULT" \
            CODE_SIGNING_ALLOWED=NO

          xcrun xcresulttool export attachments --path "$RESULT" --output-path "$EXPORT"
          find "$EXPORT" -maxdepth 2 -type f -print

          SHOT=$(find "$EXPORT" -type f -name '*.png' | head -1)
          if [ -z "$SHOT" ]; then
            echo "No PNG screenshot attachment was exported from the iPhone UI test." >&2
            cat "$EXPORT/manifest.json" >&2 || true
            exit 1
          fi

          cp "$SHOT" "$OUT/Galactic-Trust-Business-iPhone-6.5.png"
          sips -g pixelWidth -g pixelHeight "$OUT/Galactic-Trust-Business-iPhone-6.5.png"

          WIDTH=$(sips -g pixelWidth "$OUT/Galactic-Trust-Business-iPhone-6.5.png" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$OUT/Galactic-Trust-Business-iPhone-6.5.png" | awk '/pixelHeight/ {print $2}')
          if [ "$WIDTH" != "1242" ] || [ "$HEIGHT" != "2688" ]; then
            echo "Unexpected iPhone screenshot dimensions: ${WIDTH}x${HEIGHT}; expected 1242x2688." >&2
            exit 1
          fi

          xcrun simctl shutdown "$IPHONE_UDID" || true

      - name: Capture real iPad screenshot with XCUITest
        working-directory: ios/GalacticTrustBusiness
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/ipad-app-store.xcresult"
          EXPORT="$RUNNER_TEMP/ipad-attachments"
          OUT="$GITHUB_WORKSPACE/app-store-screenshots"
          mkdir -p "$OUT"

          xcrun simctl boot "$IPAD_UDID" || true
          xcrun simctl bootstatus "$IPAD_UDID" -b
          xcrun simctl status_bar "$IPAD_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

          rm -rf "$RESULT" "$EXPORT"
          xcodebuild test \
            -project GalacticTrustBusiness.xcodeproj \
            -scheme GalacticTrustBusiness \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -only-testing:GalacticTrustBusinessUITests/AppStoreScreenshotTests/testAppStoreScreenshot \
            -derivedDataPath "$RUNNER_TEMP/GalacticScreenshotDerivedData" \
            -resultBundlePath "$RESULT" \
            CODE_SIGNING_ALLOWED=NO

          xcrun xcresulttool export attachments --path "$RESULT" --output-path "$EXPORT"
          find "$EXPORT" -maxdepth 2 -type f -print

          SHOT=$(find "$EXPORT" -type f -name '*.png' | head -1)
          if [ -z "$SHOT" ]; then
            echo "No PNG screenshot attachment was exported from the iPad UI test." >&2
            cat "$EXPORT/manifest.json" >&2 || true
            exit 1
          fi

          cp "$SHOT" "$OUT/Galactic-Trust-Business-iPad-13.png"
          sips -g pixelWidth -g pixelHeight "$OUT/Galactic-Trust-Business-iPad-13.png"

          WIDTH=$(sips -g pixelWidth "$OUT/Galactic-Trust-Business-iPad-13.png" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$OUT/Galactic-Trust-Business-iPad-13.png" | awk '/pixelHeight/ {print $2}')
          if [ "$WIDTH" != "2064" ] || [ "$HEIGHT" != "2752" ]; then
            echo "Unexpected iPad screenshot dimensions: ${WIDTH}x${HEIGHT}; expected 2064x2752." >&2
            exit 1
          fi

          xcrun simctl shutdown "$IPAD_UDID" || true

      - name: Clean up simulators
        if: always()
        shell: bash
        run: |
          if [ -n "${IPHONE_UDID:-}" ]; then xcrun simctl shutdown "$IPHONE_UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$IPHONE_UDID" >/dev/null 2>&1 || true; fi
          if [ -n "${IPAD_UDID:-}" ]; then xcrun simctl shutdown "$IPAD_UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$IPAD_UDID" >/dev/null 2>&1 || true; fi

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: galactic-trust-app-store-screenshots
          path: app-store-screenshots
          if-no-files-found: error
          retention-days: 30
