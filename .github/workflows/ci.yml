name: Galactic Trust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Safety checks
        run: npm run test:safety

      - name: Sandbox certification safety
        run: npm run test:sandbox

      - name: Durable banking core safety
        run: npm run test:banking-core

      - name: Operator control safety
        run: npm run test:banking-ops

      - name: Build
        run: npm run build
