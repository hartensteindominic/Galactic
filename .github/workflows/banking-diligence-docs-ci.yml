name: Galactic Trust Diligence Docs Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  diligence-docs-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diligence documentation safety
        run: node scripts/banking-diligence-docs-check.mjs
