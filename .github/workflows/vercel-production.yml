name: Galactic Trust Vercel Production

on:
  workflow_run:
    workflows: ["Galactic Trust CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: galactic-trust-vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check Vercel configuration
        id: vercel_config
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Vercel production deployment is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment is waiting for VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout validated commit
        if: steps.vercel_config.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Setup Node
        if: steps.vercel_config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        if: steps.vercel_config.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        if: steps.vercel_config.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        if: steps.vercel_config.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: steps.vercel_config.outputs.ready == 'true'
        shell: bash
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "Production deployment: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment URL: $DEPLOY_URL"
