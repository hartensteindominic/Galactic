name: HyperStream slider upgrade
on:
  push:
    paths:
      - hyperstream-slider-trigger.txt
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade sliders
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('input[type=range]{accent-color:var(--pink);width:120px}', 'input[type=range]{accent-color:var(--pink);width:100%;height:28px;min-width:0;touch-action:pan-x}.slider-control{display:flex;flex-direction:column;gap:5px;width:100%}.slider-head{display:flex;justify-content:space-between;align-items:center;font-size:14px}.slider-head b{color:var(--pink);font-variant-numeric:tabular-nums}')
          s=s.replace('<div class="row"><span>Detail</span><input type="range" min="1" max="4" value="2" oninput="stepSize=+this.value"></div>\n      <div class="row"><span>Depth</span><input type="range" min="50" max="200" value="120" oninput="depthMul=+this.value"></div>', '''<div class="slider-control"><div class="slider-head"><span>Detail</span><b id="detailVal">100%</b></div><input id="detailSlider" type="range" min="1" max="100" step="0.1" value="100" oninput="setDetail(this.value)"></div>\n      <div class="slider-control"><div class="slider-head"><span>Depth</span><b id="depthVal">145</b></div><input id="depthSlider" type="range" min="0" max="300" step="0.5" value="145" oninput="setDepth(this.value)"></div>\n      <div class="slider-control"><div class="slider-head"><span>Brightness</span><b id="brightnessVal">100%</b></div><input id="brightnessSlider" type="range" min="0" max="300" step="0.5" value="100" oninput="setBrightness(this.value)"></div>''')
          s=s.replace('let stepSize=2,depthMul=120,fc=0,ft=0;', 'let stepSize=1,depthMul=145,brightness=100,fc=0,ft=0;')
          s=s.replace('const r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255;\n      const lum=0.299*r+0.587*g+0.114*b;', 'const r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255;\n      const rawLum=0.299*r+0.587*g+0.114*b;\n      const lum=Math.min(1,rawLum*(brightness/100));')
          s=s.replace('const r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255;\n          const lum=0.299*r+0.587*g+0.114*b;', 'const r=pix[i]/255,g=pix[i+1]/255,b=pix[i+2]/255;\n          const rawLum=0.299*r+0.587*g+0.114*b;\n          const lum=Math.min(1,rawLum*(brightness/100));')
          marker='function toggleScan(){'
          controls='''function setDetail(v){\n  const pct=+v;\n  stepSize=12-((pct-1)/99)*11;\n  $("detailVal").textContent=Math.round(pct)+"%";\n}\nfunction setDepth(v){\n  depthMul=+v;\n  $("depthVal").textContent=(Math.round(depthMul*10)/10).toString();\n}\nfunction setBrightness(v){\n  brightness=+v;\n  $("brightnessVal").textContent=(Math.round(brightness*10)/10).toString().replace(/\\.0$/,'')+"%";\n}\n\n'''
          s=s.replace(marker, controls+marker)
          p.write_text(s)
      - name: Commit upgrade
        run: |
          rm -f hyperstream-slider-trigger.txt .github/workflows/hyperstream-slider-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/hyperstream-slider-upgrade.yml hyperstream-slider-trigger.txt
          git commit -m 'Upgrade HyperStream scan sliders' || exit 0
          git push
